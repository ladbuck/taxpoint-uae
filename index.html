ine><circle cx=\"110\" cy=\"110\" fill=\"#e3f3e3\" r=\"14\" stroke=\"#008300\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"110.0\" y=\"86.5\"><tspan dy=\"0.0\" x=\"110.0\">5 Mar<\/tspan><\/text><g><rect fill=\"#e3f3e3\" height=\"46\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"180\" x=\"20\" y=\"132\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"110.0\" y=\"152.1\"><tspan dy=\"0.0\" x=\"110.0\">Advance payment of 30%<\/tspan><tspan dy=\"13.4\" x=\"110.0\">received<\/tspan><\/text><\/g><circle cx=\"330\" cy=\"110\" fill=\"#e6f0fc\" r=\"14\" stroke=\"#2a78d6\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"86.5\"><tspan dy=\"0.0\" x=\"330.0\">12 Mar<\/tspan><\/text><g><rect fill=\"#e6f0fc\" height=\"46\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"180\" x=\"240\" y=\"132\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"152.1\"><tspan dy=\"0.0\" x=\"330.0\">Tax invoice issued for<\/tspan><tspan dy=\"13.4\" x=\"330.0\">full price<\/tspan><\/text><\/g><circle cx=\"540\" cy=\"110\" fill=\"#f1f2f3\" r=\"14\" stroke=\"#8a8f96\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"540.0\" y=\"86.5\"><tspan dy=\"0.0\" x=\"540.0\">20 Mar<\/tspan><\/text><g><rect fill=\"#f1f2f3\" height=\"46\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"180\" x=\"450\" y=\"132\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"540.0\" y=\"152.1\"><tspan dy=\"0.0\" x=\"540.0\">Goods delivered to<\/tspan><tspan dy=\"13.4\" x=\"540.0\">customer<\/tspan><\/text><\/g><g><rect fill=\"#fff4d1\" height=\"44\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"300\" x=\"20\" y=\"10\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"170.0\" y=\"29.1\"><tspan dy=\"0.0\" x=\"170.0\">VAT on the 30% is due in the March return<\/tspan><tspan dy=\"13.4\" x=\"170.0\">because payment came FIRST<\/tspan><\/text><\/g><g><rect fill=\"#e6f0fc\" height=\"44\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"300\" x=\"340\" y=\"10\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"490.0\" y=\"29.1\"><tspan dy=\"0.0\" x=\"490.0\">VAT on the other 70% arises on 12 Mar: the<\/tspan><tspan dy=\"13.4\" x=\"490.0\">invoice comes before delivery<\/tspan><\/text><\/g><path d=\"M110.0,54.0 L110.0,66.0\" fill=\"none\" marker-end=\"url(#ar-dos-eda100)\" stroke=\"#eda100\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><path d=\"M380.0,54.0 L338.0,70.0\" fill=\"none\" marker-end=\"url(#ar-dos-2a78d6)\" stroke=\"#2a78d6\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><text fill=\"#c8102e\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"201.8\"><tspan dy=\"0.0\" x=\"330.0\">Rule: earliest of (1) goods transferred / service completed, (2) payment received, (3) tax invoice issued<\/tspan><\/text><\/svg><figcaption><b>Figure 6.1<\/b> The earliest-event rule, with an advance payment.<\/figcaption><\/figure><div class=\"box key\"><span class=\"lbl\">KEY POINT<\/span>\n<p>An <b>advance payment<\/b> triggers VAT on the amount received at the time it is received. The supplier must account for VAT on the deposit in the period it is received, even if the goods are delivered much later.<\/p>\n<\/div>"},{"title":"Special rules","html":"<div class=\"tbl\"><table>\n<thead><tr><th>Situation<\/th><th>Date of supply<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Continuous or periodic supplies<\/b> (rent, maintenance contracts, subscriptions, utilities)<\/td><td>The earliest of: the date of any tax invoice, the date payment is <b>due<\/b> as shown on the invoice, the date payment is received, or one year after the supply started (for services not yet invoiced or paid).<\/td><\/tr>\n<tr><td><b>Goods on approval / sale or return<\/b><\/td><td>The date the customer accepts the goods, but no later than 12 months after they were transferred.<\/td><\/tr>\n<tr><td><b>Vending machines and similar devices<\/b><\/td><td>The date the cash is collected from the machine.<\/td><\/tr>\n<tr><td><b>Goods transported to the customer<\/b><\/td><td>When transport begins (or when goods are made available if the customer collects).<\/td><\/tr>\n<tr><td><b>Goods assembled or installed<\/b><\/td><td>When installation or assembly is completed.<\/td><\/tr>\n<tr><td><b>Imports of goods<\/b><\/td><td>The date of import (when the goods clear customs).<\/td><\/tr>\n<tr><td><b>Reverse-charge services from abroad<\/b><\/td><td>The earlier of the date the service is completed and the date payment is made.<\/td><\/tr>\n<tr><td><b>Deemed supplies<\/b><\/td><td>The date of the transfer, disposal or change of use.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 6.1: Continuous supply<\/span>\n<p>A facilities company signs a one-year maintenance contract with an office tower for AED 120,000, invoiced quarterly in advance with 30-day payment terms. The first invoice is issued on 1 January 2026 (payment due 31 January). The tax point for each quarter is the <b>invoice date<\/b>, the earliest event, so VAT of AED 1,500 (5% × 30,000) goes in the return covering January.<\/p>\n<\/div><div class=\"box exam\"><span class=\"lbl\">EXAM / CLASS TIP<\/span>\n<p>Write the three dates in a row, circle the earliest, and say which tax period it falls into. Remember that a <b>pro-forma invoice<\/b> or quotation is not a tax invoice and does not create a tax point.<\/p>\n<\/div>"}],"summary":["Date of supply = earliest of transfer/completion, payment received and tax invoice issued.","Deposits are taxed when received; continuous supplies are taxed at invoice, due date or payment.","Special rules cover goods on approval (max 12 months), vending machines, installation, imports and reverse charge."],"review":[{"q":"Goods are delivered on 25 June; the invoice is issued on 3 July; payment is received on 20 July. What is the date of supply?","a":"25 June"},{"q":"A customer pays a 20% deposit on 28 March for furniture delivered on 10 April and invoiced on 12 April. Quarterly periods end in March and June. Which returns include the VAT?","a":null},{"q":"When is the tax point for goods supplied on approval and never formally accepted?","a":null}],"mcq":[33,34,35]},"ch7":{"id":"ch7","num":"7","kind":"chapter","title":"Place of Supply and Designated Zones","short":"Place of Supply & Designated Zones","objectives":["Apply the place-of-supply rules for <b>goods<\/b> and <b>services<\/b>.","Recognise the special rules for real estate, transport, events, telecoms and electronic services.","Explain the conditions and the VAT treatment of <b>Designated Zones<\/b>."],"sections":[{"title":"Why place of supply matters","html":"<p>UAE VAT applies only if the <mark>place of supply is in the UAE<\/mark>. If the place of supply is outside the UAE, the supply is outside the scope of UAE VAT (it may be taxed in another country). Exports are a special case: the place of supply of exported goods is the UAE, but the supply is <b>zero-rated<\/b>.<\/p>"},{"title":"Place of supply of goods","html":"<div class=\"tbl\"><table>\n<thead><tr><th>Situation<\/th><th>Place of supply<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Goods not transported (e.g. sold from a warehouse in the UAE)<\/td><td>Where the goods are when supplied: <b>UAE<\/b>.<\/td><\/tr>\n<tr><td>Goods transported within the UAE<\/td><td><b>UAE<\/b> (standard-rated unless a zero-rate applies).<\/td><\/tr>\n<tr><td>Goods exported outside the UAE (including to other GCC states for now)<\/td><td><b>UAE<\/b>, but <mark>zero-rated<\/mark> if export evidence exists and the goods leave within 90 days.<\/td><\/tr>\n<tr><td>Goods installed or assembled by the supplier<\/td><td>Where installed or assembled.<\/td><\/tr>\n<tr><td>Water and energy supplied through a network<\/td><td>Where the customer actually uses them.<\/td><\/tr>\n<tr><td>Goods imported into the UAE<\/td><td>Import VAT arises in the UAE (paid at customs or through the return).<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"},{"title":"Place of supply of services","html":"<p>The <b>general rule<\/b>: the place of supply is where the <mark>supplier<\/mark> has its place of residence (the establishment most closely connected with the supply). Several important <b>special rules<\/b> override it.<\/p><figure class=\"fig\"><svg aria-label=\"Place of supply rules for services\" role=\"img\" viewbox=\"0 0 660 400\" xmlns=\"http://www.w3.org/2000/svg\"><title>Place of supply rules for services<\/title><defs><\/defs><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"105\" x2=\"330\" y1=\"60\" y2=\"200\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"330\" x2=\"330\" y1=\"52\" y2=\"200\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"555\" x2=\"330\" y1=\"60\" y2=\"200\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"555\" x2=\"330\" y1=\"198\" y2=\"200\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"555\" x2=\"330\" y1=\"336\" y2=\"200\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"330\" x2=\"330\" y1=\"362\" y2=\"200\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"105\" x2=\"330\" y1=\"336\" y2=\"200\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"105\" x2=\"330\" y1=\"198\" y2=\"200\"><\/line><circle cx=\"330\" cy=\"200\" fill=\"#16324f\" r=\"70\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"196.6\"><tspan dy=\"0.0\" x=\"330.0\">PLACE OF SUPPLY<\/tspan><tspan dy=\"15.9\" x=\"330.0\">of SERVICES<\/tspan><\/text><g><rect fill=\"#e6f0fc\" height=\"88\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"190\" x=\"10\" y=\"14\"><\/rect><path d=\"M10,38 V24 Q10,14 20,14 H190 Q200,14 200,24 V38 Z\" fill=\"#2a78d6\"><\/path><text fill=\"#fff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"105.0\" y=\"30.0\"><tspan dy=\"0.0\" x=\"105.0\">General rule<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"105.0\" y=\"67.2\"><tspan dy=\"0.0\" x=\"105.0\">Where the SUPPLIER has its<\/tspan><tspan dy=\"12.9\" x=\"105.0\">place of residence<\/tspan><\/text><\/g><g><rect fill=\"#fdeadf\" height=\"92\" rx=\"10\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"190\" x=\"235\" y=\"6\"><\/rect><path d=\"M235,30 V16 Q235,6 245,6 H415 Q425,6 425,16 V30 Z\" fill=\"#eb6834\"><\/path><text fill=\"#fff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"22.0\"><tspan dy=\"0.0\" x=\"330.0\">B2B from abroad<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"54.8\"><tspan dy=\"0.0\" x=\"330.0\">Recipient's place of<\/tspan><tspan dy=\"12.9\" x=\"330.0\">residence: UAE business<\/tspan><tspan dy=\"12.9\" x=\"330.0\">reverse-charges the VAT<\/tspan><\/text><\/g><g><rect fill=\"#e3f3e3\" height=\"88\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"190\" x=\"460\" y=\"14\"><\/rect><path d=\"M460,38 V24 Q460,14 470,14 H640 Q650,14 650,24 V38 Z\" fill=\"#008300\"><\/path><text fill=\"#fff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"555.0\" y=\"30.0\"><tspan dy=\"0.0\" x=\"555.0\">Real estate<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"555.0\" y=\"60.8\"><tspan dy=\"0.0\" x=\"555.0\">Where the property is located<\/tspan><tspan dy=\"12.9\" x=\"555.0\">(agents, valuers, architects,<\/tspan><tspan dy=\"12.9\" x=\"555.0\">rentals)<\/tspan><\/text><\/g><g><rect fill=\"#e0f5ec\" height=\"88\" rx=\"10\" stroke=\"#1baf7a\" stroke-width=\"2\" width=\"190\" x=\"460\" y=\"152\"><\/rect><path d=\"M460,176 V162 Q460,152 470,152 H640 Q650,152 650,162 V176 Z\" fill=\"#1baf7a\"><\/path><text fill=\"#fff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"555.0\" y=\"168.0\"><tspan dy=\"0.0\" x=\"555.0\">Transport<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"555.0\" y=\"198.8\"><tspan dy=\"0.0\" x=\"555.0\">Where the transport begins<\/tspan><tspan dy=\"12.9\" x=\"555.0\">(international legs<\/tspan><tspan dy=\"12.9\" x=\"555.0\">zero-rated)<\/tspan><\/text><\/g><g><rect fill=\"#ebe8fb\" height=\"88\" rx=\"10\" stroke=\"#6250d6\" stroke-width=\"2\" width=\"190\" x=\"460\" y=\"290\"><\/rect><path d=\"M460,314 V300 Q460,290 470,290 H640 Q650,290 650,300 V314 Z\" fill=\"#6250d6\"><\/path><text fill=\"#fff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"555.0\" y=\"306.0\"><tspan dy=\"0.0\" x=\"555.0\">Telecom &amp; electronic<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"555.0\" y=\"343.2\"><tspan dy=\"0.0\" x=\"555.0\">Where actually used and<\/tspan><tspan dy=\"12.9\" x=\"555.0\">enjoyed<\/tspan><\/text><\/g><g><rect fill=\"#fff4d1\" height=\"88\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"190\" x=\"235\" y=\"316\"><\/rect><path d=\"M235,340 V326 Q235,316 245,316 H415 Q425,316 425,326 V340 Z\" fill=\"#eda100\"><\/path><text fill=\"#fff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"332.0\"><tspan dy=\"0.0\" x=\"330.0\">Hospitality &amp; events<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"362.8\"><tspan dy=\"0.0\" x=\"330.0\">Restaurants, hotels, catering,<\/tspan><tspan dy=\"12.9\" x=\"330.0\">culture, sport, education:<\/tspan><tspan dy=\"12.9\" x=\"330.0\">where performed<\/tspan><\/text><\/g><g><rect fill=\"#fce8f0\" height=\"88\" rx=\"10\" stroke=\"#d55181\" stroke-width=\"2\" width=\"190\" x=\"10\" y=\"290\"><\/rect><path d=\"M10,314 V300 Q10,290 20,290 H190 Q200,290 200,300 V314 Z\" fill=\"#d55181\"><\/path><text fill=\"#fff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"105.0\" y=\"306.0\"><tspan dy=\"0.0\" x=\"105.0\">Services on goods<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"105.0\" y=\"343.2\"><tspan dy=\"0.0\" x=\"105.0\">Installation, repair: where<\/tspan><tspan dy=\"12.9\" x=\"105.0\">the goods are / work is done<\/tspan><\/text><\/g><g><rect fill=\"#f1f2f3\" height=\"88\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"190\" x=\"10\" y=\"152\"><\/rect><path d=\"M10,176 V162 Q10,152 20,152 H190 Q200,152 200,162 V176 Z\" fill=\"#8a8f96\"><\/path><text fill=\"#fff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"105.0\" y=\"168.0\"><tspan dy=\"0.0\" x=\"105.0\">Intermediary for B2B<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"105.0\" y=\"205.2\"><tspan dy=\"0.0\" x=\"105.0\">Follow the general rules<\/tspan><tspan dy=\"12.9\" x=\"105.0\">unless a special rule applies<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 7.1<\/b> The general rule and special rules for services.<\/figcaption><\/figure><div class=\"tbl\"><table>\n<thead><tr><th>Service<\/th><th>Place of supply<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Business-to-business from abroad<\/b>: a non-resident supplies services to a UAE VAT-registered business<\/td><td>The UAE (recipient’s residence). The UAE business accounts for VAT under the <b>reverse charge<\/b>.<\/td><\/tr>\n<tr><td>Services connected with <b>real estate<\/b> (rental, brokerage, valuation, architecture, construction, property management)<\/td><td>Where the property is located.<\/td><\/tr>\n<tr><td><b>Transport<\/b> of goods or passengers<\/td><td>Where transport begins. International transport is zero-rated.<\/td><\/tr>\n<tr><td><b>Restaurant, hotel, food and drink, catering<\/b><\/td><td>Where performed.<\/td><\/tr>\n<tr><td><b>Cultural, artistic, sporting, educational, entertainment<\/b> services and events (and related services)<\/td><td>Where performed.<\/td><\/tr>\n<tr><td><b>Telecommunication and electronic services<\/b> (streaming, apps, cloud services, online games, e-books)<\/td><td>Where actually <mark>used and enjoyed<\/mark>.<\/td><\/tr>\n<tr><td>Services related to goods (installation, repair, maintenance)<\/td><td>Where performed.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 7.1<\/span>\n<ol>\n<li>A London law firm advises a Dubai trading company (VAT-registered) on a contract. Place of supply: UAE. The Dubai company <b>reverse-charges<\/b> 5% VAT.<\/li>\n<li>An Abu Dhabi architect designs a villa in Muscat for an Omani client. Real-estate rule: place of supply is <b>Oman<\/b>, so the service is outside the scope of UAE VAT.<\/li>\n<li>A Dubai events company runs a conference in Dubai for a German company. Event services are taxed where performed: <b>UAE 5%<\/b>, even though the customer is foreign.<\/li>\n<li>A US streaming service sells subscriptions to UAE households. Electronic services are taxed where used: the US company must <b>register in the UAE<\/b> (no threshold) and charge 5%.<\/li>\n<\/ol>\n<\/div>"},{"title":"Designated Zones","html":"<p>A <span class=\"term\">Designated Zone<\/span> is a free zone listed by Cabinet Decision for VAT purposes. To be listed it must be a <b>specific fenced area<\/b> with security measures and <b>customs controls<\/b> on the entry and exit of people and goods, and internal procedures for keeping, storing and processing goods. Designated Zones are treated as <mark>outside the UAE for certain supplies of goods only<\/mark>.<\/p><p>Examples include Jebel Ali Free Zone (North and South), Dubai Airport Free Zone, Sharjah Airport International Free Zone, Hamriyah Free Zone, Ajman Free Zone, Umm Al Quwain Free Trade Zone, Fujairah Free Zone and Khalifa Industrial Zone Abu Dhabi. Financial free zones such as <b>DIFC and ADGM are not Designated Zones<\/b>. Always check the current list.<\/p><figure class=\"fig\"><svg aria-label=\"Goods movements involving a Designated Zone\" role=\"img\" viewbox=\"0 0 660 320\" xmlns=\"http://www.w3.org/2000/svg\"><title>Goods movements involving a Designated Zone<\/title><defs><marker id=\"ar-dz-16324f\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"9\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><marker id=\"ar-dz-16324fs\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"1\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><marker id=\"ar-dz-00843d\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"9\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#00843d\"><\/path><\/marker><marker id=\"ar-dz-00843ds\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"1\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#00843d\"><\/path><\/marker><marker id=\"ar-dz-c8102e\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"9\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c8102e\"><\/path><\/marker><marker id=\"ar-dz-c8102es\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"1\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c8102e\"><\/path><\/marker><\/defs><rect fill=\"#f7f9fb\" height=\"304\" rx=\"14\" stroke=\"#8a8f96\" stroke-width=\"1.5\" width=\"644\" x=\"8\" y=\"8\"><\/rect><text fill=\"#16324f\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"28.2\"><tspan dy=\"0.0\" x=\"330.0\">UNITED ARAB EMIRATES<\/tspan><\/text><g><rect fill=\"#f1f2f3\" height=\"80\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"120\" x=\"20\" y=\"120\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"80.0\" y=\"164.2\"><tspan dy=\"0.0\" x=\"80.0\">OUTSIDE the UAE<\/tspan><\/text><\/g><rect fill=\"#fff4d1\" height=\"250\" rx=\"16\" stroke=\"#eda100\" stroke-dasharray=\"10 6\" stroke-width=\"3\" width=\"220\" x=\"200\" y=\"50\"><\/rect><text fill=\"#9a6a00\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"310.0\" y=\"67.0\"><tspan dy=\"0.0\" x=\"310.0\">DESIGNATED ZONE (fenced,<\/tspan><tspan dy=\"14.0\" x=\"310.0\">customs-controlled)<\/tspan><\/text><g><rect fill=\"#fff4d1\" height=\"46\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"80\" x=\"225\" y=\"100\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"265.0\" y=\"126.8\"><tspan dy=\"0.0\" x=\"265.0\">Company A<\/tspan><\/text><\/g><g><rect fill=\"#fff4d1\" height=\"46\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"80\" x=\"325\" y=\"100\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"365.0\" y=\"126.8\"><tspan dy=\"0.0\" x=\"365.0\">Company B<\/tspan><\/text><\/g><g><rect fill=\"#e6f0fc\" height=\"80\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"160\" x=\"480\" y=\"120\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"560.0\" y=\"164.2\"><tspan dy=\"0.0\" x=\"560.0\">MAINLAND UAE customer<\/tspan><\/text><\/g><path d=\"M142.0,150.0 L223.0,125.0\" fill=\"none\" marker-end=\"url(#ar-dz-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"12.5\" opacity=\"0.92\" rx=\"4\" width=\"89.0\" x=\"125.8\" y=\"115.2\"><\/rect><text fill=\"#16324f\" font-size=\"10\" font-weight=\"bold\" text-anchor=\"middle\" x=\"170.3\" y=\"125.2\"><tspan dy=\"0.0\" x=\"170.3\">no VAT on entry<\/tspan><\/text><path d=\"M307.0,123.0 L323.0,123.0\" fill=\"none\" marker-end=\"url(#ar-dz-00843d)\" stroke=\"#00843d\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><text fill=\"#00843d\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"315.0\" y=\"169.7\"><tspan dy=\"0.0\" x=\"315.0\">A to B goods: outside scope<\/tspan><\/text><path d=\"M407.0,140.0 L478.0,170.0\" fill=\"none\" marker-end=\"url(#ar-dz-c8102e)\" stroke=\"#c8102e\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"12.5\" opacity=\"0.92\" rx=\"4\" width=\"110.6\" x=\"387.2\" y=\"137.0\"><\/rect><text fill=\"#c8102e\" font-size=\"10\" font-weight=\"bold\" text-anchor=\"middle\" x=\"442.5\" y=\"147.0\"><tspan dy=\"0.0\" x=\"442.5\">release to mainland<\/tspan><\/text><g><rect fill=\"#fde4e4\" height=\"86\" rx=\"10\" stroke=\"#e34948\" stroke-width=\"2\" width=\"200\" x=\"440\" y=\"214\"><\/rect><text fill=\"#1f2328\" font-size=\"10.3\" font-weight=\"normal\" text-anchor=\"middle\" x=\"540.0\" y=\"235.5\"><tspan dy=\"0.0\" x=\"540.0\">Goods released to the mainland<\/tspan><tspan dy=\"12.6\" x=\"540.0\">are an IMPORT: VAT due (paid by<\/tspan><tspan dy=\"12.6\" x=\"540.0\">the importer of record); goods<\/tspan><tspan dy=\"12.6\" x=\"540.0\">used or consumed inside the zone<\/tspan><tspan dy=\"12.6\" x=\"540.0\">are taxable<\/tspan><\/text><\/g><g><rect fill=\"#ffffff\" height=\"92\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"200\" x=\"210\" y=\"200\"><\/rect><text fill=\"#1f2328\" font-size=\"10.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"310.0\" y=\"230.5\"><tspan dy=\"0.0\" x=\"310.0\">SERVICES supplied in a<\/tspan><tspan dy=\"12.8\" x=\"310.0\">Designated Zone are taxed like<\/tspan><tspan dy=\"12.8\" x=\"310.0\">the mainland (5%), unless a<\/tspan><tspan dy=\"12.8\" x=\"310.0\">zero-rating rule applies<\/tspan><\/text><\/g><g><rect fill=\"#f1f2f3\" height=\"80\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"170\" x=\"20\" y=\"220\"><\/rect><text fill=\"#1f2328\" font-size=\"10.3\" font-weight=\"normal\" text-anchor=\"middle\" x=\"105.0\" y=\"251.0\"><tspan dy=\"0.0\" x=\"105.0\">Same treatment both ways:<\/tspan><tspan dy=\"12.6\" x=\"105.0\">goods leaving the zone to<\/tspan><tspan dy=\"12.6\" x=\"105.0\">go abroad are not taxed<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 7.2<\/b> How goods are treated when they move in, between and out of Designated Zones.<\/figcaption><\/figure><div class=\"tbl\"><table>\n<thead><tr><th>Transaction<\/th><th>Treatment<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Goods supplied from one Designated Zone business to another (goods stay in the zones and are not used or consumed)<\/td><td>Outside the scope of UAE VAT.<\/td><\/tr>\n<tr><td>Goods brought from abroad into a Designated Zone<\/td><td>No import VAT while they stay in the zone under customs suspension.<\/td><\/tr>\n<tr><td>Goods moved from a Designated Zone to the mainland<\/td><td>An import into the UAE: VAT is due.<\/td><\/tr>\n<tr><td>Goods moved from the mainland into a Designated Zone<\/td><td>Generally a domestic supply (5%), unless exported onwards under the export rules.<\/td><\/tr>\n<tr><td>Goods used or consumed inside the zone (e.g. office supplies, water, electricity)<\/td><td>Taxable at 5%, as if in the mainland.<\/td><\/tr>\n<tr><td><b>Services<\/b> supplied in or from a Designated Zone<\/td><td>Taxable as in the mainland (5%), unless a zero-rate applies.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><div class=\"box warn\"><span class=\"lbl\">WATCH OUT<\/span>\n<p>Do not confuse the VAT <b>Designated Zone<\/b> list with the Corporate Tax <b>Qualifying Free Zone Person<\/b> regime. A company can be in a free zone that is not a Designated Zone (so normal VAT rules apply to all its goods) and still be a QFZP for CT, or the reverse.<\/p>\n<\/div>"}],"summary":["Goods: taxed where located/installed; exports are UAE supplies zero-rated with evidence.","Services: general rule = supplier’s residence; special rules for B2B imports, real estate, transport, events, hospitality and electronic services.","Designated Zones: fenced, customs-controlled zones treated as outside the UAE <b>for goods only<\/b>."],"review":[{"q":"A Sharjah company sells generators to a customer in Riyadh and ships them from Sharjah. What is the VAT treatment?","a":null},{"q":"Where is the place of supply of a Dubai hotel stay booked by a French tourist?","a":null},{"q":"A UAE company buys cloud storage from an Irish provider. Who accounts for VAT?","a":null},{"q":"List the conditions for a free zone to be a Designated Zone.","a":null},{"q":"Company A in JAFZA sells stock held in JAFZA to Company B in Dubai Airport Free Zone. What is the treatment? What if B is in Dubai Marina (mainland)?","a":null}],"mcq":[37,38,39,40,41,42]},"ch8":{"id":"ch8","num":"8","kind":"chapter","title":"Value of Supply and Calculating VAT","short":"Value of Supply","objectives":["Calculate VAT on tax-exclusive and tax-inclusive prices using the <b>5/105 tax fraction<\/b>.","Apply market value rules for related parties and non-monetary consideration.","Handle discounts, foreign currency, excise goods and imports.","Use the <b>profit margin scheme<\/b> and <b>bad debt relief<\/b>, including the 2026 changes."],"sections":[{"title":"The basic rule","html":"<p>The value of a supply is the <mark>consideration, excluding the VAT itself<\/mark>. Consideration includes everything received or expected to be received from the customer or anyone else: cash, goods, services, and charges such as delivery, packing, insurance, commissions and excise tax.<\/p><div class=\"grid2\">\n<div class=\"formula\">Price excluding VAT × 5% = VAT<small>AED 2,000 × 5% = AED 100<\/small><\/div>\n<div class=\"formula\">Price including VAT × 5/105 = VAT<small>AED 2,100 × 5/105 = AED 100<\/small><\/div>\n<\/div><p>The fraction <span class=\"num\">5/105<\/span> (about 4.7619%) is called the <span class=\"term\">tax fraction<\/span>. A common error is to take 5% of a VAT-inclusive price.<\/p>"},{"title":"Displaying prices","html":"<p>Prices shown to customers (on shelves, menus, websites, advertising) must be <mark>VAT-inclusive<\/mark>. A business can show a VAT-exclusive price only where the law allows it (for example on quotations to business customers or for exports), and must then make clear that VAT is extra. Failing to display VAT-inclusive prices carries a penalty of <span class=\"num\">AED 5,000<\/span>.<\/p><p>If a business forgets to add VAT to an agreed price, the law treats the price as <b>VAT-inclusive<\/b>, unless the contract allows the supplier to add VAT. The supplier then pays 5/105 of the price out of its own margin.<\/p>"},{"title":"Special valuation rules","html":"<div class=\"tbl\"><table>\n<thead><tr><th>Situation<\/th><th>Value for VAT<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Related parties<\/b><\/td><td>Where the price is below market value and the customer cannot recover all of its input tax, the FTA can use the <b>market value<\/b>.<\/td><\/tr>\n<tr><td><b>Non-monetary consideration<\/b> (barter)<\/td><td>The market value of the supply.<\/td><\/tr>\n<tr><td><b>Deemed supplies<\/b><\/td><td>Cost of the goods or services (or market value if cost is unknown); see FTA Directive No. 5 (2026) for services.<\/td><\/tr>\n<tr><td><b>Discounts<\/b> given at or before supply<\/td><td>VAT on the reduced price.<\/td><\/tr>\n<tr><td><b>Discounts or rebates after supply<\/b>, returns, errors<\/td><td>Adjusted through a <b>tax credit note<\/b> (Chapter 13).<\/td><\/tr>\n<tr><td><b>Excise goods<\/b> (tobacco, energy drinks, sweetened drinks)<\/td><td>VAT is charged on the price <b>including<\/b> excise tax.<\/td><\/tr>\n<tr><td><b>Imports<\/b><\/td><td>Customs value (CIF) <b>plus<\/b> customs duty and any excise tax.<\/td><\/tr>\n<tr><td><b>Foreign currency<\/b><\/td><td>Converted to AED at the UAE Central Bank rate on the date of supply. The VAT amount must be shown in AED on the invoice.<\/td><\/tr>\n<tr><td><span class=\"new\">NEW<\/span> <b>Digital currency<\/b> consideration<\/td><td>FTA Directive No. 3 (2026): convert to AED using the average of the rates on three FTA-published exchange platforms, used consistently for the calendar year.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 8.1: Import value<\/span>\n<p>A Dubai retailer imports handbags. CIF value AED 80,000; customs duty 5%.<\/p>\n<div class=\"tbl\"><table class=\"calc\"><tbody>\n<tr><td>Customs value (CIF)<\/td><td class=\"r\">80,000<\/td><\/tr>\n<tr><td>Customs duty 5%<\/td><td class=\"r\">4,000<\/td><\/tr>\n<tr class=\"sub\"><td>Value for import VAT<\/td><td class=\"r\">84,000<\/td><\/tr>\n<tr class=\"tot\"><td>Import VAT 5%<\/td><td class=\"r\">4,200<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>If the retailer is VAT-registered it declares AED 4,200 in Box 6 of its return and recovers it in Box 10 (if used for taxable sales), so it pays nothing in cash at the border.<\/p>\n<\/div>"},{"title":"The profit margin scheme","html":"<p>Dealers in <b>second-hand goods<\/b>, <b>antiques<\/b> (goods over 50 years old) and <b>collectors’ items<\/b> (stamps, coins, items of historical or scientific interest) may charge VAT on their <mark>profit margin<\/mark> instead of the full selling price, provided the goods were bought from a person who did not charge VAT on them (an individual, an unregistered person, or another dealer using the scheme).<\/p><div class=\"formula\">VAT = (Selling price − Purchase price) × 5/105<small>No VAT is shown separately on the invoice; no input tax is recovered on the purchase of the goods. A negative margin gives zero VAT and cannot be set off.<\/small><\/div><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 8.2<\/span>\n<p>A used-car dealer buys a car from an individual for AED 40,000 and sells it for AED 52,500.<\/p>\n<div class=\"tbl\"><table class=\"calc\"><tbody>\n<tr><td>Margin (52,500 − 40,000)<\/td><td class=\"r\">12,500<\/td><\/tr>\n<tr class=\"tot\"><td>VAT = 12,500 × 5/105<\/td><td class=\"r\">595.24<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Under normal rules VAT would be 52,500 × 5/105 = AED 2,500. The scheme avoids taxing again value that was already taxed when the car was first sold new.<\/p>\n<\/div><div class=\"box upd\"><span class=\"lbl\">UPDATE 2025–26<\/span>\n<p><span class=\"new\">NEW<\/span> From <span class=\"num\">1 October 2026<\/span> (CD 149/2026, Article 29(5)) costs incurred to acquire the goods (e.g. auction fees, transport) can be added to the purchase price for the margin calculation <b>only if the input tax on those costs is not recovered<\/b>. A dealer can no longer recover the VAT on a cost and also use it to reduce the margin.<\/p>\n<\/div>"},{"title":"Bad debt relief","html":"<p>A supplier that paid output tax on a sale but was never paid by the customer can reduce its output tax if <mark>all<\/mark> these conditions are met:<\/p><ol>\n<li>the goods or services were supplied and the VAT was charged and accounted for;<\/li>\n<li>the debt has been <b>written off<\/b> (fully or partly) in the supplier’s accounts;<\/li>\n<li>more than <span class=\"num\">6 months<\/span> have passed since the date of supply; and<\/li>\n<li>the supplier has <b>notified the customer<\/b> of the amount written off.<\/li>\n<\/ol><p>The adjustment is made in the return for the period in which the conditions are met. If the customer later pays, the supplier must account for the VAT again. The customer, for its part, must reverse input tax it claimed if it does not pay within 6 months after the agreed payment date.<\/p><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 8.3<\/span>\n<p>On 1 February 2026 a supplier invoices AED 21,000 including VAT of AED 1,000. The customer goes into liquidation. On 15 September 2026 the supplier writes off the debt and notifies the customer. Relief of <b>AED 1,000<\/b> is claimed in the return for the period containing 15 September (more than 6 months after 1 February).<\/p>\n<\/div>"}],"summary":["Value = consideration excluding VAT; use 5% on net prices and <b>5/105<\/b> on gross prices.","Prices to consumers must be shown VAT-inclusive.","Market value applies to some related-party and barter deals; import value includes duty and excise.","Profit margin scheme taxes only the dealer’s margin; bad debt relief needs write-off, 6 months and notice."],"review":[{"q":"A restaurant bill totals AED 735 including VAT. How much is VAT?","a":"AED 35"},{"q":"An invoice is issued in USD 10,000 when the Central Bank rate is 3.6725. What VAT in AED must be shown?","a":"AED 1,836.25"},{"q":"Can a jeweller use the profit margin scheme for new gold bought from a registered wholesaler? Why?","a":null},{"q":"List the four conditions for bad debt relief.","a":null}],"mcq":[43,44,45,46]},"ch9":{"id":"ch9","num":"9","kind":"chapter","title":"Zero-Rated Supplies","short":"Zero-Rated Supplies","objectives":["List the supplies zero-rated by Article 45 of the VAT Law.","Apply the conditions and <b>evidence<\/b> rules for exports of goods and services.","Explain zero-rating for international transport, precious metals, residential property, education and healthcare."],"sections":[{"title":"The zero-rated list","html":"<div class=\"tbl\"><table>\n<thead><tr><th>#<\/th><th>Category<\/th><th>Main conditions<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>1<\/td><td><b>Export of goods<\/b> outside the GCC implementing states (currently all exports)<\/td><td>Goods leave the UAE within <span class=\"num\">90 days<\/span> of the date of supply (or a longer period approved by the FTA); the supplier keeps official and commercial evidence.<\/td><\/tr>\n<tr><td>2<\/td><td><b>Export of services<\/b><\/td><td>Supplied to a recipient who has no place of residence in the UAE and is outside the UAE when the services are performed, and the services are not supplied directly in connection with real estate or goods in the UAE.<\/td><\/tr>\n<tr><td>3<\/td><td><b>International transport<\/b> of passengers and goods, and related services<\/td><td>Transport that starts or ends outside the UAE, or crosses the UAE’s territory; including related services such as loading and handling.<\/td><\/tr>\n<tr><td>4<\/td><td><b>Means of transport<\/b> and related goods and services<\/td><td>Supply of aircraft and vessels for commercial use, rescue and assistance aircraft and vessels, trains and passenger vehicles for mass transport, and goods and services for their repair, maintenance and operation.<\/td><\/tr>\n<tr><td>5<\/td><td><b>Investment precious metals<\/b><\/td><td>Gold, silver and platinum of 99% purity or more, in a form tradable in global bullion markets. (Jewellery is standard-rated.)<\/td><\/tr>\n<tr><td>6<\/td><td><b>First supply of residential buildings<\/b><\/td><td>Sale or lease to a buyer or tenant within <span class=\"num\">3 years<\/span> of completion.<\/td><\/tr>\n<tr><td>7<\/td><td><b>First supply of charitable buildings<\/b> and <b>converted residential buildings<\/b><\/td><td>Buildings designed for charitable use; residential buildings converted from non-residential use.<\/td><\/tr>\n<tr><td>8<\/td><td><b>Education<\/b><\/td><td>Nursery, pre-school and school education by licensed institutions; higher education by institutions owned or at least 50% funded by the federal or local government; and certain related goods and services supplied by the institution, subject to conditions.<\/td><\/tr>\n<tr><td>9<\/td><td><b>Healthcare<\/b><\/td><td>Preventive and basic healthcare services; goods supplied with those services; and medical products listed by Cabinet Decision.<\/td><\/tr>\n<tr><td>10<\/td><td><b>Crude oil and natural gas<\/b><\/td><td>Supplies of crude oil and natural gas.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"},{"title":"Exports of goods: evidence","html":"<div class=\"grid2\">\n<div class=\"card\"><h4>Direct export<\/h4><p>The <b>supplier<\/b> arranges transport out of the UAE. Evidence: customs exit certificate/export declaration, bill of lading or airway bill, commercial invoice, proof of payment.<\/p><\/div>\n<div class=\"card\"><h4>Indirect export<\/h4><p>The <b>overseas customer<\/b> (with no UAE residence) collects and exports the goods within 90 days. The customer must provide export evidence, and the supplier keeps it. Without it, the supplier must charge 5%.<\/p><\/div>\n<\/div><div class=\"box warn\"><span class=\"lbl\">WATCH OUT<\/span>\n<p>If the goods do not leave within 90 days, or the evidence is missing, the export zero-rate is lost and the supplier owes <b>5% output tax<\/b> (often treated as included in the price). Keep customs declarations electronically and match them to sales invoices every month.<\/p>\n<\/div>"},{"title":"Exports of services","html":"<p>Common examples: a Dubai marketing agency designing a campaign for a company based only in Singapore; a UAE software developer licensing an app to a German company. The key tests are that the customer is <mark>not resident in the UAE<\/mark> and is <mark>outside the UAE<\/mark> when the service is performed. If the service is enjoyed in the UAE by someone else (e.g. training delivered in Dubai to the UAE staff of a foreign company), take care: the zero-rate may not apply.<\/p>"},{"title":"Residential property","html":"<p>The first supply of a new residential building, by sale or lease, within three years of completion is zero-rated. This lets developers recover the large input tax on construction. All later sales and leases of that residential property are <b>exempt<\/b> (Chapter 10). Hotels, motels, serviced apartments and similar are <b>not<\/b> residential and are standard-rated.<\/p>"},{"title":"Education and healthcare","html":"<p><b>Education:<\/b> tuition fees of licensed nurseries, pre-schools and schools are zero-rated, as are those of government-owned or government-funded higher education institutions. Other private universities’ fees are standard-rated. Many related items (stationery, extracurricular activities, transport) depend on who supplies them and on detailed conditions; the FTA published an updated <b>VAT Guide for the Education Sector<\/b> in June 2026.<\/p><p><b>Healthcare:<\/b> preventive and basic healthcare services that are generally accepted as necessary for treatment are zero-rated. Cosmetic procedures that are not medically necessary are standard-rated. <span class=\"new\">NEW<\/span> From 1 October 2026 the separate categories of “pharmaceutical products” and “medical equipment” are merged into a single category of <b>“medical products”<\/b> to be specified by Cabinet Decision.<\/p>"}],"summary":["Ten zero-rated categories: exports of goods and services, international transport, means of transport, investment metals, first residential supply, charitable/converted buildings, education, healthcare, crude oil and gas.","Zero-rating needs <b>evidence<\/b>; goods must leave within <b>90 days<\/b>.","Zero-rated suppliers recover their input tax in full."],"review":[{"q":"A gold bar of 99.9% purity is sold to an investor in Dubai. What rate applies? A gold necklace?","a":null},{"q":"A developer leases a new apartment for the first time 2 years after completion. Rate? The second tenant, 3 years later?","a":null},{"q":"What evidence supports a direct export by sea?","a":null},{"q":"Is a Botox treatment for cosmetic reasons zero-rated healthcare?","a":null}],"mcq":[47,48,49,52]},"ch10":{"id":"ch10","num":"10","kind":"chapter","title":"Exempt Supplies","short":"Exempt Supplies","objectives":["List the exempt supplies under Article 46 of the VAT Law and the Executive Regulation.","Separate <b>margin-based<\/b> (exempt) from <b>fee-based<\/b> (taxable) financial services.","Explain the cost of exemption and how it leads to <b>partial exemption<\/b>."],"sections":[{"title":"The exempt list","html":"<div class=\"tbl\"><table>\n<thead><tr><th>Category<\/th><th>Details<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Certain financial services<\/b><\/td><td>Services where the consideration is an implicit margin rather than an explicit fee: interest on loans and credit, issue and transfer of shares and debt securities, operation of current and savings accounts, life insurance and life reinsurance, currency exchange margins. <span class=\"new\">NEW<\/span> From 15 Nov 2024: <b>investment fund management<\/b> services to licensed funds, and the transfer and conversion of <b>virtual assets<\/b> (retroactive to 1 Jan 2018).<\/td><\/tr>\n<tr><td><b>Residential buildings<\/b><\/td><td>Sale or lease of residential property <b>other than<\/b> the zero-rated first supply.<\/td><\/tr>\n<tr><td><b>Bare land<\/b><\/td><td>Land without completed or partly completed buildings or civil engineering works.<\/td><\/tr>\n<tr><td><b>Local passenger transport<\/b><\/td><td>Transport of passengers within the UAE in qualifying means of transport (buses, taxis, metro, water taxis).<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><h3>Financial services: exempt or taxable?<\/h3><div class=\"tbl\"><table>\n<thead><tr><th>Exempt (margin-based)<\/th><th>Standard-rated 5% (explicit fee)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Interest on a car loan or mortgage<\/td><td>Loan processing or arrangement fee<\/td><\/tr>\n<tr><td>Profit element in an Islamic finance contract (murabaha, ijara)<\/td><td>Account maintenance fee, card annual fee<\/td><\/tr>\n<tr><td>Issue or sale of shares<\/td><td>Brokerage commission on a share trade<\/td><\/tr>\n<tr><td>Life insurance premium<\/td><td>General insurance (motor, property, health)<\/td><\/tr>\n<tr><td>Currency exchange where no fee is charged<\/td><td>Remittance fee, advisory fee<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><div class=\"box key\"><span class=\"lbl\">KEY POINT<\/span>\n<p>Islamic finance products receive the <b>same VAT treatment<\/b> as their conventional equivalents, so the profit element of a murabaha is treated like interest. <span class=\"new\">NEW<\/span> FTA Directive No. 4 (2026) confirms that fees necessary for, directly connected to and included in a life insurance premium without a separate charge follow the exempt treatment.<\/p>\n<\/div>"},{"title":"The cost of exemption","html":"<figure class=\"fig\"><svg aria-label=\"Zero-rated versus exempt: effect on input VAT\" role=\"img\" viewbox=\"0 0 660 280\" xmlns=\"http://www.w3.org/2000/svg\"><title>Zero-rated versus exempt: effect on input VAT<\/title><defs><\/defs><g><rect fill=\"#e3f3e3\" height=\"170\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"310\" x=\"10\" y=\"10\"><\/rect><path d=\"M10,40 V20 Q10,10 20,10 H310 Q320,10 320,20 V40 Z\" fill=\"#008300\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"165.0\" y=\"29.6\"><tspan dy=\"0.0\" x=\"165.0\">Exporter (ZERO-RATED sales)<\/tspan><\/text><\/g><g><rect fill=\"#ffffff\" height=\"34\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"286\" x=\"22\" y=\"50\"><\/rect><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"165.0\" y=\"71.0\"><tspan dy=\"0.0\" x=\"165.0\">Sales AED 1,000,000 x 0% = VAT 0<\/tspan><\/text><\/g><g><rect fill=\"#ffffff\" height=\"34\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"286\" x=\"22\" y=\"92\"><\/rect><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"165.0\" y=\"113.0\"><tspan dy=\"0.0\" x=\"165.0\">Purchases AED 400,000 + VAT 20,000<\/tspan><\/text><\/g><g><rect fill=\"#ffffff\" height=\"34\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"286\" x=\"22\" y=\"134\"><\/rect><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"165.0\" y=\"155.0\"><tspan dy=\"0.0\" x=\"165.0\">Input VAT recoverable: YES<\/tspan><\/text><\/g><g><rect fill=\"#00843d\" height=\"70\" rx=\"10\" stroke=\"#00843d\" stroke-width=\"2\" width=\"310\" x=\"10\" y=\"194\"><\/rect><text fill=\"#ffffff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"165.0\" y=\"233.6\"><tspan dy=\"0.0\" x=\"165.0\">FTA REFUNDS AED 20,000: no VAT cost<\/tspan><\/text><\/g><g><rect fill=\"#fdeadf\" height=\"170\" rx=\"10\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"310\" x=\"340\" y=\"10\"><\/rect><path d=\"M340,40 V20 Q340,10 350,10 H640 Q650,10 650,20 V40 Z\" fill=\"#eb6834\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"495.0\" y=\"29.6\"><tspan dy=\"0.0\" x=\"495.0\">Residential landlord (EXEMPT rent)<\/tspan><\/text><\/g><g><rect fill=\"#ffffff\" height=\"34\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"286\" x=\"352\" y=\"50\"><\/rect><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"495.0\" y=\"71.0\"><tspan dy=\"0.0\" x=\"495.0\">Rent AED 1,000,000: no VAT charged<\/tspan><\/text><\/g><g><rect fill=\"#ffffff\" height=\"34\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"286\" x=\"352\" y=\"92\"><\/rect><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"495.0\" y=\"113.0\"><tspan dy=\"0.0\" x=\"495.0\">Purchases AED 400,000 + VAT 20,000<\/tspan><\/text><\/g><g><rect fill=\"#ffffff\" height=\"34\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"286\" x=\"352\" y=\"134\"><\/rect><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"495.0\" y=\"155.0\"><tspan dy=\"0.0\" x=\"495.0\">Input VAT recoverable: NO<\/tspan><\/text><\/g><g><rect fill=\"#c8102e\" height=\"70\" rx=\"10\" stroke=\"#c8102e\" stroke-width=\"2\" width=\"310\" x=\"340\" y=\"194\"><\/rect><text fill=\"#ffffff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"495.0\" y=\"233.6\"><tspan dy=\"0.0\" x=\"495.0\">AED 20,000 becomes a COST of business<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 10.1<\/b> Zero-rated and exempt sales look the same on the invoice but very different in the accounts.<\/figcaption><\/figure><p>An exempt business cannot recover input tax on costs used to make exempt supplies, so VAT becomes a <mark>real cost<\/mark>. A business making both taxable and exempt supplies (a bank, a mixed-use property developer, an insurer selling motor and life cover) is <span class=\"term\">partially exempt<\/span>: it must <b>apportion<\/b> its residual input tax (Chapter 12).<\/p><div class=\"box key\"><span class=\"lbl\">KEY POINT<\/span>\n<p>Input tax on exempt <b>financial services supplied to customers outside the UAE<\/b> can be recovered. <span class=\"new\">NEW<\/span> From 1 October 2026 a person counts as “outside the UAE” for this purpose if present in the UAE for <b>less than 30 days<\/b> (previously “less than a month”) and the presence is not effectively connected with the supply.<\/p>\n<\/div>"},{"title":"Comparison of all four treatments","html":"<div class=\"tbl\"><table>\n<thead><tr><th>Question<\/th><th class=\"c\">Standard 5%<\/th><th class=\"c\">Zero 0%<\/th><th class=\"c\">Exempt<\/th><th class=\"c\">Out of scope<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>VAT charged to customer?<\/td><td class=\"c\">Yes<\/td><td class=\"c\">No (0%)<\/td><td class=\"c\">No<\/td><td class=\"c\">No<\/td><\/tr>\n<tr><td>Related input tax recoverable?<\/td><td class=\"c\">Yes<\/td><td class=\"c\">Yes<\/td><td class=\"c\"><b>No<\/b><\/td><td class=\"c\">Depends (no, if not business)<\/td><\/tr>\n<tr><td>Counts towards registration threshold?<\/td><td class=\"c\">Yes<\/td><td class=\"c\">Yes<\/td><td class=\"c\">No<\/td><td class=\"c\">No<\/td><\/tr>\n<tr><td>Reported in VAT return?<\/td><td class=\"c\">Box 1<\/td><td class=\"c\">Box 4<\/td><td class=\"c\">Box 5<\/td><td class=\"c\">No<\/td><\/tr>\n<tr><td>Tax invoice required?<\/td><td class=\"c\">Yes<\/td><td class=\"c\">Yes<\/td><td class=\"c\">No (commercial invoice)<\/td><td class=\"c\">No<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"}],"summary":["Exempt: margin-based financial services (now including fund management and virtual assets), residential property after first supply, bare land, local passenger transport.","Exempt supplies give <b>no input tax recovery<\/b> and do not count for registration.","Mixed taxable/exempt businesses must apportion input tax."],"review":[{"q":"Classify: (a) bank interest on a personal loan; (b) bank fee for a cheque book; (c) motor insurance premium; (d) Dubai metro ticket; (e) taxi from Dubai to Abu Dhabi; (f) sale of an empty plot.","a":null},{"q":"Why might a residential landlord prefer to make zero-rated rather than exempt supplies?","a":null},{"q":"Explain why crypto exchanges were affected by Cabinet Decision 100 of 2024.","a":null}],"mcq":[20,50,51,53]},"ch11":{"id":"ch11","num":"11","kind":"chapter","title":"Reverse Charge, Imports and Exports","short":"Reverse Charge, Imports & Exports","objectives":["Explain the purpose and mechanics of the <b>reverse charge mechanism (RCM)<\/b>.","Account for imports of <b>services<\/b> and <b>goods<\/b> by registered and unregistered persons.","Identify the sectors under the <b>domestic reverse charge<\/b>, including scrap metal from 2026.","Apply the 2026 removal of self-invoicing correctly."],"sections":[{"title":"Why reverse charge?","html":"<p>When a foreign supplier sells services to a UAE business, it would be impractical to make the foreigner register and collect UAE VAT. Instead the law <mark>shifts the obligation to the recipient<\/mark>: the UAE business calculates the VAT itself, reports it as output tax and, if it is entitled, recovers the same amount as input tax in the same return. In sectors with high fraud risk (gold, phones, scrap), the UAE also uses a <b>domestic<\/b> reverse charge between UAE registrants so that VAT never passes through the hands of a supplier who might disappear.<\/p>"},{"title":"Imports of services","html":"<figure class=\"fig\"><svg aria-label=\"Reverse charge on services imported by a UAE business\" role=\"img\" viewbox=\"0 0 660 260\" xmlns=\"http://www.w3.org/2000/svg\"><title>Reverse charge on services imported by a UAE business<\/title><defs><marker id=\"ar-rcm-16324f\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"9\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><marker id=\"ar-rcm-16324fs\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"1\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><marker id=\"ar-rcm-2a78d6\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"9\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2a78d6\"><\/path><\/marker><marker id=\"ar-rcm-2a78d6s\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"1\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#2a78d6\"><\/path><\/marker><\/defs><g><rect fill=\"#f1f2f3\" height=\"70\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"170\" x=\"10\" y=\"30\"><\/rect><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"95.0\" y=\"62.0\"><tspan dy=\"0.0\" x=\"95.0\">Foreign supplier (e.g.<\/tspan><tspan dy=\"14.0\" x=\"95.0\">software firm in UK)<\/tspan><\/text><\/g><g><rect fill=\"#16324f\" height=\"70\" rx=\"10\" stroke=\"#16324f\" stroke-width=\"2\" width=\"170\" x=\"250\" y=\"30\"><\/rect><text fill=\"#ffffff\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"middle\" x=\"335.0\" y=\"61.9\"><tspan dy=\"0.0\" x=\"335.0\">UAE VAT-registered<\/tspan><tspan dy=\"14.6\" x=\"335.0\">business<\/tspan><\/text><\/g><path d=\"M182.0,65.0 L248.0,65.0\" fill=\"none\" marker-end=\"url(#ar-rcm-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"12.5\" opacity=\"0.92\" rx=\"4\" width=\"110.6\" x=\"159.7\" y=\"45.0\"><\/rect><text fill=\"#16324f\" font-size=\"10\" font-weight=\"bold\" text-anchor=\"middle\" x=\"215.0\" y=\"55.0\"><tspan dy=\"0.0\" x=\"215.0\">invoice, no UAE VAT<\/tspan><\/text><g><rect fill=\"#e6f0fc\" height=\"110\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"180\" x=\"470\" y=\"10\"><\/rect><path d=\"M470,36 V20 Q470,10 480,10 H640 Q650,10 650,20 V36 Z\" fill=\"#2a78d6\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"560.0\" y=\"27.6\"><tspan dy=\"0.0\" x=\"560.0\">VAT return<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"560.0\" y=\"62.5\"><tspan dy=\"0.0\" x=\"560.0\">Box 3: output VAT 5% on<\/tspan><tspan dy=\"12.8\" x=\"560.0\">value<\/tspan><tspan dy=\"12.8\" x=\"560.0\">Box 10: input VAT (same<\/tspan><tspan dy=\"12.8\" x=\"560.0\">amount if fully taxable)<\/tspan><\/text><\/g><path d=\"M422.0,65.0 L468.0,65.0\" fill=\"none\" marker-end=\"url(#ar-rcm-2a78d6)\" stroke=\"#2a78d6\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#fff4d1\" height=\"52\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"640\" x=\"10\" y=\"140\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"156.4\"><tspan dy=\"0.0\" x=\"330.0\">Net effect for a fully taxable business = <tspan font-weight=\"bold\">nil cash cost<\/tspan>, but BOTH entries must be reported. If the<\/tspan><tspan dy=\"13.4\" x=\"330.0\">business makes exempt supplies, part of the input VAT is not recoverable, so the reverse charge becomes<\/tspan><tspan dy=\"13.4\" x=\"330.0\">a real cost.<\/tspan><\/text><\/g><g><rect fill=\"#fdeadf\" height=\"46\" rx=\"10\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"640\" x=\"10\" y=\"204\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"224.1\"><tspan dy=\"0.0\" x=\"330.0\">From 1 Jan 2026 (FDL 16/2025) no self-invoice is required for reverse charge. Keep the supplier's<\/tspan><tspan dy=\"13.4\" x=\"330.0\">invoice, contract and proof of payment instead.<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 11.1<\/b> Reverse charge on imported services.<\/figcaption><\/figure><p>The reverse charge applies when a <b>non-resident<\/b> supplies services to a <b>UAE VAT-registered<\/b> recipient and the place of supply is the UAE. The recipient reports the value in <b>Box 3<\/b> (output) and the recoverable VAT in <b>Box 10<\/b> (input). An <b>unregistered<\/b> UAE business that buys services from abroad must count the value of those imports towards the registration threshold.<\/p><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 11.1<\/span>\n<p>Gulf Clinics LLC (Dubai) pays a US firm AED 200,000 for a new patient-booking system. Gulf Clinics makes zero-rated healthcare supplies (80% of its turnover) and standard-rated cosmetic services (20%). Both are taxable supplies, so it recovers all its input tax.<\/p>\n<div class=\"tbl\"><table class=\"calc\"><tbody>\n<tr><td>Box 3: reverse charge value AED 200,000; VAT<\/td><td class=\"r\">10,000<\/td><\/tr>\n<tr><td>Box 10: recoverable input VAT on the same purchase<\/td><td class=\"r\">(10,000)<\/td><\/tr>\n<tr class=\"tot\"><td>Net VAT cost<\/td><td class=\"r\">0<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>If instead the business were a bank with a 40% recovery rate, it would recover only AED 4,000 and bear AED 6,000 as a cost.<\/p>\n<\/div>"},{"title":"Imports of goods","html":"<div class=\"tbl\"><table>\n<thead><tr><th>Importer<\/th><th>How import VAT is handled<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>VAT-registered<\/b> importer whose customs registration is linked to its TRN<\/td><td>No cash payment at customs. The import VAT is declared in <b>Box 6<\/b> of the VAT return and, if recoverable, claimed in <b>Box 10<\/b> (a cash-flow neutral “deferment”).<\/td><\/tr>\n<tr><td><b>Unregistered<\/b> importer (or individual)<\/td><td>Pays the 5% VAT (together with customs duty) before the goods are released. Import VAT on goods arriving by courier or post is collected by the carrier.<\/td><\/tr>\n<tr><td>Goods under <b>customs suspension<\/b> (transit, bonded warehouses, temporary admission, Designated Zones)<\/td><td>No import VAT while the goods remain under suspension; VAT arises when they are released for use in the UAE.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><div class=\"box upd\"><span class=\"lbl\">UPDATE 2025–26<\/span>\n<p><span class=\"new\">NEW<\/span> Federal Decree-Law No. 16 of 2025 removed, from <span class=\"num\">1 January 2026<\/span>, the requirement to issue a <b>self-invoice<\/b> for reverse-charge supplies. The FTA’s clarifications VATP045 and VATP046 (August–September 2026) stress that this is only an administrative simplification: the recipient must still <b>calculate, report and evidence<\/b> the VAT. To recover the input tax it should keep the overseas supplier’s invoice, the contract, proof of payment and, for goods, the <b>customs declaration<\/b>. For goods imported on or before 31 December 2025 the old self-invoicing rule applied.<\/p>\n<\/div>"},{"title":"The domestic reverse charge","html":"<figure class=\"fig\"><svg aria-label=\"Domestic reverse charge between two UAE registrants\" role=\"img\" viewbox=\"0 0 660 270\" xmlns=\"http://www.w3.org/2000/svg\"><title>Domestic reverse charge between two UAE registrants<\/title><defs><marker id=\"ar-drcm-16324f\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"9\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><marker id=\"ar-drcm-16324fs\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"1\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><marker id=\"ar-drcm-008300\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"9\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#008300\"><\/path><\/marker><marker id=\"ar-drcm-008300s\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"1\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#008300\"><\/path><\/marker><\/defs><g><rect fill=\"#16324f\" height=\"70\" rx=\"10\" stroke=\"#16324f\" stroke-width=\"2\" width=\"190\" x=\"10\" y=\"20\"><\/rect><text fill=\"#ffffff\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"middle\" x=\"105.0\" y=\"59.2\"><tspan dy=\"0.0\" x=\"105.0\">UAE registered SUPPLIER<\/tspan><\/text><\/g><g><rect fill=\"#e6f0fc\" height=\"70\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"190\" x=\"330\" y=\"20\"><\/rect><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"425.0\" y=\"52.0\"><tspan dy=\"0.0\" x=\"425.0\">UAE registered BUYER (for<\/tspan><tspan dy=\"14.0\" x=\"425.0\">resale or manufacture)<\/tspan><\/text><\/g><path d=\"M202.0,55.0 L328.0,55.0\" fill=\"none\" marker-end=\"url(#ar-drcm-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"12.5\" opacity=\"0.92\" rx=\"4\" width=\"110.6\" x=\"209.7\" y=\"35.0\"><\/rect><text fill=\"#16324f\" font-size=\"10\" font-weight=\"bold\" text-anchor=\"middle\" x=\"265.0\" y=\"45.0\"><tspan dy=\"0.0\" x=\"265.0\">invoice without VAT<\/tspan><\/text><g><rect fill=\"#e3f3e3\" height=\"90\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"110\" x=\"540\" y=\"10\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"595.0\" y=\"45.4\"><tspan dy=\"0.0\" x=\"595.0\">Buyer reports<\/tspan><tspan dy=\"13.4\" x=\"595.0\">output + input<\/tspan><tspan dy=\"13.4\" x=\"595.0\">VAT<\/tspan><\/text><\/g><path d=\"M522.0,55.0 L538.0,55.0\" fill=\"none\" marker-end=\"url(#ar-drcm-008300)\" stroke=\"#008300\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#fff4d1\" height=\"40\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"510\" x=\"10\" y=\"104\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"265.0\" y=\"121.1\"><tspan dy=\"0.0\" x=\"265.0\">Invoice must state: \"Recipient to account for VAT\"; buyer gives a written<\/tspan><tspan dy=\"13.4\" x=\"265.0\">declaration of its status and purpose<\/tspan><\/text><\/g><g><rect fill=\"#fff4d1\" height=\"98\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"152\" x=\"10\" y=\"160\"><\/rect><text fill=\"#1f2328\" font-size=\"10.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"86.0\" y=\"193.5\"><tspan dy=\"0.0\" x=\"86.0\">Gold &amp; diamonds; since<\/tspan><tspan dy=\"12.8\" x=\"86.0\">2025 also other<\/tspan><tspan dy=\"12.8\" x=\"86.0\">precious metals &amp;<\/tspan><tspan dy=\"12.8\" x=\"86.0\">stones (CD 127/2024)<\/tspan><\/text><\/g><g><rect fill=\"#f1f2f3\" height=\"98\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"152\" x=\"172\" y=\"160\"><\/rect><text fill=\"#1f2328\" font-size=\"10.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"248.0\" y=\"199.9\"><tspan dy=\"0.0\" x=\"248.0\">Crude &amp; refined oil,<\/tspan><tspan dy=\"12.8\" x=\"248.0\">natural gas and<\/tspan><tspan dy=\"12.8\" x=\"248.0\">hydrocarbons<\/tspan><\/text><\/g><g><rect fill=\"#ebe8fb\" height=\"98\" rx=\"10\" stroke=\"#6250d6\" stroke-width=\"2\" width=\"152\" x=\"334\" y=\"160\"><\/rect><text fill=\"#1f2328\" font-size=\"10.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"410.0\" y=\"193.5\"><tspan dy=\"0.0\" x=\"410.0\">Mobile phones,<\/tspan><tspan dy=\"12.8\" x=\"410.0\">computers, tablets &amp;<\/tspan><tspan dy=\"12.8\" x=\"410.0\">parts (CD 91/2023, from<\/tspan><tspan dy=\"12.8\" x=\"410.0\">30 Oct 2023)<\/tspan><\/text><\/g><g><rect fill=\"#fdeadf\" height=\"98\" rx=\"10\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"152\" x=\"496\" y=\"160\"><\/rect><text fill=\"#1f2328\" font-size=\"10.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"572.0\" y=\"193.5\"><tspan dy=\"0.0\" x=\"572.0\">Ferrous &amp; non-ferrous<\/tspan><tspan dy=\"12.8\" x=\"572.0\">scrap metal (CD<\/tspan><tspan dy=\"12.8\" x=\"572.0\">153/2025, from 14 Jan<\/tspan><tspan dy=\"12.8\" x=\"572.0\">2026)<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 11.2<\/b> Domestic reverse charge between UAE registrants.<\/figcaption><\/figure><div class=\"tbl\"><table>\n<caption>Table 11.1 Sectors under the domestic reverse charge<\/caption>\n<thead><tr><th>Sector<\/th><th>Scope and conditions<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Gold and diamonds; since early 2025 also <b>precious metals<\/b> (silver, platinum, palladium) and <b>precious stones<\/b> (including pearls, rubies, sapphires, emeralds, manufactured diamonds)<\/td><td>Supplies between registrants for resale or for producing other goods. (Investment-grade metals remain zero-rated.)<\/td><\/tr>\n<tr><td>Crude or refined oil, unprocessed or processed natural gas, and hydrocarbons<\/td><td>Supplies to a registrant who intends to resell them or use them to produce or manufacture energy or hydrocarbons.<\/td><\/tr>\n<tr><td>Electronic devices: <b>mobile phones, smartphones, computers, tablets<\/b> and their parts (Cabinet Decision 91/2023, from 30 Oct 2023)<\/td><td>Supplies to a registrant buying for resale or for manufacturing electronic devices. Retail sales to consumers are not affected.<\/td><\/tr>\n<tr><td><span class=\"new\">NEW<\/span> Ferrous and non-ferrous <b>scrap metal<\/b> (Cabinet Decision 153/2025, from 14 Jan 2026)<\/td><td>Supplies between registrants for resale or processing.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><p>In each case the supplier issues a tax invoice <b>without VAT<\/b>, stating that the recipient must account for the VAT, and keeps the recipient’s written declaration that it is registered and buying for resale or manufacture. The recipient reports output tax and recovers input tax in its return.<\/p><div class=\"box warn\"><span class=\"lbl\">WATCH OUT<\/span>\n<p>If the buyer is <b>not<\/b> registered, or buys for its own use (e.g. an office buying laptops for staff), the domestic reverse charge does <b>not<\/b> apply and the supplier charges 5% normally. Suppliers should verify the buyer’s TRN and keep the declaration on file.<\/p>\n<\/div>"},{"title":"Exports at a glance","html":"<p>Exports of goods and services are zero-rated when the conditions in Chapter 9 are met. Exporters usually have more input tax than output tax, so they are in a <b>repayment<\/b> position: they file returns showing a credit and request a refund (Chapter 14). Good evidence and a clean audit trail make refunds faster.<\/p>"}],"summary":["RCM moves the duty to account for VAT from the supplier to the registered recipient.","Imported services: Box 3 + Box 10. Imported goods (registrant): Box 6 + Box 10.","Domestic RCM: precious metals and stones, hydrocarbons, electronic devices, scrap metal (from 14 Jan 2026).","No self-invoice needed from 1 Jan 2026, but evidence is still required."],"review":[{"q":"A UAE company pays a Hong Kong firm AED 50,000 for market research. Show the return entries.","a":null},{"q":"An unregistered individual buys a camera online from Japan for AED 3,000. How is VAT collected?","a":null},{"q":"A phone wholesaler sells 500 phones to a registered retailer for resale. Who accounts for VAT? What documents are needed?","a":null},{"q":"What changed on 1 January 2026 for reverse-charge transactions, and what did not change?","a":null}],"mcq":[55,56,57,58,59]},"ch12":{"id":"ch12","num":"12","kind":"chapter","title":"Input Tax Recovery","short":"Input Tax Recovery","objectives":["Apply the conditions, documents and time limits for recovering input tax.","Identify <b>blocked<\/b> input tax, including the 2026 rules on employee costs and cash payments.","Carry out <b>apportionment<\/b> under the current and the new (2027/28) standard method.","Apply the <b>Capital Assets Scheme<\/b> and the new supplier-verification duty."],"sections":[{"title":"The conditions","html":"<figure class=\"fig\"><svg aria-label=\"Tests for recovering input VAT\" role=\"img\" viewbox=\"0 0 660 360\" xmlns=\"http://www.w3.org/2000/svg\"><title>Tests for recovering input VAT<\/title><defs><marker id=\"ar-itx-00843d\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"9\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#00843d\"><\/path><\/marker><marker id=\"ar-itx-00843ds\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"1\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#00843d\"><\/path><\/marker><\/defs><circle cx=\"32\" cy=\"32\" fill=\"#16324f\" r=\"20\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"32.0\" y=\"36.9\"><tspan dy=\"0.0\" x=\"32.0\">1<\/tspan><\/text><g><rect fill=\"#e6f0fc\" height=\"48\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"486\" x=\"62\" y=\"8\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"start\" x=\"74.0\" y=\"35.9\"><tspan dy=\"0.0\" x=\"74.0\">You are VAT-registered and VAT was correctly charged to YOU<\/tspan><\/text><\/g><path d=\"M550.0,32.0 L580.0,32.0\" fill=\"none\" marker-end=\"url(#ar-itx-00843d)\" stroke=\"#00843d\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><circle cx=\"32\" cy=\"90\" fill=\"#16324f\" r=\"20\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"32.0\" y=\"94.9\"><tspan dy=\"0.0\" x=\"32.0\">2<\/tspan><\/text><g><rect fill=\"#e6f0fc\" height=\"48\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"486\" x=\"62\" y=\"66\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"start\" x=\"74.0\" y=\"87.1\"><tspan dy=\"0.0\" x=\"74.0\">The cost is used (or intended) for taxable supplies, incl. zero-rated (not<\/tspan><tspan dy=\"13.4\" x=\"74.0\">exempt or private use)<\/tspan><\/text><\/g><path d=\"M550.0,90.0 L580.0,90.0\" fill=\"none\" marker-end=\"url(#ar-itx-00843d)\" stroke=\"#00843d\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><circle cx=\"32\" cy=\"148\" fill=\"#16324f\" r=\"20\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"32.0\" y=\"152.9\"><tspan dy=\"0.0\" x=\"32.0\">3<\/tspan><\/text><g><rect fill=\"#fdeadf\" height=\"48\" rx=\"10\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"486\" x=\"62\" y=\"124\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"start\" x=\"74.0\" y=\"145.1\"><tspan dy=\"0.0\" x=\"74.0\">The cost is NOT blocked: entertainment, motor cars available for private use,<\/tspan><tspan dy=\"13.4\" x=\"74.0\">staff benefits (unless allowed)<\/tspan><\/text><\/g><path d=\"M550.0,148.0 L580.0,148.0\" fill=\"none\" marker-end=\"url(#ar-itx-00843d)\" stroke=\"#00843d\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><circle cx=\"32\" cy=\"206\" fill=\"#16324f\" r=\"20\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"32.0\" y=\"210.9\"><tspan dy=\"0.0\" x=\"32.0\">4<\/tspan><\/text><g><rect fill=\"#e0f5ec\" height=\"48\" rx=\"10\" stroke=\"#1baf7a\" stroke-width=\"2\" width=\"486\" x=\"62\" y=\"182\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"start\" x=\"74.0\" y=\"203.1\"><tspan dy=\"0.0\" x=\"74.0\">You hold a valid tax invoice / customs declaration and have paid, or intend<\/tspan><tspan dy=\"13.4\" x=\"74.0\">to pay within 6 months of the due date<\/tspan><\/text><\/g><path d=\"M550.0,206.0 L580.0,206.0\" fill=\"none\" marker-end=\"url(#ar-itx-00843d)\" stroke=\"#00843d\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><circle cx=\"32\" cy=\"264\" fill=\"#16324f\" r=\"20\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"32.0\" y=\"268.9\"><tspan dy=\"0.0\" x=\"32.0\">5<\/tspan><\/text><g><rect fill=\"#fde4e4\" height=\"48\" rx=\"10\" stroke=\"#e34948\" stroke-width=\"2\" width=\"486\" x=\"62\" y=\"240\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"start\" x=\"74.0\" y=\"254.4\"><tspan dy=\"0.0\" x=\"74.0\">From 1 Oct 2026: you have verified the supplier and the transaction (FTA<\/tspan><tspan dy=\"13.4\" x=\"74.0\">Decision 13/2026); cash payments above a limit set by the Minister are<\/tspan><tspan dy=\"13.4\" x=\"74.0\">blocked<\/tspan><\/text><\/g><path d=\"M550.0,264.0 L580.0,264.0\" fill=\"none\" marker-end=\"url(#ar-itx-00843d)\" stroke=\"#00843d\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><circle cx=\"32\" cy=\"322\" fill=\"#16324f\" r=\"20\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"32.0\" y=\"326.9\"><tspan dy=\"0.0\" x=\"32.0\">6<\/tspan><\/text><g><rect fill=\"#ebe8fb\" height=\"48\" rx=\"10\" stroke=\"#6250d6\" stroke-width=\"2\" width=\"486\" x=\"62\" y=\"298\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"start\" x=\"74.0\" y=\"319.1\"><tspan dy=\"0.0\" x=\"74.0\">Claim in the period you receive the invoice (or the next one); excess credits<\/tspan><tspan dy=\"13.4\" x=\"74.0\">must be used within 5 years<\/tspan><\/text><\/g><path d=\"M550.0,322.0 L580.0,322.0\" fill=\"none\" marker-end=\"url(#ar-itx-00843d)\" stroke=\"#00843d\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#00843d\" height=\"338\" rx=\"10\" stroke=\"#00843d\" stroke-width=\"2\" width=\"70\" x=\"582\" y=\"8\"><\/rect><text fill=\"#ffffff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"617.0\" y=\"165.7\"><tspan dy=\"0.0\" x=\"617.0\">ALL six<\/tspan><tspan dy=\"15.9\" x=\"617.0\">=<\/tspan><tspan dy=\"15.9\" x=\"617.0\">RECOVER<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 12.1<\/b> Six tests for recovering input tax.<\/figcaption><\/figure><p>Input tax is recoverable when it is incurred on goods and services <mark>used, or intended to be used, for making taxable supplies<\/mark> (standard-rated or zero-rated), or certain other supplies that the law treats as allowing recovery (such as exempt financial services to customers outside the UAE). The registrant must hold the right <b>documents<\/b>: a valid tax invoice, a customs declaration for imports, or the evidence required for reverse-charge supplies.<\/p><h3>Timing<\/h3><ul>\n<li>Claim in the return for the period in which the tax invoice is received, or in the <b>next<\/b> period.<\/li>\n<li>The registrant must have paid, or intend to pay, the consideration within <span class=\"num\">6 months<\/span> of the agreed payment date. If it does not pay by then, it must <b>reverse<\/b> the input tax claimed.<\/li>\n<li><span class=\"new\">NEW<\/span> From 1 January 2026 an excess of recoverable tax must be <b>refunded or offset within 5 years<\/b> from the end of the tax period in which it arose (with transitional relief until 31 December 2026 for older balances). Unused credits then lapse.<\/li>\n<\/ul>"},{"title":"Blocked input tax","html":"<div class=\"tbl\"><table>\n<thead><tr><th>Item<\/th><th>Rule<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Entertainment<\/b><\/td><td>Input tax on hospitality for anyone other than employees (customers, suppliers, potential customers): meals, drinks, accommodation, event tickets, trips, is <mark>not recoverable<\/mark>, with limited exceptions (e.g. a business that sells entertainment, or meals and accommodation for business travel that are not entertainment).<\/td><\/tr>\n<tr><td><b>Motor vehicles<\/b><\/td><td>Not recoverable on a vehicle (purchase, hire, repair, fuel) that is <b>available for personal use<\/b> by any person. Recoverable for vehicles used exclusively for business (taxis, rental fleets, delivery vans, vehicles for resale).<\/td><\/tr>\n<tr><td><b>Goods and services for employees<\/b> at no charge for their personal benefit<\/td><td>Generally not recoverable unless the employer must provide them under labour law or other legislation (e.g. medical insurance), or, <span class=\"new\">NEW<\/span> from 1 Oct 2026, under the cases and conditions set by the FTA.<\/td><\/tr>\n<tr><td><b>Non-business use<\/b><\/td><td>No recovery on costs used for private or non-business purposes.<\/td><\/tr>\n<tr><td><b>Exempt supplies<\/b><\/td><td>No recovery on costs used for exempt supplies (subject to apportionment).<\/td><\/tr>\n<tr><td><span class=\"new\">NEW<\/span> <b>Cash payments<\/b><\/td><td>From 1 Oct 2026 (CD 149/2026) no recovery on a supply above a value to be set by Ministerial Decision where the consideration is paid, or intended to be paid, in <b>cash<\/b>.<\/td><\/tr>\n<tr><td><span class=\"new\">NEW<\/span> <b>Tax evasion<\/b><\/td><td>From 1 Jan 2026 the FTA can deny input tax where the supply is part of a tax evasion arrangement and the recipient <b>knew or should have known<\/b>.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><div class=\"box upd\"><span class=\"lbl\">UPDATE 2025–26: EMPLOYEE COSTS<\/span>\n<p><span class=\"new\">NEW<\/span> From <span class=\"num\">1 October 2026<\/span>, FTA Decision No. 17 of 2026 sets out when input tax on goods and services given to employees free of charge can be recovered, covering <b>employee transport, food and beverages, accommodation<\/b> (including for new hires), <b>mobile phones and internet<\/b>, and <b>employee parking<\/b>. Under CD 149/2026, accommodation counts as a legal obligation only where it is <b>mandatory under a decision or directive of the Ministry of Human Resources and Emiratisation<\/b>, and the labour-law exception now covers employees in any financial or non-financial free zone. Employers should review payroll benefits policies against these conditions.<\/p>\n<\/div>"},{"title":"Supplier and transaction verification","html":"<div class=\"box upd\"><span class=\"lbl\">UPDATE 2025–26<\/span>\n<p><span class=\"new\">NEW<\/span> From <span class=\"num\">1 October 2026<\/span>, under <b>FTA Decision No. 13 of 2026<\/b>, a valid tax invoice is <mark>no longer enough on its own<\/mark>. Before recovering input tax a business must follow documented procedures to verify that the <b>supplier genuinely exists<\/b> and is properly registered, that its identity matches the invoice (name, TRN, address), and that the <b>transaction actually took place<\/b> (delivery records, contracts, payment through traceable channels). Practical steps: check TRNs on the FTA’s TRN verification service, keep supplier onboarding files, match purchase orders, goods received notes and invoices, and pay by bank transfer.<\/p>\n<\/div>"},{"title":"Apportionment for partially exempt businesses","html":"<p>Input tax falls into three buckets:<\/p><ol>\n<li><b>Directly attributable to taxable supplies<\/b>: fully recoverable.<\/li>\n<li><b>Directly attributable to exempt supplies<\/b>: not recoverable.<\/li>\n<li><b>Residual<\/b> (overheads used for both, e.g. rent of head office, audit fees, IT): partly recoverable using a recovery percentage.<\/li>\n<\/ol><h3>Current standard method (input-tax based)<\/h3><div class=\"formula\">Recovery % = Input tax on taxable supplies ÷ (Input tax on taxable + exempt supplies)<small>Applied to residual input tax each period, with an annual adjustment at the end of the tax year. A
