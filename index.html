= 4m; limit = lower of 4m and 5m = 4m; 3.5m ≤ 4m, so the de minimis test is met, if all other conditions are met."}],"tf":[{"id":1,"s":"Free zone companies are automatically exempt from Corporate Tax.","a":false,"x":"Only a QFZP gets 0%, and only on Qualifying Income."},{"id":2,"s":"Zero-rated supplies count towards the VAT registration threshold.","a":true,"x":"They are taxable supplies."},{"id":3,"s":"An exempt supplier can recover input VAT on costs of its exempt supplies.","a":false,"x":"That is the cost of exemption."},{"id":4,"s":"A tax invoice must be issued within 14 days of the date of supply.","a":true,"x":"Correct as stated."},{"id":5,"s":"Residential rent after the first supply is standard-rated.","a":false,"x":"It is exempt."},{"id":6,"s":"The UAE withholding tax rate is currently 0%.","a":true,"x":"Correct as stated."},{"id":7,"s":"An employee earning a salary of AED 2 million a year is a CT taxable person.","a":false,"x":"Wages are excluded."},{"id":8,"s":"Client entertainment is 50% deductible for Corporate Tax.","a":true,"x":"Correct as stated."},{"id":9,"s":"Input VAT on client entertainment is 50% recoverable.","a":false,"x":"It is fully blocked for VAT."},{"id":10,"s":"UAE tax losses can be carried back to an earlier year.","a":false,"x":"Carry-forward only."},{"id":11,"s":"A CT Tax Group requires 75% ownership.","a":false,"x":"95%; 75% is the Qualifying Group test."},{"id":12,"s":"Small Business Relief now applies to tax periods ending on or before 31 December 2029.","a":true,"x":"MD 131/2026."},{"id":13,"s":"A QFZP pays 9% on income attributable to its mainland branch.","a":true,"x":"Without the AED 375,000 band."},{"id":14,"s":"The VAT return is due by the 28th day after the end of the tax period.","a":true,"x":"Correct as stated."},{"id":15,"s":"Since 1 January 2026, a self-invoice is required for reverse-charge imports.","a":false,"x":"Self-invoicing was removed."},{"id":16,"s":"From 14 April 2026, the VAT late payment penalty is 14% per year.","a":true,"x":"Calculated monthly."},{"id":17,"s":"A pro-forma invoice creates a tax point.","a":false,"x":"Only a tax invoice does."},{"id":18,"s":"Exported goods must leave the UAE within 90 days to be zero-rated (unless the FTA extends this).","a":true,"x":"Correct as stated."},{"id":19,"s":"DIFC is a Designated Zone for VAT.","a":false,"x":""},{"id":20,"s":"Dividends received from a UAE company are exempt from CT.","a":true,"x":"Correct as stated."},{"id":21,"s":"Government fines are deductible for CT.","a":false,"x":""},{"id":22,"s":"Top-up Tax applies to every UAE company.","a":false,"x":"Only to MNE groups with EUR 750m+ revenue."},{"id":23,"s":"E-invoicing applies to B2C transactions from 2027.","a":false,"x":"B2C is excluded for now."},{"id":24,"s":"Businesses with revenue of AED 50m or more had to appoint an ASP by 30 October 2026.","a":true,"x":"MD 66/2026."},{"id":25,"s":"Real estate VAT records must be kept for 15 years.","a":true,"x":"Correct as stated."},{"id":26,"s":"CT records must be kept for 5 years.","a":false,"x":"7 years."},{"id":27,"s":"A voluntary disclosure is required for an underpayment above AED 10,000.","a":true,"x":"Correct as stated."},{"id":28,"s":"The R&D Tax Credit (Phase 1) is refundable in cash.","a":false,"x":"It is non-refundable."},{"id":29,"s":"Sales of bare land are exempt from VAT.","a":true,"x":"Correct as stated."},{"id":30,"s":"A company incorporated in 2026 must register for CT within 3 months of incorporation.","a":true,"x":"Correct as stated."}],"cls":[{"id":1,"s":"Sale of furniture in a Dubai showroom","a":"S","x":"Ordinary supply of goods in the UAE"},{"id":2,"s":"Export of steel to Kenya with customs exit evidence","a":"Z","x":"Export with official exit evidence"},{"id":3,"s":"Rent of a family villa in the fourth year of letting","a":"E","x":"Residential rent after the first supply"},{"id":4,"s":"Rent of an office in Business Bay","a":"S","x":"Commercial property is not residential"},{"id":5,"s":"Salary paid to a sales executive","a":"O","x":"Employment is not a business supply"},{"id":6,"s":"Dubai Metro ticket","a":"E","x":"Local passenger transport"},{"id":7,"s":"Flight from Dubai to London","a":"Z","x":"International passenger transport"},{"id":8,"s":"Tuition fees at a licensed school","a":"Z","x":"Qualifying education"},{"id":9,"s":"Interest on a car loan","a":"E","x":"Margin-based financial service (interest)"},{"id":10,"s":"Annual fee on a credit card","a":"S","x":"Fee-based financial service"},{"id":11,"s":"Life insurance premium","a":"E","x":"Life insurance"},{"id":12,"s":"Motor insurance premium","a":"S","x":"Other (non-life) insurance"},{"id":13,"s":"99.9% gold bar bought for investment","a":"Z","x":"Investment precious metal (99% purity or more)"},{"id":14,"s":"Gold necklace bought in a mall","a":"S","x":"Jewellery is not investment gold"},{"id":15,"s":"Sale of an empty plot of land","a":"E","x":"Bare land"},{"id":16,"s":"First sale of a new apartment one year after completion","a":"Z","x":"First supply of residential property within 3 years of completion"},{"id":17,"s":"Hotel room in Ras Al Khaimah","a":"S","x":"Hotel accommodation is not exempt residential"},{"id":18,"s":"Dividend received from shares","a":"O","x":"Return on shares, not consideration for a supply"},{"id":19,"s":"Pure donation to a charity with nothing received in return","a":"O","x":"Nothing supplied in return"},{"id":20,"s":"Basic medical consultation at a clinic","a":"Z","x":"Preventive and basic healthcare"}],"dl":[{"id":1,"q":"VAT quarter ends 31 March 2026: return and payment","a":"28 April 2026"},{"id":2,"q":"VAT monthly period February 2026: return and payment","a":"28 March 2026"},{"id":3,"q":"Taxable supplies first exceed AED 375,000 at the end of August 2026: apply for VAT registration","a":"30 September 2026 (effective 1 September 2026)"},{"id":4,"q":"Goods delivered (date of supply) on 3 March 2026: issue the tax invoice","a":"17 March 2026"},{"id":5,"q":"Company incorporated on 12 April 2026: CT registration","a":"12 July 2026"},{"id":6,"q":"Financial year ended 31 December 2026: CT return and payment","a":"30 September 2027"},{"id":7,"q":"Financial year ended 31 March 2026: CT return and payment","a":"31 December 2026"},{"id":8,"q":"First tax period ended 31 December 2025, company registered late: file to obtain the penalty waiver","a":"31 July 2026"},{"id":9,"q":"Freelancer crossed AED 1m business turnover in 2026: CT registration","a":"31 March 2027"},{"id":10,"q":"MNE group (calendar year) in scope of Top-up Tax for 2025: registration / first return","a":"30 November 2026 / 30 June 2027"},{"id":11,"q":"Error of AED 25,000 found on Monday 2 November 2026: Voluntary Disclosure","a":"Within 20 business days: about 30 November 2026 (check public holidays)"},{"id":12,"q":"Business with revenue of AED 30m: appoint an e-invoicing ASP / go live","a":"31 March 2027 / 1 July 2027"}],"blanks":[{"id":1,"q":"The UAE standard VAT rate is ___.","a":"5%"},{"id":2,"q":"The mandatory VAT registration threshold is ___.","a":"AED 375,000"},{"id":3,"q":"The voluntary VAT registration threshold is ___.","a":"AED 187,500"},{"id":4,"q":"VAT in a VAT-inclusive price = price × ___.","a":"5/105"},{"id":5,"q":"The CT 0% band applies to taxable income up to ___.","a":"AED 375,000"},{"id":6,"q":"A natural person is taxable for CT when business turnover exceeds ___ in a calendar year.","a":"AED 1 million"},{"id":7,"q":"Small Business Relief applies where revenue does not exceed ___.","a":"AED 3 million"},{"id":8,"q":"The QFZP de minimis limit is the lower of ___ of total revenue and ___.","a":"5%; AED 5 million"},{"id":9,"q":"The participation exemption needs ___ ownership or a cost of at least ___.","a":"5%; AED 4 million"},{"id":10,"q":"A CT Tax Group needs ___ ownership.","a":"95%"},{"id":11,"q":"Net interest is deductible up to the higher of ___ and ___ of adjusted EBITDA.","a":"AED 12 million; 30%"},{"id":12,"q":"Losses brought forward can offset at most ___ of taxable income.","a":"75%"},{"id":13,"q":"The CT return is due ___ months after the end of the tax period.","a":"9"},{"id":14,"q":"The VAT return is due by the ___ day after the end of the tax period.","a":"28th"},{"id":15,"q":"The late payment penalty from 14 April 2026 is ___ per year.","a":"14%"}],"prac":[{"id":"P1","g":0,"t":"Dinner bill","q":"Your family’s restaurant bill is AED 630, and menu prices include VAT. How much VAT did you pay?","a":"<li><p>630 × 5/105 = <b>AED 30<\/b>. The restaurant’s net revenue is AED 600.<\/p><\/li>"},{"id":"P2","g":0,"t":"Tourist shopping","q":"Maria, a Spanish tourist aged 30, buys a handbag for AED 2,100 including VAT at a store in the tourist refund scheme and leaves Dubai a week later with the bag. How much will she get back?","a":"<li><p>VAT = 2,100 × 5/105 = 100. Refund = 87% × 100 − AED 3.60 = <b>AED 83.40<\/b>.<\/p><\/li>"},{"id":"P3","g":0,"t":"Salary and bonus","q":"Ahmed earns a salary of AED 25,000 a month and a year-end bonus of AED 60,000. What UAE tax does he pay on this income?","a":"<li><p><b>None.<\/b> There is no personal income tax on employment income, and wages are excluded from Corporate Tax. He pays VAT only as a consumer.<\/p><\/li>"},{"id":"P4","g":0,"t":"Freelance web developer","q":"Priya, a freelance web developer, invoices UAE clients AED 30,000 every month from January 2026. Must she register for VAT? For CT?","a":"<li><p>VAT: 12 × 30,000 = 360,000, which never exceeds AED 375,000 in any 12 months, so registration is <b>not mandatory<\/b>; she <b>may<\/b> register voluntarily once supplies pass AED 187,500 (end of July: 210,000). CT: turnover below AED 1m, so she is <b>not<\/b> a taxable person.<\/p><\/li>"},{"id":"P5","g":0,"t":"Family landlord","q":"Fatima owns three apartments rented to families for AED 450,000 a year. Must she register for VAT or CT?","a":"<li><p>VAT: residential rents (after the first supply) are <b>exempt<\/b> and do not count towards the threshold, so no. CT: rent from personally owned property that needs no licence is <b>real estate investment income<\/b>, excluded for individuals, so no.<\/p><\/li>"},{"id":"P6","g":0,"t":"Fatima buys a shop","q":"Fatima also buys a shop and lets it to a retailer for AED 400,000 a year. What changes?","a":"<li><p>Commercial rent is <b>standard-rated<\/b>; AED 400,000 &gt; AED 375,000, so she <b>must register for VAT<\/b> and charge 5%. For CT it is still real estate investment income of an individual if no licence is required, so no CT.<\/p><\/li>"},{"id":"P7","g":0,"t":"Buying a new flat","q":"Omar buys a brand-new apartment directly from the developer six months after completion. Does he pay VAT? Is the 4% Dubai Land Department fee VAT?","a":"<li><p>The first supply of residential property within 3 years of completion is <b>zero-rated<\/b>, so no VAT. The DLD fee is a government fee, <b>outside the scope<\/b> of VAT.<\/p><\/li>"},{"id":"P8","g":0,"t":"Renting an office","q":"Your company (VAT-registered, fully taxable) rents an office for AED 120,000 + VAT a year. What is the real cost?","a":"<li><p>VAT of AED 6,000 is charged but <b>recoverable<\/b> as input tax, so the real cost is AED 120,000 (if the company verifies the landlord and holds a valid tax invoice).<\/p><\/li>"},{"id":"P9","g":0,"t":"Streaming subscription","q":"A US streaming service charges UAE subscribers AED 55 a month. Is VAT included, and who pays it to the FTA?","a":"<li><p>Electronic services used in the UAE are taxed here. The US company must register (no threshold) and include 5% VAT: 55 × 5/105 = <b>AED 2.62<\/b> a month, paid by the company to the FTA.<\/p><\/li>"},{"id":"P10","g":0,"t":"School and hospital bills","q":"Your child’s licensed school charges AED 45,000 tuition. Your spouse has a basic GP consultation (AED 400) and a cosmetic laser treatment (AED 2,000). Which carry VAT?","a":"<li><p>Tuition: <b>zero-rated<\/b>. Basic healthcare: <b>zero-rated<\/b>. Cosmetic treatment that is not medically necessary: <b>5%<\/b> (AED 100 if the price is VAT-exclusive).<\/p><\/li>"},{"id":"P11","g":1,"t":"Supermarket receipt","q":"A supermarket receipt totals AED 315 including VAT. What kind of document is it, and how much VAT is included?","a":"<li><p>A <b>simplified tax invoice<\/b>. VAT = 315 × 5/105 = <b>AED 15<\/b>.<\/p><\/li>"},{"id":"P12","g":1,"t":"Used car dealer","q":"A dealer buys a used car from an individual for AED 45,000 and sells it for AED 57,600 using the profit margin scheme. What VAT is due?","a":"<li><p>Margin 12,600 × 5/105 = <b>AED 600<\/b>. (Under normal rules it would be 2,742.86.)<\/p><\/li>"},{"id":"P13","g":1,"t":"Selling your own car","q":"You sell your private car to a friend for AED 40,000. Is VAT due?","a":"<li><p><b>No.<\/b> A private individual not conducting business makes no taxable supply; it is outside the scope of VAT.<\/p><\/li>"},{"id":"P14","g":1,"t":"Eid hampers","q":"A company gives 300 customers one hamper each costing AED 400 (input tax recovered). Is VAT due?","a":"<li><p>Each recipient received less than AED 500 in 12 months, so there is <b>no deemed supply<\/b>.<\/p><\/li>"},{"id":"P15","g":1,"t":"A VIP gift","q":"The same company gives its biggest client a watch costing AED 3,000. Is VAT due?","a":"<li><p>Above AED 500 for that recipient: a <b>deemed supply<\/b> with output tax of AED 150. It is payable only if total deemed-supply output tax in the 12 months exceeds AED 2,000 (only the excess is payable).<\/p><\/li>"},{"id":"P16","g":1,"t":"Online order from abroad","q":"You order headphones worth AED 1,200 from a foreign website, delivered by courier to your home. How is VAT collected?","a":"<li><p>Import VAT of 5% (on the value plus any duty) is collected by the courier or customs before delivery. You are not registered, so you cannot recover it.<\/p><\/li>"},{"id":"P17","g":1,"t":"Wedding hall deposit","q":"You pay a hall a deposit of AED 10,500 (including VAT) in March for a wedding in June. When must the hall account for VAT?","a":"<li><p>On the deposit, in the period covering <b>March<\/b> (payment creates a tax point): VAT = 10,500 × 5/105 = AED 500.<\/p><\/li>"},{"id":"P18","g":1,"t":"Returned shoes","q":"A shop refunds a customer AED 210 (including VAT) for returned shoes. What must the shop do?","a":"<li><p>Issue a <b>tax credit note<\/b> within 14 days and reduce its output tax by AED 10 in that period.<\/p><\/li>"},{"id":"P19","g":1,"t":"Foreign clients only","q":"A Dubai translator works only for clients based abroad with no UAE presence, earning AED 500,000 a year. VAT position?","a":"<li><p>Exported services are <b>zero-rated<\/b> and count towards the threshold, so she must register. Because all her supplies are zero-rated, she can ask the FTA for an <b>exception from registration<\/b> (then she cannot recover input tax).<\/p><\/li>"},{"id":"P20","g":1,"t":"Small grocery LLC","q":"A grocery LLC has annual sales of AED 1.5m. VAT? CT?","a":"<li><p>VAT: <b>must register<\/b> (over AED 375,000). CT: as a company it must <b>register and file<\/b>; with revenue under AED 3m (and never above it) it can elect <b>Small Business Relief<\/b> and pay nil to 2029.<\/p><\/li>"},{"id":"P21","g":2,"t":"Cash for a coffee machine","q":"A café owner plans to pay AED 80,000 in cash for a coffee machine in November 2026. Any VAT risk?","a":"<li><p>From 1 October 2026 input tax is blocked on cash-paid supplies above a limit to be set by Ministerial Decision, and suppliers and transactions must be verified (FTA Decision 13/2026). Pay by <b>bank transfer<\/b> and keep evidence.<\/p><\/li>"},{"id":"P22","g":2,"t":"Managing director’s car","q":"A company leases a saloon car that the managing director also uses at weekends. VAT and CT treatment?","a":"<li><p>VAT: input tax is <b>blocked<\/b> (car available for personal use). CT: normally <b>deductible<\/b> as part of employment costs, provided it is at arm’s length/market value (the MD may be a Connected Person if an owner or officer).<\/p><\/li>"},{"id":"P23","g":2,"t":"Staff housing after October 2026","q":"A construction firm provides free accommodation to workers. Can it recover the VAT on the rent?","a":"<li><p>From 1 October 2026 accommodation counts as a legal obligation only where <b>mandatory under a MoHRE decision or directive<\/b>; otherwise recovery depends on the conditions in FTA Decision 17/2026. If neither applies, the VAT is blocked.<\/p><\/li>"},{"id":"P24","g":2,"t":"A first-year loss","q":"A new trading company made a loss of AED 400,000 in its first year. Must it file a CT return? Should it elect SBR?","a":"<li><p>Yes, it must file. Electing SBR would mean the loss <b>cannot be carried forward<\/b>, so it may be better not to elect SBR for a loss year.<\/p><\/li>"},{"id":"P25","g":2,"t":"Dividends of an individual","q":"Khalid receives AED 80,000 of dividends from his personal share portfolio. Is this taxed?","a":"<li><p><b>No.<\/b> Personal investment income of an individual is excluded from CT.<\/p><\/li>"},{"id":"P26","g":2,"t":"Free zone consultancy","q":"A free zone consultancy firm earns most of its fees from mainland clients. Will it pay 0%?","a":"<li><p>Consultancy is <b>not a Qualifying Activity<\/b>, so mainland fees are non-qualifying revenue. If they exceed the de minimis limit (lower of 5% or AED 5m), it is <b>not a QFZP<\/b> and pays the normal 0%/9% rates. Many free zone service firms are in this position.<\/p><\/li>"},{"id":"P27","g":2,"t":"Late VAT payment","q":"VAT of AED 30,000 due on 28 April 2026 is paid on 28 June 2026, and the return was filed late too. What penalties apply?","a":"<li><p>Late payment: 30,000 × 14% × 2/12 = <b>AED 700<\/b>. Late filing (first time): <b>AED 1,000<\/b>.<\/p><\/li>"},{"id":"P28","g":2,"t":"Small error found","q":"A business discovers it under-declared VAT by AED 7,500 last quarter; its next return is not yet due. What should it do?","a":"<li><p>Errors of AED 10,000 or less can be <b>corrected in the next return<\/b>. A Voluntary Disclosure is needed only if no return can carry it.<\/p><\/li>"},{"id":"P29","g":2,"t":"Treaty benefits abroad","q":"A UAE company receives dividends from India and wants the lower treaty withholding rate. What document does it need?","a":"<li><p>A <b>Tax Residency Certificate<\/b>, applied for on EmaraTax.<\/p><\/li>"},{"id":"P30","g":2,"t":"PDF invoices in 2027","q":"A company with AED 80m revenue plans to keep emailing PDF invoices in 2027. Is that compliant?","a":"<li><p><b>No.<\/b> From 1 January 2027 it must issue structured e-invoices through an Accredited Service Provider (it should have appointed one by 30 October 2026).<\/p><\/li>"},{"id":"P31","g":3,"t":"Social media influencer","q":"Layla, an influencer, earns AED 1.4m in 2026 from UAE and foreign brands. VAT and CT?","a":"<li><p>CT: business turnover over AED 1m, so she is a <b>taxable person<\/b>: register by 31 March 2027, file by 30 September 2027 (she may elect SBR). VAT: over AED 375,000, so she <b>must register<\/b>: 5% on UAE brands; services to foreign brands can be zero-rated if the export conditions are met.<\/p><\/li>"},{"id":"P32","g":3,"t":"Suspicious supplier","q":"A trading company’s new supplier has a TRN that does not validate on the FTA’s checker. What should it do?","a":"<li><p>Do <b>not<\/b> claim the input tax until the supplier and transaction are verified (FTA Decision 13/2026). Since 2026 the FTA can deny input tax linked to evasion where the buyer knew or should have known.<\/p><\/li>"},{"id":"P33","g":3,"t":"Jewellery or bullion","q":"You buy a gold necklace (AED 8,400 including VAT) and a 50 g gold bar of 99.99% purity. VAT on each?","a":"<li><p>Necklace: <b>5%<\/b>, AED 400 included. Investment gold bar: <b>zero-rated<\/b>.<\/p><\/li>"},{"id":"P34","g":3,"t":"Gym membership","q":"An annual gym membership costs AED 3,150 including VAT. How much VAT is included?","a":"<li><p>3,150 × 5/105 = <b>AED 150<\/b>.<\/p><\/li>"},{"id":"P35","g":3,"t":"Traffic fine","q":"A company pays AED 1,500 of traffic fines for its delivery van. VAT? CT?","a":"<li><p>Fines are not consideration for a supply, so <b>no VAT<\/b>. For CT, fines are <b>not deductible<\/b>.<\/p><\/li>"},{"id":"P36","g":3,"t":"Charity run sponsorship","q":"A company pays AED 50,000 to a registered event organiser to sponsor a charity run and gets its logo on all shirts. VAT?","a":"<li><p>Sponsorship with advertising benefits is consideration for a <b>taxable service<\/b>: the organiser charges 5% (AED 2,500).<\/p><\/li>"},{"id":"P37","g":3,"t":"Visa fees recharged","q":"A PRO company pays a client’s visa fees of AED 3,000 to the government and charges a service fee of AED 500. VAT?","a":"<li><p>If the PRO pays the fees as the client’s agent, recharges the exact amount and shows it separately, the AED 3,000 is a <b>disbursement<\/b> outside scope. The AED 500 fee is <b>5%<\/b> (AED 25).<\/p><\/li>"},{"id":"P38","g":3,"t":"Selling a family business","q":"Khalid sells his whole bakery business (assets, staff, customer contracts) to a VAT-registered buyer who will keep running it. VAT on the sale?","a":"<li><p>A <b>transfer of a going concern<\/b>: not a supply, so no VAT, provided the buyer is (or becomes) registered and continues the business.<\/p><\/li>"},{"id":"P39","g":3,"t":"Record keeping","q":"A property developer wants to shred invoices from 2019. Can it?","a":"<li><p><b>No<\/b> for real estate records: they must be kept for <b>15 years<\/b>. Other VAT records: 5 years; CT records: 7 years (longer if a refund is pending).<\/p><\/li>"},{"id":"P40","g":3,"t":"Startup thinking about voluntary VAT registration","q":"A start-up has no sales yet but has spent AED 220,000 + VAT on fit-out and equipment. Should it register?","a":"<li><p>It <b>may register voluntarily<\/b> (taxable expenses above AED 187,500) to recover the input VAT, as long as it intends to make taxable supplies. It then must file returns and cannot deregister within 12 months.<\/p><\/li>"}],"pgroups":["Everyday life, homes and property","Shopping, gifts and small businesses","Business costs, Corporate Tax and compliance","Mixed real-life situations"],"cases":[{"id":"C1","t":"Bloom Florals — when to register","lv":"L2","facts":"<p><b>Bloom Florals LLC<\/b> opened a flower shop in Ajman on <b>1 March 2026<\/b>. All its sales are standard-rated. Monthly sales (AED, excluding VAT):<\/p><div class=\"tbl\"><table>\n<thead><tr><th>Mar<\/th><th>Apr<\/th><th>May<\/th><th>Jun<\/th><th>Jul<\/th><th>Aug<\/th><th>Sep<\/th><th>Oct<\/th><\/tr><\/thead>\n<tbody><tr><td>30,000<\/td><td>40,000<\/td><td>45,000<\/td><td>50,000<\/td><td>55,000<\/td><td>60,000<\/td><td>70,000<\/td><td>80,000<\/td><\/tr><\/tbody>\n<\/table><\/div><p><b>Required<\/b><\/p><ol>\n<li>Using only the historic test, in which month is the mandatory threshold exceeded? By when must Bloom apply, and from when is it registered? <i>(4 marks)<\/i><\/li>\n<li>From which month could Bloom have registered voluntarily? Give one advantage and one disadvantage of doing so. <i>(3 marks)<\/i><\/li>\n<li>Now assume that on <b>10 September 2026<\/b> Bloom signs a contract with a hotel group for AED 400,000 of flower arrangements, to be delivered and invoiced on 25 September. How does this change your answer to (1)? <i>(3 marks)<\/i><\/li>\n<li>If Bloom registers late and never charged VAT to its customers, explain how the VAT it owes is calculated. <i>(2 marks)<\/i><\/li>\n<\/ol>","marks":12,"sol":["<div class=\"box eg\"><span class=\"lbl\">WORKINGS<\/span>\n<div class=\"tbl\"><table class=\"calc\">\n<thead><tr><th>Month (2026)<\/th><th class=\"r\">Sales<\/th><th class=\"r\">Cumulative<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>March<\/td><td class=\"r\">30,000<\/td><td class=\"r\">30,000<\/td><\/tr>\n<tr><td>April<\/td><td class=\"r\">40,000<\/td><td class=\"r\">70,000<\/td><\/tr>\n<tr><td>May<\/td><td class=\"r\">45,000<\/td><td class=\"r\">115,000<\/td><\/tr>\n<tr><td>June<\/td><td class=\"r\">50,000<\/td><td class=\"r\">165,000<\/td><\/tr>\n<tr><td>July<\/td><td class=\"r\">55,000<\/td><td class=\"r\">220,000<\/td><\/tr>\n<tr><td>August<\/td><td class=\"r\">60,000<\/td><td class=\"r\">280,000<\/td><\/tr>\n<tr><td>September<\/td><td class=\"r\">70,000<\/td><td class=\"r\">350,000<\/td><\/tr>\n<tr class=\"sub\"><td>October<\/td><td class=\"r\">80,000<\/td><td class=\"r\">430,000<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>\n<\/div>","<li><b>Historic test:<\/b> the AED 375,000 threshold is first exceeded at the <b>end of October 2026<\/b> (AED 430,000). Bloom must apply by <b>30 November 2026<\/b> and is registered from <b>1 November 2026<\/b>.<\/li>","<li><b>Voluntary:<\/b> supplies passed AED 187,500 at the end of <b>July 2026<\/b> (AED 220,000), so Bloom could have registered voluntarily from then. Advantage: recover input VAT on stock, rent and fit-out; looks credible to corporate clients such as hotels (who can recover VAT). Disadvantage: must add 5% to prices for consumers who cannot recover it, plus filing work; cannot deregister within 12 months.<\/li>","<li><b>Future test:<\/b> on 10 September Bloom expects supplies in the <b>next 30 days<\/b> to exceed AED 375,000 (the AED 400,000 contract alone does). It must apply within 30 days, by <b>10 October 2026<\/b>, and is registered from <b>10 September 2026<\/b>, so the hotel invoice of 25 September must include 5% VAT (AED 20,000).<\/li>","<li><b>Late registration:<\/b> VAT is due on all taxable supplies from the date Bloom should have been registered. If it did not charge VAT and cannot recover it from customers, its prices are treated as VAT-inclusive: VAT = sales × 5/105. It also faces the AED 10,000 late-registration penalty and late-payment penalties.<\/li>"]},{"id":"C2","t":"Sahara Electronics — prepare the VAT return","lv":"L3","facts":"<p><b>Sahara Electronics Trading LLC<\/b> has its head office in Dubai and a branch in Sharjah. Data for the quarter <b>July–September 2026<\/b> (all amounts exclude VAT unless stated):<\/p><ol>\n<li>Standard-rated sales by the Dubai office: AED 2,400,000. By the Sharjah branch: AED 600,000.<\/li>\n<li>Exports to Oman: AED 800,000, with customs exit evidence.<\/li>\n<li>An “export” to Kenya of AED 200,000 invoiced in April 2026: the goods never left the UAE, and the 90 days have passed. The contract price excludes VAT.<\/li>\n<li>A tax credit note issued in August to a Dubai customer for returned goods: AED 50,000 + VAT 2,500.<\/li>\n<li>A Dubai customer that owed AED 63,000 (including VAT 3,000) for goods supplied in January 2026 went bankrupt. Sahara wrote the debt off in August and notified the customer.<\/li>\n<li>Goods imported from China: customs value AED 1,500,000; customs duty 5%. Sahara’s customs code is linked to its TRN.<\/li>\n<li>Software licence bought from a US company: AED 120,000.<\/li>\n<li>Mobile phones bought from a UAE-registered wholesaler for resale (domestic reverse charge): AED 700,000.<\/li>\n<li>Local standard-rated purchases: AED 900,000 + VAT, including client entertainment AED 40,000 and the lease of a saloon car used by the managing director at weekends AED 60,000.<\/li>\n<\/ol><p><b>Required:<\/b> Complete the return below (Boxes 1–14) and state the payment deadline. Explain the treatment of items 3, 5, 8 and 9. <i>(20 marks)<\/i><\/p><div class=\"tbl\"><table>\n<caption>VAT201 working form<\/caption>\n<thead><tr><th>Box<\/th><th class=\"r\">Amount (AED)<\/th><th class=\"r\">VAT (AED)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>1b Standard-rated supplies: Dubai<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>1c Standard-rated supplies: Sharjah<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>2 Tourist refunds<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>3 Supplies subject to reverse charge<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>4 Zero-rated supplies<\/td><td><\/td><td>–<\/td><\/tr>\n<tr><td>5 Exempt supplies<\/td><td><\/td><td>–<\/td><\/tr>\n<tr><td>6 Goods imported into the UAE<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>8 Totals<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>9 Standard-rated expenses<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>10 Supplies subject to reverse charge (recoverable)<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>11 Totals<\/td><td><\/td><td><\/td><\/tr>\n<tr><td>12 / 13 / 14 Due tax / recoverable tax / payable tax<\/td><td><\/td><td><\/td><\/tr>\n<\/tbody>\n<\/table><\/div>","marks":20,"sol":["<div class=\"tbl\"><table class=\"calc\">\n<thead><tr><th>Box<\/th><th class=\"r\">Amount (AED)<\/th><th class=\"r\">VAT (AED)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>1b Dubai: 2,400,000 + 200,000 (failed export) − 50,000 (credit note) − 60,000 (bad debt)<\/td><td class=\"r\">2,490,000<\/td><td class=\"r\">124,500<\/td><\/tr>\n<tr><td>1c Sharjah<\/td><td class=\"r\">600,000<\/td><td class=\"r\">30,000<\/td><\/tr>\n<tr><td>3 Reverse charge: US software 120,000 + phones 700,000<\/td><td class=\"r\">820,000<\/td><td class=\"r\">41,000<\/td><\/tr>\n<tr><td>4 Zero-rated: exports to Oman<\/td><td class=\"r\">800,000<\/td><td class=\"r\">–<\/td><\/tr>\n<tr><td>6 Imports: (1,500,000 + 75,000 duty)<\/td><td class=\"r\">1,575,000<\/td><td class=\"r\">78,750<\/td><\/tr>\n<tr class=\"sub\"><td>8 Totals<\/td><td class=\"r\">6,285,000<\/td><td class=\"r\">274,250<\/td><\/tr>\n<tr><td>9 Standard-rated expenses: 900,000 − 40,000 − 60,000<\/td><td class=\"r\">800,000<\/td><td class=\"r\">40,000<\/td><\/tr>\n<tr><td>10 Reverse charge recoverable (Box 3 + Box 6)<\/td><td class=\"r\">2,395,000<\/td><td class=\"r\">119,750<\/td><\/tr>\n<tr class=\"sub\"><td>11 Totals<\/td><td class=\"r\">3,195,000<\/td><td class=\"r\">159,750<\/td><\/tr>\n<tr class=\"tot\"><td>14 Payable tax (274,250 − 159,750), due 28 October 2026<\/td><td><\/td><td class=\"r\">114,500<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>","<li><b>Item 3 (failed export):<\/b> the goods did not leave within 90 days, so the zero rate is lost. Sahara accounts for 5% output VAT (AED 10,000) now; because the contract price excludes VAT and the customer is abroad, Sahara will probably bear it.<\/li>","<li><b>Item 5 (bad debt):<\/b> all conditions are met (more than 6 months since January, written off, customer notified), so output tax is reduced by AED 3,000 (net 60,000).<\/li>","<li><b>Item 8 (phones):<\/b> under the domestic reverse charge the wholesaler charged no VAT; Sahara, as the registered buyer for resale, reports AED 35,000 in Box 3 and recovers it in Box 10.<\/li>","<li><b>Item 9:<\/b> VAT on client entertainment (AED 2,000) and on a car available for private use (AED 3,000) is <b>blocked<\/b>; these become costs.<\/li>"]},{"id":"C3","t":"Crescent Developments — partial exemption","lv":"L3","facts":"<p><b>Crescent Developments LLC<\/b> (Dubai) makes these supplies in the quarter: first sales of new apartments (completed 8 months ago) AED 30m; sales of ground-floor shops AED 10m; rent from apartments it let to second tenants AED 2m. Input tax for the quarter: directly attributable to apartment sales AED 800,000; to shop sales AED 400,000; to the apartment lettings AED 300,000; residual overheads AED 240,000.<\/p><p>Crescent also owns its head-office building (cost AED 8m + VAT AED 400,000, recovered in full in year 1). In year 2, 25% of the building is used by its residential leasing team.<\/p><p><b>Required<\/b><\/p><ol>\n<li>Classify each supply and calculate output tax. <i>(3 marks)<\/i><\/li>\n<li>Calculate recoverable input tax under the current standard method, and the net VAT position. <i>(6 marks)<\/i><\/li>\n<li>Estimate the residual recovery under the new output-based method that starts for tax years after 1 October 2027, if the supplies were the same. <i>(3 marks)<\/i><\/li>\n<li>Calculate the Capital Assets Scheme adjustment for the head office in year 2. <i>(3 marks)<\/i><\/li>\n<\/ol>","marks":15,"sol":["<li>Apartments (first supply within 3 years): <b>zero-rated<\/b>, Box 4 AED 30m. Shops: <b>standard-rated<\/b>, output tax <b>AED 500,000<\/b>. Second lettings of apartments: <b>exempt<\/b>, Box 5 AED 2m.<\/li>","<li>Recovery % = taxable input 1,200,000 ÷ (1,200,000 + 300,000) = <b>80%<\/b>. Residual recoverable = 80% × 240,000 = 192,000. Total recoverable = 1,200,000 + 192,000 = <b>AED 1,392,000<\/b>. Irrecoverable = 300,000 + 48,000 = AED 348,000. Net position = 500,000 − 1,392,000 = <b>refund of AED 892,000<\/b>.<\/li>","<li>New method: taxable supplies 40m ÷ total supplies 42m ≈ <b>95.2%<\/b>; residual recoverable ≈ AED 228,571 (about AED 36,600 more than now). Real estate developers must separate stock-in-trade (counted) from capital assets (excluded).<\/li>","<li>Capital Assets Scheme: 400,000 ÷ 10 = 40,000 per year × (100% − 75%) = <b>AED 10,000 payable<\/b> for year 2, and the test repeats each year.<\/li>"]},{"id":"C4","t":"Spot the errors — a hotel supplier’s invoice","lv":"L2","facts":"<p>Oasis Hotels LLC (VAT-registered) receives the invoice below from Palm Grove Supplies LLC for linen delivered on 1 September 2026. Oasis’s accountant must decide whether to claim the input tax in the quarter ending 30 September 2026.<\/p><figure class=\"fig\"><svg aria-label=\"An invoice containing several errors\" role=\"img\" viewbox=\"0 0 660 470\" xmlns=\"http://www.w3.org/2000/svg\"><title>An invoice containing several errors<\/title><defs><\/defs><rect fill=\"#ffffff\" height=\"450\" rx=\"10\" stroke=\"#16324f\" stroke-width=\"2.5\" width=\"540\" x=\"60\" y=\"10\"><\/rect><text fill=\"#16324f\" font-size=\"22\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"51.7\"><tspan dy=\"0.0\" x=\"330.0\">INVOICE<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"start\" x=\"84.0\" y=\"84.2\"><tspan dy=\"0.0\" x=\"84.0\">Palm Grove Supplies LLC, Warehouse 7, Al Qusais, Dubai, UAE<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"start\" x=\"84.0\" y=\"104.2\"><tspan dy=\"0.0\" x=\"84.0\">TRN: 100 4567 8910 23<\/tspan><\/text><line stroke=\"#d9dce1\" stroke-width=\"1.5\" x1=\"78\" x2=\"582\" y1=\"114\" y2=\"114\"><\/line><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"start\" x=\"84.0\" y=\"138.2\"><tspan dy=\"0.0\" x=\"84.0\">Bill to: Oasis Hotels LLC, Corniche Road, Abu Dhabi<\/tspan><\/text><text fill=\"#8a8f96\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"start\" x=\"84.0\" y=\"158.2\"><tspan dy=\"0.0\" x=\"84.0\">Customer TRN: ________<\/tspan><\/text><text fill=\"#8a8f96\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"start\" x=\"84.0\" y=\"184.2\"><tspan dy=\"0.0\" x=\"84.0\">Invoice No: ________<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"start\" x=\"330.0\" y=\"184.2\"><tspan dy=\"0.0\" x=\"330.0\">Date of issue: 11/10/2026<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"start\" x=\"84.0\" y=\"204.2\"><tspan dy=\"0.0\" x=\"84.0\">Date of supply (delivery): 01/09/2026<\/tspan><\/text><rect fill=\"#16324f\" height=\"26\" width=\"504\" x=\"78\" y=\"216\"><\/rect><text fill=\"#fff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"start\" x=\"86.0\" y=\"233.0\"><tspan dy=\"0.0\" x=\"86.0\">Description<\/tspan><\/text><text fill=\"#fff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"start\" x=\"290.0\" y=\"233.0\"><tspan dy=\"0.0\" x=\"290.0\">Qty<\/tspan><\/text><text fill=\"#fff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"start\" x=\"350.0\" y=\"233.0\"><tspan dy=\"0.0\" x=\"350.0\">Unit price<\/tspan><\/text><text fill=\"#fff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"start\" x=\"470.0\" y=\"233.0\"><tspan dy=\"0.0\" x=\"470.0\">Amount (AED)<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"start\" x=\"86.0\" y=\"266.2\"><tspan dy=\"0.0\" x=\"86.0\">Bed linen sets (king)<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"start\" x=\"294.0\" y=\"266.2\"><tspan dy=\"0.0\" x=\"294.0\">400<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"start\" x=\"354.0\" y=\"266.2\"><tspan dy=\"0.0\" x=\"354.0\">100.00<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"start\" x=\"474.0\" y=\"266.2\"><tspan dy=\"0.0\" x=\"474.0\">40,000.00<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"start\" x=\"86.0\" y=\"290.2\"><tspan dy=\"0.0\" x=\"86.0\">Bath towels<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"start\" x=\"294.0\" y=\"290.2\"><tspan dy=\"0.0\" x=\"294.0\">800<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"start\" x=\"354.0\" y=\"290.2\"><tspan dy=\"0.0\" x=\"354.0\">10.00<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"start\" x=\"474.0\" y=\"290.2\"><tspan dy=\"0.0\" x=\"474.0\">8,000.00<\/tspan><\/text><line stroke=\"#d9dce1\" stroke-width=\"1.5\" x1=\"78\" x2=\"582\" y1=\"300\" y2=\"300\"><\/line><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"end\" x=\"440.0\" y=\"326.2\"><tspan dy=\"0.0\" x=\"440.0\">Subtotal<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"end\" x=\"574.0\" y=\"326.2\"><tspan dy=\"0.0\" x=\"574.0\">48,000.00<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"end\" x=\"440.0\" y=\"350.2\"><tspan dy=\"0.0\" x=\"440.0\">Less: early-order discount<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"end\" x=\"574.0\" y=\"350.2\"><tspan dy=\"0.0\" x=\"574.0\">(2,000.00)<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"end\" x=\"440.0\" y=\"374.2\"><tspan dy=\"0.0\" x=\"440.0\">Net amount<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"end\" x=\"574.0\" y=\"374.2\"><tspan dy=\"0.0\" x=\"574.0\">46,000.00<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"end\" x=\"440.0\" y=\"398.2\"><tspan dy=\"0.0\" x=\"440.0\">VAT 5%<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"end\" x=\"574.0\" y=\"398.2\"><tspan dy=\"0.0\" x=\"574.0\">2,400.00<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"end\" x=\"440.0\" y=\"422.2\"><tspan dy=\"0.0\" x=\"440.0\">TOTAL<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"end\" x=\"574.0\" y=\"422.2\"><tspan dy=\"0.0\" x=\"574.0\">48,400.00<\/tspan><\/text><text fill=\"#6b7079\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"451.9\"><tspan dy=\"0.0\" x=\"330.0\">All amounts in AED. Payment within 30 days.<\/tspan><\/text><\/svg><figcaption><b>Figure D.1<\/b> The invoice received by Oasis Hotels.<\/figcaption><\/figure><p><b>Required<\/b><\/p><ol>\n<li>Identify <b>six<\/b> errors or omissions on this invoice. <i>(6 marks)<\/i><\/li>\n<li>Calculate the correct VAT and total. <i>(2 marks)<\/i><\/li>\n<li>Advise Oasis whether it can recover input tax now, and what it should ask for. <i>(2 marks)<\/i><\/li>\n<li>What penalty could Palm Grove face under the 2026 framework? <i>(2 marks)<\/i><\/li>\n<\/ol>","marks":12,"sol":["<li>Six errors: (1) titled “INVOICE” instead of <b>“Tax Invoice”<\/b>; (2) the supplier TRN has only 13 digits (a TRN has <b>15<\/b>); (3) <b>no customer TRN<\/b>, although Oasis is registered and the value exceeds AED 10,000, so a full tax invoice is required; (4) <b>no sequential invoice number<\/b>; (5) issued on 11 October for a supply on 1 September: more than <b>14 days<\/b> late; (6) <b>VAT calculated before the discount<\/b>.<\/li>","<li>Correct VAT = 5% × 46,000 = <b>AED 2,300<\/b>; correct total = <b>AED 48,300<\/b> (AED 100 overcharged).<\/li>","<li>Oasis should <b>not<\/b> claim the input tax on this document. It should ask for a corrected full tax invoice (or credit note and new invoice) and verify the supplier’s TRN (FTA Decision 13/2026) before claiming, in that quarter or the next.<\/li>","<li>Under Cabinet Decision 129/2025, failing to issue a tax invoice within the legal period is <b>AED 2,500 per case<\/b>.<\/li>"]},{"id":"C5","t":"Gulf Gate Logistics — Designated Zone movements","lv":"L2","facts":"<p><b>Gulf Gate Logistics FZE<\/b> is located in <b>Jebel Ali Free Zone<\/b> (a Designated Zone) and is VAT-registered. Classify each transaction for VAT and say who, if anyone, accounts for VAT.<\/p><ol>\n<li>Imports machine parts from Germany into its JAFZA warehouse, where they are stored.<\/li>\n<li>Sells part of that stock, still in JAFZA, to another company in Dubai Airport Free Zone (also a Designated Zone). The goods move between the zones under customs control.<\/li>\n<li>Sells parts to a factory in Dubai Investments Park (mainland); the goods are released from JAFZA to the factory.<\/li>\n<li>Charges a mainland company for storing that company’s goods in its JAFZA warehouse.<\/li>\n<li>Buys office stationery from a mainland supplier for use in its JAFZA office.<\/li>\n<li>Re-exports parts from JAFZA to a customer in Saudi Arabia.<\/li>\n<\/ol><p><i>(12 marks: 2 per item)<\/i><\/p>","marks":12,"sol":["<div class=\"tbl\"><table>\n<thead><tr><th>#<\/th><th>Treatment<\/th><th>Who accounts for VAT<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>1<\/td><td>Goods enter the Designated Zone under customs suspension: no import VAT while stored there<\/td><td>Nobody yet<\/td><\/tr>\n<tr><td>2<\/td><td>Goods moved between Designated Zones and not used or consumed: <b>outside scope<\/b><\/td><td>Nobody<\/td><\/tr>\n<tr><td>3<\/td><td>Goods released to the mainland: an <b>import<\/b>, 5% VAT<\/td><td>The importer of record (e.g. the factory declares it in Box 6 and recovers in Box 10 if registered)<\/td><\/tr>\n<tr><td>4<\/td><td>Storage is a <b>service<\/b>; services in a Designated Zone are taxed as on the mainland: <b>5%<\/b><\/td><td>Gulf Gate charges VAT<\/td><\/tr>\n<tr><td>5<\/td><td>Goods used or consumed in the zone: <b>5%<\/b><\/td><td>Mainland supplier charges VAT; Gulf Gate recovers it<\/td><\/tr>\n<tr><td>6<\/td><td>Goods leaving the Designated Zone for abroad: <b>outside scope<\/b> (keep exit evidence)<\/td><td>Nobody<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"]},{"id":"C6","t":"Saffron & Spice — a restaurant after October 2026","lv":"L3","facts":"<p><b>Saffron &amp; Spice LLC<\/b> runs a restaurant in Dubai. Quarter <b>October–December 2026<\/b>:<\/p><ol>\n<li>Dine-in sales (menu prices include VAT): AED 840,000.<\/li>\n<li>Delivery orders through a UAE delivery app, where the restaurant is the supplier of the food to the customer: AED 210,000 including VAT. The app charges the restaurant a commission of AED 30,000 + VAT.<\/li>\n<li>Free staff meals: food cost AED 45,000 + VAT. Assume the FTA conditions for recovery (FTA Decision 17/2026) are <b>not<\/b> met.<\/li>\n<li>Free accommodation for staff: rent AED 90,000 + VAT. It is <b>not<\/b> mandated by a MoHRE decision or directive.<\/li>\n<li>A new oven: AED 60,000 + VAT, paid in cash. (Assume no Ministerial Decision has yet set the cash threshold.)<\/li>\n<li>Food supplies from verified suppliers: AED 300,000 + VAT.<\/li>\n<li>The owner’s family ate free; food cost AED 8,000 (no other deemed supplies in the last 12 months).<\/li>\n<\/ol><p><b>Required:<\/b> Calculate output tax, recoverable input tax and VAT payable, explaining each item. Then give the owner three practical recommendations. <i>(15 marks)<\/i><\/p>","marks":15,"sol":["<div class=\"tbl\"><table class=\"calc\">\n<tbody>\n<tr><td>Dine-in: 840,000 × 5/105<\/td><td class=\"r\">40,000<\/td><\/tr>\n<tr><td>Delivery orders (restaurant is the supplier): 210,000 × 5/105<\/td><td class=\"r\">10,000<\/td><\/tr>\n<tr><td>Owner’s family meals: deemed supply, output tax 400, below the AED 2,000 annual limit<\/td><td class=\"r\">0<\/td><\/tr>\n<tr class=\"sub\"><td>Output tax<\/td><td class=\"r\">50,000<\/td><\/tr>\n<tr><td>App commission: recoverable<\/td><td class=\"r\">1,500<\/td><\/tr>\n<tr><td>Staff meals: conditions not met, blocked<\/td><td class=\"r\">0<\/td><\/tr>\n<tr><td>Staff accommodation: not MoHRE-mandated, blocked from 1 Oct 2026<\/td><td class=\"r\">0<\/td><\/tr>\n<tr><td>Oven paid in cash: recoverable for now (no threshold yet set)<\/td><td class=\"r\">3,000<\/td><\/tr>\n<tr><td>Food from verified suppliers<\/td><td class=\"r\">15,000<\/td><\/tr>\n<tr class=\"sub\"><td>Recoverable input tax<\/td><td class=\"r\">19,500<\/td><\/tr>\n<tr class=\"tot\"><td>VAT payable by 28 January 2027<\/td><td class=\"r\">30,500<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>","<p><b>Recommendations:<\/b> (1) pay suppliers by bank transfer, because cash-paid supplies above the forthcoming Ministerial threshold will lose input tax; (2) write a staff-benefits policy and check meals and housing against FTA Decision 17/2026 to recover AED 6,750 a quarter if the conditions can be met; (3) keep supplier verification files and plan e-invoicing (ASP by 31 March 2027, live by 1 July 2027 if revenue is below AED 50m).<\/p>"]},{"id":"C7","t":"Emirates Precision Engineering — full CT computation","lv":"L3","facts":"<p><b>Emirates Precision Engineering LLC<\/b> (Abu Dhabi mainland, year ended 31 December 2026) reports accounting profit before tax of <b>AED 18,000,000<\/b>, after the following items:<\/p><ol>\n<li>Dividend from a UAE company: AED 400,000.<\/li>\n<li>Gain on selling a 10% shareholding in an Indian company held for 3 years (participation exemption conditions met): AED 1,200,000.<\/li>\n<li>Client entertainment: AED 500,000. Staff annual party: AED 120,000.<\/li>\n<li>Municipality and traffic fines: AED 35,000.<\/li>\n<li>Donations: AED 100,000 to a listed Qualifying Public Benefit Entity and AED 50,000 to an unlisted community club.<\/li>\n<li>Salary paid to the owner’s son (a Connected Person): AED 900,000; market value of the role AED 600,000.<\/li>\n<li>Depreciation: AED 2,000,000. Net interest expenditure: AED 20,000,000.<\/li>\n<li>Tax losses brought forward: AED 4,000,000 (ownership unchanged).<\/li>\n<\/ol><p><b>Required:<\/b> Calculate taxable income and Corporate Tax payable, including the interest limitation. Use the form below. State the filing and payment deadline. <i>(20 marks)<\/i><\/p><div class=\"tbl\"><table class=\"calc\">\n<caption>CT computation working form<\/caption>\n<tbody>\n<tr><td>Accounting profit before tax<\/td><td class=\"r\">18,000,000<\/td><\/tr>\n<tr><td class=\"ind\">Less: exempt income<\/td><td class=\"r\"><\/td><\/tr>\n<tr><td class=\"ind\">Add: non-deductible expenses<\/td><td class=\"r\"><\/td><\/tr>\n<tr><td class=\"ind\">Interest limitation adjustment<\/td><td class=\"r\"><\/td><\/tr>\n<tr class=\"sub\"><td>Taxable income before losses<\/td><td class=\"r\"><\/td><\/tr>\n<tr><td class=\"ind\">Less: tax losses (75% cap)<\/td><td class=\"r\"><\/td><\/tr>\n<tr class=\"sub\"><td>Taxable income<\/td><td class=\"r\"><\/td><\/tr>\n<tr class=\"tot\"><td>Corporate Tax payable<\/td><td class=\"r\"><\/td><\/tr>\n<\/tbody>\n<\/table><\/div>","marks":20,"sol":["<div class=\"tbl\"><table class=\"calc\">\n<tbody>\n<tr><td>Accounting profit before tax<\/td><td class=\"r\">18,000,000<\/td><\/tr>\n<tr><td class=\"ind\">Less: UAE dividend (exempt)<\/td><td class=\"r\">(400,000)<\/td><\/tr>\n<tr><td class=\"ind\">Less: gain on Indian shares (participation exemption)<\/td><td class=\"r\">(1,200,000)<\/td><\/tr>\n<tr><td class=\"ind\">Add: 50% of client entertainment (staff party fully deductible)<\/td><td class=\"r\">250,000<\/td><\/tr>\n<tr><td class=\"ind\">Add: fines<\/td><td class=\"r\">35,000<\/td><\/tr>\n<tr><td class=\"ind\">Add: donation to unlisted club (QPBE donation deductible)<\/td><td class=\"r\">50,000<\/td><\/tr>\n<tr><td class=\"ind\">Add: excess salary to Connected Person (900,000 − 600,000)<\/td><td class=\"r\">300,000<\/td><\/tr>\n<tr class=\"sub\"><td>Taxable income before interest limitation<\/td><td class=\"r\">17,035,000<\/td><\/tr>\n<tr><td class=\"ind\">Adjusted EBITDA = 17,035,000 + 20,000,000 interest + 2,000,000 depreciation = 39,035,000; 30% = 11,710,500; cap = higher of that and AED 12m<\/td><td class=\"r\">12,000,000<\/td><\/tr>\n<tr><td class=\"ind\">Add: disallowed interest (20,000,000 − 12,000,000), carried forward up to 10 years<\/td><td class=\"r\">8,000,000<\/td><\/tr>\n<tr class=\"sub\"><td>Taxable income before losses<\/td><td class=\"r\">25,035,000<\/td><\/tr>\n<tr><td class=\"ind\">Less: losses (cap 75% = 18,776,250; all 4,000,000 used)<\/td><td class=\"r\">(4,000,000)<\/td><\/tr>\n<tr class=\"sub\"><td>Taxable income<\/td><td class=\"r\">21,035,000<\/td><\/tr>\n<tr class=\"tot\"><td>CT = 9% × (21,035,000 − 375,000), due 30 September 2027<\/td><td class=\"r\">1,859,400<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"]},{"id":"C8","t":"Al Noor Logistics FZCO — does it stay a QFZP?","lv":"L3","facts":"<p><b>Al Noor Logistics FZCO<\/b> is in a free zone and meets the substance, audit and transfer pricing conditions. Revenue for 2026 (AED):<\/p><div class=\"tbl\"><table>\n<thead><tr><th>Revenue stream<\/th><th class=\"r\">AED<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Logistics services to other Free Zone Persons<\/td><td class=\"r\">12,000,000<\/td><\/tr>\n<tr><td>Logistics services to mainland customers<\/td><td class=\"r\">8,000,000<\/td><\/tr>\n<tr><td>Sales of packing materials to walk-in individuals<\/td><td class=\"r\">900,000<\/td><\/tr>\n<tr><td>Rent of free zone warehouse space to a Free Zone Person<\/td><td class=\"r\">500,000<\/td><\/tr>\n<tr><td>Rent of free zone warehouse space to a mainland company<\/td><td class=\"r\">400,000<\/td><\/tr>\n<tr><td>Consultancy services to mainland companies<\/td><td class=\"r\">300,000<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><p>Taxable income is AED 4,500,000, of which AED 250,000 relates to the rent from the mainland company.<\/p><p><b>Required<\/b><\/p><ol>\n<li>Classify each stream. <i>(6 marks)<\/i><\/li>\n<li>Apply the de minimis test. Is Al Noor a QFZP for 2026? <i>(4 marks)<\/i><\/li>\n<li>Calculate CT for 2026. <i>(3 marks)<\/i><\/li>\n<li>Recalculate assuming the consultancy contracts had not been signed. What advice would you give? <i>(4 marks)<\/i><\/li>\n<\/ol>","marks":17,"sol":["<li>Classification: logistics to Free Zone Persons (12m) and to mainland customers (8m): <b>Qualifying Income<\/b> (logistics is a Qualifying Activity). Sales to individuals (0.9m): <b>Excluded Activity<\/b>, non-qualifying revenue. Rent to a Free Zone Person (0.5m): <b>Qualifying<\/b> (free zone commercial property, Free Zone tenant). Rent to a mainland company (0.4m): taxed at <b>9%<\/b>, outside the de minimis test. Consultancy (0.3m): <b>non-qualifying<\/b> (not a Qualifying Activity).<\/li>","<li>Non-qualifying revenue = 0.9m + 0.3m = <b>1.2m<\/b>. Revenue for the test = 21.7m (excluding the 0.4m rent); 5% = 1.085m, lower than AED 5m. 1.2m &gt; 1.085m, so the de minimis test <b>fails<\/b> (it would also fail on 22.1m: limit 1.105m). Al Noor is <b>not a QFZP for 2026 to 2030<\/b>.<\/li>","<li>CT = 9% × (4,500,000 − 375,000) = <b>AED 371,250<\/b>.<\/li>","<li>Without consultancy: non-qualifying 0.9m against a limit of about 1.07m: <b>passes<\/b>. CT = 9% × 250,000 (mainland rent) = <b>AED 22,500<\/b>. Advice: monitor the de minimis ratio monthly; stop or move non-qualifying activities (walk-in sales, consultancy) to a separate entity with real substance, priced at arm’s length; the AED 300,000 contract cost about AED 349,000 of tax a year, for five years.<\/li>"]},{"id":"C9","t":"Horizon Holdings — group planning","lv":"L3","facts":"<figure class=\"fig\"><svg aria-label=\"Horizon Holdings group structure\" role=\"img\" viewbox=\"0 0 660 320\" xmlns=\"http://www.w3.org/2000/svg\"><title>Horizon Holdings group structure<\/title><defs><marker id=\"ar-qgrp-16324f\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"9\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><marker id=\"ar-qgrp-16324fs\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"1\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><\/defs><g><rect fill=\"#16324f\" height=\"56\" rx=\"10\" stroke=\"#16324f\" stroke-width=\"2\" width=\"220\" x=\"220\" y=\"10\"><\/rect><text fill=\"#ffffff\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"34.9\"><tspan dy=\"0.0\" x=\"330.0\">Horizon Holdings LLC (Dubai<\/tspan><tspan dy=\"14.6\" x=\"330.0\">mainland, parent)<\/tspan><\/text><\/g><path d=\"M330.0,66.0 L70.0,170.0\" fill=\"none\" marker-end=\"url(#ar-qgrp-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"14.4\" opacity=\"0.92\" rx=\"4\" width=\"32.8\" x=\"152.4\" y=\"121.3\"><\/rect><text fill=\"#16324f\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"168.8\" y=\"132.8\"><tspan dy=\"0.0\" x=\"168.8\">100%<\/tspan><\/text><g><rect fill=\"#e6f0fc\" height=\"70\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"120\" x=\"10\" y=\"172\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"70.0\" y=\"197.4\"><tspan dy=\"0.0\" x=\"70.0\"><tspan font-weight=\"bold\">A Trading<\/tspan><\/tspan><tspan dy=\"13.4\" x=\"70.0\">LLC<tspan font-weight=\"bold\"><\/tspan><\/tspan><tspan dy=\"13.4\" x=\"70.0\">Dubai mainland<\/tspan><\/text><\/g><path d=\"M330.0,66.0 L200.0,170.0\" fill=\"none\" marker-end=\"url(#ar-qgrp-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"14.4\" opacity=\"0.92\" rx=\"4\" width=\"26.6\" x=\"236.1\" y=\"121.3\"><\/rect><text fill=\"#16324f\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"249.4\" y=\"132.8\"><tspan dy=\"0.0\" x=\"249.4\">97%<\/tspan><\/text><g><rect fill=\"#e6f0fc\" height=\"70\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"120\" x=\"140\" y=\"172\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"200.0\" y=\"190.7\"><tspan dy=\"0.0\" x=\"200.0\"><tspan font-weight=\"bold\">B Contracting<\/tspan><\/tspan><tspan dy=\"13.4\" x=\"200.0\">LLC<tspan font-weight=\"bold\"><\/tspan><\/tspan><tspan dy=\"13.4\" x=\"200.0\">Abu Dhabi<\/tspan><tspan dy=\"13.4\" x=\"200.0\">mainland<\/tspan><\/text><\/g><path d=\"M330.0,66.0 L330.0,170.0\" fill=\"none\" marker-end=\"url(#ar-qgrp-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"14.4\" opacity=\"0.92\" rx=\"4\" width=\"26.6\" x=\"316.7\" y=\"121.3\"><\/rect><text fill=\"#16324f\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"132.8\"><tspan dy=\"0.0\" x=\"330.0\">85%<\/tspan><\/text><g><rect fill=\"#e0f5ec\" height=\"70\" rx=\"10\" stroke=\"#1baf7a\" stroke-width=\"2\" width=\"120\" x=\"270\" y=\"172\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"204.1\"><tspan dy=\"0.0\" x=\"330.0\"><tspan font-weight=\"bold\">C Retail LLC<\/tspan><\/tspan><tspan dy=\"13.4\" x=\"330.0\">Sharjah mainland<\/tspan><\/text><\/g><path d=\"M330.0,66.0 L460.0,170.0\" fill=\"none\" marker-end=\"url(#ar-qgrp-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"14.4\" opacity=\"0.92\" rx=\"4\" width=\"32.8\" x=\"394.2\" y=\"121.3\"><\/rect><text fill=\"#16324f\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"410.6\" y=\"132.8\"><tspan dy=\"0.0\" x=\"410.6\">100%<\/tspan><\/text><g><rect fill=\"#fff4d1\" height=\"70\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"120\" x=\"400\" y=\"172\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"460.0\" y=\"197.4\"><tspan dy=\"0.0\" x=\"460.0\"><tspan font-weight=\"bold\">D Logistics<\/tspan><\/tspan><tspan dy=\"13.4\" x=\"460.0\">FZE<tspan font-weight=\"bold\"><\/tspan><\/tspan><tspan dy=\"13.4\" x=\"460.0\">JAFZA (QFZP)<\/tspan><\/text><\/g><path d=\"M330.0,66.0 L590.0,170.0\" fill=\"none\" marker-end=\"url(#ar-qgrp-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"14.4\" opacity=\"0.92\" rx=\"4\" width=\"32.8\" x=\"474.8\" y=\"121.3\"><\/rect><text fill=\"#16324f\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"491.2\" y=\"132.8\"><tspan dy=\"0.0\" x=\"491.2\">100%<\/tspan><\/text><g><rect fill=\"#f1f2f3\" height=\"70\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"120\" x=\"530\" y=\"172\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"590.0\" y=\"197.4\"><tspan dy=\"0.0\" x=\"590.0\"><tspan font-weight=\"bold\">E Services<\/tspan><\/tspan><tspan dy=\"13.4\" x=\"590.0\">LLC<tspan font-weight=\"bold\"><\/tspan><\/tspan><tspan dy=\"13.4\" x=\"590.0\">Oman<\/tspan><\/text><\/g><text fill=\"#3a3f45\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"271.1\"><tspan dy=\"0.0\" x=\"330.0\">2026 taxable income: Parent AED 2.0m | A loss (AED 2.5m) | B AED 6.0m | C AED 1.0m | D Qualifying Income<\/tspan><tspan dy=\"13.4\" x=\"330.0\">AED 3.0m<\/tspan><\/text><text fill=\"#6b7079\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"305.9\"><tspan dy=\"0.0\" x=\"330.0\">All UAE companies have a 31 December year end and use IFRS.<\/tspan><\/text><\/svg><figcaption><b>Figure D.2<\/b> The Horizon Holdings group.<\/figcaption><\/figure><p><b>Required<\/b><\/p><ol>\n<li>Which companies can form a CT Tax Group with the parent? Explain why each other company cannot. <i>(5 marks)<\/i><\/li>\n<li>Calculate total UAE CT for 2026 under three options: (a) no group and no loss transfer; (b) a Tax Group of the eligible companies; (c) no Tax Group, but A transfers its loss to B. <i>(9 marks)<\/i><\/li>\n<li>B wants to transfer a building (book value AED 8m, market value AED 12m) to C. Can Qualifying Group Relief apply? What happens if C sells it 18 months later? <i>(4 marks)<\/i><\/li>\n<li>D provides logistics to B. What compliance point must the group watch? <i>(2 marks)<\/i><\/li>\n<\/ol>","marks":20,"sol":["<li>Eligible: <b>Parent, A (100%) and B (97%)<\/b>. C: only 85% (needs 95%). D: a QFZP cannot join. E: not a UAE resident.<\/li>","<li>\n<div class=\"tbl\"><table class=\"calc\">\n<thead><tr><th>Option<\/th><th class=\"r\">CT (AED)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>(a) Separate: P 9% × 1,625,000 = 146,250; B 9% × 5,625,000 = 506,250; C 9% × 625,000 = 56,250; A loss carried forward; D 0%<\/td><td class=\"r\">708,750<\/td><\/tr>\n<tr><td>(b) Tax Group P+A+B: 2.0 − 2.5 + 6.0 = 5.5m; 9% × 5,125,000 = 461,250; plus C 56,250<\/td><td class=\"r\">517,500<\/td><\/tr>\n<tr class=\"tot\"><td>(c) Loss transfer A → B (100%/97% common ownership ≥ 75%; cap 75% × 6m = 4.5m): B 9% × 3,125,000 = 281,250; P 146,250; C 56,250<\/td><td class=\"r\">483,750<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>\n  Option (c) is cheapest this year because P and B each keep their AED 375,000 band; the group gets only one. Option (b) gives simpler compliance and full offset of future losses, but joint liability.<\/li>","<li>Yes: B and C are both at least 75% owned by the parent, resident, not exempt or QFZPs, and share year end and IFRS. B transfers at book value (AED 8m), no gain. If C sells within <b>2 years<\/b> (18 months), the relief is clawed back and the <b>AED 4m gain becomes taxable<\/b>.<\/li>","<li>D (QFZP) and B are Related Parties: prices must be at <b>arm’s length<\/b> and documented. TP compliance is also one of D’s QFZP conditions, and B’s deduction can be adjusted by the FTA.<\/li>"]},{"id":"C10","t":"Rashid — a freelancer with several incomes","lv":"L2","facts":"<p>Rashid is a UAE resident individual. In <b>2026<\/b> he earns: photography fees AED 1,300,000 and business consulting fees AED 700,000 (both from UAE clients, invoiced evenly through the year); a salary of AED 240,000 for part-time university teaching; rent of AED 180,000 from a villa he owns personally; and dividends of AED 30,000 from listed shares. His business expenses are AED 900,000, including a family holiday of AED 60,000 booked through the business. His 2025 business turnover was AED 900,000, and he has been VAT-registered since July 2025.<\/p><p><b>Required<\/b><\/p><ol>\n<li>Is Rashid a CT taxable person for 2026? Which incomes count? <i>(3 marks)<\/i><\/li>\n<li>Calculate his taxable income and CT with and without Small Business Relief. <i>(4 marks)<\/i><\/li>\n<li>State his CT registration and filing deadlines. <i>(2 marks)<\/i><\/li>\n<li>Which of his 2026 receipts belong in his VAT returns, and how is each treated? <i>(3 marks)<\/i><\/li>\n<\/ol>","marks":12,"sol":["<li>Business turnover = 1,300,000 + 700,000 = <b>2,000,000 &gt; AED 1m<\/b>: he is a taxable person for 2026. Salary (wage), villa rent (real estate investment, no licence) and dividends (personal investment) are excluded.<\/li>","<li>Deductible expenses = 900,000 − 60,000 (family holiday, not wholly and exclusively for business) = 840,000. Taxable income = <b>AED 1,160,000<\/b>. Without SBR: 9% × 785,000 = <b>AED 70,650<\/b>. With SBR (revenue 2.0m now and 0.9m in 2025, both ≤ AED 3m): <b>nil<\/b>.<\/li>","<li>Register by <b>31 March 2027<\/b>; file (and pay any tax) by <b>30 September 2027<\/b>.<\/li>","<li>VAT: photography and consulting fees to UAE clients are <b>standard-rated<\/b> (Box 1). Villa rent: if a residential lease after the first supply, an <b>exempt<\/b> supply (Box 5), which may restrict recovery of shared input tax. Salary and dividends are <b>outside scope<\/b>.<\/li>"]},{"id":"C11","t":"Gulf Star Consulting — foreign income","lv":"L3","facts":"<p><b>Gulf Star Consulting LLC<\/b> (Dubai, calendar year) has accounting profit of AED 3,000,000 for 2026, which includes:<\/p><ul>\n<li>Profit of its branch in Saudi Arabia: AED 800,000; Saudi tax paid on it AED 160,000. No foreign PE exemption has been elected.<\/li>\n<li>A dividend of AED 50,000 from a 3% holding in a UK listed company that cost AED 1,000,000.<\/li>\n<li>A dividend of AED 300,000 from a 40% holding in a company in Country X, which has no corporate income tax.<\/li>\n<\/ul><p><b>Required<\/b><\/p><ol>\n<li>Explain whether each dividend is exempt. <i>(4 marks)<\/i><\/li>\n<li>Calculate CT payable after the foreign tax credit. <i>(4 marks)<\/i><\/li>\n<li>Calculate CT if the foreign PE exemption were elected, and advise. <i>(4 marks)<\/i><\/li>\n<\/ol>","marks":12,"sol":["<li>UK dividend: 3% holding costing AED 1m, below both 5% and AED 4m: <b>not exempt<\/b>. Country X dividend: ownership met, but the subsidiary is not taxed at 9% or more, so the subject-to-tax condition fails: <b>not exempt<\/b>.<\/li>","<li>Taxable income AED 3,000,000; CT = 9% × 2,625,000 = 236,250. Foreign tax credit = lower of 160,000 and 9% × 800,000 = 72,000. <b>CT payable = AED 164,250<\/b>; the other AED 88,000 of Saudi tax is lost.<\/li>","<li>Foreign PE exemption: taxable income 2,200,000; CT = 9% × 1,825,000 = <b>AED 164,250<\/b>, the same. The election simplifies compliance but covers all foreign PEs, so future branch losses could not reduce UAE income.<\/li>"]},{"id":"C12","t":"Blue Wave Marine — a bad year for compliance","lv":"L3","facts":"<p><b>Blue Wave Marine Trading LLC<\/b> (revenue AED 65 million) has several problems in 2026. Assume penalties apply for each month the obligation remains unmet.<\/p><ol>\n<li>VAT of AED 120,000 for the quarter ending 30 June 2026 (due 28 July 2026) was paid on 28 October 2026.<\/li>\n<li>In early November 2026 it discovered that output VAT of AED 45,000 was under-declared in the return for the quarter ending 31 December 2025 (due 28 January 2026). It files a Voluntary Disclosure on 10 November 2026, before any audit notification.<\/li>\n<li>The CT return and payment of AED 300,000 for the year ended 31 December 2025, due 30 September 2026, were filed and paid on 30 November 2026.<\/li>\n<li>It appointed its e-invoicing Accredited Service Provider on 15 December 2026.<\/li>\n<li>On 2 November 2026 it received an FTA penalty decision it believes is wrong.<\/li>\n<\/ol><p><b>Required:<\/b> Calculate or explain the penalty or deadline for each item, and recommend three controls to prevent a repeat. <i>(20 marks)<\/i><\/p>","marks":20,"sol":["<li>VAT late payment: 3 months × 14%/12 × 120,000 = <b>AED 4,200<\/b>.<\/li>","<li>Error above AED 10,000: Voluntary Disclosure within 20 business days (done). Penalty 1% per month from 28 January 2026: about 9 months = <b>AED 4,050<\/b> (AED 4,500 if part-months count); pay the tax within 20 business days. After an audit notice a further 15% (AED 6,750) would apply.<\/li>","<li>CT late filing: 2 × AED 500 = <b>AED 1,000<\/b>. Late payment: 300,000 × 14% × 2/12 = <b>AED 7,000<\/b>.<\/li>","<li>E-invoicing: ASP was due by 30 October 2026; appointed 15 December = 2 months × AED 5,000 = <b>AED 10,000<\/b>. Go-live is still <b>1 January 2027<\/b>.<\/li>","<li>Reconsideration within <b>40 business days<\/b> of 2 November 2026: about <b>28–31 December 2026<\/b> depending on holidays. Then the Tax Disputes Resolution Committee (40 business days); court above AED 100,000.<\/li>","<li><b>Controls:<\/b> a tax calendar with reminders 10 days before each deadline; maker-checker review of returns with monthly reconciliations; scheduled GIBAN payments; a named e-invoicing project owner; an annual health check by a registered tax agent.<\/li>"]}],"mocks":[{"id":"p1","title":"Paper 1: Value Added Tax","mcq":[12,17,25,31,34,38,40,45,49,53,58,62,64,68,77],"prac":["P15","P17","P19","P23"],"pm":5,"cases":[["C2",20],["C3",15],["C6",15]]},{"id":"p2","title":"Paper 2: Corporate Tax and Procedures","mcq":[80,83,86,92,94,101,109,111,113,117,118,127,129,139,144],"prac":["P20","P22","P24","P26","P28","P31"],"pm":5,"cases":[["C7",20],["C9",20]]}],"plan":"<p>Use this plan for every case in Part D and in the mock papers. Examiners award marks for a <mark>clear structure<\/mark> as well as the right numbers.<\/p><ol class=\"steps\">\n<li><b>Read the requirement first<\/b>, then the facts. Underline dates, amounts, locations (mainland, free zone, Designated Zone, abroad) and the status of each party (registered, individual, QFZP).<\/li>\n<li><b>List the issues<\/b> one line each: “Item 3: failed export, 90-day rule”.<\/li>\n<li><b>State the rule<\/b> with its number or date (AED 375,000; 14 days; 75%; 9 months).<\/li>\n<li><b>Calculate<\/b> in a neat table: one line per item, a total, and the payable or refundable amount.<\/li>\n<li><b>Conclude and advise<\/b>: what to file, pay or change, and the deadline.<\/li>\n<\/ol><div class=\"grid2\">\n<div class=\"card\"><h4>VAT checklist<\/h4><p>Is it a supply? By a taxable person? Where is the place of supply? Which rate (5%, 0%, exempt)? What is the value? When is the date of supply? Who accounts (supplier or reverse charge)? Is input tax recoverable or blocked? Which return box?<\/p><\/div>\n<div class=\"card\"><h4>CT checklist<\/h4><p>Is it a taxable person (resident, non-resident with PE or nexus, natural person over AED 1m)? Any exemption or QFZP status? Start from accounting profit; add back non-deductibles; remove exempt income; apply interest cap; use losses (75% cap); apply SBR, groups or reliefs; 0% band; credits; deadlines.<\/p><\/div>\n<\/div>","decks":{"numbers":[{"t":"VAT","f":"Standard rate / tax fraction","b":"5% / 5÷105"},{"t":"VAT","f":"Mandatory registration threshold","b":"AED 375,000 (12 months back or 30 days ahead)"},{"t":"VAT","f":"Voluntary registration threshold","b":"AED 187,500 (supplies or expenses)"},{"t":"VAT","f":"Non-resident registration","b":"No threshold (if no reverse-charge recipient)"},{"t":"VAT","f":"Apply to register / deregister","b":"30 days / 20 business days"},{"t":"VAT","f":"Tax invoice and credit note deadline","b":"14 days"},{"t":"VAT","f":"Simplified tax invoice allowed","b":"Unregistered customer, or registered customer and ≤ AED 10,000"},{"t":"VAT","f":"Return and payment deadline","b":"28th day after the tax period"},{"t":"VAT","f":"Monthly tax periods","b":"Turnover ≥ AED 150m (FTA assigns)"},{"t":"VAT","f":"Export evidence period","b":"90 days"},{"t":"VAT","f":"Deemed supply exceptions","b":"Gifts/samples ≤ AED 500 per recipient per 12 months; output tax ≤ AED 2,000 per 12 months"},{"t":"VAT","f":"First supply of residential: zero-rated window","b":"3 years from completion"},{"t":"VAT","f":"Capital Assets Scheme","b":"≥ AED 5m; 10 years (buildings) / 5 years (others)"},{"t":"VAT","f":"Pay supplier or reverse input tax","b":"6 months after agreed date"},{"t":"VAT","f":"Bad debt relief","b":"6 months after supply + written off + customer notified"},{"t":"VAT","f":"Use or refund excess credit","b":"5 years (from 1 Jan 2026)"},{"t":"VAT","f":"Voluntary disclosure trigger","b":"Error > AED 10,000: VD within 20 business days"},{"t":"VAT","f":"Record retention","b":"5 years (real estate 15 years)"},{"t":"VAT","f":"Tourist refund","b":"Min AED 250; 87% of VAT less AED 3.60 per claim; export within 90 days"},{"t":"Corporate Tax","f":"Rates","b":"0% to AED 375,000; 9% above"},{"t":"Corporate Tax","f":"QFZP","b":"0% Qualifying Income; 9% other; de minimis lower of 5% or AED 5m"},{"t":"Corporate Tax","f":"QFZP disqualification","b":"Current period + 4 following periods"},{"t":"Corporate Tax","f":"Natural persons","b":"Business turnover > AED 1m per calendar year"},{"t":"Corporate Tax","f":"Small Business Relief","b":"Revenue ≤ AED 3m; periods ending by 31 Dec 2029"},{"t":"Corporate Tax","f":"IFRS for SMEs / cash basis","b":"Revenue ≤ AED 50m / ≤ AED 3m"},{"t":"Corporate Tax","f":"Audited financial statements","b":"Revenue > AED 50m, and all QFZPs"},{"t":"Corporate Tax","f":"Client entertainment deduction","b":"50%"},{"t":"Corporate Tax","f":"Interest cap","b":"Higher of AED 12m and 30% adjusted EBITDA; carry forward 10 years"},{"t":"Corporate Tax","f":"Tax losses","b":"Indefinite; max 75% of taxable income; 50% ownership continuity"},{"t":"Corporate Tax","f":"Participation exemption","b":"≥ 5% or cost ≥ AED 4m; 12 months; 9% subject-to-tax"},{"t":"Corporate Tax","f":"Qualifying Group / loss transfer","b":"≥ 75% common ownership; 2-year clawback"},{"t":"Corporate Tax","f":"Tax Group","b":"≥ 95% ownership"},{"t":"Corporate Tax","f":"TP Disclosure Form","b":"RPT > AED 40m (categories > AED 4m); connected persons > AED 500,000"},{"t":"Corporate Tax","f":"Master File / Local File","b":"Revenue ≥ AED 200m or group ≥ AED 3.15bn; give within 30 days of request"},{"t":"Corporate Tax","f":"Registration (new company)","b":"3 months from incorporation"},{"t":"Corporate Tax","f":"Return and payment","b":"9 months after year end"},{"t":"Corporate Tax","f":"Late-registration penalty waiver","b":"File first return within 7 months"},{"t":"Corporate Tax","f":"Record retention","b":"7 years"},{"t":"Corporate Tax","f":"Withholding tax","b":"0%"},{"t":"Corporate Tax","f":"Top-up Tax","b":"15%; groups ≥ EUR 750m; return 15 months (18 first year)"},{"t":"Corporate Tax","f":"R&D Tax Credit","b":"15% / 35% / 50% tiers; cap AED 2m; from 2026"}],"glossary":[{"f":"Accredited Service Provider (ASP)","b":"A provider accredited to transmit e-invoices on the Peppol network and report data to the FTA."},{"f":"Arm’s length principle","b":"Pricing between related parties as independent parties would price the same transaction."},{"f":"Bare land","b":"Land without completed or partly completed buildings or civil works; its supply is VAT-exempt."},{"f":"Capital Assets Scheme","b":"VAT rules adjusting input tax over 5 or 10 years for assets costing AED 5m or more when their use changes."},{"f":"Composite supply","b":"A supply with several elements treated as one, following the principal element."},{"f":"Connected Person","b":"An owner, director or officer of a taxable person, or a related party of them; payments to them are deductible only at market value."},{"f":"Deemed supply","b":"A transaction treated as a supply without consideration, e.g. gifts or private use of business assets."},{"f":"De minimis requirement","b":"QFZP condition: non-qualifying revenue not above the lower of 5% of total revenue or AED 5m."},{"f":"Designated Zone","b":"A fenced, customs-controlled free zone listed by Cabinet for VAT, treated as outside the UAE for certain goods."},{"f":"Directive","b":"A binding FTA decision on how tax law applies to specific transactions (from 2026)."},{"f":"EmaraTax","b":"The FTA’s online platform for registration, returns, payments and requests."},{"f":"Exempt supply","b":"A supply on which no VAT is charged and related input tax is not recoverable."},{"f":"Free Zone Person","b":"A juridical person incorporated, established or registered in a UAE free zone."},{"f":"GIBAN","b":"A unique bank account reference for paying tax to the FTA."},{"f":"Input tax","b":"VAT paid on purchases and imports used for the business."},{"f":"Nexus","b":"A connection that makes a non-resident taxable in the UAE, such as income from UAE immovable property."},{"f":"Output tax","b":"VAT charged on taxable supplies."},{"f":"Participating Interest","b":"A shareholding meeting the participation exemption conditions."},{"f":"Permanent Establishment","b":"A fixed place of business or dependent agent of a non-resident in the UAE."},{"f":"Place of supply","b":"The location where a supply is treated as made for VAT."},{"f":"Qualifying Free Zone Person (QFZP)","b":"A Free Zone Person meeting all conditions for 0% CT on Qualifying Income."},{"f":"Qualifying Group","b":"Two taxable persons with at least 75% common ownership (for asset transfer and loss transfer relief)."},{"f":"Qualifying Public Benefit Entity","b":"A listed charitable or public-interest entity exempt from CT; donations to it are deductible."},{"f":"Related Party","b":"A person linked by family (to the 4th degree), 50% ownership or control, or other specified ties."},{"f":"Reverse charge","b":"The recipient, not the supplier, accounts for VAT."},{"f":"Small Business Relief","b":"Election for residents with revenue up to AED 3m to be treated as having no taxable income (to 2029)."},{"f":"Tax Group","b":"For VAT: related UAE persons under common control registered as one. For CT: a parent and 95%-owned subsidiaries treated as one taxable person."},{"f":"Tax Registration Number (TRN)","b":"15-digit number identifying a registrant."},{"f":"Top-up Tax (DMTT)","b":"A tax ensuring a 15% minimum effective rate for large MNE groups in the UAE."},{"f":"Transfer of a going concern","b":"Sale of a business as a going concern to a taxable person; not a supply for VAT."},{"f":"Voluntary Disclosure","b":"A form used to correct errors in returns or refund claims."},{"f":"Zero-rated supply","b":"A taxable supply at 0%, with input tax recoverable."}],"abbr":[{"f":"AED","b":"UAE Dirham (USD 1 = AED 3.6725, fixed peg)"},{"f":"ASP","b":"Accredited Service Provider (e-invoicing)"},{"f":"BRR","b":"Business Restructuring Relief"},{"f":"CbCR","b":"Country-by-Country Report"},{"f":"CD","b":"Cabinet Decision"},{"f":"CT","b":"Corporate Tax (Federal Decree-Law No. 47 of 2022)"},{"f":"DMTT","b":"Domestic Minimum Top-up Tax (the UAE “Top-up Tax”)"},{"f":"DZ","b":"Designated Zone (VAT)"},{"f":"EBITDA","b":"Earnings before interest, tax, depreciation and amortisation"},{"f":"EmaraTax","b":"The FTA’s online tax platform"},{"f":"ER","b":"Executive Regulation"},{"f":"FDL","b":"Federal Decree-Law"},{"f":"FTA","b":"Federal Tax Authority"},{"f":"FTC","b":"Foreign Tax Credit"},{"f":"FZ / FZP","b":"Free Zone / Free Zone Person"},{"f":"GCC","b":"Gulf Cooperation Council (UAE, Saudi Arabia const ic = (n, cls = '') => `<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${ICONS[n] || ''}</svg>`;

/* ================= state, persistence, account sync ================= */
const KEY = 'taxpoint-uae-v1';
const fresh = () => ({ v: 1, u: 0, xp: 0, days: {}, streak: 0, bestStreak: 0, last: '', goal: 50, theme: 'auto', sound: true, calm: false,
  ch: {}, q: {}, tf: {}, cl: {}, pr: {}, cs: {}, mk: {}, fc: {}, bd: {}, chain: 0, ans: 0, ok: 0, combo: 0, bestCombo: 0, lastCh: '' });
function load() { for (const k of [KEY, KEY + '-bak']) { try { const j = JSON.parse(localStorage.getItem(k)); if (j && j.v === 1) return Object.assign(fresh(), j); } catch (e) {} } return fresh(); }
let S = load();
function save() {
  S.u = Date.now();
  const ks = Object.keys(S.days).sort(); while (ks.length > 70) delete S.days[ks.shift()];
  try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {}

}
const Sync = {
  ref: null, busy: false, again: false, t: 0, state: 'local',
  async init() {
    try {
      if (!(window.claude && typeof window.claude.use === 'function')) return;

      if (!db || !user) return;
      const id = await user.id(); if (!id) return;
      this.ref = db.collection('data/users/' + id).doc('progress');
      const snap = await Promise.race([this.ref.get(), new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), 10000))]);
      const remote = snap && snap.exists ? snap.data() : null;
      this.state = 'account';
      if (remote && remote.s && remote.u > (S.u || 0)) {
        const r = JSON.parse(remote.s);
        if (r && r.v === 1) { S = Object.assign(fresh(), r); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch (e) {} applyPrefs(); updateChips(); refresh(); }
      } else if (S.u && (!remote || S.u > remote.u)) this.flush();
      if ($('#syncLine')) refresh();
    } catch (e) { this.ref = null; this.state = 'local'; }
  },
  queue() { if (!this.ref) return; clearTimeout(this.t); this.t = setTimeout(() => this.flush(), 1500); },
  async flush() {
    if (!this.ref) return;
    if (this.busy) { this.again = true; return; }
    this.busy = true;
    try { await this.ref.set({ u: S.u, s: JSON.stringify(S) }); }
    catch (e) { if (e && (e.code === 'revoked' || e.code === 'not_granted' || e.code === 'capability_disabled')) { this.ref = null; this.state = 'local'; } }
    this.busy = false;
    if (this.again) { this.again = false; this.flush(); }
  }
};
function persistNow() { try { localStorage.setItem(KEY, JSON.stringify(S)); localStorage.setItem(KEY + '-bak', JSON.stringify(S)); } catch (e) {} }
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'hidden') { persistNow(); if (Sync.ref) { clearTimeout(Sync.t); Sync.flush(); } } });

setInterval(persistNow, 15000);
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) {}

/* ================= sound, haptics, confetti, floating XP ================= */
const Snd = {
  ctx: null,
  wake() { if (this.ctx) return; try { const C = window.AudioContext || window.webkitAudioContext; if (C) this.ctx = new C(); } catch (e) {} },

      o.connect(g).connect(c.destination); o.start(t); o.stop(t + d + .02);
    } catch (e) {}
  },
  tick() { this.tone(880, .05, 'triangle', .035); },
  ok() { this.tone(659, .1, 'sine', .08); this.tone(988, .18, 'sine', .08, .09); },
  no() { this.tone(220, .16, 'square', .03); this.tone(165, .22, 'square', .03, .1); },
  flip() { this.tone(520, .06, 'triangle', .05); this.tone(780, .05, 'triangle', .03, .04); },
  coin() { this.tone(1319, .07, 'square', .025); this.tone(1760, .12, 'square', .025, .06); },
  win() { [523, 659, 784, 1047].forEach((f, i) => this.tone(f, .2, 'triangle', .07, i * .09)); },
