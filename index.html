" text-anchor=\"middle\" x=\"435.0\" y=\"65.4\"><tspan dy=\"0.0\" x=\"435.0\">C3 Buyer's<\/tspan><tspan dy=\"13.4\" x=\"435.0\">Accredited Service<\/tspan><tspan dy=\"13.4\" x=\"435.0\">Provider<\/tspan><\/text><\/g><g><rect fill=\"#16324f\" height=\"70\" rx=\"10\" stroke=\"#16324f\" stroke-width=\"2\" width=\"120\" x=\"530\" y=\"40\"><\/rect><text fill=\"#ffffff\" font-size=\"11.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"590.0\" y=\"72.0\"><tspan dy=\"0.0\" x=\"590.0\">C4 Buyer (ERP<\/tspan><tspan dy=\"14.0\" x=\"590.0\">receives)<\/tspan><\/text><\/g><g><rect fill=\"#c8102e\" height=\"70\" rx=\"10\" stroke=\"#c8102e\" stroke-width=\"2\" width=\"190\" x=\"250\" y=\"170\"><\/rect><text fill=\"#ffffff\" font-size=\"11.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"345.0\" y=\"195.0\"><tspan dy=\"0.0\" x=\"345.0\">C5 Federal Tax Authority:<\/tspan><tspan dy=\"14.0\" x=\"345.0\">receives tax data in near<\/tspan><tspan dy=\"14.0\" x=\"345.0\">real time<\/tspan><\/text><\/g><path d=\"M142.0,75.0 L188.0,75.0\" fill=\"none\" marker-end=\"url(#ar-5c-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"12.5\" opacity=\"0.92\" rx=\"4\" width=\"24.2\" x=\"152.9\" y=\"57.0\"><\/rect><text fill=\"#16324f\" font-size=\"10\" font-weight=\"bold\" text-anchor=\"middle\" x=\"165.0\" y=\"67.0\"><tspan dy=\"0.0\" x=\"165.0\">XML<\/tspan><\/text><path d=\"M322.0,75.0 L368.0,75.0\" fill=\"none\" marker-end=\"url(#ar-5c-00843d)\" stroke=\"#00843d\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"12.5\" opacity=\"0.92\" rx=\"4\" width=\"40.4\" x=\"324.8\" y=\"57.0\"><\/rect><text fill=\"#00843d\" font-size=\"10\" font-weight=\"bold\" text-anchor=\"middle\" x=\"345.0\" y=\"67.0\"><tspan dy=\"0.0\" x=\"345.0\">Peppol<\/tspan><\/text><path d=\"M502.0,75.0 L528.0,75.0\" fill=\"none\" marker-end=\"url(#ar-5c-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><path d=\"M255.0,112.0 L300.0,168.0\" fill=\"none\" marker-end=\"url(#ar-5c-c8102e)\" stroke=\"#c8102e\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"12.5\" opacity=\"0.92\" rx=\"4\" width=\"40.4\" x=\"233.3\" y=\"132.0\"><\/rect><text fill=\"#c8102e\" font-size=\"10\" font-weight=\"bold\" text-anchor=\"middle\" x=\"253.5\" y=\"142.0\"><tspan dy=\"0.0\" x=\"253.5\">report<\/tspan><\/text><path d=\"M435.0,112.0 L395.0,168.0\" fill=\"none\" marker-end=\"url(#ar-5c-c8102e)\" stroke=\"#c8102e\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"12.5\" opacity=\"0.92\" rx=\"4\" width=\"40.4\" x=\"420.8\" y=\"132.0\"><\/rect><text fill=\"#c8102e\" font-size=\"10\" font-weight=\"bold\" text-anchor=\"middle\" x=\"441.0\" y=\"142.0\"><tspan dy=\"0.0\" x=\"441.0\">report<\/tspan><\/text><text fill=\"#16324f\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"24.2\"><tspan dy=\"0.0\" x=\"330.0\">Invoices travel as structured data (PINT AE format), not PDFs<\/tspan><\/text><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"261.9\"><tspan dy=\"0.0\" x=\"330.0\">B2B and B2G invoices are in scope; B2C transactions are excluded for now<\/tspan><\/text><\/svg><figcaption><b>Figure 31.1<\/b> The five-corner (Peppol) model.<\/figcaption><\/figure><p>Each business appoints an <span class=\"term\">Accredited Service Provider<\/span> (ASP). The supplier’s system sends the invoice to its ASP (corner 2), which validates it against the UAE data standard (<b>PINT AE<\/b>, based on Peppol BIS Billing 3.0) and sends it over the Peppol network to the buyer’s ASP (corner 3), which delivers it to the buyer (corner 4). The ASPs report the tax data to the <b>FTA<\/b> (corner 5). From 1 October 2026 ASPs obtain direct accreditation under Ministerial Decision No. 168 of 2026 (replacing the earlier pre-approval system).<\/p>"},{"title":"Scope and exclusions","html":"<ul>\n<li>Applies to <b>all persons conducting business in the UAE<\/b> for their business transactions, whether or not VAT-registered, unless excluded.<\/li>\n<li><b>B2C<\/b> transactions are excluded for now.<\/li>\n<li>Excluded transactions include, for example, sovereign activities of government entities not in competition with the private sector, and certain international airline passenger transport and related services.<\/li>\n<li><span class=\"new\">NEW<\/span> Ministerial Decision No. 197 of 2026 (in force 1 October 2026) excludes transactions <b>between members of the same VAT Tax Group<\/b> for <span class=\"num\">24 months<\/span> from 1 January 2027, removes the requirement to store e-invoice data inside the UAE (replaced by a duty to keep and produce it on request), and drops the system-failure notification rules.<\/li>\n<li>Excluded persons may join voluntarily.<\/li>\n<\/ul>"},{"title":"Timeline","html":"<figure class=\"fig\"><svg aria-label=\"UAE e-invoicing implementation timeline\" role=\"img\" viewbox=\"0 0 660 240\" xmlns=\"http://www.w3.org/2000/svg\"><title>UAE e-invoicing implementation timeline<\/title><defs><\/defs><line stroke=\"#16324f\" stroke-linecap=\"round\" stroke-width=\"4\" x1=\"20\" x2=\"640\" y1=\"120\" y2=\"120\"><\/line><circle cx=\"45\" cy=\"120\" fill=\"#f1f2f3\" r=\"12\" stroke=\"#8a8f96\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"45.0\" y=\"150.0\"><tspan dy=\"0.0\" x=\"45.0\">1 Jul 2026<\/tspan><\/text><g><rect fill=\"#f1f2f3\" height=\"66\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"124\" x=\"4\" y=\"10\"><\/rect><text fill=\"#1f2328\" font-size=\"10.4\" font-weight=\"normal\" text-anchor=\"middle\" x=\"66.0\" y=\"40.3\"><tspan dy=\"0.0\" x=\"66.0\">Pilot &amp; voluntary<\/tspan><tspan dy=\"12.7\" x=\"66.0\">adoption opens<\/tspan><\/text><\/g><circle cx=\"150\" cy=\"120\" fill=\"#fff4d1\" r=\"12\" stroke=\"#eda100\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"150.0\" y=\"100.0\"><tspan dy=\"0.0\" x=\"150.0\">30 Oct 2026<\/tspan><\/text><g><rect fill=\"#fff4d1\" height=\"66\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"124\" x=\"88\" y=\"160\"><\/rect><text fill=\"#1f2328\" font-size=\"10.4\" font-weight=\"normal\" text-anchor=\"middle\" x=\"150.0\" y=\"190.3\"><tspan dy=\"0.0\" x=\"150.0\">Revenue ≥ AED 50m:<\/tspan><tspan dy=\"12.7\" x=\"150.0\">appoint an ASP<\/tspan><\/text><\/g><circle cx=\"260\" cy=\"120\" fill=\"#c8102e\" r=\"12\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"260.0\" y=\"150.0\"><tspan dy=\"0.0\" x=\"260.0\">1 Jan 2027<\/tspan><\/text><g><rect fill=\"#c8102e\" height=\"66\" rx=\"10\" stroke=\"#c8102e\" stroke-width=\"2\" width=\"124\" x=\"198\" y=\"10\"><\/rect><text fill=\"#ffffff\" font-size=\"10.4\" font-weight=\"normal\" text-anchor=\"middle\" x=\"260.0\" y=\"34.0\"><tspan dy=\"0.0\" x=\"260.0\">Revenue ≥ AED 50m:<\/tspan><tspan dy=\"12.7\" x=\"260.0\">e-invoicing<\/tspan><tspan dy=\"12.7\" x=\"260.0\">mandatory<\/tspan><\/text><\/g><circle cx=\"375\" cy=\"120\" fill=\"#fff4d1\" r=\"12\" stroke=\"#eda100\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"375.0\" y=\"100.0\"><tspan dy=\"0.0\" x=\"375.0\">31 Mar 2027<\/tspan><\/text><g><rect fill=\"#fff4d1\" height=\"66\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"124\" x=\"313\" y=\"160\"><\/rect><text fill=\"#1f2328\" font-size=\"10.4\" font-weight=\"normal\" text-anchor=\"middle\" x=\"375.0\" y=\"184.0\"><tspan dy=\"0.0\" x=\"375.0\">Revenue &lt; AED 50m<\/tspan><tspan dy=\"12.7\" x=\"375.0\">&amp; government:<\/tspan><tspan dy=\"12.7\" x=\"375.0\">appoint an ASP<\/tspan><\/text><\/g><circle cx=\"490\" cy=\"120\" fill=\"#c8102e\" r=\"12\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"490.0\" y=\"150.0\"><tspan dy=\"0.0\" x=\"490.0\">1 Jul 2027<\/tspan><\/text><g><rect fill=\"#c8102e\" height=\"66\" rx=\"10\" stroke=\"#c8102e\" stroke-width=\"2\" width=\"124\" x=\"428\" y=\"10\"><\/rect><text fill=\"#ffffff\" font-size=\"10.4\" font-weight=\"normal\" text-anchor=\"middle\" x=\"490.0\" y=\"40.3\"><tspan dy=\"0.0\" x=\"490.0\">Revenue &lt; AED 50m:<\/tspan><tspan dy=\"12.7\" x=\"490.0\">mandatory<\/tspan><\/text><\/g><circle cx=\"605\" cy=\"120\" fill=\"#ebe8fb\" r=\"12\" stroke=\"#6250d6\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"605.0\" y=\"100.0\"><tspan dy=\"0.0\" x=\"605.0\">1 Oct 2027<\/tspan><\/text><g><rect fill=\"#ebe8fb\" height=\"66\" rx=\"10\" stroke=\"#6250d6\" stroke-width=\"2\" width=\"124\" x=\"532\" y=\"160\"><\/rect><text fill=\"#1f2328\" font-size=\"10.4\" font-weight=\"normal\" text-anchor=\"middle\" x=\"594.0\" y=\"184.0\"><tspan dy=\"0.0\" x=\"594.0\">Government<\/tspan><tspan dy=\"12.7\" x=\"594.0\">entities:<\/tspan><tspan dy=\"12.7\" x=\"594.0\">mandatory<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 31.2<\/b> Implementation timeline (as amended by MD 66/2026).<\/figcaption><\/figure><div class=\"tbl\"><table>\n<thead><tr><th>Group<\/th><th>Appoint an ASP by<\/th><th>Go live by<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Voluntary adopters / pilot<\/td><td>–<\/td><td>From 1 July 2026<\/td><\/tr>\n<tr><td>Revenue of <b>AED 50 million or more<\/b><\/td><td><span class=\"num\">30 October 2026<\/span> (extended from 31 July)<\/td><td><span class=\"num\">1 January 2027<\/span><\/td><\/tr>\n<tr><td>Revenue below AED 50 million<\/td><td>31 March 2027<\/td><td>1 July 2027<\/td><\/tr>\n<tr><td>Government entities (in scope)<\/td><td>31 March 2027<\/td><td>1 October 2027<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"},{"title":"Impact on VAT","html":"<ul>\n<li>Where a business must issue e-invoices, the <b>simplified tax invoice<\/b> option does not apply to those invoices.<\/li>\n<li>Keeping the e-invoice electronically becomes a condition for <b>input tax recovery<\/b> (FTA VATP046).<\/li>\n<li>Credit notes must also be electronic.<\/li>\n<li>Data quality (TRNs, addresses, product codes, tax categories) becomes critical, since errors are visible to the FTA immediately.<\/li>\n<\/ul>"},{"title":"Readiness checklist","html":"<ol class=\"steps\">\n<li>Confirm your revenue band and deadlines; identify all entities, including Tax Group members.<\/li>\n<li>Map invoice flows (sales, purchases, credit notes, self-billing, intra-group) and data fields against PINT AE.<\/li>\n<li>Select and appoint an ASP; check its accreditation status.<\/li>\n<li>Upgrade ERP/billing systems; clean master data (customer TRNs, Peppol IDs, addresses).<\/li>\n<li>Test end to end, train staff, and update procedures and contracts with customers and suppliers.<\/li>\n<li>Go live; monitor rejections; reconcile e-invoice data with VAT returns every period.<\/li>\n<\/ol>"}],"summary":["Five-corner Peppol model with ASPs and FTA reporting; PINT AE data standard.","AED 50m+: ASP by 30 Oct 2026, live 1 Jan 2027; others: 31 Mar 2027 / 1 Jul 2027; government: 1 Oct 2027.","B2C excluded; intra-Tax Group excluded for 24 months from 2027."],"review":[{"q":"Is a PDF emailed to a customer an e-invoice under the UAE system? Explain.","a":null},{"q":"What are the five corners?","a":null},{"q":"A company with AED 30m revenue: what are its two key dates?","a":null}],"mcq":[145,146,147,148,149,150]},"ch32":{"id":"ch32","num":"32","kind":"chapter","title":"Accounting for VAT and Corporate Tax","short":"Accounting for VAT & Corporate Tax","objectives":["Record VAT on sales, purchases, imports and reverse-charge supplies, and clear the VAT control account.","Reconcile the general ledger to the VAT return.","Account for current and deferred Corporate Tax under <b>IAS 12<\/b> and prepare a tax rate reconciliation."],"sections":[{"title":"VAT in the books","html":"<p>For a fully taxable registrant, VAT is <mark>neither income nor expense<\/mark>: output VAT is a liability owed to the FTA and input VAT is an asset (a claim against the FTA). Revenue and costs are recorded <b>net<\/b> of recoverable VAT. Only <b>irrecoverable<\/b> VAT (blocked items, the exempt share of a partially exempt business) becomes part of the cost of the asset or expense.<\/p><div class=\"tbl\"><table>\n<caption>Table 32.1 Standard journal entries<\/caption>\n<thead><tr><th>Transaction<\/th><th>Debit<\/th><th>Credit<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Standard-rated sale AED 100 + VAT<\/td><td>Receivable 105<\/td><td>Revenue 100; VAT output 5<\/td><\/tr>\n<tr><td>Zero-rated export AED 100<\/td><td>Receivable 100<\/td><td>Revenue 100<\/td><\/tr>\n<tr><td>Standard-rated purchase AED 100 + VAT<\/td><td>Expense / inventory 100; VAT input 5<\/td><td>Payable 105<\/td><\/tr>\n<tr><td>Blocked purchase (client dinner) AED 100 + VAT<\/td><td>Entertainment expense 105<\/td><td>Payable 105<\/td><\/tr>\n<tr><td>Imported services (reverse charge) AED 100<\/td><td>Expense 100; VAT input 5<\/td><td>Payable 100; VAT output (RCM) 5<\/td><\/tr>\n<tr><td>Import of goods by a registrant AED 100<\/td><td>Inventory 100; VAT input 5<\/td><td>Payable 100; VAT output (imports) 5<\/td><\/tr>\n<tr><td>Tax credit note issued AED 10 + VAT<\/td><td>Revenue 10; VAT output 0.50<\/td><td>Receivable 10.50<\/td><\/tr>\n<tr><td>Bad debt relief on VAT of 5<\/td><td>VAT output 5; bad debt expense 100<\/td><td>Receivable 105<\/td><\/tr>\n<tr><td>Closing the return (net payable)<\/td><td>VAT output (total)<\/td><td>VAT input (total); VAT payable (net)<\/td><\/tr>\n<tr><td>Paying the FTA<\/td><td>VAT payable<\/td><td>Bank<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 32.1: Falcon Trading LLC (data from Example 14.1)<\/span>\n<div class=\"tbl\"><table class=\"calc\">\n<thead><tr><th>Account<\/th><th class=\"r\">Output (Cr)<\/th><th class=\"r\">Input (Dr)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Local standard-rated sales 1,500,000<\/td><td class=\"r\">75,000<\/td><td class=\"r\"><\/td><\/tr>\n<tr><td>Reverse charge on UK consultancy 100,000<\/td><td class=\"r\">5,000<\/td><td class=\"r\">5,000<\/td><\/tr>\n<tr><td>Imports 400,000<\/td><td class=\"r\">20,000<\/td><td class=\"r\">20,000<\/td><\/tr>\n<tr><td>Local purchases 880,000 (excluding blocked entertainment)<\/td><td class=\"r\"><\/td><td class=\"r\">44,000<\/td><\/tr>\n<tr class=\"sub\"><td>Totals<\/td><td class=\"r\">100,000<\/td><td class=\"r\">69,000<\/td><\/tr>\n<tr class=\"tot\"><td>VAT payable (agrees to Box 14)<\/td><td class=\"r\" colspan=\"2\">31,000<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The client entertainment of AED 20,000 is booked at <b>AED 21,000<\/b> in the income statement, because its VAT of AED 1,000 is blocked.<\/p>\n<\/div>"},{"title":"Reconciling the ledger to the return","html":"<p>Every period, before filing, reconcile:<\/p><ol class=\"steps\">\n<li>Sales ledger totals by VAT code to Boxes 1, 4 and 5 (and by emirate for Box 1).<\/li>\n<li>The VAT output and input accounts in the general ledger to Boxes 8 and 11.<\/li>\n<li>Customs import data (available on EmaraTax) to Box 6; investigate imports made under your customs code for other people.<\/li>\n<li>Reverse-charge purchases (overseas supplier ledger) to Boxes 3 and 10.<\/li>\n<li>Credit notes, bad debts, blocked items, foreign exchange and late invoices (input tax can be claimed in the next period).<\/li>\n<li>Prepayments and deposits received (VAT at receipt) and continuous supplies (VAT at invoice or due date).<\/li>\n<\/ol><div class=\"box warn\"><span class=\"lbl\">WATCH OUT<\/span>\n<p>From 2027, e-invoicing gives the FTA your invoice data almost in real time. Differences between e-invoice data and your VAT return will be easy for the FTA to spot, so monthly reconciliation becomes essential.<\/p>\n<\/div>"},{"title":"Corporate Tax under IAS 12","html":"<p><b>IAS 12 Income Taxes<\/b> requires two components of tax expense:<\/p><div class=\"grid2\">\n<div class=\"card\"><h4>Current tax<\/h4><p>The CT payable (or recoverable) for the period, from the tax computation. Dr Current tax expense / Cr CT payable.<\/p><\/div>\n<div class=\"card\"><h4>Deferred tax<\/h4><p>Tax on <b>temporary differences<\/b> between the accounting carrying amounts of assets and liabilities and their tax bases, and on unused tax losses and credits (deferred tax assets only if future taxable profit is probable).<\/p><\/div>\n<\/div><ul>\n<li>For IFRS purposes the UAE CT Law was treated as <b>substantively enacted<\/b> on 16 January 2023, when the Cabinet Decision setting the AED 375,000 threshold was published; deferred tax was recognised from that date.<\/li>\n<li>Deferred tax is measured at the rate expected to apply when the difference reverses: usually <b>9%<\/b> for mainland entities, and <b>0%<\/b> for differences relating to a QFZP’s Qualifying Income.<\/li>\n<li>Typical UAE temporary differences: unrealised gains on investment property or financial assets where the <b>realisation basis<\/b> is elected; interest disallowed now but carried forward; unused <b>tax losses<\/b>; provisions deductible only when paid.<\/li>\n<li>IAS 12 contains a mandatory <b>temporary exception<\/b>: no deferred tax is recognised for Pillar Two top-up taxes such as the UAE DMTT, but the exposure must be disclosed.<\/li>\n<\/ul><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 32.2: Oasis Logistics LLC (data from Example 22.1)<\/span>\n<p>Current tax is AED 182,700. A deferred tax liability arises on the AED 500,000 unrealised gain (taxed only when realised): 9% × 500,000 = AED 45,000. A deferred tax asset of AED 90,000 (9% × AED 1,000,000 losses) recognised last year is used up.<\/p>\n<div class=\"tbl\"><table class=\"calc\"><tbody>\n<tr><td>Current tax expense<\/td><td class=\"r\">182,700<\/td><\/tr>\n<tr><td>Deferred tax: new liability on unrealised gain<\/td><td class=\"r\">45,000<\/td><\/tr>\n<tr><td>Deferred tax: reversal of asset on losses used<\/td><td class=\"r\">90,000<\/td><\/tr>\n<tr class=\"tot\"><td>Total income tax expense<\/td><td class=\"r\">317,700<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Journal: Dr Current tax expense 182,700 / Cr CT payable 182,700; Dr Deferred tax expense 135,000 / Cr Deferred tax liability 45,000 / Cr Deferred tax asset 90,000.<\/p>\n<p><b>Tax rate reconciliation<\/b> (IAS 12 disclosure):<\/p>\n<div class=\"tbl\"><table class=\"calc\"><tbody>\n<tr><td>Profit before tax 4,200,000 × 9%<\/td><td class=\"r\">378,000<\/td><\/tr>\n<tr><td>Effect of the 0% band (375,000 × 9%)<\/td><td class=\"r\">(33,750)<\/td><\/tr>\n<tr><td>Exempt dividends (500,000 × 9%)<\/td><td class=\"r\">(45,000)<\/td><\/tr>\n<tr><td>Non-deductible expenses (205,000 × 9%)<\/td><td class=\"r\">18,450<\/td><\/tr>\n<tr class=\"tot\"><td>Income tax expense (effective rate 7.6%)<\/td><td class=\"r\">317,700<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<\/div>"}],"summary":["Recoverable VAT sits in balance sheet accounts; irrecoverable VAT is a cost.","Reverse charge and imports are recorded on both sides of the VAT control account.","Reconcile ledgers to every box of the VAT return each period.","IAS 12: current tax plus deferred tax; no deferred tax for Top-up Tax (disclose instead)."],"review":[{"q":"Record the purchase of a delivery van for AED 120,000 + VAT by a fully taxable company.","a":null},{"q":"A bank recovers 40% of its residual input tax. How is the other 60% treated in its accounts?","a":null},{"q":"Why might a QFZP measure some deferred tax at 0%?","a":null}]},"ch33":{"id":"ch33","num":"33","kind":"chapter","title":"Starting Your UAE Tax Journey","short":"Starting Your UAE Tax Journey","objectives":["Map the roles and skills in UAE tax practice.","Understand how to become an <b>FTA-registered Tax Agent<\/b>.","Build habits for staying current and practising ethically."],"sections":[{"title":"Careers in UAE tax","html":"<figure class=\"fig\"><svg aria-label=\"A learning path into UAE tax practice\" role=\"img\" viewbox=\"0 0 660 230\" xmlns=\"http://www.w3.org/2000/svg\"><title>A learning path into UAE tax practice<\/title><defs><\/defs><g><rect fill=\"#e6f0fc\" height=\"100\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"122\" x=\"10\" y=\"120\"><\/rect><path d=\"M10,146 V130 Q10,120 20,120 H122 Q132,120 132,130 V146 Z\" fill=\"#2a78d6\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"71.0\" y=\"137.6\"><tspan dy=\"0.0\" x=\"71.0\">Learn<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.4\" font-weight=\"normal\" text-anchor=\"middle\" x=\"71.0\" y=\"167.6\"><tspan dy=\"0.0\" x=\"71.0\">Study VAT, CT &amp;<\/tspan><tspan dy=\"12.7\" x=\"71.0\">Tax Procedures<\/tspan><tspan dy=\"12.7\" x=\"71.0\">(this book) +<\/tspan><tspan dy=\"12.7\" x=\"71.0\">accounting basics<\/tspan><\/text><\/g><g><rect fill=\"#e0f5ec\" height=\"124\" rx=\"10\" stroke=\"#1baf7a\" stroke-width=\"2\" width=\"122\" x=\"140\" y=\"96\"><\/rect><path d=\"M140,122 V106 Q140,96 150,96 H252 Q262,96 262,106 V122 Z\" fill=\"#1baf7a\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"201.0\" y=\"113.5\"><tspan dy=\"0.0\" x=\"201.0\">Practise<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.4\" font-weight=\"normal\" text-anchor=\"middle\" x=\"201.0\" y=\"155.6\"><tspan dy=\"0.0\" x=\"201.0\">Bookkeeping, VAT<\/tspan><tspan dy=\"12.7\" x=\"201.0\">returns, CT<\/tspan><tspan dy=\"12.7\" x=\"201.0\">computations on<\/tspan><tspan dy=\"12.7\" x=\"201.0\">EmaraTax<\/tspan><\/text><\/g><g><rect fill=\"#fff4d1\" height=\"148\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"122\" x=\"270\" y=\"72\"><\/rect><path d=\"M270,98 V82 Q270,72 280,72 H382 Q392,72 392,82 V98 Z\" fill=\"#eda100\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"331.0\" y=\"89.5\"><tspan dy=\"0.0\" x=\"331.0\">Qualify<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.4\" font-weight=\"normal\" text-anchor=\"middle\" x=\"331.0\" y=\"143.6\"><tspan dy=\"0.0\" x=\"331.0\">Degree +<\/tspan><tspan dy=\"12.7\" x=\"331.0\">experience; FTA<\/tspan><tspan dy=\"12.7\" x=\"331.0\">Tax Agent exam &amp;<\/tspan><tspan dy=\"12.7\" x=\"331.0\">registration<\/tspan><\/text><\/g><g><rect fill=\"#fdeadf\" height=\"172\" rx=\"10\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"122\" x=\"400\" y=\"48\"><\/rect><path d=\"M400,74 V58 Q400,48 410,48 H512 Q522,48 522,58 V74 Z\" fill=\"#eb6834\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"461.0\" y=\"65.5\"><tspan dy=\"0.0\" x=\"461.0\">Specialise<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.4\" font-weight=\"normal\" text-anchor=\"middle\" x=\"461.0\" y=\"138.0\"><tspan dy=\"0.0\" x=\"461.0\">Free zones, real<\/tspan><tspan dy=\"12.7\" x=\"461.0\">estate, TP, Pillar<\/tspan><tspan dy=\"12.7\" x=\"461.0\">Two, e-invoicing<\/tspan><\/text><\/g><g><rect fill=\"#e3f3e3\" height=\"196\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"122\" x=\"530\" y=\"24\"><\/rect><path d=\"M530,50 V34 Q530,24 540,24 H642 Q652,24 652,34 V50 Z\" fill=\"#008300\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"591.0\" y=\"41.5\"><tspan dy=\"0.0\" x=\"591.0\">Advise<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.4\" font-weight=\"normal\" text-anchor=\"middle\" x=\"591.0\" y=\"126.0\"><tspan dy=\"0.0\" x=\"591.0\">Audits, disputes,<\/tspan><tspan dy=\"12.7\" x=\"591.0\">restructuring,<\/tspan><tspan dy=\"12.7\" x=\"591.0\">training<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 33.1<\/b> A typical learning path.<\/figcaption><\/figure><div class=\"tbl\"><table>\n<thead><tr><th>Role<\/th><th>What you do<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Accountant / tax accountant<\/td><td>Book-keeping, VAT returns, CT computations, reconciliations, record keeping.<\/td><\/tr>\n<tr><td>Tax compliance officer (in-house)<\/td><td>Owns the tax calendar, filings, e-invoicing controls and FTA correspondence for a company.<\/td><\/tr>\n<tr><td>Tax consultant / advisor<\/td><td>Structures transactions, free zone and group planning, VAT reviews, health checks.<\/td><\/tr>\n<tr><td>FTA-registered Tax Agent<\/td><td>Formally represents clients before the FTA, including audits, VDs and reconsiderations.<\/td><\/tr>\n<tr><td>Transfer pricing / Pillar Two specialist<\/td><td>Benchmarking, documentation, Top-up Tax modelling for multinational groups.<\/td><\/tr>\n<tr><td>Tax technology specialist<\/td><td>ERP tax configuration, e-invoicing implementation, data analytics.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"},{"title":"Becoming a Tax Agent","html":"<p>A <span class=\"term\">Tax Agent<\/span> is an individual registered with the FTA and listed in its register, who may represent taxpayers before the FTA. A <span class=\"term\">Tax Agency<\/span> is the licensed firm through which agents work. The FTA’s requirements, which it updates from time to time, broadly include:<\/p><ul>\n<li>a recognised degree in tax, accounting, law or a related field (or a recognised professional qualification);<\/li>\n<li>relevant practical experience in tax or accounting (historically at least three years);<\/li>\n<li>passing the FTA’s <b>Tax Agent examination<\/b> on UAE tax law and procedures;<\/li>\n<li>good conduct, medical fitness, the required language skills, and (for the agency) professional indemnity insurance; and<\/li>\n<li>renewal of the registration when it expires.<\/li>\n<\/ul><p>The FTA also announced a national programme from January 2026 to train Emirati tax agents. Always check the current criteria on <b>tax.gov.ae<\/b> before applying.<\/p>"},{"title":"Staying up to date","html":"<ul>\n<li>Check the “Legislation”, “Public Clarifications” and “Guides” pages of <b>tax.gov.ae<\/b> and the news pages of <b>mof.gov.ae<\/b> every month.<\/li>\n<li>Subscribe to FTA announcements and attend its free awareness sessions and webinars.<\/li>\n<li>Read professional alerts from law and accounting firms, but verify against the official text.<\/li>\n<li>Keep a personal “change log” of every new decision with its effective date.<\/li>\n<\/ul>"},{"title":"Ethics and professional conduct","html":"<ul>\n<li>Never help a client evade tax or prepare false documents; tax evasion is a crime.<\/li>\n<li>Keep client information confidential and secure.<\/li>\n<li>Disclose the limits of your knowledge; get second opinions on complex matters.<\/li>\n<li>Document the facts and the law behind every position you take.<\/li>\n<\/ul>"},{"title":"A first-90-days checklist for a new UAE business","html":"<ol class=\"steps\">\n<li>Register for CT within 3 months of incorporation; set the financial year.<\/li>\n<li>Track taxable supplies monthly; register for VAT within 30 days of passing AED 375,000 (or register voluntarily).<\/li>\n<li>Set up accounting software that produces compliant tax invoices and VAT reports; plan for e-invoicing.<\/li>\n<li>Create a tax calendar (Appendix B) and a document retention policy (5/7/15 years).<\/li>\n<li>Review related-party arrangements and free zone conditions; decide on SBR and other elections.<\/li>\n<li>Build supplier verification into purchasing (FTA Decision 13/2026).<\/li>\n<\/ol>"},{"title":"Frequently asked questions from new learners","html":"<div class=\"tbl\"><table>\n<thead><tr><th>Question<\/th><th>Short answer<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Do I pay tax on my UAE salary?<\/td><td>No. There is no personal income tax on employment income.<\/td><\/tr>\n<tr><td>My company made a loss. Do I still file a CT return?<\/td><td>Yes. Registration, the return and records are required even with a loss or zero tax; filing also preserves the loss for later years.<\/td><\/tr>\n<tr><td>Is every free zone company taxed at 0%?<\/td><td>No. Only a QFZP, on Qualifying Income, and only while it meets all conditions.<\/td><\/tr>\n<tr><td>Can I register for VAT before I reach AED 375,000?<\/td><td>Yes, voluntarily, once supplies or taxable expenses exceed AED 187,500.<\/td><\/tr>\n<tr><td>Does a VAT-registered business always need to charge VAT?<\/td><td>It charges 5% on standard-rated supplies, 0% on zero-rated supplies, and no VAT on exempt or out-of-scope transactions.<\/td><\/tr>\n<tr><td>Can a PDF invoice be a tax invoice?<\/td><td>Yes today, if it contains all required details. Once e-invoicing applies to the business (2027), a structured e-invoice through an ASP is required.<\/td><\/tr>\n<tr><td>Can I claim input VAT on a car for my sales manager?<\/td><td>Not if it is available for personal use. Vehicles used only for business can qualify.<\/td><\/tr>\n<tr><td>What happens if I miss a deadline?<\/td><td>Fixed or time-based penalties apply (Chapter 30). Correct quickly: the new penalties grow with time.<\/td><\/tr>\n<tr><td>Is there a CT exemption for start-ups?<\/td><td>Small Business Relief (revenue up to AED 3m, to 2029) gives zero tax if elected; the AED 375,000 0% band helps everyone else.<\/td><\/tr>\n<tr><td>Where do I find the official law?<\/td><td>tax.gov.ae (Legislation, Guides, Public Clarifications) and mof.gov.ae.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"}],"summary":["UAE tax offers careers in compliance, advisory, agent representation, transfer pricing and tax technology.","Tax Agents must meet FTA qualification, experience and exam requirements.","Build the habits of checking official sources, logging changes and documenting positions."],"review":[]},"appA":{"id":"appA","num":"A","kind":"appendix","title":"Quick Reference: Key Numbers and Thresholds","short":"Quick Reference","objectives":[],"sections":[{"title":"Quick Reference: Key Numbers and Thresholds","html":"<div class=\"tbl\"><table>\n<caption>VAT<\/caption>\n<thead><tr><th>Item<\/th><th>Number<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Standard rate / tax fraction<\/td><td>5% / 5÷105<\/td><\/tr>\n<tr><td>Mandatory registration threshold<\/td><td>AED 375,000 (12 months back or 30 days ahead)<\/td><\/tr>\n<tr><td>Voluntary registration threshold<\/td><td>AED 187,500 (supplies or expenses)<\/td><\/tr>\n<tr><td>Non-resident registration<\/td><td>No threshold (if no reverse-charge recipient)<\/td><\/tr>\n<tr><td>Apply to register / deregister<\/td><td>30 days / 20 business days<\/td><\/tr>\n<tr><td>Tax invoice and credit note deadline<\/td><td>14 days<\/td><\/tr>\n<tr><td>Simplified tax invoice allowed<\/td><td>Unregistered customer, or registered customer and ≤ AED 10,000<\/td><\/tr>\n<tr><td>Return and payment deadline<\/td><td>28th day after the tax period<\/td><\/tr>\n<tr><td>Monthly tax periods<\/td><td>Turnover ≥ AED 150m (FTA assigns)<\/td><\/tr>\n<tr><td>Export evidence period<\/td><td>90 days<\/td><\/tr>\n<tr><td>Deemed supply exceptions<\/td><td>Gifts/samples ≤ AED 500 per recipient per 12 months; output tax ≤ AED 2,000 per 12 months<\/td><\/tr>\n<tr><td>First supply of residential: zero-rated window<\/td><td>3 years from completion<\/td><\/tr>\n<tr><td>Capital Assets Scheme<\/td><td>≥ AED 5m; 10 years (buildings) / 5 years (others)<\/td><\/tr>\n<tr><td>Pay supplier or reverse input tax<\/td><td>6 months after agreed date<\/td><\/tr>\n<tr><td>Bad debt relief<\/td><td>6 months after supply + written off + customer notified<\/td><\/tr>\n<tr><td>Use or refund excess credit<\/td><td>5 years (from 1 Jan 2026)<\/td><\/tr>\n<tr><td>Voluntary disclosure trigger<\/td><td>Error &gt; AED 10,000: VD within 20 business days<\/td><\/tr>\n<tr><td>Record retention<\/td><td>5 years (real estate 15 years)<\/td><\/tr>\n<tr><td>Tourist refund<\/td><td>Min AED 250; 87% of VAT less AED 3.60 per claim; export within 90 days<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><div class=\"tbl\"><table>\n<caption>Corporate Tax<\/caption>\n<thead><tr><th>Item<\/th><th>Number<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Rates<\/td><td>0% to AED 375,000; 9% above<\/td><\/tr>\n<tr><td>QFZP<\/td><td>0% Qualifying Income; 9% other; de minimis lower of 5% or AED 5m<\/td><\/tr>\n<tr><td>QFZP disqualification<\/td><td>Current period + 4 following periods<\/td><\/tr>\n<tr><td>Natural persons<\/td><td>Business turnover &gt; AED 1m per calendar year<\/td><\/tr>\n<tr><td>Small Business Relief<\/td><td>Revenue ≤ AED 3m; periods ending by 31 Dec 2029<\/td><\/tr>\n<tr><td>IFRS for SMEs / cash basis<\/td><td>Revenue ≤ AED 50m / ≤ AED 3m<\/td><\/tr>\n<tr><td>Audited financial statements<\/td><td>Revenue &gt; AED 50m, and all QFZPs<\/td><\/tr>\n<tr><td>Client entertainment deduction<\/td><td>50%<\/td><\/tr>\n<tr><td>Interest cap<\/td><td>Higher of AED 12m and 30% adjusted EBITDA; carry forward 10 years<\/td><\/tr>\n<tr><td>Tax losses<\/td><td>Indefinite; max 75% of taxable income; 50% ownership continuity<\/td><\/tr>\n<tr><td>Participation exemption<\/td><td>≥ 5% or cost ≥ AED 4m; 12 months; 9% subject-to-tax<\/td><\/tr>\n<tr><td>Qualifying Group / loss transfer<\/td><td>≥ 75% common ownership; 2-year clawback<\/td><\/tr>\n<tr><td>Tax Group<\/td><td>≥ 95% ownership<\/td><\/tr>\n<tr><td>TP Disclosure Form<\/td><td>RPT &gt; AED 40m (categories &gt; AED 4m); connected persons &gt; AED 500,000<\/td><\/tr>\n<tr><td>Master File / Local File<\/td><td>Revenue ≥ AED 200m or group ≥ AED 3.15bn; give within 30 days of request<\/td><\/tr>\n<tr><td>Registration (new company)<\/td><td>3 months from incorporation<\/td><\/tr>\n<tr><td>Return and payment<\/td><td>9 months after year end<\/td><\/tr>\n<tr><td>Late-registration penalty waiver<\/td><td>File first return within 7 months<\/td><\/tr>\n<tr><td>Record retention<\/td><td>7 years<\/td><\/tr>\n<tr><td>Withholding tax<\/td><td>0%<\/td><\/tr>\n<tr><td>Top-up Tax<\/td><td>15%; groups ≥ EUR 750m; return 15 months (18 first year)<\/td><\/tr>\n<tr><td>R&amp;D Tax Credit<\/td><td>15% / 35% / 50% tiers; cap AED 2m; from 2026<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"}],"summary":"","review":[]},"appB":{"id":"appB","num":"B","kind":"appendix","title":"Compliance Calendar","short":"Compliance Calendar","objectives":[],"sections":[{"title":"Compliance Calendar","html":"<p>For a company with a <b>calendar financial year<\/b> and <b>quarterly VAT periods<\/b> ending March, June, September and December.<\/p><div class=\"tbl\"><table>\n<thead><tr><th>Date<\/th><th>Obligation<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>28 January<\/td><td>VAT return and payment for October–December<\/td><\/tr>\n<tr><td>31 March<\/td><td>CT registration deadline for natural persons who crossed AED 1m turnover in the previous year<\/td><\/tr>\n<tr><td>28 April<\/td><td>VAT return and payment for January–March<\/td><\/tr>\n<tr><td>30 June<\/td><td>Top-up Tax return (in-scope MNE groups, 18 months after the first in-scope year; 15 months later years) — e.g. 30 June 2027 for FY2025<\/td><\/tr>\n<tr><td>28 July<\/td><td>VAT return and payment for April–June<\/td><\/tr>\n<tr><td>31 July<\/td><td>First CT return only: file by here to cancel any late-registration penalty<\/td><\/tr>\n<tr><td>30 September<\/td><td>CT return and payment for the previous year; TP Disclosure Form with the return; natural persons’ CT return<\/td><\/tr>\n<tr><td>28 October<\/td><td>VAT return and payment for July–September<\/td><\/tr>\n<tr><td>Within 30 days after the CT return deadline<\/td><td>QFZPs relying on Designated Zone distribution: AUP report (from tax periods starting 1 Jan 2026)<\/td><\/tr>\n<tr><td>Before year end<\/td><td>Apply to form or change a Tax Group; review SBR revenue, QFZP de minimis, elections<\/td><\/tr>\n<tr><td>Ongoing<\/td><td>Tax invoices within 14 days; supplier verification; VDs within 20 business days of finding errors &gt; AED 10,000; e-invoicing go-live dates in 2027<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"}],"summary":"","review":[]},"appC":{"id":"appC","num":"C","kind":"appendix","title":"Glossary","short":"Glossary","objectives":[],"sections":[{"title":"Glossary","html":"<dl class=\"glossary\">\n<div class=\"gl\"><dt>Accredited Service Provider (ASP)<\/dt><dd>A provider accredited to transmit e-invoices on the Peppol network and report data to the FTA.<\/dd><\/div>\n<div class=\"gl\"><dt>Arm’s length principle<\/dt><dd>Pricing between related parties as independent parties would price the same transaction.<\/dd><\/div>\n<div class=\"gl\"><dt>Bare land<\/dt><dd>Land without completed or partly completed buildings or civil works; its supply is VAT-exempt.<\/dd><\/div>\n<div class=\"gl\"><dt>Capital Assets Scheme<\/dt><dd>VAT rules adjusting input tax over 5 or 10 years for assets costing AED 5m or more when their use changes.<\/dd><\/div>\n<div class=\"gl\"><dt>Composite supply<\/dt><dd>A supply with several elements treated as one, following the principal element.<\/dd><\/div>\n<div class=\"gl\"><dt>Connected Person<\/dt><dd>An owner, director or officer of a taxable person, or a related party of them; payments to them are deductible only at market value.<\/dd><\/div>\n<div class=\"gl\"><dt>Deemed supply<\/dt><dd>A transaction treated as a supply without consideration, e.g. gifts or private use of business assets.<\/dd><\/div>\n<div class=\"gl\"><dt>De minimis requirement<\/dt><dd>QFZP condition: non-qualifying revenue not above the lower of 5% of total revenue or AED 5m.<\/dd><\/div>\n<div class=\"gl\"><dt>Designated Zone<\/dt><dd>A fenced, customs-controlled free zone listed by Cabinet for VAT, treated as outside the UAE for certain goods.<\/dd><\/div>\n<div class=\"gl\"><dt>Directive<\/dt><dd>A binding FTA decision on how tax law applies to specific transactions (from 2026).<\/dd><\/div>\n<div class=\"gl\"><dt>EmaraTax<\/dt><dd>The FTA’s online platform for registration, returns, payments and requests.<\/dd><\/div>\n<div class=\"gl\"><dt>Exempt supply<\/dt><dd>A supply on which no VAT is charged and related input tax is not recoverable.<\/dd><\/div>\n<div class=\"gl\"><dt>Free Zone Person<\/dt><dd>A juridical person incorporated, established or registered in a UAE free zone.<\/dd><\/div>\n<div class=\"gl\"><dt>GIBAN<\/dt><dd>A unique bank account reference for paying tax to the FTA.<\/dd><\/div>\n<div class=\"gl\"><dt>Input tax<\/dt><dd>VAT paid on purchases and imports used for the business.<\/dd><\/div>\n<div class=\"gl\"><dt>Nexus<\/dt><dd>A connection that makes a non-resident taxable in the UAE, such as income from UAE immovable property.<\/dd><\/div>\n<div class=\"gl\"><dt>Output tax<\/dt><dd>VAT charged on taxable supplies.<\/dd><\/div>\n<div class=\"gl\"><dt>Participating Interest<\/dt><dd>A shareholding meeting the participation exemption conditions.<\/dd><\/div>\n<div class=\"gl\"><dt>Permanent Establishment<\/dt><dd>A fixed place of business or dependent agent of a non-resident in the UAE.<\/dd><\/div>\n<div class=\"gl\"><dt>Place of supply<\/dt><dd>The location where a supply is treated as made for VAT.<\/dd><\/div>\n<div class=\"gl\"><dt>Qualifying Free Zone Person (QFZP)<\/dt><dd>A Free Zone Person meeting all conditions for 0% CT on Qualifying Income.<\/dd><\/div>\n<div class=\"gl\"><dt>Qualifying Group<\/dt><dd>Two taxable persons with at least 75% common ownership (for asset transfer and loss transfer relief).<\/dd><\/div>\n<div class=\"gl\"><dt>Qualifying Public Benefit Entity<\/dt><dd>A listed charitable or public-interest entity exempt from CT; donations to it are deductible.<\/dd><\/div>\n<div class=\"gl\"><dt>Related Party<\/dt><dd>A person linked by family (to the 4th degree), 50% ownership or control, or other specified ties.<\/dd><\/div>\n<div class=\"gl\"><dt>Reverse charge<\/dt><dd>The recipient, not the supplier, accounts for VAT.<\/dd><\/div>\n<div class=\"gl\"><dt>Small Business Relief<\/dt><dd>Election for residents with revenue up to AED 3m to be treated as having no taxable income (to 2029).<\/dd><\/div>\n<div class=\"gl\"><dt>Tax Group<\/dt><dd>For VAT: related UAE persons under common control registered as one. For CT: a parent and 95%-owned subsidiaries treated as one taxable person.<\/dd><\/div>\n<div class=\"gl\"><dt>Tax Registration Number (TRN)<\/dt><dd>15-digit number identifying a registrant.<\/dd><\/div>\n<div class=\"gl\"><dt>Top-up Tax (DMTT)<\/dt><dd>A tax ensuring a 15% minimum effective rate for large MNE groups in the UAE.<\/dd><\/div>\n<div class=\"gl\"><dt>Transfer of a going concern<\/dt><dd>Sale of a business as a going concern to a taxable person; not a supply for VAT.<\/dd><\/div>\n<div class=\"gl\"><dt>Voluntary Disclosure<\/dt><dd>A form used to correct errors in returns or refund claims.<\/dd><\/div>\n<div class=\"gl\"><dt>Zero-rated supply<\/dt><dd>A taxable supply at 0%, with input tax recoverable.<\/dd><\/div>\n<\/dl>"}],"summary":"","review":[]},"appD":{"id":"appD","num":"D","kind":"appendix","title":"Practice Questions with Answers","short":"Practice Questions","objectives":[],"sections":[{"title":"Practice questions","html":"<p>The 30 practice questions of Appendix D are in <b>Practice &rarr; Final check<\/b>, with instant marking. The longer exercises are below.<\/p>"}],"summary":"","review":[]},"appE":{"id":"appE","num":"E","kind":"appendix","title":"Key Legislation List","short":"Legislation List","objectives":[],"sections":[{"title":"Key Legislation List","html":"<div class=\"tbl\"><table>\n<thead><tr><th>Instrument<\/th><th>Subject<\/th><th>Effective<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>FDL 8/2017<\/td><td>VAT Law<\/td><td>1 Jan 2018<\/td><\/tr>\n<tr><td>CD 52/2017<\/td><td>VAT Executive Regulation<\/td><td>1 Jan 2018<\/td><\/tr>\n<tr><td>CD 59/2017<\/td><td>Designated Zones<\/td><td>1 Jan 2018<\/td><\/tr>\n<tr><td>CD 100/2024<\/td><td>VAT Executive Regulation amendments (virtual assets, fund management, etc.)<\/td><td>15 Nov 2024<\/td><\/tr>\n<tr><td>CD 91/2023; CD 127/2024; CD 153/2025<\/td><td>Domestic reverse charge: electronics; precious metals and stones; scrap metal<\/td><td>30 Oct 2023; 2025; 14 Jan 2026<\/td><\/tr>\n<tr><td>FDL 16/2025<\/td><td>VAT Law amendments<\/td><td>1 Jan 2026<\/td><\/tr>\n<tr><td>CD 149/2026<\/td><td>VAT Executive Regulation amendments<\/td><td>1 Oct 2026 (apportionment: first tax year after 1 Oct 2027)<\/td><\/tr>\n<tr><td>FTA Decisions 13/2026 and 17/2026<\/td><td>Supplier verification; employee-related input tax<\/td><td>1 Oct 2026<\/td><\/tr>\n<tr><td>FTA Decision 11/2026<\/td><td>Tourist refund scheme<\/td><td>12 Jul 2026<\/td><\/tr>\n<tr><td>FDL 7/2017; CD 197/2025<\/td><td>Excise Tax; tiered sweetened-drink excise<\/td><td>1 Oct 2017; 1 Jan 2026<\/td><\/tr>\n<tr><td>FDL 47/2022 (as amended by FDL 60/2023, FDL 28/2025)<\/td><td>Corporate Tax Law<\/td><td>FYs from 1 Jun 2023<\/td><\/tr>\n<tr><td>CD 116/2022; CD 49/2023<\/td><td>AED 375,000 band; natural persons<\/td><td>2023<\/td><\/tr>\n<tr><td>CD 100/2023; MD 229/2025; MD 230/2025<\/td><td>Qualifying Income; Qualifying and Excluded Activities; price reporting agencies<\/td><td>From 1 Jun 2023 (MD 229 retroactive)<\/td><\/tr>\n<tr><td>MD 73/2023; MD 131/2026<\/td><td>Small Business Relief; extension to 2029<\/td><td>2023; 29 Jul 2026<\/td><\/tr>\n<tr><td>MD 97/2023<\/td><td>Transfer pricing documentation<\/td><td>2023<\/td><\/tr>\n<tr><td>MD 84/2025<\/td><td>Audited financial statements<\/td><td>Periods from 1 Jan 2025<\/td><\/tr>\n<tr><td>MD 301/2024<\/td><td>Tax Groups<\/td><td>2025<\/td><\/tr>\n<tr><td>CD 34/2025; CD 35/2025; CD 55/2025; CD 63/2025; MD 96/2025<\/td><td>Investment funds &amp; QLPs; non-resident nexus; exempt persons; unincorporated partnerships; REITs<\/td><td>2025<\/td><\/tr>\n<tr><td>FTA Decision 3/2024<\/td><td>CT registration timelines<\/td><td>1 Mar 2024<\/td><\/tr>\n<tr><td>FTA Decision 6/2026<\/td><td>QFZP Designated Zone distribution AUP report<\/td><td>Periods from 1 Jan 2026<\/td><\/tr>\n<tr><td>CD 142/2024; FTA Decision 12/2026; MD 96/2026; MD 133/2026<\/td><td>Top-up Tax; registration; OECD commentary; information return<\/td><td>FYs from 1 Jan 2025; 2026<\/td><\/tr>\n<tr><td>CD 215/2025; MD 24/2026<\/td><td>R&amp;D Tax Credit<\/td><td>Periods from 1 Jan 2026<\/td><\/tr>\n<tr><td>CD 75/2023 (as amended by CD 10/2024)<\/td><td>CT penalties<\/td><td>1 Aug 2023<\/td><\/tr>\n<tr><td>FDL 28/2022; FDL 17/2025<\/td><td>Tax Procedures Law; amendments<\/td><td>1 Mar 2023; 1 Jan 2026<\/td><\/tr>\n<tr><td>CD 74/2023; CD 17/2026<\/td><td>Tax Procedures Executive Regulation; amendments<\/td><td>2023; 1 Apr 2026<\/td><\/tr>\n<tr><td>CD 129/2025<\/td><td>Penalties (TPL, VAT, Excise)<\/td><td>14 Apr 2026<\/td><\/tr>\n<tr><td>MD 243/2025; MD 244/2025; MD 66/2026; MD 168/2026; MD 197/2026<\/td><td>E-invoicing system; timeline; ASP deadline extension; ASP accreditation; tax group exclusion and storage<\/td><td>2025–2026<\/td><\/tr>\n<tr><td>CD 106/2025<\/td><td>E-invoicing penalties<\/td><td>With the e-invoicing phases<\/td><\/tr>\n<tr><td>CD 85/2022<\/td><td>Tax residence of individuals and companies<\/td><td>1 Mar 2023<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"}],"summary":"","review":[]},"appF":{"id":"appF","num":"F","kind":"appendix","title":"Sources and Further Reading","short":"Sources","objectives":[],"sections":[{"title":"Sources and Further Reading","html":"<p><b>Official sources (start here):<\/b><\/p><ul class=\"srcs\">\n<li>Federal Tax Authority: legislation, guides, public clarifications, Directives, EmaraTax: https://tax.gov.ae<\/li>\n<li>Ministry of Finance: tax legislation and news: https://mof.gov.ae<\/li>\n<li>UAE Government portal, taxation pages: https://u.ae<\/li>\n<li>MoF: Ministerial Decision No. 66 of 2026 amending MD 244 of 2025 (e-invoicing timeline); MD 197 of 2026 (e-invoicing amendments); Cabinet Decision No. 149 of 2026 (VAT Executive Regulation); Cabinet Decision No. 106 of 2025 (e-invoicing penalties) — all published on mof.gov.ae.<\/li>\n<\/ul><p><b>Professional summaries consulted for the 2025–2026 changes<\/b> (useful for teaching, but always verify against the official texts):<\/p><ul class=\"srcs\">\n<li>Baker McKenzie: UAE VAT and Tax Procedures Law amendments (Dec 2025); MENA Quarterly Tax Update July–September 2026 (Oct 2026); VAT Executive Regulation amended (Sep 2026).<\/li>\n<li>KPMG: Federal Decree-Law No. 16 and 17 of 2025; Cabinet Decision 149 of 2026; FDL 28 of 2025; Top-up Tax registration requirements.<\/li>\n<li>PwC Middle East: legislative updates to tax procedures, VAT and excise (Dec 2025); revised administrative penalty framework (Nov 2025); Tax Procedures Executive Regulation amendments (Apr 2026); R&amp;D Tax Credit (Mar 2026); Cabinet Decision 149 of 2026 (Sep 2026).<\/li>\n<li>Deloitte Middle East: amendments to the UAE VAT Executive Regulation (2026); e-invoicing legislation (2025); Ministerial Decisions 229 and 230 of 2025.<\/li>\n<li>EY Tax News: UAE R&amp;D Tax Credit legislation (Mar 2026); UAE DMTT legislation (Feb 2025).<\/li>\n<li>Hadef &amp; Partners: Tax Procedures Law recent amendments (FDL 17/2025).<\/li>\n<li>Al Tamimi &amp; Company: comprehensive tax penalty reform effective 14 April 2026.<\/li>\n<li>Gulf News, Khaleej Times, WAM, The National: news reports on SBR extension, e-invoicing deadlines, sugar tax and the penalty waiver initiative.<\/li>\n<\/ul><div class=\"box warn\"><span class=\"lbl\">FINAL REMINDER<\/span>\n<p>Tax law in the UAE is changing quickly. Before relying on any figure in these notes, check the latest version of the law and FTA guidance. Encourage students to build the habit of always citing the instrument and its effective date.<\/p>\n<\/div>"}],"summary":"","review":[]}},"about":"<h2>About these notes<\/h2><p>These notes were prepared as a <mark>complete teaching text<\/mark> for a course on United Arab Emirates (UAE) <span class=\"term\">Value Added Tax (VAT)<\/span> and <span class=\"term\">Corporate Tax (CT)<\/span>. They are written for learners who are new to UAE taxation, for accountants moving to the UAE, and for anyone who wants a structured path from the basic ideas to the working knowledge needed to prepare returns, advise small and medium businesses, and keep up with change.<\/p><p>The law is stated as it stood on <span class=\"num\">6 November 2026<\/span>. UAE tax law changes often; during 2025 and 2026 alone there were amendments to the VAT Law, the Tax Procedures Law and its Executive Regulation, the VAT Executive Regulation, the penalty framework, the e-invoicing rules, the Free Zone rules, Small Business Relief and the Top-up Tax. Where a rule changed recently, it is flagged with a <span class=\"new\">NEW<\/span> tag or an <b>Update<\/b> box so that students know what is fresh and what was the earlier position.<\/p><div class=\"box warn\"><span class=\"lbl\">IMPORTANT DISCLAIMER<\/span>\n<p>These are <b>educational notes<\/b>, not legal or tax advice. They simplify the law so that it can be taught. Before acting on any point for a real business, read the current legislation and the Federal Tax Authority (FTA) guidance on <b>tax.gov.ae<\/b> and <b>mof.gov.ae<\/b>, or consult a registered tax agent. Penalties, thresholds and deadlines quoted here should be checked against the latest official texts.<\/p>\n<\/div><h2>How to use this book<\/h2><p>The book is in four parts. <b>Part I<\/b> explains the UAE, its tax system and how tax law is made and administered. <b>Part II<\/b> covers VAT from registration to returns and sector rules. <b>Part III<\/b> covers Corporate Tax, including the Free Zone regime, transfer pricing and the 15% Top-up Tax. <b>Part IV<\/b> covers the procedures that apply to all taxes (audits, refunds, disputes, penalties and e-invoicing) and ends with practical advice on starting a career in UAE tax. Appendices provide a one-page quick reference, a compliance calendar, a glossary, practice questions with answers, a legislation list and sources.<\/p><p>Each teaching chapter opens with <b>learning objectives<\/b> and closes with a <b>summary<\/b> and <b>review questions<\/b>; the case-study chapters (16 and 28) bring the rules together in full worked solutions. Teachers can use the review questions as homework and the worked examples as classroom exercises.<\/p><h3>Reading the highlights<\/h3><div class=\"legend-hl\">\n<span><mark>Yellow highlight<\/mark> = an important rule or phrase<\/span>\n<span><span class=\"num\">AED 375,000<\/span> = a number, rate, threshold or deadline to memorise<\/span>\n<span><span class=\"term\">Dark red bold<\/span> = a defined legal term<\/span>\n<span><span class=\"new\">NEW<\/span> = changed in 2025–2026<\/span>\n<\/div><h3>Boxes used in the text<\/h3><div class=\"grid3\">\n<div class=\"box key\"><span class=\"lbl\">KEY POINT<\/span><p>The idea you must remember.<\/p><\/div>\n<div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE<\/span><p>A calculation or case, step by step.<\/p><\/div>\n<div class=\"box exam\"><span class=\"lbl\">EXAM / CLASS TIP<\/span><p>Common mistakes and how to avoid them.<\/p><\/div>\n<div class=\"box warn\"><span class=\"lbl\">WATCH OUT<\/span><p>A trap that leads to penalties.<\/p><\/div>\n<div class=\"box upd\"><span class=\"lbl\">UPDATE 2025–26<\/span><p>A recent change in the law.<\/p><\/div>\n<div class=\"box law\"><span class=\"lbl\">LEGAL REFERENCE<\/span><p>Where the rule is found.<\/p><\/div>\n<\/div><h3>Suggested teaching plan (12 weeks)<\/h3><div class=\"tbl\"><table>\n<thead><tr><th>Week<\/th><th>Topics<\/th><th>Chapters<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">1<\/td><td>UAE tax landscape, legislation, FTA and EmaraTax<\/td><td>1–2<\/td><\/tr>\n<tr><td class=\"c\">2<\/td><td>VAT fundamentals and registration<\/td><td>3–4<\/td><\/tr>\n<tr><td class=\"c\">3<\/td><td>Supply, date of supply, place of supply<\/td><td>5–7<\/td><\/tr>\n<tr><td class=\"c\">4<\/td><td>Value, zero-rated and exempt supplies<\/td><td>8–10<\/td><\/tr>\n<tr><td class=\"c\">5<\/td><td>Reverse charge, imports and input tax<\/td><td>11–12<\/td><\/tr>\n<tr><td class=\"c\">6<\/td><td>Invoices, returns, refunds, sector rules, VAT cases<\/td><td>13–16<\/td><\/tr>\n<tr><td class=\"c\">7<\/td><td>CT introduction, taxable and exempt persons<\/td><td>17–19<\/td><\/tr>\n<tr><td class=\"c\">8<\/td><td>Free Zones, Small Business Relief, natural persons<\/td><td>20–21<\/td><\/tr>\n<tr><td class=\"c\">9<\/td><td>Taxable income, exempt income, losses and reliefs<\/td><td>22–23<\/td><\/tr>\n<tr><td class=\"c\">10<\/td><td>Tax groups, transfer pricing, Top-up Tax and credits<\/td><td>24–26<\/td><\/tr>\n<tr><td class=\"c\">11<\/td><td>CT compliance and CT cases<\/td><td>27–28<\/td><\/tr>\n<tr><td class=\"c\">12<\/td><td>Tax procedures, penalties, e-invoicing, accounting for taxes, career path, revision<\/td><td>29–33, Appendices<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>","mcq":{"1":{"id":1,"set":1,"ch":"ch2","lv":"L1","q":"Which body administers, collects and enforces federal taxes in the UAE?","o":["Ministry of Economy","Central Bank of the UAE","Each emirate’s municipality","Federal Tax Authority (FTA)"],"a":3,"x":"The FTA administers and enforces; the Ministry of Finance makes tax policy."},"2":{"id":2,"set":1,"ch":"ch1","lv":"L1","q":"UAE VAT was introduced on:","o":["1 October 2017","1 January 2018","1 June 2023","1 January 2025"],"a":1,"x":"VAT started on 1 January 2018 (Excise Tax started on 1 October 2017)."},"3":{"id":3,"set":1,"ch":"ch1","lv":"L1","q":"The main UAE Corporate Tax law is:","o":["Federal Decree-Law No. 8 of 2017","Federal Decree-Law No. 28 of 2022","Federal Decree-Law No. 47 of 2022","Federal Decree-Law No. 7 of 2017"],"a":2,"x":"FDL 47/2022 is the CT Law; 8/2017 is VAT; 28/2022 is Tax Procedures; 7/2017 is Excise."},"4":{"id":4,"set":1,"ch":"ch1","lv":"L1","q":"If the Arabic and English versions of a UAE tax law differ, which prevails?","o":["The English version","Whichever is more recent","The FTA decides case by case","The Arabic version"],"a":3,"x":"Arabic is the official language of legislation; English texts are translations."},"5":{"id":5,"set":1,"ch":"ch1","lv":"L1","q":"Which of these is NOT levied in the UAE?","o":["Personal income tax on salaries","VAT","Excise Tax","Corporate Tax"],"a":0,"x":"There is no personal income tax on employment income."},"6":{"id":6,"set":1,"ch":"ch2","lv":"L1","q":"Which instrument has the highest legal authority?","o":["FTA Public Clarification","Ministerial Decision","Cabinet Decision","Federal Decree-Law"],"a":3,"x":"Decree-Laws sit above Cabinet Decisions, Ministerial Decisions and FTA guidance."},"7":{"id":7,"set":1,"ch":"ch2","lv":"L1","q":"A UAE Tax Registration Number (TRN) has:","o":["10 digits","12 digits","15 digits","18 digits"],"a":2,"x":"The TRN is a 15-digit number."},"8":{"id":8,"set":1,"ch":"ch2","lv":"L2","q":"FTA “Directives” introduced in 2026 are:","o":["Non-binding guidance like guides","Binding only on the FTA","Binding only on government entities","Binding on both the FTA and taxpayers for the transactions they cover"],"a":3,"x":"FDL 17/2025 empowered the FTA to issue binding Directives; five VAT Directives were issued in 2026."},"9":{"id":9,"set":1,"ch":"ch2","lv":"L2","q":"Under Cabinet Decision 85/2022, an individual is a UAE tax resident (without any other condition) if present in the UAE for at least:","o":["365 days","183 days","120 days","90 days"],"a":1,"x":"183 days in a consecutive 12-month period. The 90-day test needs extra conditions."},"10":{"id":10,"set":1,"ch":"ch1","lv":"L2","q":"From 1 January 2026, the excise on a sweetened drink with 9 g of sugar per 100 ml is:","o":["50% of the retail price","AED 0.79 per litre","AED 1.09 per litre","100% of the excise price"],"a":2,"x":"High-sugar drinks (8 g or more per 100 ml) pay AED 1.09 per litre under the tiered model."},"11":{"id":11,"set":2,"ch":"ch3","lv":"L1","q":"VAT payable for a tax period equals:","o":["Output tax plus input tax","Output tax minus recoverable input tax","Total sales × 5%","Net profit × 5%"],"a":1,"x":"Registrants pay output tax less recoverable input tax."},"12":{"
