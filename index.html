special method can be used with FTA approval.<\/small><\/div><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 12.1<\/span>\n<p>A bank’s input tax for a quarter: directly taxable AED 300,000; directly exempt AED 450,000; residual AED 200,000.<\/p>\n<div class=\"tbl\"><table class=\"calc\"><tbody>\n<tr><td>Recovery % = 300,000 / (300,000 + 450,000)<\/td><td class=\"r\">40%<\/td><\/tr>\n<tr><td>Recoverable residual = 40% × 200,000<\/td><td class=\"r\">80,000<\/td><\/tr>\n<tr><td>Plus directly taxable input tax<\/td><td class=\"r\">300,000<\/td><\/tr>\n<tr class=\"tot\"><td>Total recoverable input tax<\/td><td class=\"r\">380,000<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Irrecoverable: AED 450,000 + AED 120,000 = AED 570,000, which becomes a cost.<\/p>\n<\/div><h3>New standard method (output based)<\/h3><div class=\"box upd\"><span class=\"lbl\">UPDATE 2025–26<\/span>\n<p><span class=\"new\">NEW<\/span> CD 149/2026 replaces the input-tax-based method with an <b>output-based<\/b> one from the <b>first tax year starting after 1 October 2027<\/b> (1 January 2028 for calendar-year businesses). The recovery percentage will be the value of <b>taxable supplies<\/b> divided by the value of <b>all supplies<\/b>, excluding supplies of capital assets of the business and receipts of reverse-charge goods and services. Real estate businesses must separate stock-in-trade from capital assets. <b>Government entities and charities<\/b> keep an input-tax-based method (new Article 55(19)).<\/p>\n<p>Example: taxable supplies AED 60m, exempt supplies AED 40m: recovery % = 60/100 = <b>60%<\/b> of residual input tax.<\/p>\n<\/div>"},{"title":"The Capital Assets Scheme","html":"<p>For expensive, long-life assets the initial recovery is <b>adjusted over time<\/b> if the use of the asset changes. A <span class=\"term\">capital asset<\/span> is a business asset costing <span class=\"num\">AED 5,000,000<\/span> or more (excluding VAT) with a useful life of at least <span class=\"num\">10 years<\/span> for buildings and <span class=\"num\">5 years<\/span> for other assets. The adjustment period is 10 years for buildings and 5 years for other assets.<\/p><div class=\"formula\">Annual adjustment = (Total input tax ÷ number of years) × (Initial recovery % − Recovery % this year)<\/div><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 12.2<\/span>\n<p>A company buys an office building for AED 20,000,000 + VAT AED 1,000,000 and uses it fully for taxable supplies, recovering AED 1,000,000. In year 3 it lets 40% of the floors to residential tenants (exempt), so taxable use falls to 60%.<\/p>\n<div class=\"tbl\"><table class=\"calc\"><tbody>\n<tr><td>Input tax per year: 1,000,000 / 10<\/td><td class=\"r\">100,000<\/td><\/tr>\n<tr><td>Change in use: 100% − 60%<\/td><td class=\"r\">40%<\/td><\/tr>\n<tr class=\"tot\"><td>Adjustment payable to the FTA for year 3<\/td><td class=\"r\">40,000<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>The same test is repeated each remaining year. <span class=\"new\">NEW<\/span> From 1 October 2026 the definition refers to a “business asset with a cost” of AED 5m or more, rather than a “single item of expenditure”.<\/p>\n<\/div>"},{"title":"Input tax before registration","html":"<p>A newly registered business can recover, in its first return, input tax on goods it still holds at registration and on capital assets bought before registration, provided they are used for taxable supplies after registration and the usual evidence exists. Input tax on services that were fully used up before registration is generally not recoverable.<\/p>"}],"summary":["Recover input tax used for taxable supplies with valid documents; pay within 6 months; use credits within 5 years.","Blocked: entertainment, cars available for private use, most free staff benefits, cash purchases above a future limit, evasion-linked supplies.","From 1 Oct 2026 verify suppliers and transactions before recovering input tax.","Partially exempt businesses apportion residual input tax; a new output-based method starts in 2027/28.","Capital Assets Scheme: AED 5m+; adjust over 10 years (buildings) or 5 years (others)."],"review":[{"q":"Which of these is recoverable for a fully taxable trading company? (a) dinner for a client; (b) staff medical insurance required by law; (c) a pick-up truck used only for deliveries; (d) a saloon car for the sales manager used at weekends.","a":null},{"q":"Compute the recovery percentage: input tax on taxable supplies AED 90,000; on exempt supplies AED 60,000; residual AED 50,000.","a":"60%; residual recoverable AED 30,000"},{"q":"What must a business do from 1 October 2026 before recovering input tax?","a":null},{"q":"A machine costing AED 6m + VAT is used 100% for taxable supplies in year 1 and 50% in year 2. What adjustment arises in year 2?","a":"300,000/5 × 50% = AED 30,000"}],"mcq":[60,61,62,63,64,65,66]},"ch13":{"id":"ch13","num":"13","kind":"chapter","title":"Tax Invoices, Credit Notes and Record Keeping","short":"Tax Invoices & Records","objectives":["Prepare a valid <b>full<\/b> and <b>simplified<\/b> tax invoice and a tax credit note.","Know the <b>14-day<\/b> issue rule, foreign currency rules and self-billing.","List the records a registrant must keep and for how long."],"sections":[{"title":"When must a tax invoice be issued?","html":"<p>A registrant must issue a <span class=\"term\">tax invoice<\/span> for every <b>taxable supply<\/b> (standard-rated or zero-rated), and for deemed supplies, within <span class=\"num\">14 days<\/span> of the date of supply. Tax invoices are not issued for exempt supplies. The original goes to the customer and the supplier keeps a copy. Failing to issue a tax invoice or tax credit note within the legal period carries a penalty of <span class=\"num\">AED 2,500<\/span> per detected case.<\/p>"},{"title":"Full tax invoice","html":"<figure class=\"fig\"><svg aria-label=\"Anatomy of a full UAE tax invoice\" role=\"img\" viewbox=\"0 0 660 500\" xmlns=\"http://www.w3.org/2000/svg\"><title>Anatomy of a full UAE tax invoice<\/title><defs><\/defs><rect fill=\"#ffffff\" height=\"480\" rx=\"10\" stroke=\"#16324f\" stroke-width=\"2.5\" width=\"420\" x=\"10\" y=\"10\"><\/rect><text fill=\"#16324f\" font-size=\"20\" font-weight=\"bold\" text-anchor=\"middle\" x=\"220.0\" y=\"47.0\"><tspan dy=\"0.0\" x=\"220.0\">TAX INVOICE<\/tspan><\/text><circle cx=\"330\" cy=\"40\" fill=\"#c8102e\" r=\"10\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"43.7\"><tspan dy=\"0.0\" x=\"330.0\">1<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"start\" x=\"28.0\" y=\"77.8\"><tspan dy=\"0.0\" x=\"28.0\">Desert Rose Trading LLC, Office 12, Al Quoz, Dubai, UAE<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"start\" x=\"28.0\" y=\"95.8\"><tspan dy=\"0.0\" x=\"28.0\">TRN: 100 2345 6789 0003<\/tspan><\/text><circle cx=\"410\" cy=\"82\" fill=\"#c8102e\" r=\"10\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"410.0\" y=\"85.7\"><tspan dy=\"0.0\" x=\"410.0\">2<\/tspan><\/text><line stroke=\"#d9dce1\" stroke-width=\"1.5\" x1=\"24\" x2=\"416\" y1=\"104\" y2=\"104\"><\/line><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"start\" x=\"28.0\" y=\"125.8\"><tspan dy=\"0.0\" x=\"28.0\">Bill to: Falcon Interiors FZ-LLC, Sharjah<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"start\" x=\"28.0\" y=\"143.8\"><tspan dy=\"0.0\" x=\"28.0\">Customer TRN: 100 9876 5432 1003<\/tspan><\/text><circle cx=\"410\" cy=\"130\" fill=\"#c8102e\" r=\"10\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"410.0\" y=\"133.7\"><tspan dy=\"0.0\" x=\"410.0\">3<\ t-size=\"11\" font-weight=\"bold\" text-anchor=\"end\" x=\"240.0\" y=\"373.9\"><tspan dy=\"0.0\" x=\"240.0\">TOTAL PAYABLE (AED)<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"end\" x=\"408.0\" y=\"373.9\"><tspan dy=\"0.0\" x=\"408.0\">9,576.00<\/tspan><\/text><circle cx=\"30\" cy=\"346\" fill=\"#c8102e\" r=\"10\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"30.0\" y=\"349.7\"><tspan dy=\"0.0\" x=\"30.0\">9<\/tspan><\/text><circle cx=\"30\" cy=\"370\" fill=\"#c8102e\" r=\"10\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"30.0\" y=\"373.7\"><tspan dy=\"0.0\" x=\"30.0\">10<\/tspan><\/text><rect fill=\"#fff4d1\" height=\"40\" rx=\"6\" stroke=\"#eda100\" width=\"392\" x=\"24\" y=\"392\"><\/rect><text fill=\"#1f2328\" font-size=\"10\" font-weight=\"normal\" text-anchor=\"middle\" x=\"220.0\" y=\"409.4\"><tspan dy=\"0.0\" x=\"220.0\">Where relevant: \"Recipient to account for VAT\" (reverse charge),<\/tspan><tspan dy=\"12.2\" x=\"220.0\">or the amount in AED if the invoice is in a foreign currency<\/tspan><\/text><circle cx=\"30\" cy=\"412\" fill=\"#c8102e\" r=\"10\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"30.0\" y=\"415.7\"><tspan dy=\"0.0\" x=\"30.0\">11<\/tspan><\/text><text fill=\"#5d6168\" font-size=\"9.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"220.0\" y=\"465.3\"><tspan dy=\"0.0\" x=\"220.0\">Payment due within 30 days | Bank: XYZ Bank, IBAN AE00 0000 0000 0000<\/tspan><\/text><circle cx=\"458\" cy=\"34\" fill=\"#c8102e\" r=\"10\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"458.0\" y=\"37.7\"><tspan dy=\"0.0\" x=\"458.0\">1<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"start\" x=\"474.0\" y=\"37.8\"><tspan dy=\"0.0\" x=\"474.0\">The words \"Tax Invoice\"<\/tspan><\/text><circle cx=\"458\" cy=\"77\" fill=\"#c8102e\" r=\"10\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"458.0\" y=\"80.7\"><tspan dy=\"0.0\" x=\"458.0\">2<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"start\" x=\"474.0\" y=\"80.8\"><tspan dy=\"0.0\" x=\"474.0\">Supplier name, address, TRN<\/tspan><\/text><circle cx=\"458\" cy=\"120\" fill=\"#c8102e\" r=\"10\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"458.0\" y=\"123.7\"><tspan dy=\"0.0\" x=\"458.0\">3<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"start\" x=\"474.0\" y=\"117.2\"><tspan dy=\"0.0\" x=\"474.0\">Recipient name, address, TRN<\/tspan><tspan dy=\"13.2\" x=\"474.0\">(if registered)<\/tspan><\/text><circle cx=\"458\" cy=\"163\" fill=\"#c8102e\" r=\"10\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"458.0\" y=\"166.7\"><tspan dy=\"0.0\" x=\"458.0\">4<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"start\" x=\"474.0\" y=\"166.8\"><tspan dy=\"0.0\" x=\"474.0\">Sequential invoice number<\/tspan><\/text><circle cx=\"458\" cy=\"206\" fill=\"#c8102e\" r=\"10\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"458.0\" y=\"209.7\"><tspan dy=\"0.0\" x=\"458.0\">5<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"start\" x=\"474.0\" y=\"209.8\"><tspan dy=\"0.0\" x=\"474.0\">Date of issue<\/tspan><\/text><circle cx=\"458\" cy=\"249\" fill=\"#c8102e\" r=\"10\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"458.0\" y=\"252.7\"><tspan dy=\"0.0\" x=\"458.0\">6<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"start\" x=\"474.0\" y=\"252.8\"><tspan dy=\"0.0\" x=\"474.0\">Date of supply (if different)<\/tspan><\/text><circle cx=\"458\" cy=\"292\" fill=\"#c8102e\" r=\"10\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"458.0\" y=\"295.7\"><tspan dy=\"0.0\" x=\"458.0\">7<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"start\" x=\"474.0\" y=\"289.2\"><tspan dy=\"0.0\" x=\"474.0\">Description, quantity, unit<\/tspan><tspan dy=\"13.2\" x=\"474.0\">price, rate, amount<\/tspan><\/text><circle cx=\"458\" cy=\"335\" fill=\"#c8102e\" r=\"10\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"458.0\" y=\"338.7\"><tspan dy=\"0.0\" x=\"458.0\">8<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"start\" x=\"474.0\" y=\"338.8\"><tspan dy=\"0.0\" x=\"474.0\">Any discount<\/tspan><\/text><circle cx=\"458\" cy=\"378\" fill=\"#c8102e\" r=\"10\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"458.0\" y=\"381.7\"><tspan dy=\"0.0\" x=\"458.0\">9<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"start\" x=\"474.0\" y=\"381.8\"><tspan dy=\"0.0\" x=\"474.0\">Total VAT in AED<\/tspan><\/text><circle cx=\"458\" cy=\"421\" fill=\"#c8102e\" r=\"10\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"458.0\" y=\"424.7\"><tspan dy=\"0.0\" x=\"458.0\">10<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"start\" x=\"474.0\" y=\"424.8\"><tspan dy=\"0.0\" x=\"474.0\">Gross amount payable<\/tspan><\/text><circle cx=\"458\" cy=\"464\" fill=\"#c8102e\" r=\"10\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"458.0\" y=\"467.7\"><tspan dy=\"0.0\" x=\"458.0\">11<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"start\" x=\"474.0\" y=\"461.2\"><tspan dy=\"0.0\" x=\"474.0\">Reverse-charge statement / AED<\/tspan><tspan dy=\"13.2\" x=\"474.0\">values<\/tspan><\/text><\/svg><figcaption><b>Figure 13.1<\/b> A full tax invoice and its eleven required elements.<\/figcaption><\/figure><p>A full tax invoice is required where the customer is VAT-registered and the value is more than <span class=\"num\">AED 10,000<\/span>. If the invoice is in a foreign currency, the VAT amount must be shown in <b>AED<\/b> together with the exchange rate used. Where the reverse charge applies, the invoice must state that the recipient is required to account for the tax.<\/p>"},{"title":"Simplified tax invoice","html":"<p>A <span class=\"term\">simplified tax invoice<\/span> may be issued where the recipient is <b>not registered<\/b>, or where the recipient is registered and the consideration does <b>not exceed AED 10,000<\/b>. It must show: the words “Tax Invoice”; the supplier’s name, address and TRN; the date of issue; a description of the goods or services; and the total consideration and VAT charged. A typical supermarket till receipt is a simplified tax invoice.<\/p><div class=\"box upd\"><span class=\"lbl\">UPDATE 2025–26<\/span>\n<p>Once e-invoicing becomes mandatory for a business (from 2027, see Chapter 31), the simplified tax invoice rules do <b>not<\/b> apply where the business must, or chooses to, issue its tax invoice as an electronic invoice. The FTA’s clarification VATP046 also warns that an electronic document (e.g. a PDF) is not automatically a valid tax invoice: it must contain all the required information, and where e-invoicing applies, keeping the e-invoice electronically becomes a <mark>condition for recovering input tax<\/mark>.<\/p>\n<\/div>"},{"title":"Tax credit notes","html":"<p>When the VAT on a supply goes down after the invoice was issued (price reduction, returned goods, cancellation, error), the supplier issues a <span class=\"term\">tax credit note<\/span> within 14 days. It must show: the words <b>“Tax Credit Note”<\/b> (a drafting error in the Executive Regulation that referred to the invoice was corrected from 1 October 2026), the supplier’s and recipient’s details and TRNs, the date and number, the original invoice reference, the value on the original invoice, the correct value, the difference, the VAT amount, and a brief reason. The supplier reduces its output tax and the customer reduces its input tax in the period the credit note is issued.<\/p><p>If the VAT goes <b>up<\/b> (e.g. undercharged), the supplier issues a new or supplementary tax invoice and accounts for the extra VAT.<\/p>"},{"title":"Self-billing and other arrangements","html":"<ul>\n<li><b>Self-billing:<\/b> the customer issues the tax invoice on behalf of the supplier (common with commission agents or suppliers of scrap). Both must be registered and agree in writing; the supplier must not issue its own invoice.<\/li>\n<li><b>Summary invoices:<\/b> a supplier may issue one invoice covering several supplies to the same customer within a calendar month.<\/li>\n<li><b>Electronic invoices:<\/b> allowed now if they contain the required data and integrity is assured; mandatory structured e-invoicing starts in 2027.<\/li>\n<\/ul>"},{"title":"Record keeping","html":"<div class=\"tbl\"><table>\n<thead><tr><th>Records to keep<\/th><th>Retention period<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Books of account, ledgers, tax invoices and credit notes issued and received, alternative documents, import and export documents, records of goods and services disposed of or used privately, adjustments and corrections<\/td><td>At least <span class=\"num\">5 years<\/span> after the end of the tax period they relate to.<\/td><\/tr>\n<tr><td>Records relating to <b>real estate<\/b><\/td><td><span class=\"num\">15 years<\/span>.<\/td><\/tr>\n<tr><td>Records for a period in which a <b>refund application<\/b> is pending (filed within the 5-year window)<\/td><td><span class=\"new\">NEW<\/span> Two extra years (Tax Procedures Executive Regulation, from 1 April 2026).<\/td><\/tr>\n<tr><td>Corporate Tax records<\/td><td><span class=\"num\">7 years<\/span> (Chapter 27).<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><p>Records can be kept electronically but must be available to the FTA on request, in Arabic if required. <span class=\"new\">NEW<\/span> FTA Decision No. 4 of 2026 sets rules for <b>electronic accounting records<\/b>: integrity, security (passwords and encryption), backups and access; outsourcing storage to a provider is allowed but the taxpayer stays responsible.<\/p><div class=\"box warn\"><span class=\"lbl\">WATCH OUT<\/span>\n<p>Failure to keep the required records carries a penalty of <span class=\"num\">AED 10,000<\/span>, rising to <span class=\"num\">AED 20,000<\/span> for a repeat within 24 months. Missing invoices also mean lost input tax.<\/p>\n<\/div>"}],"summary":["Issue tax invoices for taxable supplies within <b>14 days<\/b>; full invoice for registered customers over <b>AED 10,000<\/b>, otherwise simplified invoices are allowed.","Use tax credit notes for reductions; they must say “Tax Credit Note”.","Keep VAT records 5 years (real estate 15; CT 7); electronic records must meet FTA rules."],"review":[{"q":"List eight items that must appear on a full tax invoice.","a":null},{"q":"A café sells coffee to walk-in customers. What invoice must it give?","a":null},{"q":"Goods invoiced on 2 March are returned on 20 March. What document is issued and by when?","a":null},{"q":"How long must a property developer keep its records?","a":null}],"mcq":[67,68,69,70,71]},"ch14":{"id":"ch14","num":"14","kind":"chapter","title":"VAT Returns, Payments, Refunds and Corrections","short":"VAT Returns, Payments & Refunds","objectives":["Complete the <b>VAT201 return<\/b> box by box.","Meet the 28-day filing and payment deadline.","Request refunds and use the special refund schemes for tourists, UAE nationals and foreign businesses.","Correct errors under the 2026 rules on returns and <b>voluntary disclosures<\/b>."],"sections":[{"title":"Tax periods and deadlines","html":"<p>The standard tax period is a <b>calendar quarter<\/b>, with quarters staggered by the FTA (some businesses have periods ending March/June/September/December, others February/May/August/November, and so on). Businesses with annual turnover of <span class=\"num\">AED 150 million<\/span> or more are generally assigned <b>monthly<\/b> periods. The return must be filed, and the tax paid, <mark>no later than the 28th day after the end of the tax period<\/mark>.<\/p><figure class=\"fig\"><svg aria-label=\"Quarterly VAT return cycle\" role=\"img\" viewbox=\"0 0 660 220\" xmlns=\"http://www.w3.org/2000/svg\"><title>Quarterly VAT return cycle<\/title><defs><\/defs><line stroke=\"#16324f\" stroke-linecap=\"round\" stroke-width=\"4\" x1=\"20\" x2=\"640\" y1=\"100\" y2=\"100\"><\/line><circle cx=\"40\" cy=\"100\" fill=\"#e6f0fc\" r=\"13\" stroke=\"#2a78d6\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"40.0\" y=\"76.5\"><tspan dy=\"0.0\" x=\"40.0\">1 Jan<\/tspan><\/text><g><rect fill=\"#e6f0fc\" height=\"56\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"140\" x=\"10\" y=\"124\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"80.0\" y=\"155.8\"><tspan dy=\"0.0\" x=\"80.0\">Tax period starts<\/tspan><\/text><\/g><circle cx=\"250\" cy=\"100\" fill=\"#e6f0fc\" r=\"13\" stroke=\"#2a78d6\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"250.0\" y=\"76.5\"><tspan dy=\"0.0\" x=\"250.0\">31 Mar<\/tspan><\/text><g><rect fill=\"#e6f0fc\" height=\"56\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"140\" x=\"180\" y=\"124\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"250.0\" y=\"155.8\"><tspan dy=\"0.0\" x=\"250.0\">Tax period ends<\/tspan><\/text><\/g><circle cx=\"430\" cy=\"100\" fill=\"#c8102e\" r=\"13\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"430.0\" y=\"76.5\"><tspan dy=\"0.0\" x=\"430.0\">28 Apr<\/tspan><\/text><g><rect fill=\"#c8102e\" height=\"56\" rx=\"10\" stroke=\"#c8102e\" stroke-width=\"2\" width=\"140\" x=\"360\" y=\"124\"><\/rect><text fill=\"#ffffff\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"430.0\" y=\"149.1\"><tspan dy=\"0.0\" x=\"430.0\">Return filed AND VAT<\/tspan><tspan dy=\"13.4\" x=\"430.0\">paid by this date<\/tspan><\/text><\/g><circle cx=\"600\" cy=\"100\" fill=\"#e3f3e3\" r=\"13\" stroke=\"#008300\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"600.0\" y=\"76.5\"><tspan dy=\"0.0\" x=\"600.0\">After<\/tspan><\/text><g><rect fill=\"#e3f3e3\" height=\"56\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"140\" x=\"530\" y=\"124\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"600.0\" y=\"142.4\"><tspan dy=\"0.0\" x=\"600.0\">Refund claim (if<\/tspan><tspan dy=\"13.4\" x=\"600.0\">credit) or carry<\/tspan><tspan dy=\"13.4\" x=\"600.0\">forward<\/tspan><\/text><\/g><rect fill=\"#fde4e4\" height=\"30\" rx=\"8\" stroke=\"#e34948\" stroke-width=\"2\" width=\"180\" x=\"250\" y=\"18\"><\/rect><text fill=\"#c8102e\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"340.0\" y=\"37.0\"><tspan dy=\"0.0\" x=\"340.0\">28 days to file and pay<\/tspan><\/text><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"208.8\"><tspan dy=\"0.0\" x=\"330.0\">Monthly periods follow the same rule: due by the 28th day after the month ends.<\/tspan><\/text><\/svg><figcaption><b>Figure 14.1<\/b> The quarterly return cycle.<\/figcaption><\/figure>"},{"title":"The VAT201 return, box by box","html":"<div class=\"tbl\"><table>\n<thead><tr><th>Box<\/th><th>Title<\/th><th>What goes in<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"c\">1a–1g<\/td><td>Standard-rated supplies by emirate<\/td><td>Net value and output VAT of 5% sales, split by the emirate of the supplier’s establishment (Abu Dhabi, Dubai, Sharjah, Ajman, Umm Al Quwain, Ras Al Khaimah, Fujairah). Adjustments such as credit notes and bad debts reduce these figures.<\/td><\/tr>\n<tr><td class=\"c\">2<\/td><td>Tax refunds provided to tourists<\/td><td>For retailers in the tourist refund scheme: VAT refunded to tourists (negative).<\/td><\/tr>\n<tr><td class=\"c\">3<\/td><td>Supplies subject to reverse charge<\/td><td>Value and VAT of imported services and domestic reverse-charge purchases.<\/td><\/tr>\n<tr><td class=\"c\">4<\/td><td>Zero-rated supplies<\/td><td>Value only (exports, international transport, etc.).<\/td><\/tr>\n<tr><td class=\"c\">5<\/td><td>Exempt supplies<\/td><td>Value only.<\/td><\/tr>\n<tr><td class=\"c\">6<\/td><td>Goods imported into the UAE<\/td><td>Value and VAT of imports declared through customs (for registrants).<\/td><\/tr>\n<tr><td class=\"c\">7<\/td><td>Adjustments to imports<\/td><td>Corrections to Box 6 (e.g. where customs data is wrong or goods imported for someone else).<\/td><\/tr>\n<tr><td class=\"c\">8<\/td><td>Totals<\/td><td>Sum of the output side.<\/td><\/tr>\n<tr><td class=\"c\">9<\/td><td>Standard-rated expenses<\/td><td>Value and <b>recoverable<\/b> input VAT on local purchases (exclude blocked items).<\/td><\/tr>\n<tr><td class=\"c\">10<\/td><td>Supplies subject to reverse charge<\/td><td>Recoverable input VAT on Box 3 and Box 6 amounts.<\/td><\/tr>\n<tr><td class=\"c\">11<\/td><td>Totals<\/td><td>Sum of the input side.<\/td><\/tr>\n<tr><td class=\"c\">12–14<\/td><td>Net position<\/td><td>Total due tax, total recoverable tax, and payable tax (or refundable credit).<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 14.1: A complete return<\/span>\n<p>Falcon Trading LLC (Dubai), quarter July–September 2026: standard-rated sales in Dubai AED 1,200,000 and through its Abu Dhabi branch AED 300,000; exports AED 500,000; consultancy bought from a UK firm AED 100,000; goods imported AED 400,000; local standard-rated purchases AED 900,000 including AED 20,000 of client entertainment.<\/p>\n<div class=\"tbl\"><table class=\"calc\">\n<thead><tr><th>Box<\/th><th class=\"r\">Amount (AED)<\/th><th class=\"r\">VAT (AED)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>1a Abu Dhabi<\/td><td class=\"r\">300,000<\/td><td class=\"r\">15,000<\/td><\/tr>\n<tr><td>1b Dubai<\/td><td class=\"r\">1,200,000<\/td><td class=\"r\">60,000<\/td><\/tr>\n<tr><td>3 Reverse charge (UK consultancy)<\/td><td class=\"r\">100,000<\/td><td class=\"r\">5,000<\/td><\/tr>\n<tr><td>4 Zero-rated (exports)<\/td><td class=\"r\">500,000<\/td><td class=\"r\">–<\/td><\/tr>\n<tr><td>6 Imports<\/td><td class=\"r\">400,000<\/td><td class=\"r\">20,000<\/td><\/tr>\n<tr class=\"sub\"><td>8 Total output side<\/td><td class=\"r\">2,500,000<\/td><td class=\"r\">100,000<\/td><\/tr>\n<tr><td>9 Standard-rated expenses (900,000 less 20,000 entertainment)<\/td><td class=\"r\">880,000<\/td><td class=\"r\">44,000<\/td><\/tr>\n<tr><td>10 Reverse charge recoverable (Box 3 + Box 6)<\/td><td class=\"r\">500,000<\/td><td class=\"r\">25,000<\/td><\/tr>\n<tr class=\"sub\"><td>11 Total input side<\/td><td class=\"r\">1,380,000<\/td><td class=\"r\">69,000<\/td><\/tr>\n<tr><td>12 Total value of due tax<\/td><td><\/td><td class=\"r\">100,000<\/td><\/tr>\n<tr><td>13 Total value of recoverable tax<\/td><td><\/td><td class=\"r\">69,000<\/td><\/tr>\n<tr class=\"tot\"><td>14 Payable tax (due by 28 October 2026)<\/td><td><\/td><td class=\"r\">31,000<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>The VAT of AED 1,000 on entertainment is blocked and becomes a cost.<\/p>\n<\/div>"},{"title":"Paying VAT","html":"<p>Tax is paid through EmaraTax by card or e-Dirham, or by bank transfer to the taxpayer’s unique <b>GIBAN<\/b>. The money must <b>reach<\/b> the FTA by the deadline. Late payment attracts a penalty of <span class=\"num\">14% per year<\/span>, calculated monthly on the unpaid amount, under the penalty framework in force from 14 April 2026 (Chapter 30).<\/p>"},{"title":"Refunds of excess input tax","html":"<p>When recoverable tax exceeds due tax, the registrant can <b>carry the credit forward<\/b> or <b>apply for a refund<\/b> through EmaraTax. From 1 April 2026 the Tax Procedures Executive Regulation requires the FTA to decide within <span class=\"num\">20 business days<\/span> (it may extend this with notice) and to start paying within <span class=\"num\">5 business days<\/span> of approving. The FTA can defer a refund until all outstanding returns are filed.<\/p><div class=\"box upd\"><span class=\"lbl\">UPDATE 2025–26: THE FIVE-YEAR LIMIT<\/span>\n<p><span class=\"new\">NEW<\/span> From 1 January 2026 a refund or offset of a credit balance must be requested within <span class=\"num\">5 years<\/span> from the end of the tax period in which the credit arose. FTA clarification VATP046 confirms the clock runs from the period in which the excess <b>originated<\/b>, not the last period in which it was carried forward. Transitional rule: credits whose 5-year period had expired, or would expire within one year after 1 January 2026, could still be claimed until <b>31 December 2026<\/b>. Unclaimed credits are lost.<\/p>\n<\/div>"},{"title":"Special refund schemes","html":"<div class=\"tbl\"><table>\n<thead><tr><th>Scheme<\/th><th>Main rules<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Tourists<\/b><\/td><td>Run digitally by Planet for the FTA. Tourists aged 18+ who are not UAE residents buy from participating retailers, spend at least <span class=\"num\">AED 250<\/span> per invoice, and export the goods within <span class=\"num\">90 days<\/span>. The refund is <b>87%<\/b> of the VAT less a fixed fee per claim, cut to <span class=\"num\">AED 3.60<\/span> by FTA Decision No. 11 of 2026 (from 12 July 2026). Cash refunds are capped at AED 35,000 per tourist per 24 hours. Services and consumed goods are excluded.<\/td><\/tr>\n<tr><td><b>UAE nationals building a new residence<\/b><\/td><td>UAE nationals can reclaim VAT on qualifying contractor services and building materials used to build a new home for their own family’s use (the list of eligible costs was widened from 1 January 2026). Claims are made on EmaraTax or the <b>Maskan<\/b> app within <span class=\"num\">12 months<\/span> of completion (the earlier of occupation and the completion certificate); retention payments can be claimed separately within 6 months of payment. See the FTA guide VATGRH1 (updated 2026).<\/td><\/tr>\n<tr><td><b>Foreign businesses<\/b><\/td><td>Businesses established in countries that offer reciprocal treatment, not registered and not making supplies in the UAE, can reclaim VAT on UAE costs (e.g. exhibitions, business trips). The claim covers a calendar year, has a minimum of AED 2,000, and is filed in the following year by the FTA’s annual deadline.<\/td><\/tr>\n<tr><td><b>Diplomats, international organisations, foreign governments<\/b><\/td><td>Refund of VAT on qualifying purchases, subject to reciprocity and FTA conditions.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"},{"title":"Correcting errors","html":"<p>From 2026 the procedure depends on the size of the error in tax terms:<\/p><div class=\"tbl\"><table>\n<thead><tr><th>Error<\/th><th>What to do<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Tax underpaid (or refund overstated) by <b>more than AED 10,000<\/b><\/td><td>File a <span class=\"term\">Voluntary Disclosure<\/span> on EmaraTax within <span class=\"num\">20 business days<\/span> of discovering the error.<\/td><\/tr>\n<tr><td>Error of <b>AED 10,000 or less<\/b><\/td><td>Correct it in the next tax return not yet due (or the return for the period in which it is discovered, if earlier). If no upcoming return can carry it, file a Voluntary Disclosure within 20 business days.<\/td><\/tr>\n<tr><td>Error in your favour (tax overpaid)<\/td><td>Correct through the return or a Voluntary Disclosure; refund rights are subject to the 5-year limit.<\/td><\/tr>\n<tr><td>Error with no tax effect (e.g. wrong box or wrong emirate)<\/td><td>Correct as required by the FTA; a Voluntary Disclosure may still be needed in cases the FTA specifies.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><p>Penalties on voluntary disclosures are now time-based: <span class=\"num\">1% per month<\/span> on the tax difference until the disclosure is filed, plus a fixed <span class=\"num\">15%<\/span> if it is filed after the FTA has notified a tax audit (Chapter 30).<\/p>"}],"summary":["Quarterly (or monthly for AED 150m+) returns; file and pay by the <b>28th day<\/b> after the period.","VAT201: Boxes 1–8 output side, 9–11 input side, 12–14 net.","Refunds: FTA decides in 20 business days; credits must be used within <b>5 years<\/b>.","Errors above AED 10,000: Voluntary Disclosure within 20 business days; smaller ones in the next return."],"review":[{"q":"A company’s quarter ends 31 May 2026. When must the return be filed and paid?","a":"28 June 2026"},{"q":"In which boxes are (a) imported services, (b) zero-rated exports, (c) local purchases reported?","a":null},{"q":"A business discovers it under-declared VAT of AED 25,000 two years ago. What must it do?","a":null},{"q":"A tourist buys a watch for AED 10,500 including VAT. Estimate the refund.","a":"VAT 500; 87% = 435; less 3.60 = AED 431.40"}],"mcq":[72,73,74,75,76,77,78]},"ch15":{"id":"ch15","num":"15","kind":"chapter","title":"Sector Focus: Real Estate, Finance, Health, Education and More","short":"VAT Sector Focus","objectives":["Apply VAT rules to the main UAE sectors in one place.","Handle mixed real estate, financial services and insurance.","Recognise the special positions of government bodies, charities and non-resident digital suppliers."],"sections":[{"title":"Real estate","html":"<figure class=\"fig\"><svg aria-label=\"VAT treatment of real estate\" role=\"img\" viewbox=\"0 0 660 300\" xmlns=\"http://www.w3.org/2000/svg\"><title>VAT treatment of real estate<\/title><defs><\/defs><g><rect fill=\"#e3f3e3\" height=\"132\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"204\" x=\"10\" y=\"10\"><\/rect><path d=\"M10,40 V20 Q10,10 20,10 H204 Q214,10 214,20 V40 Z\" fill=\"#008300\"><\/path><text fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"112.0\" y=\"29.2\"><tspan dy=\"0.0\" x=\"112.0\">Residential: FIRST supply<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"112.0\" y=\"88.0\"><tspan dy=\"0.0\" x=\"112.0\">Sale or lease within 3 years<\/tspan><tspan dy=\"14.0\" x=\"112.0\">of completion: ZERO-RATED (0%)<\/tspan><\/text><\/g><g><rect fill=\"#fdeadf\" height=\"132\" rx=\"10\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"204\" x=\"228\" y=\"10\"><\/rect><path d=\"M228,40 V20 Q228,10 238,10 H422 Q432,10 432,20 V40 Z\" fill=\"#eb6834\"><\/path><text fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"29.2\"><tspan dy=\"0.0\" x=\"330.0\">Residential: later supplies<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"88.0\"><tspan dy=\"0.0\" x=\"330.0\">Resale or lease after the<\/tspan><tspan dy=\"14.0\" x=\"330.0\">first supply: EXEMPT<\/tspan><\/text><\/g><g><rect fill=\"#fdeadf\" height=\"132\" rx=\"10\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"204\" x=\"446\" y=\"10\"><\/rect><path d=\"M446,40 V20 Q446,10 456,10 H640 Q650,10 650,20 V40 Z\" fill=\"#eb6834\"><\/path><text fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"548.0\" y=\"29.2\"><tspan dy=\"0.0\" x=\"548.0\">Bare land<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"548.0\" y=\"88.0\"><tspan dy=\"0.0\" x=\"548.0\">Land without completed or<\/tspan><tspan dy=\"14.0\" x=\"548.0\">partly built buildings: EXEMPT<\/tspan><\/text><\/g><g><rect fill=\"#e6f0fc\" height=\"132\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"204\" x=\"10\" y=\"156\"><\/rect><path d=\"M10,186 V166 Q10,156 20,156 H204 Q214,156 214,166 V186 Z\" fill=\"#2a78d6\"><\/path><text fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"112.0\" y=\"175.2\"><tspan dy=\"0.0\" x=\"112.0\">Commercial property<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"112.0\" y=\"234.0\"><tspan dy=\"0.0\" x=\"112.0\">Offices, shops, warehouses<\/tspan><tspan dy=\"14.0\" x=\"112.0\">(sale or lease): STANDARD 5%<\/tspan><\/text><\/g><g><rect fill=\"#e6f0fc\" height=\"132\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"204\" x=\"228\" y=\"156\"><\/rect><path d=\"M228,186 V166 Q228,156 238,156 H422 Q432,156 432,166 V186 Z\" fill=\"#2a78d6\"><\/path><text fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"175.2\"><tspan dy=\"0.0\" x=\"330.0\">Hotels &amp; serviced apartments<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"234.0\"><tspan dy=\"0.0\" x=\"330.0\">Hotel-type accommodation:<\/tspan><tspan dy=\"14.0\" x=\"330.0\">STANDARD 5%<\/tspan><\/text><\/g><g><rect fill=\"#e3f3e3\" height=\"132\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"204\" x=\"446\" y=\"156\"><\/rect><path d=\"M446,186 V166 Q446,156 456,156 H640 Q650,156 650,166 V186 Z\" fill=\"#008300\"><\/path><text fill=\"#fff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"548.0\" y=\"167.9\"><tspan dy=\"0.0\" x=\"548.0\">Charity buildings &amp;<\/tspan><tspan dy=\"14.6\" x=\"548.0\">conversions<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"548.0\" y=\"227.0\"><tspan dy=\"0.0\" x=\"548.0\">First supply of charitable<\/tspan><tspan dy=\"14.0\" x=\"548.0\">buildings / converted<\/tspan><tspan dy=\"14.0\" x=\"548.0\">residential: 0%<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 15.1<\/b> VAT treatment of real estate in the UAE.<\/figcaption><\/figure><p>A <span class=\"term\">residential building<\/span> is a building intended and designed for people to live in as their principal place of residence (houses, apartments, staff accommodation, student dormitories). It <b>excludes<\/b> hotels, motels, bed-and-breakfasts, serviced apartments, hospitals, prisons and similar. Commercial property is anything that is not residential.<\/p><div class=\"tbl\"><table>\n<thead><tr><th>Transaction<\/th><th>Treatment<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Developer sells a new villa to its first owner within 3 years of completion<\/td><td>Zero-rated (developer recovers construction VAT).<\/td><\/tr>\n<tr><td>Owner resells the villa, or rents it to a family<\/td><td>Exempt.<\/td><\/tr>\n<tr><td>Sale or lease of an office, shop, warehouse or hotel<\/td><td>Standard-rated 5%.<\/td><\/tr>\n<tr><td>Sale of bare land<\/td><td>Exempt (land with infrastructure or partly built works is not bare land: 5%).<\/td><\/tr>\n<tr><td>Mixed-use building (shops below, flats above)<\/td><td>Split the price on a fair basis; apportion input tax.<\/td><\/tr>\n<tr><td>Brokerage commission, property management, valuation, maintenance<\/td><td>Standard-rated 5% (place of supply: where the property is).<\/td><\/tr>\n<tr><td>Land department registration fees<\/td><td>Government fees: outside the scope of VAT.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><div class=\"box key\"><span class=\"lbl\">KEY POINT<\/span>\n<p>Real estate records must be kept for <span class=\"num\">15 years<\/span>. From the first tax year after 1 October 2027, real estate businesses applying the new apportionment method must separate supplies of <b>stock-in-trade<\/b> (counted in the ratio) from supplies of <b>capital assets<\/b> (excluded).<\/p>\n<\/div>"},{"title":"Financial services and insurance","html":"<ul>\n<li><b>Exempt<\/b>: interest and Islamic profit elements, issue and transfer of shares and bonds, operation of accounts, life insurance and life reinsurance, investment fund management (from 15 Nov 2024), transfer and conversion of virtual assets.<\/li>\n<li><b>Standard-rated<\/b>: explicit fees and commissions, general insurance (motor, property, medical, travel), advisory and brokerage services.<\/li>\n<li><b>Zero-rated<\/b>: financial services supplied to customers outside the UAE that would otherwise be exempt or standard-rated, provided the export of services conditions are met.<\/li>\n<\/ul><p>Banks and insurers are partially exempt and depend heavily on apportionment; many use a special method agreed with the FTA.<\/p>"},{"title":"Healthcare and education","html":"<p>Preventive and basic healthcare is zero-rated; elective cosmetic treatments are standard-rated; listed medical products are zero-rated. Tuition fees at licensed nurseries, schools and government-funded universities are zero-rated; private university fees and many related charges are standard-rated (see the FTA’s 2026 Education Sector guide). Health <b>insurance<\/b> premiums are standard-rated as general insurance.<\/p>"},{"title":"Hospitality, retail and tourism","html":"<ul>\n<li>Hotel stays, restaurant meals and catering: 5%. A restaurant service charge is part of the consideration and is taxed.<\/li>\n<li>Government tourism fees collected on hotel bills (e.g. the Tourism Dirham) are outside the scope of VAT.<\/li>\n<li>Retailers can join the <b>tourist refund scheme<\/b> and report tourist refunds in Box 2.<\/li>\n<li>Loyalty points and vouchers need careful analysis of when value is paid and redeemed.<\/li>\n<\/ul>"},{"title":"Transport and logistics","html":"<p>International passenger and freight transport is zero-rated, as are related services such as handling at ports and airports. Domestic freight is standard-rated. Local passenger transport (buses, taxis, metro) is exempt. Supplies of aircraft and ships for commercial use and their repair are zero-rated.<\/p>"},{"title":"Gold, jewellery and electronics","html":"<p>Investment-grade gold, silver and platinum (99% purity or more): zero-rated. Jewellery and gold sold to consumers: 5%. Supplies of precious metals and stones, and of phones, computers and tablets, between registrants for resale: <b>domestic reverse charge<\/b>.<\/p>"},{"title":"Digital services and e-commerce","html":"<p>Non-resident suppliers of electronic services to UAE consumers (apps, streaming, gaming, online courses) must register with <b>no threshold<\/b> and charge 5%. Online retailers selling goods located in the UAE charge VAT like any shop; goods sent from abroad to consumers suffer import VAT at the border.<\/p>"},{"title":"Government entities and charities","html":"<p>Government bodies acting in a sovereign capacity and not in competition with the private sector are generally outside VAT. Certain bodies listed as <span class=\"term\">Designated Government Bodies<\/span> are treated as not conducting business for specified non-competitive activities. <span class=\"term\">Designated charities<\/span> can recover input tax on their activities. A higher deemed-supply threshold (AED 250,000 of output tax) applies to qualifying supplies between government entities or charities, and from the 2027/28 tax year they keep an input-tax-based apportionment method.<\/p>"}],"summary":["Residential: first supply 0%, then exempt; commercial and hotels 5%; bare land exempt.","Financial: margin-based exempt, fee-based 5%; life insurance exempt, general insurance 5%.","Health and education: core services 0%, extras often 5%.","Digital services by non-residents to consumers: register with no threshold."],"review":[{"q":"Classify: (a) rent of a warehouse; (b) third lease of a townhouse; (c) sale of a serviced apartment; (d) brokerage on selling a villa.","a":null},{"q":"Why do banks often use a special apportionment method?","a":null},{"q":"A hotel bill shows room AED 1,000, service charge AED 100, Tourism Dirham AED 15. Calculate the VAT.","a":"5% × 1,100 = AED 55"}],"mcq":[54]},"ch16":{"id":"ch16","num":"16","kind":"chapter","title":"VAT Case Studies and Worked Solutions","short":"VAT Case Studies","objectives":["Combine the rules from Chapters 3–15 in realistic cases.","Practise preparing a VAT return from raw business data."],"sections":[{"title":"Case A: A design start-up","html":"<p><b>PixelCraft LLC<\/b> is a design studio in Dubai (mainland). It registered voluntarily for VAT from 1 January 2026 because its set-up costs exceeded AED 187,500. Data for its first quarter (January–March 2026), all amounts excluding VAT:<\/p><ul>\n<li>Design services to UAE companies: AED 60,000.<\/li>\n<li>Design services to companies in the UK and Singapore with no UAE presence: AED 90,000.<\/li>\n<li>Design software subscription from a US company: AED 20,000.<\/li>\n<li>Laptops bought locally: AED 30,000 + VAT; office rent: AED 40,000 + VAT.<\/li>\n<li>Lunch with a prospective client: AED 2,000 + VAT.<\/li>\n<\/ul><div class=\"box eg\"><span class=\"lbl\">SOLUTION<\/span>\n<div class=\"tbl\"><table class=\"calc\">\n<thead><tr><th>Item<\/th><th class=\"r\">Box<\/th><th class=\"r\">VAT (AED)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Local design services 60,000 × 5%<\/td><td class=\"r\">1b<\/td><td class=\"r\">3,000<\/td><\/tr>\n<tr><td>Exported services 90,000 (zero-rated)<\/td><td class=\"r\">4<\/td><td class=\"r\">0<\/td><\/tr>\n<tr><td>US software: reverse charge 20,000 × 5%<\/td><td class=\"r\">3<\/td><td class=\"r\">1,000<\/td><\/tr>\n<tr class=\"sub\"><td>Total output tax (Box 12)<\/td><td><\/td><td class=\"r\">4,000<\/td><\/tr>\n<tr><td>Laptops 30,000 × 5%<\/td><td class=\"r\">9<\/td><td class=\"r\">1,500<\/td><\/tr>\n<tr><td>Office rent 40,000 × 5%<\/td><td class=\"r\">9<\/td><td class=\"r\">2,000<\/td><\/tr>\n<tr><td>Reverse charge recoverable<\/td><td class=\"r\">10<\/td><td class=\"r\">1,000<\/td><\/tr>\n<tr><td>Client lunch: entertainment, blocked<\/td><td class=\"r\">–<\/td><td class=\"r\">0<\/td><\/tr>\n<tr class=\"sub\"><td>Total recoverable tax (Box 13)<\/td><td><\/td><td class=\"r\">4,500<\/td><\/tr>\n<tr class=\"tot\"><td>Box 14: refundable credit<\/td><td><\/td><td class=\"r\">(500)<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>PixelCraft can carry forward or reclaim AED 500. It must keep evidence that the UK and Singapore clients are not resident and not in the UAE when the services are performed, and it must verify its local suppliers (FTA Decision 13/2026).<\/p>\n<\/div>"},{"title":"Case B: A mixed-use developer","html":"<p><b>Marina Heights Development LLC<\/b> completes a building in Ras Al Khaimah in March 2026. In the quarter April–June 2026 it sells 20 apartments to first owners at AED 1,000,000 each and 5 ground-floor shops at AED 2,000,000 each. VAT on construction costs received in the quarter: directly for apartments AED 600,000; directly for shops AED 300,000; common areas and overheads AED 150,000.<\/p><div class=\"box eg\"><span class=\"lbl\">SOLUTION<\/span>\n<div class=\"tbl\"><table class=\"calc\"><tbody>\n<tr><td>Apartments: first supply within 3 years: zero-rated (Box 4: 20,000,000)<\/td><td class=\"r\">0<\/td><\/tr>\n<tr><td>Shops: commercial: 10,000,000 × 5% (Box 1f, Ras Al Khaimah)<\/td><td class=\"r\">500,000<\/td><\/tr>\n<tr class=\"sub\"><td>Output tax<\/td><td class=\"r\">500,000<\/td><\/tr>\n<tr><td>Input tax on apartments (zero-rated = taxable)<\/td><td class=\"r\">600,000<\/td><\/tr>\n<tr><td>Input tax on shops<\/td><td class=\"r\">300,000<\/td><\/tr>\n<tr><td>Residual: all supplies are taxable, so 100% recoverable<\/td><td class=\"r\">150,000<\/td><\/tr>\n<tr class=\"sub\"><td>Recoverable input tax<\/td><td class=\"r\">1,050,000<\/td><\/tr>\n<tr class=\"tot\"><td>Refundable credit for the quarter<\/td><td class=\"r\">(550,000)<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Twist:<\/b> if the developer instead kept two apartments and rented them for the first time in 2027, those first leases would also be zero-rated; but any lease <b>after<\/b> the first supply would be exempt, so input tax on costs linked to those later leases would not be recoverable and the Capital Assets Scheme may require adjustments if the building is a capital asset. Records must be kept for 15 years.<\/p>\n<\/div>"},{"title":"Case C: A restaurant","html":"<p><b>Saffron Bites LLC<\/b> runs a restaurant in Abu Dhabi. Quarter July–September 2026:<\/p><ul>\n<li>Restaurant sales (menu prices VAT-inclusive): AED 1,050,000.<\/li>\n<li>Catering for a corporate event: AED 200,000 + VAT. Part of the event was cancelled and AED 10,000 + VAT was credited back to the client in September.<\/li>\n<li>Food and ingredients: AED 400,000 + VAT. Restaurant rent: AED 150,000 + VAT.<\/li>\n<li>Staff accommodation required by a MoHRE directive: AED 60,000 + VAT.<\/li>\n<li>The owner’s family ate free at the restaurant; food cost AED 5,000 (no other deemed supplies in the last 12 months).<\/li>\n<\/ul><div class=\"box eg\"><span class=\"lbl\">SOLUTION<\/span>\n<div class=\"tbl\"><table class=\"calc\"><tbody>\n<tr><td>Restaurant sales: 1,050,000 × 5/105 (net 1,000,000)<\/td><td class=\"r\">50,000<\/td><\/tr>\n<tr><td>Catering: 200,000 × 5%<\/td><td class=\"r\">10,000<\/td><\/tr>\n<tr><td>Credit note: 10,000 × 5% (reduces Box 1a)<\/td><td class=\"r\">(500)<\/td><\/tr>\n<tr><td>Owner’s family meals: deemed supply, output tax 250; total deemed-supply output tax in 12 months is below AED 2,000, so nothing payable<\/td><td class=\"r\">0<\/td><\/tr>\n<tr class=\"sub\"><td>Output tax (Box 1a: net 1,190,000)<\/td><td class=\"r\">59,500<\/td><\/tr>\n<tr><td>Food and ingredients<\/td><td class=\"r\">20,000<\/td><\/tr>\n<tr><td>Rent<\/td><td class=\"r\">7,500<\/td><\/tr>\n<tr><td>Staff accommodation (mandatory under MoHRE directive)<\/td><td class=\"r\">3,000<\/td><\/tr>\n<tr class=\"sub\"><td>Recoverable input tax (Box 9)<\/td><td class=\"r\">30,500<\/td><\/tr>\n<tr class=\"tot\"><td>VAT payable by 28 October 2026<\/td><td class=\"r\">29,000<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Common mistakes: charging 5% on the VAT-inclusive menu total (AED 52,500 instead of AED 50,000); forgetting the credit note; claiming input tax on staff accommodation that is <b>not<\/b> mandatory under a MoHRE decision (from 1 Oct 2026).<\/p>\n<\/div>"},{"title":"Short problems for class discussion","html":"<ol class=\"qs\">\n<li>A JAFZA (Designated Zone) company sells machinery stored in JAFZA to a mainland Dubai factory. Who pays VAT and how?<\/li>\n<li>A Sharjah school charges AED 40,000 tuition and AED 3,000 for an optional ski trip run by an outside tour company. Discuss.<\/li>\n<li>A trading company paid AED 250,000 in cash to a supplier in October 2026 and holds a tax invoice. What two 2026 rules should it consider before claiming input tax?<\/li>\n<li>A consultant registered late: she should have registered on 1 March 2026 but only applied in September 2026. Her fees were AED 80,000 per month and she charged no VAT. Estimate the VAT she owes for March–August if her contracts are silent on VAT. <span class=\"ans\">(6 × 80,000 = 480,000 × 5/105 = AED 22,857, plus penalties)<\/span><\/li>\n<\/ol>"}],"summary":"","review":[]},"ch17":{"id":"ch17","num":"17","kind":"chapter","title":"Introduction to UAE Corporate Tax","short":"Introduction to Corporate Tax","objectives":["Explain why the UAE introduced Corporate Tax and when it started for each business.","State the rate structure: <b>0% / 9%<\/b>, QFZP 0%, Top-up Tax 15%.","Map the main legislation and the steps of a CT computation."],"sections":[{"title":"Background","html":"<p>On 9 December 2022 the UAE issued <b>Federal Decree-Law No. 47 of 2022 on the Taxation of Corporations and Businesses<\/b> (the “CT Law”). It applies to <mark>financial years starting on or after 1 June 2023<\/mark>. The aims were to provide a sustainable source of revenue, meet international standards on transparency and preventing harmful tax practices, and keep the UAE competitive with one of the lowest headline rates in the world.<\/p><div class=\"tbl\"><table>\n<caption>Table 17.1 When did CT start for a business?<\/caption>\n<thead><tr><th>Financial year<\/th><th>First tax period<\/th><th>First return and payment due<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>1 June – 31 May<\/td><td>1 Jun 2023 – 31 May 2024<\/td><td>28 Feb 2025<\/td><\/tr>\n<tr><td>1 July – 30 June<\/td><td>1 Jul 2023 – 30 Jun 2024<\/td><td>31 Mar 2025<\/td><\/tr>\n<tr><td>1 January – 31 December<\/td><td>1 Jan 2024 – 31 Dec 2024<\/td><td>30 Sep 2025<\/td><\/tr>\n<tr><td>1 April – 31 March<\/td><td>1 Apr 2024 – 31 Mar 2025<\/td><td>31 Dec 2025<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"},{"title":"The rate structure","html":"<figure class=\"fig\"><svg aria-label=\"UAE Corporate Tax rate structure\" role=\"img\" viewbox=\"0 0 660 290\" xmlns=\"http://www.w3.org/2000/svg\"><title>UAE Corporate Tax rate structure<\/title><defs><\/defs><text fill=\"#16324f\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"22.2\"><tspan dy=\"0.0\" x=\"330.0\">Mainland taxable person (and Free Zone income that does not qualify)<\/tspan><\/text><g><rect fill=\"#e3f3e3\" height=\"70\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"200\" x=\"10\" y=\"32\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"110.0\" y=\"63.9\"><tspan dy=\"0.0\" x=\"110.0\">0% on the first AED 375,000<\/tspan><tspan dy=\"14.6\" x=\"110.0\">of taxable income<\/tspan><\/text><\/g><g><rect fill=\"#2a78d6\" height=\"70\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"436\" x=\"214\" y=\"32\"><\/rect><text fill=\"#ffffff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"432.0\" y=\"71.5\"><tspan dy=\"0.0\" x=\"432.0\">9% on taxable income above AED 375,000<\/tspan><\/text><\/g><g><rect fill=\"#fff4d1\" height=\"160\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"205\" x=\"10\" y=\"120\"><\/rect><path d=\"M10,148 V130 Q10,120 20,120 H205 Q215,120 215,130 V148 Z\" fill=\"#eda100\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"112.5\" y=\"138.6\"><tspan dy=\"0.0\" x=\"112.5\">Qualifying Free Zone Person<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11.2\" font-weight=\"normal\" text-anchor=\"middle\" x=\"112.5\" y=\"204.3\"><tspan dy=\"0.0\" x=\"112.5\">0% on Qualifying Income<\/tspan><tspan dy=\"13.7\" x=\"112.5\">9% on other taxable income<\/tspan><tspan dy=\"13.7\" x=\"112.5\">(no AED 375,000 band)<\/tspan><\/text><\/g><g><rect fill=\"#ebe8fb\" height=\"160\" rx=\"10\" stroke=\"#6250d6\" stroke-width=\"2\" width=\"205\" x=\"228\" y=\"120\"><\/rect><path d=\"M228,148 V130 Q228,120 238,120 H423 Q433,120 433,130 V148 Z\" fill=\"#6250d6\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.5\" y=\"138.6\"><tspan dy=\"0.0\" x=\"330.5\">Large MNE groups<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11.2\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.5\" y=\"197.4\"><tspan dy=\"0.0\" x=\"330.5\">Revenue of EUR 750m or more:<\/tspan><tspan dy=\"13.7\" x=\"330.5\">Domestic Minimum Top-up Tax<\/tspan><tspan dy=\"13.7\" x=\"330.5\">tops the effective rate up to<\/tspan><tspan dy=\"13.7\" x=\"330.5\">15%<\/tspan><\/text><\/g><g><rect fill=\"#e0f5ec\" height=\"160\" rx=\"10\" stroke=\"#1baf7a\" stroke-width=\"2\" width=\"204\" x=\"446\" y=\"120\"><\/rect><path d=\"M446,148 V130 Q446,120 456,120 H640 Q650,120 650,130 V148 Z\" fill=\"#1baf7a\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"548.0\" y=\"138.6\"><tspan dy=\"0.0\" x=\"548.0\">Small Business Relief<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11.2\" font-weight=\"normal\" text-anchor=\"middle\" x=\"548.0\" y=\"197.4\"><tspan dy=\"0.0\" x=\"548.0\">Revenue of AED 3m or less<\/tspan><tspan dy=\"13.7\" x=\"548.0\">(periods ending up to 31 Dec<\/tspan><tspan dy=\"13.7\" x=\"548.0\">2029): elect to be treated as<\/tspan><tspan dy=\"13.7\" x=\"548.0\">having no taxable income<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 17.1<\/b> UAE Corporate Tax rates.<\/figcaption><\/figure><p>For an ordinary taxable person the first <span class=\"num\">AED 375,000<\/span> of taxable income is taxed at <span class=\"num\">0%<\/span> and the excess at <span class=\"num\">9%<\/span> (Cabinet Decision No. 116 of 2022). Because of the 0% band, the <b>effective<\/b> rate rises slowly towards 9% as income grows.<\/p><figure class=\"fig\"><svg aria-label=\"Effective Corporate Tax rate by taxable income (AED)\" role=\"img\" viewbox=\"0 0 660 300\" xmlns=\"http://www.w3.org/2000/svg\"><title>Effective Corporate Tax rate by taxable income (AED)<\/title><defs><\/defs><line stroke=\"#e3e5e8\" stroke-width=\"1\" x1=\"62\" x2=\"510\" y1=\"248.0\" y2=\"248.0\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"end\" x=\"54.0\" y=\"251.8\"><tspan dy=\"0.0\" x=\"54.0\">0.0%<\/tspan><\/text><line stroke=\"#e3e5e8\" stroke-width=\"1\" x1=\"62\" x2=\"510\" y1=\"202.8\" y2=\"202.8\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"end\" x=\"54.0\" y=\"206.7\"><tspan dy=\"0.0\" x=\"54.0\">2.0%<\/tspan><\/text><line stroke=\"#e3e5e8\" stroke-width=\"1\" x1=\"62\" x2=\"510\" y1=\"157.6\" y2=\"157.6\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"end\" x=\"54.0\" y=\"161.4\"><tspan dy=\"0.0\" x=\"54.0\">4.0%<\/tspan><\/text><line stroke=\"#e3e5e8\" stroke-width=\"1\" x1=\"62\" x2=\"510\" y1=\"112.4\" y2=\"112.4\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"end\" x=\"54.0\" y=\"116.2\"><tspan dy=\"0.0\" x=\"54.0\">6.0%<\/tspan><\/text><line stroke=\"#e3e5e8\" stroke-width=\"1\" x1=\"62\" x2=\"510\" y1=\"67.2\" y2=\"67.2\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"end\" x=\"54.0\" y=\"71.0\"><tspan dy=\"0.0\" x=\"54.0\">8.0%<\/tspan><\/text><line stroke=\"#e3e5e8\" stroke-width=\"1\" x1=\"62\" x2=\"510\" y1=\"22.0\" y2=\"22.0\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"end\" x=\"54.0\" y=\"25.9\"><tspan dy=\"0.0\" x=\"54.0\">10.0%<\/tspan><\/text><line stroke=\"#8a8f96\" stroke-width=\"1.5\" x1=\"62\" x2=\"510\" y1=\"248\" y2=\"248\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"62.0\" y=\"267.9\"><tspan dy=\"0.0\" x=\"62.0\">0.375m<\/tspan><\/text><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"111.8\" y=\"267.9\"><tspan dy=\"0.0\" x=\"111.8\">0.5m<\/tspan><\/text><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"161.6\" y=\"267.9\"><tspan dy=\"0.0\" x=\"161.6\">0.75m<\/tspan><\/text><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"211.3\" y=\"267.9\"><tspan dy=\"0.0\" x=\"211.3\">1m<\/tspan><\/text><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"261.1\" y=\"267.9\"><tspan dy=\"0.0\" x=\"261.1\">2m<\/tspan><\/text><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"310.9\" y=\"267.9\"><tspan dy=\"0.0\" x=\"310.9\">3m<\/tspan><\/text><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"360.7\" y=\"267.9\"><tspan dy=\"0.0\" x=\"360.7\">5m<\/tspan><\/text><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"410.4\" y=\"267.9\"><tspan dy=\"0.0\" x=\"410.4\">10m<\/tspan><\/text><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"460.2\" y=\"267.9\"><tspan dy=\"0.0\" x=\"460.2\">20m<\/tspan><\/text><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"510.0\" y=\"267.9\"><tspan dy=\"0.0\" x=\"510.0\">50m<\/tspan><\/text><text fill=\"#3a3f45\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"286.0\" y=\"294.2\"><tspan dy=\"0.0\" x=\"286.0\">Taxable income (AED, not to scale)<\/tspan><\/text><text fill=\"#3a3f45\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" transform=\"rotate(-90 16 135.0)\" x=\"16\" y=\"135.0\">Tax as % of taxable income<\/text><path d=\"M62.0,248.0 L111.8,197.2 L161.6,146.3 L211.3,121.0 L261.1,82.8 L310.9,69.9 L360.7,60.0 L410.4,52.3 L460.2,48.4 L510.0,46.2\" fill=\"none\" stroke=\"#2a78d6\" stroke-linejoin=\"round\" stroke-width=\"2.4\"><\/path><g><title>Effective rate — 0.375m: 0.0%<\/title><circle cx=\"62.0\" cy=\"248.0\" fill=\"transparent\" r=\"9\"><\/circle><circle cx=\"62.0\" cy=\"248.0\" fill=\"#2a78d6\" r=\"4\" stroke=\"#fff\" stroke-width=\"2\"><\/circle><\/g><g><title>Effective rate — 0.5m: 2.2%<\/title><circle cx=\"111.8\" cy=\"197.2\" fill=\"transparent\" r=\"9\"><\/circle><circle cx=\"111.8\" cy=\"197.2\" fill=\"#2a78d6\" r=\"4\" stroke=\"#fff\" stroke-width=\"2\"><\/circle><\/g><g><title>Effective rate — 0.75m: 4.5%<\/title><circle cx=\"161.6\" cy=\"146.3\" fill=\"transparent\" r=\"9\"><\/circle><circle cx=\"161.6\" cy=\"146.3\" fill=\"#2a78d6\" r=\"4\" stroke=\"#fff\" stroke-width=\"2\"><\/circle><\/g><g><title>Effective rate — 1m: 5.6%<\/title><circle cx=\"211.3\" cy=\"121.0\" fill=\"transparent\" r=\"9\"><\/circle><circle cx=\"211.3\" cy=\"121.0\" fill=\"#2a78d6\" r=\"4\" stroke=\"#fff\" stroke-width=\"2\"><\/circle><\/g><g><title>Effective rate — 2m: 7.3%<\/title><circle cx=\"261.1\" cy=\"82.8\" fill=\"transparent\" r=\"9\"><\/circle><circle cx=\"261.1\" cy=\"82.8\" fill=\"#2a78d6\" r=\"4\" stroke=\"#fff\" stroke-width=\"2\"><\/circle><\/g><g><title>Effective rate — 3m: 7.9%<\/title><circle cx=\"310.9\" cy=\"69.9\" fill=\"transparent\" r=\"9\"><\/circle><circle cx=\"310.9\" cy=\"69.9\" fill=\"#2a78d6\" r=\"4\" stroke=\"#fff\" stroke-width=\"2\"><\/circle><\/g><g><title>Effective rate — 5m: 8.3%<\/title><circle cx=\"360.7\" cy=\"60.0\" fill=\"transparent\" r=\"9\"><\/circle><circle cx=\"360.7\" cy=\"60.0\" fill=\"#2a78d6\" r=\"4\" stroke=\"#fff\" stroke-width=\"2\"><\/circle><\/g><g><title>Effective rate — 10m: 8.7%<\/title><circle cx=\"410.4\" cy=\"52.3\" fill=\"transparent\" r=\"9\"><\/circle><circle cx=\"410.4\" cy=\"52.3\" fill=\"#2a78d6\" r=\"4\" stroke=\"#fff\" stroke-width=\"2\"><\/circle><\/g><g><title>Effective rate — 20m: 8.8%<\/title><circle cx=\"460.2\" cy=\"48.4\" fill=\"transparent\" r=\"9\"><\/circle><circle cx=\"460.2\" cy=\"48.4\" fill=\"#2a78d6\" r=\"4\" stroke=\"#fff\" stroke-width=\"2\"><\/circle><\/g><g><title>Effective rate — 50m: 8.9%<\/title><circle cx=\"510.0\" cy=\"46.2\" fill=\"transparent\" r=\"9\"><\/circle><circle cx=\"510.0\" cy=\"46.2\" fill=\"#2a78d6\" r=\"4\" stroke=\"#fff\" stroke-width=\"2\"><\/circle><\/g><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"start\" x=\"518.0\" y=\"50.2\"><tspan dy=\"0.0\" x=\"518.0\">Effective rate: 8.9%<\/tspan><\/text><rect fill=\"#2a78d6\" height=\"4\" rx=\"2\" width=\"16\" x=\"72\" y=\"23\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"start\" x=\"94.0\" y=\"28.9\"><tspan dy=\"0.0\" x=\"94.0\">Effective rate<\/tspan><\/text><text fill=\"#16324f\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"257.3\" y=\"144.7\"><tspan dy=\"0.0\" x=\"257.3\">5.6% at AED 1m<\/tspan><\/text><\/svg><figcaption><b>Chart 17.1<\/b> Effective CT rate at different levels of taxable income. Hover a point for its value.<\/figcaption><\/figure><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 17.1<\/span>\n<p>Taxable income of AED 1,000,000: CT = 9% × (1,000,000 − 375,000) = <b>AED 56,250<\/b>. Effective rate = 56,250 / 1,000,000 = 5.6%.<\/p>\n<\/div>"},{"title":"The legislation","html":"<div class=\"tbl\"><table>\n<caption>Table 17.2 Main CT instruments (selection)<\/caption>\n<thead><tr><th>Instrument<\/th><th>Subject<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>FDL 47/2022, amended by FDL 60/2023 and FDL 28/2025<\/td><td>The CT Law; 2023 amendment enabled the Top-up Tax; 2025 amendment set the order of settling CT with credits and a framework for refunding unused credits.<\/td><\/tr>\n<tr><td>CD 116/2022<\/td><td>AED 375,000 threshold for the 0% band.<\/td><\/tr>\n<tr><td>CD 49/2023<\/td><td>Natural persons: AED 1m turnover test.<\/td><\/tr>\n<tr><td>CD 100/2023; MD 229 &amp; 230/2025<\/td><td>Qualifying Income; Qualifying and Excluded Activities; price reporting agencies (Free Zones).<\/td><\/tr>\n<tr><td>MD 73/2023, amended by MD 131/2026<\/td><td>Small Business Relief (now to tax periods ending by 31 Dec 2029).<\/td><\/tr>\n<tr><td>MD 97/2023<\/td><td>Transfer pricing documentation.<\/td><\/tr>\n<tr><td>MD 84/2025 (replaced MD 82/2023)<\/td><td>Audited financial statements.<\/td><\/tr>\n<tr><td>MD 301/2024<\/td><td>Tax Groups.<\/td><\/tr>\n<tr><td>CD 34/2025; CD 63/2025; CD 35/2025; MD 96/2025<\/td><td>Investment funds and limited partnerships; unincorporated partnerships; non-resident nexus; REITs.<\/td><\/tr>\n<tr><td>CD 142/2024; FTA Decision 12/2026<\/td><td>Domestic Minimum Top-up Tax; its registration deadlines.<\/td><\/tr>\n<tr><td>CD 215/2025; MD 24/2026<\/td><td>R&amp;D Tax Credit (from 2026).<\/td><\/tr>\n<tr><td>FTA Decision 3/2024<\/td><td>CT registration deadlines.<\/td><\/tr>\n<tr><td>CD 75/2023 (amended by CD 10/2024)<\/td><td>CT administrative penalties.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"},{"title":"The computation roadmap","html":"<figure class=\"fig\"><svg aria-label=\"Roadmap for computing UAE Corporate Tax\" role=\"img\" viewbox=\"0 0 660 220\" xmlns=\"http://www.w3.org/2000/svg\"><title>Roadmap for computing UAE Corporate Tax<\/title><defs><marker id=\"ar-ctrm-16324f\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"9\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><marker id=\"ar-ctrm-16324fs\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"1\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><\/defs><g><rect fill=\"#ebe8fb\" height=\"96\" rx=\"10\" stroke=\"#6250d6\" stroke-width=\"2\" width=\"196\" x=\"10\" y=\"8\"><\/rect><path d=\"M10,34 V18 Q10,8 20,8 H196 Q206,8 206,18 V34 Z\" fill=\"#6250d6\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"108.0\" y=\"25.6\"><tspan dy=\"0.0\" x=\"108.0\">1. WHO?<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"108.0\" y=\"66.1\"><tspan dy=\"0.0\" x=\"108.0\">Is it a Taxable Person?<\/tspan><tspan dy=\"13.4\" x=\"108.0\">Exempt? QFZP?<\/tspan><\/text><\/g><path d=\"M207.0,56.0 L226.0,56.0\" fill=\"none\" marker-end=\"url(#ar-ctrm-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#e6f0fc\" height=\"96\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"196\" x=\"228\" y=\"8\"><\/rect><path d=\"M228,34 V18 Q228,8 238,8 H414 Q424,8 424,18 V34 Z\" fill=\"#2a78d6\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"326.0\" y=\"25.6\"><tspan dy=\"0.0\" x=\"326.0\">2. START<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"326.0\" y=\"66.1\"><tspan dy=\"0.0\" x=\"326.0\">Accounting net profit (IFRS /<\/tspan><tspan dy=\"13.4\" x=\"326.0\">IFRS for SMEs)<\/tspan><\/text><\/g><path d=\"M425.0,56.0 L444.0,56.0\" fill=\"none\" marker-end=\"url(#ar-ctrm-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#e0f5ec\" height=\"96\" rx=\"10\" stroke=\"#1baf7a\" stroke-width=\"2\" width=\"196\" x=\"446\" y=\"8\"><\/rect><path d=\"M446,34 V18 Q446,8 456,8 H632 Q642,8 642,18 V34 Z\" fill=\"#1baf7a\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"544.0\" y=\"25.6\"><tspan dy=\"0.0\" x=\"544.0\">3. ADJUST<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"544.0\" y=\"59.4\"><tspan dy=\"0.0\" x=\"544.0\">Exempt income, reliefs,<\/tspan><tspan dy=\"13.4\" x=\"544.0\">non-deductibles, interest cap,<\/tspan><tspan dy=\"13.4\" x=\"544.0\">transfer pricing<\/tspan><\/text><\/g><g><rect fill=\"#fff4d1\" height=\"96\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"196\" x=\"10\" y=\"116\"><\/rect><path d=\"M10,142 V126 Q10,116 20,116 H196 Q206,116 206,126 V142 Z\" fill=\"#eda100\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"108.0\" y=\"133.6\"><tspan dy=\"0.0\" x=\"108.0\">4. LOSSES<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"108.0\" y=\"174.1\"><tspan dy=\"0.0\" x=\"108.0\">Offset brought-forward losses<\/tspan><tspan dy=\"13.4\" x=\"108.0\">(max 75%)<\/tspan><\/text><\/g><path d=\"M207.0,164.0 L226.0,164.0\" fill=\"none\" marker-end=\"url(#ar-ctrm-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#fdeadf\" height=\"96\" rx=\"10\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"196\" x=\"228\" y=\"116\"><\/rect><path d=\"M228,142 V126 Q228,116 238,116 H414 Q424,116 424,126 V142 Z\" fill=\"#eb6834\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"326.0\" y=\"133.6\"><tspan dy=\"0.0\" x=\"326.0\">5. RATE<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"326.0\" y=\"180.8\"><tspan dy=\"0.0\" x=\"326.0\">0% up to AED 375,000; 9% above<\/tspan><\/text><\/g><path d=\"M425.0,164.0 L444.0,164.0\" fill=\"none\" marker-end=\"url(#ar-ctrm-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#e3f3e3\" height=\"96\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"196\" x=\"446\" y=\"116\"><\/rect><path d=\"M446,142 V126 Q446,116 456,116 H632 Q642,116 642,126 V142 Z\" fill=\"#008300\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"544.0\" y=\"133.6\"><tspan dy=\"0.0\" x=\"544.0\">6. CREDITS &amp; FILE<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"544.0\" y=\"174.1\"><tspan dy=\"0.0\" x=\"544.0\">Foreign tax &amp; R&amp;D credits;<\/tspan><tspan dy=\"13.4\" x=\"544.0\">file and pay within 9 months<\/tspan><\/text><\/g><path d=\"M640.0,104.0 L640.0,108.0 L108.0,108.0 L108.0,114.0\" fill=\"none\" marker-end=\"url(#ar-ctrm-16324f)\" stroke=\"#16324f\" stroke-dasharray=\"6 4\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><\/svg><figcaption><b>Figure 17.2<\/b> Six steps to compute Corporate Tax.<\/figcaption><\/figure><div class=\"box key\"><span class=\"lbl\">KEY POINT<\/span>\n<p>Registration is <b>separate<\/b> from paying tax. Almost every company and free zone entity must register, file a return and keep records, <mark>even if its tax is zero<\/mark> (because of the 0% band, Small Business Relief or the QFZP regime).<\/p>\n<\/div>"},{"title":"Key terms","html":"<div class=\"tbl\"><table>\n<thead><tr><th>Term<\/th><th>Meaning<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><span class=\"term\">Tax Period<\/span><\/td><td>The financial year (normally 12 months, Gregorian calendar) for which a return is filed.<\/td><\/tr>\n<tr><td><span class=\"term\">Taxable Income<\/span><\/td><td>Accounting income after the adjustments required by the CT Law.<\/td><\/tr>\n<tr><td><span class=\"term\">Business / Business Activity<\/span><\/td><td>Any activity conducted regularly, on an ongoing and independent basis, and any transaction or series of transactions conducted by a person in the course of business.<\/td><\/tr>\n<tr><td><span class=\"term\">Resident / Non-Resident Person<\/span><\/td><td>Determines whether worldwide income or only UAE income is taxed (Chapter 18).<\/td><\/tr>\n<tr><td><span class=\"term\">Related Party / Connected Person<\/span><\/td><td>Persons whose transactions must follow the arm’s length principle or market value (Chapter 25).<\/td><\/tr>\n<tr><td><span class=\"term\">Withholding Tax<\/span><\/td><td>A tax on certain UAE-sourced income paid to non-residents; currently <span class=\"num\">0%<\/span>.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"}],"summary":["CT applies to financial years starting on or after <b>1 June 2023<\/b>.","Rates: <b>0%<\/b> to AED 375,000, <b>9%<\/b> above; QFZP 0% on qualifying income; DMTT tops large MNEs up to 15%.","Registration and filing are required even when no tax is payable."],"review":[{"q":"A company’s financial year runs October to September. When did its first tax period start?","a":"1 October 2023"},{"q":"Calculate CT on taxable income of AED 375,000; AED 400,000; AED 10,000,000.","a":"0; 2,250; 866,250"},{"q":"Why does the effective rate never reach 9%?","a":null}],"mcq":[79,80,81,82]},"ch18":{"id":"ch18","num":"18","kind":"chapter","title":"Taxable Persons, Residence and Source","short":"Taxable Persons, Residence & Source","objectives":["Identify <b>resident<\/b> and <b>non-resident<\/b> taxable persons.","Apply the <b>effective management and control<\/b> test.","Explain <b>permanent establishment<\/b>, <b>nexus<\/b> and <b>UAE-sourced income<\/b>."],"sections":[{"title":"Who is a taxable person?","html":"<figure class=\"fig\"><svg aria-label=\"Who is a Taxable Person for UAE Corporate Tax\" role=\"img\" viewbox=\"0 0 660 340\" xmlns=\"http://www.w3.org/2000/svg\"><title>Who is a Taxable Person for UAE Corporate Tax<\/title><defs><marker id=\"ar-tp-16324f\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"9\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><marker id=\"ar-tp-16324fs\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"1\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><\/defs><g><rect fill=\"#16324f\" height=\"44\" rx=\"10\" stroke=\"#16324f\" stroke-width=\"2\" width=\"200\" x=\"230\" y=\"8\"><\/rect><text fill=\"#ffffff\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"34.9\"><tspan dy=\"0.0\" x=\"330.0\">TAXABLE PERSON<\/tspan><\/text><\/g><g><rect fill=\"#00843d\" height=\"40\" rx=\"10\" stroke=\"#00843d\" stroke-width=\"2\" width=\"250\" x=\"40\" y=\"76\"><\/rect><text fill=\"#ffffff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"165.0\" y=\"93.0\"><tspan dy=\"0.0\" x=\"165.0\">RESIDENT PERSON (taxed on worldwide<\/tspan><tspan dy=\"14.0\" x=\"165.0\">income)<\/tspan><\/text><\/g><g><rect fill=\"#c8102e\" height=\"40\" rx=\"10\" stroke=\"#c8102e\" stroke-width=\"2\" width=\"250\" x=\"370\" y=\"76\"><\/rect><text fill=\"#ffffff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"495.0\" y=\"93.0\"><tspan dy=\"0.0\" x=\"495.0\">NON-RESIDENT PERSON (taxed on UAE<\/tspan><tspan dy=\"14.0\" x=\"495.0\">income only)<\/tspan><\/text><\/g><path d=\"M300.0,52.0 L165.0,74.0\" fill=\"none\" marker-end=\"url(#ar-tp-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><path d=\"M360.0,52.0 L495.0,74.0\" fill=\"none\" marker-end=\"url(#ar-tp-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#e3f3e3\" height=\"58\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"290\" x=\"20\" y=\"132\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"165.0\" y=\"151.4\"><tspan dy=\"0.0\" x=\"165.0\">Company or other juridical person<\/tspan><tspan dy=\"13.4\" x=\"165.0\">incorporated / established in the UAE<\/tspan><tspan dy=\"13.4\" x=\"165.0\">(mainland or Free Zone)<\/tspan><\/text><\/g><g><rect fill=\"#e3f3e3\" height=\"58\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"290\" x=\"20\" y=\"200\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"165.0\" y=\"226.1\"><tspan dy=\"0.0\" x=\"165.0\">Foreign company effectively managed and<\/tspan><tspan dy=\"13.4\" x=\"165.0\">controlled in the UAE<\/tspan><\/text><\/g><g><rect fill=\"#e3f3e3\" height=\"58\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"290\" x=\"20\" y=\"268\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"165.0\" y=\"287.4\"><tspan dy=\"0.0\" x=\"165.0\">Natural person doing business in the UAE with<\/tspan><tspan dy=\"13.4\" x=\"165.0\">turnover above AED 1 million in a calendar<\/tspan><tspan dy=\"13.4\" x=\"165.0\">year<\/tspan><\/text><\/g><g><rect fill=\"#fde4e4\" height=\"58\" rx=\"10\" stroke=\"#e34948\" stroke-width=\"2\" width=\"290\" x=\"350\" y=\"132\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"495.0\" y=\"158.1\"><tspan dy=\"0.0\" x=\"495.0\">Has a Permanent Establishment (fixed place /<\/tspan><tspan dy=\"13.4\" x=\"495.0\">dependent agent) in the UAE<\/tspan><\/text><\/g><g><rect fill=\"#fde4e4\" height=\"58\" rx=\"10\" stroke=\"#e34948\" stroke-width=\"2\" width=\"290\" x=\"350\" y=\"200\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"495.0\" y=\"226.1\"><tspan dy=\"0.0\" x=\"495.0\">Has a nexus in the UAE: income from UAE<\/tspan><tspan dy=\"13.4\" x=\"495.0\">immovable property<\/tspan><\/text><\/g><g><rect fill=\"#fde4e4\" height=\"58\" rx=\"10\" stroke=\"#e34948\" stroke-width=\"2\" width=\"290\" x=\"350\" y=\"268\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"495.0\" y=\"294.1\"><tspan dy=\"0.0\" x=\"495.0\">Earns UAE-sourced income not linked to a PE:<\/tspan><tspan dy=\"13.4\" x=\"495.0\">subject only to 0% withholding tax<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 18.1<\/b> Resident and non-resident taxable persons.<\/figcaption><\/figure><h3>Resident persons (taxed on worldwide income)<\/h3><ol>\n<li><b>Juridical persons incorporated or established in the UAE<\/b>: LLCs, private and public joint stock companies, free zone companies (FZE, FZCO, FZ-LLC), branches established under UAE law, and others.<\/li>\n<li><b>Foreign juridical persons effectively managed and controlled in the UAE<\/b>: where the key management and commercial decisions necessary for the business are in substance made in the UAE (for example most board meetings held and decisions taken in Dubai).<\/li>\n<li><b>Natural persons<\/b> who conduct a business or business activity in the UAE with total turnover above <span class=\"num\">AED 1 million<\/span> in a calendar year (Chapter 21).<\/li>\n<\/ol><p>A resident person can claim a <b>foreign tax credit<\/b> for foreign tax paid on foreign income, limited to the UAE CT on that income, so double taxation is relieved. Double tax agreements may also allocate taxing rights.<\/p><h3>Non-resident person
