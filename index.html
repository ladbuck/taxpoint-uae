dy=\"12.9\" x=\"555.0\">or more<\/tspan><\/text><\/g><g><rect fill=\"#e6f0fc\" height=\"76\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"190\" x=\"460\" y=\"135\"><\/rect><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"555.0\" y=\"170.2\"><tspan dy=\"0.0\" x=\"555.0\">Head office and its Permanent<\/tspan><tspan dy=\"12.9\" x=\"555.0\">Establishment<\/tspan><\/text><\/g><g><rect fill=\"#e6f0fc\" height=\"76\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"190\" x=\"460\" y=\"262\"><\/rect><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"555.0\" y=\"284.3\"><tspan dy=\"0.0\" x=\"555.0\">Partners in the same<\/tspan><tspan dy=\"12.9\" x=\"555.0\">Unincorporated Partnership;<\/tspan><tspan dy=\"12.9\" x=\"555.0\">trustee, founder,<\/tspan><tspan dy=\"12.9\" x=\"555.0\">beneficiaries<\/tspan><\/text><\/g><g><rect fill=\"#fdeadf\" height=\"76\" rx=\"10\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"190\" x=\"10\" y=\"262\"><\/rect><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"105.0\" y=\"297.2\"><tspan dy=\"0.0\" x=\"105.0\">CONNECTED PERSON: an owner of<\/tspan><tspan dy=\"12.9\" x=\"105.0\">the business<\/tspan><\/text><\/g><g><rect fill=\"#fdeadf\" height=\"76\" rx=\"10\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"190\" x=\"235\" y=\"278\"><\/rect><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"313.2\"><tspan dy=\"0.0\" x=\"330.0\">CONNECTED PERSON: a director<\/tspan><tspan dy=\"12.9\" x=\"330.0\">or officer<\/tspan><\/text><\/g><g><rect fill=\"#fdeadf\" height=\"76\" rx=\"10\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"190\" x=\"10\" y=\"135\"><\/rect><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"105.0\" y=\"163.8\"><tspan dy=\"0.0\" x=\"105.0\">CONNECTED PERSON: a Related<\/tspan><tspan dy=\"12.9\" x=\"105.0\">Party of an owner, director<\/tspan><tspan dy=\"12.9\" x=\"105.0\">or officer<\/tspan><\/text><\/g><text fill=\"#3a3f45\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"367.7\"><tspan dy=\"0.0\" x=\"330.0\">Blue = Related Parties (arm's length rules)   Orange = Connected Persons (market value test for payments)<\/tspan><\/text><\/svg><figcaption><b>Figure 25.1<\/b> Related Parties and Connected Persons.<\/figcaption><\/figure>"},{"title":"Transfer pricing methods","html":"<div class=\"tbl\"><table>\n<thead><tr><th>Method<\/th><th>How it works<\/th><th>Typical use<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Comparable Uncontrolled Price (CUP)<\/b><\/td><td>Compare the price with the price in comparable independent transactions.<\/td><td>Commodities, loans, royalties with good market data.<\/td><\/tr>\n<tr><td><b>Resale Price<\/b><\/td><td>Start from the resale price to independent customers and deduct an arm’s length gross margin.<\/td><td>Distributors that buy from group companies.<\/td><\/tr>\n<tr><td><b>Cost Plus<\/b><\/td><td>Add an arm’s length mark-up to the supplier’s costs.<\/td><td>Contract manufacturers, service providers.<\/td><\/tr>\n<tr><td><b>Transactional Net Margin (TNMM)<\/b><\/td><td>Compare a net profit indicator (e.g. operating margin) with comparable independent companies.<\/td><td>The most common method in practice.<\/td><\/tr>\n<tr><td><b>Transactional Profit Split<\/b><\/td><td>Split combined profits based on each party’s contribution.<\/td><td>Highly integrated operations, unique intangibles.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><p>Other methods may be used if none of these can reasonably apply. The taxpayer should select the <b>most appropriate method<\/b> and support it with a <b>benchmarking study<\/b>.<\/p>"},{"title":"Documentation","html":"<figure class=\"fig\"><svg aria-label=\"Transfer pricing compliance ladder\" role=\"img\" viewbox=\"0 0 660 300\" xmlns=\"http://www.w3.org/2000/svg\"><title>Transfer pricing compliance ladder<\/title><defs><\/defs><g><rect fill=\"#f1f2f3\" height=\"140\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"152\" x=\"10\" y=\"150\"><\/rect><path d=\"M10,178 V160 Q10,150 20,150 H152 Q162,150 162,160 V178 Z\" fill=\"#8a8f96\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"86.0\" y=\"168.6\"><tspan dy=\"0.0\" x=\"86.0\">Everyone<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.2\" font-weight=\"normal\" text-anchor=\"middle\" x=\"86.0\" y=\"212.7\"><tspan dy=\"0.0\" x=\"86.0\">Arm's length principle<\/tspan><tspan dy=\"12.4\" x=\"86.0\">for all Related Party<\/tspan><tspan dy=\"12.4\" x=\"86.0\">transactions; market<\/tspan><tspan dy=\"12.4\" x=\"86.0\">value for payments to<\/tspan><tspan dy=\"12.4\" x=\"86.0\">Connected Persons<\/tspan><\/text><\/g><g><rect fill=\"#e6f0fc\" height=\"186\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"152\" x=\"170\" y=\"104\"><\/rect><path d=\"M170,132 V114 Q170,104 180,104 H312 Q322,104 322,114 V132 Z\" fill=\"#2a78d6\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"246.0\" y=\"122.5\"><tspan dy=\"0.0\" x=\"246.0\">RPT &gt; AED 40m<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.2\" font-weight=\"normal\" text-anchor=\"middle\" x=\"246.0\" y=\"177.2\"><tspan dy=\"0.0\" x=\"246.0\">TP Disclosure Form with<\/tspan><tspan dy=\"12.4\" x=\"246.0\">the CT return<\/tspan><tspan dy=\"12.4\" x=\"246.0\">(categories above AED 4m<\/tspan><tspan dy=\"12.4\" x=\"246.0\">itemised); also<\/tspan><tspan dy=\"12.4\" x=\"246.0\">Connected Person<\/tspan><tspan dy=\"12.4\" x=\"246.0\">payments above AED<\/tspan><tspan dy=\"12.4\" x=\"246.0\">500,000<\/tspan><\/text><\/g><g><rect fill=\"#ebe8fb\" height=\"232\" rx=\"10\" stroke=\"#6250d6\" stroke-width=\"2\" width=\"152\" x=\"330\" y=\"58\"><\/rect><path d=\"M330,86 V68 Q330,58 340,58 H472 Q482,58 482,68 V86 Z\" fill=\"#6250d6\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"406.0\" y=\"76.5\"><tspan dy=\"0.0\" x=\"406.0\">Revenue ≥ AED 200m<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.2\" font-weight=\"normal\" text-anchor=\"middle\" x=\"406.0\" y=\"166.7\"><tspan dy=\"0.0\" x=\"406.0\">Keep a Local File (and a<\/tspan><tspan dy=\"12.4\" x=\"406.0\">Master File if part of<\/tspan><tspan dy=\"12.4\" x=\"406.0\">an MNE group); give to<\/tspan><tspan dy=\"12.4\" x=\"406.0\">the FTA within 30 days<\/tspan><tspan dy=\"12.4\" x=\"406.0\">of a request<\/tspan><\/text><\/g><g><rect fill=\"#fde4e4\" height=\"278\" rx=\"10\" stroke=\"#e34948\" stroke-width=\"2\" width=\"152\" x=\"490\" y=\"12\"><\/rect><path d=\"M490,40 V22 Q490,12 500,12 H632 Q642,12 642,22 V40 Z\" fill=\"#e34948\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"566.0\" y=\"30.6\"><tspan dy=\"0.0\" x=\"566.0\">Group ≥ AED 3.15bn<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.2\" font-weight=\"normal\" text-anchor=\"middle\" x=\"566.0\" y=\"143.7\"><tspan dy=\"0.0\" x=\"566.0\">MNE group also needs<\/tspan><tspan dy=\"12.4\" x=\"566.0\">Master File &amp; Local<\/tspan><tspan dy=\"12.4\" x=\"566.0\">File; group files a<\/tspan><tspan dy=\"12.4\" x=\"566.0\">Country-by-Country<\/tspan><tspan dy=\"12.4\" x=\"566.0\">Report<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 25.2<\/b> What documentation is needed at each level.<\/figcaption><\/figure><ul>\n<li><b>Transfer Pricing Disclosure Form<\/b>: filed <b>with the CT return<\/b> where Related Party transactions exceed <span class=\"num\">AED 40 million<\/span> in aggregate (each category above AED 4 million itemised), or payments and benefits to Connected Persons exceed <span class=\"num\">AED 500,000<\/span>.<\/li>\n<li><b>Master File and Local File<\/b> (MD 97/2023): required where the taxpayer’s revenue is at least <span class=\"num\">AED 200 million<\/span>, or it belongs to an MNE group with consolidated revenue of at least <span class=\"num\">AED 3.15 billion<\/span>. They are not filed with the return but must be given to the FTA within <span class=\"num\">30 days<\/span> of a request. (A purely domestic group meeting only the AED 200m test needs a Local File but not a Master File.)<\/li>\n<li><b>Country-by-Country Report<\/b>: for MNE groups with consolidated revenue of AED 3.15 billion or more, under the UAE CbCR rules.<\/li>\n<\/ul><div class=\"box upd\"><span class=\"lbl\">UPDATE 2025–26<\/span>\n<p><span class=\"new\">NEW<\/span> FTA <b>Public Clarification CTP011<\/b> (15 July 2026) explains <b>downward<\/b> transfer pricing adjustments made in the CT return. The taxpayer should keep the rationale, an arm’s length analysis with benchmarking, a reconciliation between the financial statements and the arm’s length values in the return, and evidence that the related party made a <b>symmetrical<\/b> corresponding adjustment.<\/p>\n<\/div>"},{"title":"Practical illustration","html":"<div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 25.1<\/span>\n<p>A mainland distributor buys products from its free zone sister company (a QFZP) and resells them in the UAE. If the QFZP overcharges, profit moves from the mainland (taxed at 9%) to the free zone (0%). A benchmarking study shows independent distributors earn operating margins of 3% to 6% (median 4.5%). The mainland company’s margin is 0.5% on sales of AED 100m. The FTA could adjust its margin to 4.5%, adding AED 4m to taxable income (and AED 360,000 of tax), and the QFZP’s compliance with TP rules (a QFZP condition) would be in question.<\/p>\n<\/div>"}],"summary":["Related Party transactions must be at arm’s length; Connected Person payments at market value.","Five OECD methods; TNMM is the most common.","Disclosure Form (AED 40m / AED 4m / AED 500k), Master & Local File (AED 200m or AED 3.15bn group), CbCR (AED 3.15bn)."],"review":[{"q":"Are a company and the wife of its 60% shareholder Related Parties?","a":null},{"q":"Which method suits a contract manufacturer that is paid its costs plus a mark-up?","a":null},{"q":"A company has revenue of AED 250m but no foreign group members. Which TP documents does it need?","a":null}],"mcq":[120,121,122,123,124]},"ch26":{"id":"ch26","num":"26","kind":"chapter","title":"Pillar Two Top-up Tax, Tax Credits and Incentives","short":"Top-up Tax, Credits & Incentives","objectives":["Explain why the UAE introduced a <b>Domestic Minimum Top-up Tax<\/b> and who is in scope.","Outline the calculation and the 2026 registration and filing deadlines.","Apply foreign tax credits, the order of settling CT, and the new <b>R&amp;D Tax Credit<\/b>."],"sections":[{"title":"Pillar Two in brief","html":"<p>Under the OECD/G20 <b>Pillar Two<\/b> (GloBE) rules, large multinational groups should pay at least a <span class=\"num\">15%<\/span> effective tax rate in every country where they operate. If a country taxes them less, another country can collect the difference. To keep that revenue at home, the UAE introduced a <span class=\"term\">Domestic Minimum Top-up Tax<\/span> (DMTT, called “Top-up Tax”) through Cabinet Decision No. 142 of 2024, for financial years starting on or after <span class=\"num\">1 January 2025<\/span>. The UAE has implemented only the domestic top-up tax at this stage.<\/p>"},{"title":"Who is in scope?","html":"<p>UAE <b>Constituent Entities<\/b> (companies and PEs) of an <b>MNE group<\/b> whose consolidated revenue was at least <span class=\"num\">EUR 750 million<\/span> in at least two of the four previous financial years. This applies whatever the entity’s CT status: a QFZP paying 0% CT can still pay Top-up Tax. Certain entities (governmental entities, international organisations, non-profits, pension funds, and investment or real estate vehicles that are ultimate parents) are <b>excluded<\/b>, as explained in the FTA’s Excluded Entities guide (TTGEIE1, August 2026).<\/p>"},{"title":"How it is calculated","html":"<figure class=\"fig\"><svg aria-label=\"How the Domestic Minimum Top-up Tax is calculated\" role=\"img\" viewbox=\"0 0 660 420\" xmlns=\"http://www.w3.org/2000/svg\"><title>How the Domestic Minimum Top-up Tax is calculated<\/title><defs><marker id=\"ar-dmtt-16324f\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"9\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><marker id=\"ar-dmtt-16324fs\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"1\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><\/defs><g><rect fill=\"#24507a\" height=\"50\" rx=\"10\" stroke=\"#24507a\" stroke-width=\"2\" width=\"150\" x=\"10\" y=\"6\"><\/rect><text fill=\"#ffffff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"85.0\" y=\"35.2\"><tspan dy=\"0.0\" x=\"85.0\">Scope<\/tspan><\/text><\/g><g><rect fill=\"#ffffff\" height=\"50\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"480\" x=\"170\" y=\"6\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"start\" x=\"180.0\" y=\"28.1\"><tspan dy=\"0.0\" x=\"180.0\">MNE group with consolidated revenue of EUR 750m+ in at least 2 of the 4<\/tspan><tspan dy=\"13.4\" x=\"180.0\">previous years; UAE Constituent Entities<\/tspan><\/text><\/g><path d=\"M85.0,57.0 L85.0,64.0\" fill=\"none\" marker-end=\"url(#ar-dmtt-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#e6f0fc\" height=\"50\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"150\" x=\"10\" y=\"65\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"85.0\" y=\"94.2\"><tspan dy=\"0.0\" x=\"85.0\">GloBE income<\/tspan><\/text><\/g><g><rect fill=\"#ffffff\" height=\"50\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"480\" x=\"170\" y=\"65\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"start\" x=\"180.0\" y=\"93.8\"><tspan dy=\"0.0\" x=\"180.0\">Start from accounting profit of all UAE entities; make Pillar Two adjustments<\/tspan><\/text><\/g><path d=\"M85.0,116.0 L85.0,123.0\" fill=\"none\" marker-end=\"url(#ar-dmtt-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#e6f0fc\" height=\"50\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"150\" x=\"10\" y=\"124\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"85.0\" y=\"153.2\"><tspan dy=\"0.0\" x=\"85.0\">Covered taxes<\/tspan><\/text><\/g><g><rect fill=\"#ffffff\" height=\"50\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"480\" x=\"170\" y=\"124\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"start\" x=\"180.0\" y=\"152.8\"><tspan dy=\"0.0\" x=\"180.0\">UAE CT (and deferred tax) attributable to that income<\/tspan><\/text><\/g><path d=\"M85.0,175.0 L85.0,182.0\" fill=\"none\" marker-end=\"url(#ar-dmtt-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#e0f5ec\" height=\"50\" rx=\"10\" stroke=\"#1baf7a\" stroke-width=\"2\" width=\"150\" x=\"10\" y=\"183\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"85.0\" y=\"212.2\"><tspan dy=\"0.0\" x=\"85.0\">Effective tax rate<\/tspan><\/text><\/g><g><rect fill=\"#ffffff\" height=\"50\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"480\" x=\"170\" y=\"183\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"start\" x=\"180.0\" y=\"211.8\"><tspan dy=\"0.0\" x=\"180.0\">ETR = covered taxes ÷ GloBE income (for the UAE as a whole)<\/tspan><\/text><\/g><path d=\"M85.0,234.0 L85.0,241.0\" fill=\"none\" marker-end=\"url(#ar-dmtt-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#fff4d1\" height=\"50\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"150\" x=\"10\" y=\"242\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"85.0\" y=\"271.2\"><tspan dy=\"0.0\" x=\"85.0\">Top-up %<\/tspan><\/text><\/g><g><rect fill=\"#ffffff\" height=\"50\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"480\" x=\"170\" y=\"242\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"start\" x=\"180.0\" y=\"270.9\"><tspan dy=\"0.0\" x=\"180.0\">If ETR &lt; 15%: top-up % = 15% − ETR<\/tspan><\/text><\/g><path d=\"M85.0,293.0 L85.0,300.0\" fill=\"none\" marker-end=\"url(#ar-dmtt-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#fdeadf\" height=\"50\" rx=\"10\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"150\" x=\"10\" y=\"301\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"85.0\" y=\"330.2\"><tspan dy=\"0.0\" x=\"85.0\">Excess profit<\/tspan><\/text><\/g><g><rect fill=\"#ffffff\" height=\"50\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"480\" x=\"170\" y=\"301\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"start\" x=\"180.0\" y=\"329.9\"><tspan dy=\"0.0\" x=\"180.0\">GloBE income − substance-based income exclusion (payroll &amp; tangible assets)<\/tspan><\/text><\/g><path d=\"M85.0,352.0 L85.0,359.0\" fill=\"none\" marker-end=\"url(#ar-dmtt-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#c8102e\" height=\"50\" rx=\"10\" stroke=\"#c8102e\" stroke-width=\"2\" width=\"150\" x=\"10\" y=\"360\"><\/rect><text fill=\"#ffffff\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"85.0\" y=\"389.2\"><tspan dy=\"0.0\" x=\"85.0\">Top-up tax<\/tspan><\/text><\/g><g><rect fill=\"#ffffff\" height=\"50\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"480\" x=\"170\" y=\"360\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"start\" x=\"180.0\" y=\"388.9\"><tspan dy=\"0.0\" x=\"180.0\">Top-up % × excess profit (+ adjustments); paid with the Top-up Tax return<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 26.1<\/b> The Top-up Tax calculation in seven steps.<\/figcaption><\/figure><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 26.1 (simplified)<\/span>\n<p>The UAE entities of an MNE group have GloBE income of AED 200m and covered taxes of AED 12m. The substance-based income exclusion (based on UAE payroll and tangible assets) is AED 40m.<\/p>\n<div class=\"tbl\"><table class=\"calc\"><tbody>\n<tr><td>Effective tax rate = 12 / 200<\/td><td class=\"r\">6%<\/td><\/tr>\n<tr><td>Top-up percentage = 15% − 6%<\/td><td class=\"r\">9%<\/td><\/tr>\n<tr><td>Excess profit = 200 − 40<\/td><td class=\"r\">AED 160m<\/td><\/tr>\n<tr class=\"tot\"><td>Top-up Tax = 9% × 160m<\/td><td class=\"r\">AED 14.4m<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>Safe harbours (such as the transitional CbCR safe harbour) can reduce the UAE Top-up Tax to zero for some groups if their conditions are met.<\/p>\n<\/div>"},{"title":"Registration and filing","html":"<div class=\"box upd\"><span class=\"lbl\">UPDATE 2025–26<\/span>\n<ul>\n<li><span class=\"new\">NEW<\/span> <b>Registration<\/b> opened on EmaraTax in July 2026. Under <b>FTA Decision No. 12 of 2026<\/b>, an in-scope entity must register within <span class=\"num\">7 months<\/span> of the end of its first in-scope financial year. Entities whose first in-scope year ended <b>before 30 April 2026<\/b> (e.g. calendar year 2025) must register by <span class=\"num\">30 November 2026<\/span>. A group may appoint one <b>Domestic Designated Filing Entity<\/b> to register, file and pay for all UAE entities. CT registration does <b>not<\/b> count as Top-up Tax registration.<\/li>\n<li>The <b>Top-up Tax return<\/b> and payment are due <span class=\"num\">15 months<\/span> after the financial year end (<span class=\"num\">18 months<\/span> for the first year): for calendar year 2025, by <b>30 June 2027<\/b>. A separate <b>Pillar Two Information Return<\/b> is also required; Ministerial Decision No. 133 of 2026 sets out the filing options.<\/li>\n<li>No penalties apply to late Top-up Tax returns or information returns for periods beginning on or before 31 December 2026 (and not ending after 30 June 2028) if the group took reasonable measures to comply.<\/li>\n<li>Ministerial Decision No. 96 of 2026 adopts the OECD Commentary and Administrative Guidance for UAE purposes.<\/li>\n<\/ul>\n<\/div>"},{"title":"Credits and the order of settlement","html":"<p>Federal Decree-Law No. 28 of 2025 restated the order in which CT is settled:<\/p><ol class=\"steps\">\n<li>Withholding tax credit (currently nil, as the WHT rate is 0%).<\/li>\n<li><b>Foreign tax credit<\/b>: foreign tax paid on income also taxed in the UAE, limited to the UAE CT due on that income. Unused foreign tax credit cannot be carried forward or refunded.<\/li>\n<li>Other credits and incentives specified by Cabinet Decision, such as the <b>R&amp;D Tax Credit<\/b>.<\/li>\n<li>Any remaining CT is paid.<\/li>\n<\/ol><p>The same decree-law added a framework (Article 49 bis) allowing <b>unused<\/b> qualifying credits to be claimed back in cash where a Cabinet Decision allows it.<\/p><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 26.2: Foreign tax credit<\/span>\n<p>A UAE company earns AED 1,000,000 of fees from Egypt on which Egypt withheld AED 120,000. Its other taxable income uses up the 0% band. UAE CT on the Egyptian income = 9% × 1,000,000 = AED 90,000. Credit = lower of 120,000 and 90,000 = <b>AED 90,000<\/b>; the extra AED 30,000 is lost.<\/p>\n<\/div>"},{"title":"The R&D Tax Credit (from 2026)","html":"<p>Cabinet Decision No. 215 of 2025 and Ministerial Decision No. 24 of 2026 introduce a credit for tax periods starting on or after <span class=\"num\">1 January 2026<\/span>.<\/p><div class=\"tbl\"><table>\n<thead><tr><th>Feature<\/th><th>Rule (Phase 1)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Who can claim<\/td><td>Entities subject to CT and/or Top-up Tax that bear the financial risk of the R&amp;D and own the results; must obtain <b>pre-approval<\/b>. Not available to persons electing SBR; a free zone person must be taxed at 9% (or Top-up Tax) on the related income.<\/td><\/tr>\n<tr><td>Qualifying activities<\/td><td>Novel, creative, uncertain, systematic, reproducible work (OECD Frascati Manual), physically performed in the UAE; social sciences, humanities and arts excluded.<\/td><\/tr>\n<tr><td>Qualifying expenditure<\/td><td>Staff costs (plus a 30% overhead uplift), consumables, UAE subcontracting, qualifying cost contribution arrangements; at least <span class=\"num\">AED 500,000<\/span> per project.<\/td><\/tr>\n<tr><td>Rates (tiered)<\/td><td><b>15%<\/b> on the first AED 1m (average 2+ R&amp;D staff); <b>35%<\/b> on AED 1m–2m (6+ staff); <b>50%<\/b> on AED 2m–5m (14+ staff).<\/td><\/tr>\n<tr><td>Cap and use<\/td><td>Maximum <span class=\"num\">AED 2m<\/span> per entity per tax period; <b>non-refundable<\/b>; used against CT and Top-up Tax; unused credit carried forward indefinitely (subject to conditions); can be transferred within commonly owned groups.<\/td><\/tr>\n<tr><td>Records<\/td><td>Technical and financial records kept for 7 years; clawback and anti-abuse rules apply.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><p>A separate <b>refundable tax credit for high-value employment<\/b> has been announced by the Ministry of Finance; check for implementing legislation before relying on it.<\/p>"}],"summary":["Top-up Tax: MNE groups with EUR 750m+ revenue pay at least 15% on UAE profits from 2025.","Register within 7 months of the first in-scope year end (by 30 Nov 2026 for 2025 calendar years); returns due 15 months after year end (18 for the first).","Settle CT with WHT credit, then foreign tax credit, then incentives such as the R&D credit (from 2026, up to 50%, cap AED 2m)."],"review":[{"q":"Why does a QFZP in a large MNE group still care about Top-up Tax?","a":null},{"q":"When is the first Top-up Tax return due for a group with a 31 December 2025 year end?","a":null},{"q":"An entity spends AED 1.5m on qualifying R&D with an average of 7 R&D staff. Estimate its credit.","a":"15% × 1m + 35% × 0.5m = AED 325,000"}],"mcq":[125,126,127,128]},"ch27":{"id":"ch27","num":"27","kind":"chapter","title":"CT Registration, Returns, Payment and Records","short":"CT Registration, Returns & Records","objectives":["Know the CT registration deadlines and the late-registration penalty waiver.","File returns and pay tax within <b>9 months<\/b>; know what the return contains.","Keep records for <b>7 years<\/b>; understand audited accounts, deregistration and penalties."],"sections":[{"title":"Registration","html":"<p>All taxable persons (including free zone persons and natural persons over the AED 1m threshold) and most exempt persons must register. FTA Decision No. 3 of 2024 sets the deadlines.<\/p><div class=\"tbl\"><table>\n<thead><tr><th>Person<\/th><th>Deadline<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Resident juridical person incorporated before 1 March 2024<\/td><td>Staggered deadlines during 2024 by month of licence issue (all now passed).<\/td><\/tr>\n<tr><td>Resident juridical person incorporated on or after 1 March 2024<\/td><td><span class=\"num\">3 months<\/span> from incorporation, establishment or recognition.<\/td><\/tr>\n<tr><td>Foreign company effectively managed and controlled in the UAE<\/td><td>3 months from the end of its financial year.<\/td><\/tr>\n<tr><td>Resident natural person<\/td><td><span class=\"num\">31 March<\/span> of the year following the year turnover exceeded AED 1m.<\/td><\/tr>\n<tr><td>Non-resident with a PE / with a nexus<\/td><td>6 months from when the PE exists / 3 months from when the nexus exists.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><div class=\"box key\"><span class=\"lbl\">KEY POINT: THE PENALTY WAIVER<\/span>\n<p>The late-registration penalty is <span class=\"num\">AED 10,000<\/span>. Under the FTA’s waiver initiative it is <mark>cancelled (or refunded) automatically<\/mark> if the person files its <b>first<\/b> CT return (or annual declaration for an exempt person) within <span class=\"num\">7 months<\/span> of the end of its first tax period, instead of the usual nine months.<\/p>\n<\/div>"},{"title":"Tax period, return and payment","html":"<figure class=\"fig\"><svg aria-label=\"Corporate Tax timeline for a calendar-year company (FY 2026)\" role=\"img\" viewbox=\"0 0 660 250\" xmlns=\"http://www.w3.org/2000/svg\"><title>Corporate Tax timeline for a calendar-year company (FY 2026)<\/title><defs><\/defs><line stroke=\"#16324f\" stroke-linecap=\"round\" stroke-width=\"4\" x1=\"20\" x2=\"640\" y1=\"110\" y2=\"110\"><\/line><circle cx=\"40\" cy=\"110\" fill=\"#e6f0fc\" r=\"12\" stroke=\"#2a78d6\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"40.0\" y=\"90.2\"><tspan dy=\"0.0\" x=\"40.0\">1 Jan 2026<\/tspan><\/text><g><rect fill=\"#e6f0fc\" height=\"76\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"140\" x=\"6\" y=\"150\"><\/rect><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"76.0\" y=\"191.7\"><tspan dy=\"0.0\" x=\"76.0\">Tax period begins<\/tspan><\/text><\/g><circle cx=\"200\" cy=\"110\" fill=\"#e6f0fc\" r=\"12\" stroke=\"#2a78d6\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"200.0\" y=\"140.2\"><tspan dy=\"0.0\" x=\"200.0\">31 Dec 2026<\/tspan><\/text><g><rect fill=\"#e6f0fc\" height=\"66\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"140\" x=\"130\" y=\"6\"><\/rect><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"200.0\" y=\"36.2\"><tspan dy=\"0.0\" x=\"200.0\">Tax period ends;<\/tspan><tspan dy=\"12.9\" x=\"200.0\">close books<\/tspan><\/text><\/g><circle cx=\"350\" cy=\"110\" fill=\"#fff4d1\" r=\"12\" stroke=\"#eda100\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"350.0\" y=\"90.2\"><tspan dy=\"0.0\" x=\"350.0\">31 Jul 2027<\/tspan><\/text><g><rect fill=\"#fff4d1\" height=\"76\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"140\" x=\"280\" y=\"150\"><\/rect><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"350.0\" y=\"165.8\"><tspan dy=\"0.0\" x=\"350.0\">First year only:<\/tspan><tspan dy=\"12.9\" x=\"350.0\">file by here to<\/tspan><tspan dy=\"12.9\" x=\"350.0\">avoid the<\/tspan><tspan dy=\"12.9\" x=\"350.0\">late-registration<\/tspan><tspan dy=\"12.9\" x=\"350.0\">penalty<\/tspan><\/text><\/g><circle cx=\"480\" cy=\"110\" fill=\"#c8102e\" r=\"12\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"480.0\" y=\"140.2\"><tspan dy=\"0.0\" x=\"480.0\">30 Sep 2027<\/tspan><\/text><g><rect fill=\"#c8102e\" height=\"66\" rx=\"10\" stroke=\"#c8102e\" stroke-width=\"2\" width=\"140\" x=\"410\" y=\"6\"><\/rect><text fill=\"#ffffff\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"480.0\" y=\"36.2\"><tspan dy=\"0.0\" x=\"480.0\">CT return + payment<\/tspan><tspan dy=\"12.9\" x=\"480.0\">due (9 months)<\/tspan><\/text><\/g><circle cx=\"610\" cy=\"110\" fill=\"#f1f2f3\" r=\"12\" stroke=\"#8a8f96\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"610.0\" y=\"90.2\"><tspan dy=\"0.0\" x=\"610.0\">2033+<\/tspan><\/text><g><rect fill=\"#f1f2f3\" height=\"76\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"140\" x=\"514\" y=\"150\"><\/rect><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"584.0\" y=\"185.2\"><tspan dy=\"0.0\" x=\"584.0\">Keep records at<\/tspan><tspan dy=\"12.9\" x=\"584.0\">least 7 years<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 27.1<\/b> CT timeline for a calendar-year company.<\/figcaption><\/figure><ul>\n<li>The tax period is the <b>financial year<\/b>; it can be changed only with FTA approval.<\/li>\n<li>The return and payment are due within <span class=\"num\">9 months<\/span> of the end of the tax period. There are no advance or instalment payments.<\/li>\n<li>The return (on EmaraTax) includes: financial statement data, the adjustments to accounting profit, elections (SBR, realisation basis, QGR, BRR, foreign PE exemption, loss transfer), QFZP information, the Transfer Pricing Disclosure Form (if required), and the tax due.<\/li>\n<li>Tax is paid through EmaraTax or to the taxpayer’s GIBAN.<\/li>\n<\/ul>"},{"title":"Financial statements and records","html":"<ul>\n<li><b>Audited financial statements<\/b> are required where revenue exceeds <span class=\"num\">AED 50 million<\/span> and for every <b>QFZP<\/b> (MD 84/2025). Tax groups may need audited special-purpose aggregated statements. The FTA can ask any taxpayer for its financial statements.<\/li>\n<li>Records and documents supporting the return must be kept for <span class=\"num\">7 years<\/span> after the end of the tax period.<\/li>\n<\/ul>"},{"title":"Deregistration","html":"<p>A taxable person must apply to deregister within <span class=\"num\">3 months<\/span> of ceasing business (dissolution, liquidation, merger). The FTA approves only when all returns are filed and all tax and penalties are paid. Late application: AED 1,000 per month, up to AED 10,000.<\/p>"},{"title":"CT penalties at a glance","html":"<div class=\"tbl\"><table>\n<caption>Table 27.1 Main CT penalties (Cabinet Decision 75 of 2023, as amended)<\/caption>\n<thead><tr><th>Violation<\/th><th>Penalty<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Late registration<\/td><td>AED 10,000 (waiver available as above)<\/td><\/tr>\n<tr><td>Late filing of return<\/td><td>AED 500 per month for the first 12 months; AED 1,000 per month after that<\/td><\/tr>\n<tr><td>Late payment<\/td><td>14% per year, calculated monthly on the unpaid tax<\/td><\/tr>\n<tr><td>Incorrect return corrected by voluntary disclosure<\/td><td>1% per month on the tax difference<\/td><\/tr>\n<tr><td>Error found by the FTA (tax assessment)<\/td><td>15% of the tax difference plus 1% per month<\/td><\/tr>\n<tr><td>Failure to keep records<\/td><td>AED 10,000 (AED 20,000 if repeated within 24 months)<\/td><\/tr>\n<tr><td>Late deregistration<\/td><td>AED 1,000 per month, maximum AED 10,000<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"},{"title":"Tax residency certificates and treaties","html":"<p>Companies and individuals can apply on EmaraTax for a <b>Tax Residency Certificate<\/b> (under MD 247 of 2023) to claim treaty benefits abroad, such as reduced withholding tax on dividends, interest or royalties. The FTA may also issue a certificate confirming domestic tax residency.<\/p>"}],"summary":["Register within 3 months of incorporation (natural persons by 31 March of the next year).","File and pay within <b>9 months<\/b>; first return within 7 months cancels the AED 10,000 late-registration penalty.","Audit if revenue > AED 50m or QFZP; keep records 7 years; deregister within 3 months of cessation."],"review":[{"q":"A company was incorporated on 15 August 2026. By when must it register?","a":"15 November 2026"},{"q":"A return for the year ended 30 June 2026 is filed on 15 May 2027. Calculate the late filing penalty.","a":"Due 31 Mar 2027; 2 months (one part) late: AED 1,000"},{"q":"Which businesses must have audited financial statements?","a":null}],"mcq":[129,130,131,132,133,134,135,136]},"ch28":{"id":"ch28","num":"28","kind":"chapter","title":"Corporate Tax Case Studies and Worked Solutions","short":"Corporate Tax Case Studies","objectives":["Apply Chapters 17–27 to complete cases.","Explain the reasoning behind each adjustment, as you would to a client."],"sections":[{"title":"Case 1: A trading company with a foreign branch","html":"<p><b>Desert Star Trading LLC<\/b> (Dubai, year ended 31 December 2026). Accounting profit AED 7,500,000, which includes: profit of its Oman branch AED 1,000,000 (Omani tax paid AED 150,000; no foreign PE exemption elected); client entertainment AED 300,000; a fine from the municipality AED 20,000; a provision for a VAT penalty AED 50,000; rent paid to the managing director for a warehouse he owns AED 900,000 (market rent AED 700,000); depreciation AED 400,000 (accounting depreciation is deductible). Net interest expense AED 3,000,000 (below AED 12m). No losses brought forward.<\/p><div class=\"box eg\"><span class=\"lbl\">SOLUTION<\/span>\n<div class=\"tbl\"><table class=\"calc\"><tbody>\n<tr><td>Accounting profit<\/td><td class=\"r\">7,500,000<\/td><\/tr>\n<tr><td class=\"ind\">Add: 50% of client entertainment<\/td><td class=\"r\">150,000<\/td><\/tr>\n<tr><td class=\"ind\">Add: municipality fine<\/td><td class=\"r\">20,000<\/td><\/tr>\n<tr><td class=\"ind\">Add: VAT penalty provision (penalty not deductible)<\/td><td class=\"r\">50,000<\/td><\/tr>\n<tr><td class=\"ind\">Add: rent to connected person above market value<\/td><td class=\"r\">200,000<\/td><\/tr>\n<tr><td class=\"ind\">Depreciation and interest: no adjustment<\/td><td class=\"r\">–<\/td><\/tr>\n<tr class=\"sub\"><td>Taxable income (includes Oman branch profit)<\/td><td class=\"r\">7,920,000<\/td><\/tr>\n<tr><td class=\"ind\">CT: 9% × (7,920,000 − 375,000)<\/td><td class=\"r\">679,050<\/td><\/tr>\n<tr><td class=\"ind\">Less: foreign tax credit, lower of 150,000 and 9% × 1,000,000<\/td><td class=\"r\">(90,000)<\/td><\/tr>\n<tr class=\"tot\"><td>CT payable by 30 September 2027<\/td><td class=\"r\">589,050<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Advice point:<\/b> the foreign tax credit already removes all UAE tax on the branch profit (UAE tax 90,000 less credit 90,000). Electing the <b>foreign PE exemption<\/b> would give the same result this year and simplify compliance, but the election covers <b>all<\/b> foreign PEs and means foreign PE losses could not reduce UAE taxable income, so weigh future plans before electing.<\/p>\n<\/div>"},{"title":"Case 2: A free zone manufacturer","html":"<p>See Worked Example 20.1 for the de minimis test. Extend it: Falcon Manufacturing FZE also opens a <b>retail showroom on the mainland<\/b> (a domestic PE) that earns profit of AED 500,000 from sales to individuals.<\/p><div class=\"box eg\"><span class=\"lbl\">SOLUTION<\/span>\n<ul>\n<li>Income attributable to a <b>domestic PE<\/b> is never Qualifying Income: taxed at <b>9% × 500,000 = AED 45,000<\/b> (no 375,000 band for a QFZP).<\/li>\n<li>The mainland PE’s income is dealt with separately from the de minimis test because it is taxed at 9% in any case. By contrast, sales to <b>individuals<\/b> made directly by the free zone entity would be Excluded Activities and would count as non-qualifying revenue.<\/li>\n<li>Total CT = AED 31,500 (rental) + AED 45,000 (PE) = <b>AED 76,500<\/b>, provided all QFZP conditions continue to be met (substance, audit, TP, de minimis, and the AUP report if it relies on Designated Zone distribution).<\/li>\n<\/ul>\n<\/div>"},{"title":"Case 3: Choosing between SBR and normal taxation","html":"<p><b>Bright Minds Training LLC<\/b> (Sharjah) has revenue of AED 2.9m and taxable income of AED 600,000 in 2026. In 2027 it expects revenue of AED 3.5m and a tax loss of AED 400,000 because of expansion.<\/p><div class=\"box eg\"><span class=\"lbl\">SOLUTION<\/span>\n<ul>\n<li>2026: eligible for SBR (revenue ≤ AED 3m in 2026 and all earlier periods). Electing saves 9% × (600,000 − 375,000) = <b>AED 20,250<\/b>.<\/li>\n<li>2027: revenue above AED 3m, so SBR is no longer available, now or later. The 2027 loss can be carried forward because 2027 is not an SBR period.<\/li>\n<li>Lesson: a loss made in a year in which SBR is elected would be lost; when a loss is expected in a year that is still SBR-eligible, it can be better <b>not<\/b> to elect SBR for that year so the loss is preserved.<\/li>\n<\/ul>\n<\/div>"},{"title":"Case 4: Group planning","html":"<p>Use Worked Example 24.1. Ask students to add a fifth company, D, a QFZP owned 100% by P with Qualifying Income of AED 4m, and to explain: (a) why D cannot join the Tax Group; (b) whether A’s losses can be transferred to D (no: QFZPs are excluded); (c) why sales between B and D must be at arm’s length and documented; and (d) whether the group could be within the Top-up Tax (only if the wider MNE group has consolidated revenue of EUR 750m or more).<\/p>"}],"summary":"","review":[]},"ch29":{"id":"ch29","num":"29","kind":"chapter","title":"Tax Procedures: Audits, Disclosures, Refunds and Disputes","short":"Tax Procedures","objectives":["Describe the Tax Procedures Law and its 2026 amendments.","Explain FTA audits, assessments, clarifications and Directives.","Apply the rules on voluntary disclosures, refunds and the <b>statute of limitation<\/b>.","Follow the dispute path from reconsideration to the courts."],"sections":[{"title":"The Tax Procedures Law","html":"<p><b>Federal Decree-Law No. 28 of 2022 on Tax Procedures<\/b> (the “TPL”, in force from 1 March 2023) sets the common rules for all federal taxes: VAT, Excise Tax, Corporate Tax and Top-up Tax. Its <b>Executive Regulation<\/b> is Cabinet Decision No. 74 of 2023.<\/p><div class=\"box upd\"><span class=\"lbl\">UPDATE 2025–26<\/span>\n<ul>\n<li><span class=\"new\">NEW<\/span> <b>FDL 17/2025<\/b> (from 1 January 2026): 5-year time limit for refund claims and use of credit balances, with special windows for late-arising credits; errors corrected through the return unless the FTA requires a Voluntary Disclosure; FTA may audit after 5 years in certain refund cases (completing within 2 years of the claim); FTA power to issue <b>binding Directives<\/b>. The separate limitation rules in the VAT and Excise laws were repealed in favour of the TPL.<\/li>\n<li><span class=\"new\">NEW<\/span> <b>Cabinet Decision 17/2026<\/b> (from 1 April 2026) amended the Executive Regulation: two-track Voluntary Disclosure rule around AED 10,000; extra 2 years of record retention for pending refunds; 20-business-day refund decisions and payment within 5 business days of approval; FTA power to extend document seizures; rules on sharing taxpayer data with other government bodies.<\/li>\n<li><span class=\"new\">NEW<\/span> <b>Cabinet Decision 129/2025<\/b> (from 14 April 2026): new penalty framework (Chapter 30).<\/li>\n<\/ul>\n<\/div>"},{"title":"Obligations of taxpayers","html":"<ul>\n<li>Register, file returns and pay tax on time; notify the FTA of changes to registered details.<\/li>\n<li>Keep books, records and documents for the required period and provide them on request (with Arabic translations if asked).<\/li>\n<li>Cooperate with tax auditors and give access to premises, systems and records.<\/li>\n<li>Appoint a <b>legal representative<\/b> where required (e.g. guardian of a minor, liquidator of a company) who must meet the person’s tax obligations.<\/li>\n<\/ul>"},{"title":"Tax audits and assessments","html":"<p>The FTA can audit any person to check compliance. It usually gives at least <b>5 business days’ notice<\/b> of a field audit, conducts it during official working hours, and may audit at the taxpayer’s premises or the FTA’s office. Auditors may inspect and copy records and, if there is a risk of loss, seize documents and assets (seizure periods can now be extended). After the audit the FTA notifies the result, and may issue a <span class=\"term\">tax assessment<\/span> for tax due plus penalties. Payment is generally due within <b>20 business days<\/b> of an assessment.<\/p>"},{"title":"Clarifications and Directives","html":"<div class=\"tbl\"><table>\n<thead><tr><th>Type<\/th><th>What it is<\/th><th>Binding?<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Private clarification<\/b><\/td><td>The FTA’s answer to a specific taxpayer about its own transaction, on application.<\/td><td>Binds the FTA for that taxpayer and facts.<\/td><\/tr>\n<tr><td><b>Public clarification<\/b> and <b>guides<\/b><\/td><td>General explanations published on the FTA website (e.g. VATP045, CTP011).<\/td><td>Not legally binding, but show the FTA’s approach.<\/td><\/tr>\n<tr><td><span class=\"new\">NEW<\/span> <b>Directives<\/b><\/td><td>Decisions setting how the law applies to specific transactions (five VAT Directives were issued in 2026).<\/td><td>Binding on the FTA <b>and<\/b> taxpayers.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"},{"title":"Voluntary disclosures and corrections","html":"<ul>\n<li>Underpaid tax (or overstated refund) of <b>more than AED 10,000<\/b>: file a <b>Voluntary Disclosure<\/b> within <span class=\"num\">20 business days<\/span> of becoming aware of the error.<\/li>\n<li><b>AED 10,000 or less<\/b>: correct it in the next tax return (or in the return for the period when it is discovered, if earlier); file a Voluntary Disclosure only if no return can carry it.<\/li>\n<li>The penalty is <span class=\"num\">1% per month<\/span> on the tax difference; an extra fixed <span class=\"num\">15%<\/span> applies if the disclosure is made after an audit notification.<\/li>\n<\/ul>"},{"title":"Refunds and the five-year rule","html":"<p>Under Article 38 of the TPL (as amended), a refund of a credit balance must be claimed within <span class=\"num\">5 years<\/span> from the end of the relevant tax period. The start point depends on how the credit arose: an overpayment (the period in which it was paid), a return, VD or FTA decision (the period of that filing or decision), or otherwise the period in which the credit arose. If a credit arises from an FTA decision after the 5 years or in their last 90 days, there is <b>one year<\/b> to claim; for other late credits, <b>90 days<\/b>. Missing the deadline means the right is lost.<\/p>"},{"title":"Statute of limitation","html":"<figure class=\"fig\"><svg aria-label=\"Statute of limitation for FTA audits and assessments\" role=\"img\" viewbox=\"0 0 660 280\" xmlns=\"http://www.w3.org/2000/svg\"><title>Statute of limitation for FTA audits and assessments<\/title><defs><\/defs><line stroke=\"#eef0f2\" stroke-width=\"1\" x1=\"200\" x2=\"200\" y1=\"24\" y2=\"250\"><\/line><text fill=\"#5d6168\" font-size=\"10\" font-weight=\"normal\" text-anchor=\"middle\" x=\"200.0\" y=\"265.5\"><tspan dy=\"0.0\" x=\"200.0\">0<\/tspan><\/text><line stroke=\"#eef0f2\" stroke-width=\"1\" x1=\"226\" x2=\"226\" y1=\"24\" y2=\"250\"><\/line><text fill=\"#5d6168\" font-size=\"10\" font-weight=\"normal\" text-anchor=\"middle\" x=\"226.0\" y=\"265.5\"><tspan dy=\"0.0\" x=\"226.0\">1<\/tspan><\/text><line stroke=\"#eef0f2\" stroke-width=\"1\" x1=\"252\" x2=\"252\" y1=\"24\" y2=\"250\"><\/line><text fill=\"#5d6168\" font-size=\"10\" font-weight=\"normal\" text-anchor=\"middle\" x=\"252.0\" y=\"265.5\"><tspan dy=\"0.0\" x=\"252.0\">2<\/tspan><\/text><line stroke=\"#eef0f2\" stroke-width=\"1\" x1=\"278\" x2=\"278\" y1=\"24\" y2=\"250\"><\/line><text fill=\"#5d6168\" font-size=\"10\" font-weight=\"normal\" text-anchor=\"middle\" x=\"278.0\" y=\"265.5\"><tspan dy=\"0.0\" x=\"278.0\">3<\/tspan><\/text><line stroke=\"#eef0f2\" stroke-width=\"1\" x1=\"304\" x2=\"304\" y1=\"24\" y2=\"250\"><\/line><text fill=\"#5d6168\" font-size=\"10\" font-weight=\"normal\" text-anchor=\"middle\" x=\"304.0\" y=\"265.5\"><tspan dy=\"0.0\" x=\"304.0\">4<\/tspan><\/text><line stroke=\"#eef0f2\" stroke-width=\"1\" x1=\"330\" x2=\"330\" y1=\"24\" y2=\"250\"><\/line><text fill=\"#5d6168\" font-size=\"10\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"265.5\"><tspan dy=\"0.0\" x=\"330.0\">5<\/tspan><\/text><line stroke=\"#eef0f2\" stroke-width=\"1\" x1=\"356\" x2=\"356\" y1=\"24\" y2=\"250\"><\/line><text fill=\"#5d6168\" font-size=\"10\" font-weight=\"normal\" text-anchor=\"middle\" x=\"356.0\" y=\"265.5\"><tspan dy=\"0.0\" x=\"356.0\">6<\/tspan><\/text><line stroke=\"#eef0f2\" stroke-width=\"1\" x1=\"382\" x2=\"382\" y1=\"24\" y2=\"250\"><\/line><text fill=\"#5d6168\" font-size=\"10\" font-weight=\"normal\" text-anchor=\"middle\" x=\"382.0\" y=\"265.5\"><tspan dy=\"0.0\" x=\"382.0\">7<\/tspan><\/text><line stroke=\"#eef0f2\" stroke-width=\"1\" x1=\"408\" x2=\"408\" y1=\"24\" y2=\"250\"><\/line><text fill=\"#5d6168\" font-size=\"10\" font-weight=\"normal\" text-anchor=\"middle\" x=\"408.0\" y=\"265.5\"><tspan dy=\"0.0\" x=\"408.0\">8<\/tspan><\/text><line stroke=\"#eef0f2\" stroke-width=\"1\" x1=\"434\" x2=\"434\" y1=\"24\" y2=\"250\"><\/line><text fill=\"#5d6168\" font-size=\"10\" font-weight=\"normal\" text-anchor=\"middle\" x=\"434.0\" y=\"265.5\"><tspan dy=\"0.0\" x=\"434.0\">9<\/tspan><\/text><line stroke=\"#eef0f2\" stroke-width=\"1\" x1=\"460\" x2=\"460\" y1=\"24\" y2=\"250\"><\/line><text fill=\"#5d6168\" font-size=\"10\" font-weight=\"normal\" text-anchor=\"middle\" x=\"460.0\" y=\"265.5\"><tspan dy=\"0.0\" x=\"460.0\">10<\/tspan><\/text><line stroke=\"#eef0f2\" stroke-width=\"1\" x1=\"486\" x2=\"486\" y1=\"24\" y2=\"250\"><\/line><text fill=\"#5d6168\" font-size=\"10\" font-weight=\"normal\" text-anchor=\"middle\" x=\"486.0\" y=\"265.5\"><tspan dy=\"0.0\" x=\"486.0\">11<\/tspan><\/text><line stroke=\"#eef0f2\" stroke-width=\"1\" x1=\"512\" x2=\"512\" y1=\"24\" y2=\"250\"><\/line><text fill=\"#5d6168\" font-size=\"10\" font-weight=\"normal\" text-anchor=\"middle\" x=\"512.0\" y=\"265.5\"><tspan dy=\"0.0\" x=\"512.0\">12<\/tspan><\/text><line stroke=\"#eef0f2\" stroke-width=\"1\" x1=\"538\" x2=\"538\" y1=\"24\" y2=\"250\"><\/line><text fill=\"#5d6168\" font-size=\"10\" font-weight=\"normal\" text-anchor=\"middle\" x=\"538.0\" y=\"265.5\"><tspan dy=\"0.0\" x=\"538.0\">13<\/tspan><\/text><line stroke=\"#eef0f2\" stroke-width=\"1\" x1=\"564\" x2=\"564\" y1=\"24\" y2=\"250\"><\/line><text fill=\"#5d6168\" font-size=\"10\" font-weight=\"normal\" text-anchor=\"middle\" x=\"564.0\" y=\"265.5\"><tspan dy=\"0.0\" x=\"564.0\">14<\/tspan><\/text><line stroke=\"#eef0f2\" stroke-width=\"1\" x1=\"590\" x2=\"590\" y1=\"24\" y2=\"250\"><\/line><text fill=\"#5d6168\" font-size=\"10\" font-weight=\"normal\" text-anchor=\"middle\" x=\"590.0\" y=\"265.5\"><tspan dy=\"0.0\" x=\"590.0\">15<\/tspan><\/text><text fill=\"#3a3f45\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"395.0\" y=\"279.7\"><tspan dy=\"0.0\" x=\"395.0\">Years after the end of the tax period<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"end\" x=\"192.0\" y=\"45.9\"><tspan dy=\"0.0\" x=\"192.0\">General rule<\/tspan><\/text><g><title>General rule: 5 years<\/title><rect fill=\"#e3f3e3\" height=\"24\" rx=\"5\" stroke=\"#008300\" stroke-width=\"2\" width=\"130\" x=\"200\" y=\"30\"><\/rect><\/g><text fill=\"#1f2328\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"end\" x=\"324.0\" y=\"45.7\"><tspan dy=\"0.0\" x=\"324.0\">5 years<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"end\" x=\"192.0\" y=\"81.8\"><tspan dy=\"0.0\" x=\"192.0\">Audit notified in year 5<\/tspan><\/text><g><title>Audit notified in year 5: up to 4 more years<\/title><rect fill=\"#e6f0fc\" height=\"24\" rx=\"5\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"234\" x=\"200\" y=\"66\"><\/rect><\/g><text fill=\"#1f2328\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"end\" x=\"428.0\" y=\"81.7\"><tspan dy=\"0.0\" x=\"428.0\">up to 4 more years<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"end\" x=\"192.0\" y=\"117.8\"><tspan dy=\"0.0\" x=\"192.0\">Voluntary disclosure in year 5<\/tspan><\/text><g><title>Voluntary disclosure in year 5: +1 year<\/title><rect fill=\"#e0f5ec\" height=\"24\" rx=\"5\" stroke=\"#1baf7a\" stroke-width=\"2\" width=\"156\" x=\"200\" y=\"102\"><\/rect><\/g><text fill=\"#1f2328\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"end\" x=\"350.0\" y=\"117.7\"><tspan dy=\"0.0\" x=\"350.0\">+1 year<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"end\" x=\"192.0\" y=\"147.1\"><tspan dy=\"0.0\" x=\"192.0\">Refund claim in year 5 (from<\/tspan><tspan dy=\"13.4\" x=\"192.0\">2026)<\/tspan><\/text><g><title>Refund claim in year 5 (from 2026): +2 years from the claim<\/title><rect fill=\"#fff4d1\" height=\"24\" rx=\"5\" stroke=\"#eda100\" stroke-width=\"2\" width=\"182\" x=\"200\" y=\"138\"><\/rect><\/g><text fill=\"#1f2328\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"end\" x=\"376.0\" y=\"153.7\"><tspan dy=\"0.0\" x=\"376.0\">+2 years from the claim<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"end\" x=\"192.0\" y=\"189.8\"><tspan dy=\"0.0\" x=\"192.0\">Tax evasion<\/tspan><\/text><g><title>Tax evasion: 15 years<\/title><rect fill=\"#fde4e4\" height=\"24\" rx=\"5\" stroke=\"#e34948\" stroke-width=\"2\" width=\"390\" x=\"200\" y=\"174\"><\/rect><\/g><text fill=\"#1f2328\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"end\" x=\"584.0\" y=\"189.7\"><tspan dy=\"0.0\" x=\"584.0\">15 years<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"end\" x=\"192.0\" y=\"225.8\"><tspan dy=\"0.0\" x=\"192.0\">Failure to register<\/tspan><\/text><g><title>Failure to register: 15 years<\/title><rect fill=\"#fdeadf\" height=\"24\" rx=\"5\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"390\" x=\"200\" y=\"210\"><\/rect><\/g><text fill=\"#1f2328\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"end\" x=\"584.0\" y=\"225.7\"><tspan dy=\"0.0\" x=\"584.0\">15 years<\/tspan><\/text><\/svg><figcaption><b>Figure 29.1<\/b> How long the FTA can audit or assess (simplified).<\/figcaption><\/figure><p>The FTA generally cannot audit or assess a tax period more than <span class=\"num\">5 years<\/span> after its end. Exceptions: if an audit was notified before the 5 years ended, the FTA can complete it within 4 years of the notification; a Voluntary Disclosure filed in year 5 extends the period by 1 year; <b>tax evasion<\/b> or <b>failure to register<\/b> extends it to <span class=\"num\">15 years<\/span>; and from 2026 a refund claim made in year 5 (or in a late window) allows an audit completed within <b>2 years<\/b> of the claim.<\/p>"},{"title":"Disputes","html":"<figure class=\"fig\"><svg aria-label=\"Tax dispute resolution path\" role=\"img\" viewbox=\"0 0 660 260\" xmlns=\"http://www.w3.org/2000/svg\"><title>Tax dispute resolution path<\/title><defs><marker id=\"ar-disp-16324f\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"9\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><marker id=\"ar-disp-16324fs\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"1\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><\/defs><g><rect fill=\"#f1f2f3\" height=\"170\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"150\" x=\"10\" y=\"20\"><\/rect><path d=\"M10,64 V30 Q10,20 20,20 H150 Q160,20 160,30 V64 Z\" fill=\"#8a8f96\"><\/path><text fill=\"#fff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"85.0\" y=\"46.0\"><tspan dy=\"0.0\" x=\"85.0\">FTA decision<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"middle\" x=\"85.0\" y=\"117.6\"><tspan dy=\"0.0\" x=\"85.0\">Assessment, penalty or<\/tspan><tspan dy=\"13.2\" x=\"85.0\">refusal notified to<\/tspan><tspan dy=\"13.2\" x=\"85.0\">you<\/tspan><\/text><\/g><path d=\"M161.0,105.0 L172.0,105.0\" fill=\"none\" marker-end=\"url(#ar-disp-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#e6f0fc\" height=\"170\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"150\" x=\"174\" y=\"20\"><\/rect><path d=\"M174,64 V30 Q174,20 184,20 H314 Q324,20 324,30 V64 Z\" fill=\"#2a78d6\"><\/path><text fill=\"#fff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"249.0\" y=\"46.0\"><tspan dy=\"0.0\" x=\"249.0\">Reconsideration<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"middle\" x=\"249.0\" y=\"104.4\"><tspan dy=\"0.0\" x=\"249.0\">Apply to the FTA<\/tspan><tspan dy=\"13.2\" x=\"249.0\">within 40 business<\/tspan><tspan dy=\"13.2\" x=\"249.0\">days of being<\/tspan><tspan dy=\"13.2\" x=\"249.0\">notified, with grounds<\/tspan><tspan dy=\"13.2\" x=\"249.0\">and evidence<\/tspan><\/text><\/g><path d=\"M325.0,105.0 L336.0,105.0\" fill=\"none\" marker-end=\"url(#ar-disp-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#ebe8fb\" height=\"170\" rx=\"10\" stroke=\"#6250d6\" stroke-width=\"2\" width=\"150\" x=\"338\" y=\"20\"><\/rect><path d=\"M338,64 V30 Q338,20 348,20 H478 Q488,20 488,30 V64 Z\" fill=\"#6250d6\"><\/path><text fill=\"#fff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"413.0\" y=\"39.0\"><tspan dy=\"0.0\" x=\"413.0\">Tax Disputes<\/tspan><tspan dy=\"14.0\" x=\"413.0\">Resolution Committee<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"middle\" x=\"413.0\" y=\"91.3\"><tspan dy=\"0.0\" x=\"413.0\">Object within 40<\/tspan><tspan dy=\"13.2\" x=\"413.0\">business days of the<\/tspan><tspan dy=\"13.2\" x=\"413.0\">FTA's decision;<\/tspan><tspan dy=\"13.2\" x=\"413.0\">disputed tax generally<\/tspan><tspan dy=\"13.2\" x=\"413.0\">paid first; decides<\/tspan><tspan dy=\"13.2\" x=\"413.0\">within 20 business<\/tspan><tspan dy=\"13.2\" x=\"413.0\">days<\/tspan><\/text><\/g><path d=\"M489.0,105.0 L500.0,105.0\" fill=\"none\" marker-end=\"url(#ar-disp-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#fde4e4\" height=\"170\" rx=\"10\" stroke=\"#e34948\" stroke-width=\"2\" width=\"150\" x=\"502\" y=\"20\"><\/rect><path d=\"M502,64 V30 Q502,20 512,20 H642 Q652,20 652,30 V64 Z\" fill=\"#e34948\"><\/path><text fill=\"#fff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"577.0\" y=\"46.0\"><tspan dy=\"0.0\" x=\"577.0\">Federal Court<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"middle\" x=\"577.0\" y=\"111.0\"><tspan dy=\"0.0\" x=\"577.0\">Where the amount in<\/tspan><tspan dy=\"13.2\" x=\"577.0\">dispute exceeds AED<\/tspan><tspan dy=\"13.2\" x=\"577.0\">100,000: appeal within<\/tspan><tspan dy=\"13.2\" x=\"577.0\">40 business days<\/tspan><\/text><\/g><text fill=\"#c8102e\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"224.2\"><tspan dy=\"0.0\" x=\"330.0\">Deadlines are strict: missing one usually ends the right to challenge.<\/tspan><\/text><text fill=\"#5d6168\" font-size=\"10.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"247.7\"><tspan dy=\"0.0\" x=\"330.0\">Check the current Tax Procedures Law and committee rules before relying on any time limit.<\/tspan><\/text><\/svg><figcaption><b>Figure 29.2<\/b> The dispute path.<\/figcaption><\/figure><ol class=\"steps\">\n<li><b>Reconsideration:<\/b> apply to the FTA within 40 business days of being notified of the decision, explaining the grounds and attaching evidence.<\/li>\n<li><b>Tax Disputes Resolution Committee:<\/b> if the FTA rejects the request, object to the Committee within 40 business days of the FTA’s decision; the disputed tax generally must be paid first. The Committee normally decides within 20 business days (extendable).<\/li>\n<li><b>Court:<\/b> where the amount in dispute exceeds <span class=\"num\">AED 100,000<\/span>, the Committee’s decision can be appealed to the competent federal court within 40 business days; otherwise the Committee’s decision is final.<\/li>\n<\/ol><div class=\"box exam\"><span class=\"lbl\">EXAM / CLASS TIP<\/span>\n<p>Many disputes are lost on <b>procedure<\/b>, not substance. Track every FTA notification date, count business days carefully, and file complete evidence at the reconsideration stage.<\/p>\n<\/div>"},{"title":"Tax evasion and information exchange","html":"<p><span class=\"term\">Tax evasion<\/span> (using illegal means to reduce tax, such as false invoices, hiding income, or not registering deliberately) is a criminal offence that can lead to heavy fines and imprisonment, in addition to administrative penalties and the 15-year limitation period. The UAE also exchanges information with foreign tax authorities under treaties, the Common Reporting Standard and country-by-country reporting; Cabinet Decision No. 209 of 2025 sets the procedure for answering foreign requests.<\/p>"}],"summary":["The TPL governs all federal taxes; it was amended from 1 Jan 2026 and its Regulation from 1 Apr 2026.","VD over AED 10,000 within 20 business days; smaller errors in the next return.","Refunds: 5 years; audits: generally 5 years, up to 15 for evasion or non-registration.","Disputes: reconsideration (40 business days) → Committee → court."],"review":[{"q":"What is the difference between a public clarification and a Directive?","a":null},{"q":"A company finds an underpayment of AED 6,000. What are its options?","a":null},{"q":"For a tax period ending 31 December 2026, until when can the FTA normally issue an assessment?","a":"31 December 2031"}],"mcq":[141,142,143]},"ch30":{"id":"ch30","num":"30","kind":"chapter","title":"Administrative Penalties","short":"Administrative Penalties","objectives":["Apply the new VAT/Excise penalty framework in force from <b>14 April 2026<\/b>.","Compare old and new late-payment penalties.","Know the CT and e-invoicing penalty tables and how to challenge a penalty."],"sections":[{"title":"The 2026 reform","html":"<p><b>Cabinet Decision No. 129 of 2025<\/b>, effective <span class=\"num\">14 April 2026<\/span>, revised the penalties for violations of the Tax Procedures Law, VAT Law and Excise Tax Law. It moved away from compounding penalties towards <mark>time-based, proportionate penalties<\/mark> that reward early correction. CT penalties remain in Cabinet Decision No. 75 of 2023 (as amended), which already used a similar approach.<\/p><figure class=\"fig\"><svg aria-label=\"Late payment penalty on AED 100,000 of unpaid VAT: old vs new regime\" role=\"img\" viewbox=\"0 0 660 320\" xmlns=\"http://www.w3.org/2000/svg\"><title>Late payment penalty on AED 100,000 of unpaid VAT: old vs new regime<\/title><defs><\/defs><line stroke=\"#e3e5e8\" stroke-width=\"1\" x1=\"62\" x2=\"510\" y1=\"268.0\" y2=\"268.0\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"end\" x=\"54.0\" y=\"271.9\"><tspan dy=\"0.0\" x=\"54.0\">0k<\/tspan><\/text><line stroke=\"#e3e5e8\" stroke-width=\"1\" x1=\"62\" x2=\"510\" y1=\"223.3\" y2=\"223.3\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"end\" x=\"54.0\" y=\"227.1\"><tspan dy=\"0.0\" x=\"54.0\">10k<\/tspan><\/text><line stroke=\"#e3e5e8\" stroke-width=\"1\" x1=\"62\" x2=\"510\" y1=\"178.5\" y2=\"178.5\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"end\" x=\"54.0\" y=\"182.4\"><tspan dy=\"0.0\" x=\"54.0\">20k<\/tspan><\/text><line stroke=\"#e3e5e8\" stroke-width=\"1\" x1=\"62\" x2=\"510\" y1=\"133.8\" y2=\"133.8\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"end\" x=\"54.0\" y=\"137.7\"><tspan dy=\"0.0\" x=\"54.0\">30k<\/tspan><\/text><line stroke=\"#e3e5e8\" stroke-width=\"1\" x1=\"62\" x2=\"510\" y1=\"89.1\" y2=\"89.1\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"end\" x=\"54.0\" y=\"92.9\"><tspan dy=\"0.0\" x=\"54.0\">40k<\/tspan><\/text><line stroke=\"#e3e5e8\" stroke-width=\"1\" x1=\"62\" x2=\"510\" y1=\"44.4\" y2=\"44.4\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"end\" x=\"54.0\" y=\"4 "#2a78d6\" r=\"4\" stroke=\"#fff\" stroke-width=\"2\"><\/circle><\/g><g><title>New (14% a year) — 6: AED 7,000<\/title><circle cx=\"286.0\" cy=\"236.7\" fill=\"transparent\" r=\"9\"><\/circle><circle cx=\"286.0\" cy=\"236.7\" fill=\"#2a78d6\" r=\"4\" stroke=\"#fff\" stroke-width=\"2\"><\/circle><\/g><g><title>New (14% a year) — 7: AED 8,167<\/title><circle cx=\"323.3\" cy=\"231.5\" fill=\"transparent\" r=\"9\"><\/circle><circle cx=\"323.3\" cy=\"231.5\" fill=\"#2a78d6\" r=\"4\" stroke=\"#fff\" stroke-width=\"2\"><\/circle><\/g><g><title>New (14% a year) — 8: AED 9,333<\/title><circle cx=\"360.7\" cy=\"226.3\" fill=\"transparent\" r=\"9\"><\/circle><circle cx=\"360.7\" cy=\"226.3\" fill=\"#2a78d6\" r=\"4\" stroke=\"#fff\" stroke-width=\"2\"><\/circle><\/g><g><title>New (14% a year) — 9: AED 10,500<\/title><circle cx=\"398.0\" cy=\"221.0\" fill=\"transparent\" r=\"9\"><\/circle><circle cx=\"398.0\" cy=\"221.0\" fill=\"#2a78d6\" r=\"4\" stroke=\"#fff\" stroke-width=\"2\"><\/circle><\/g><g><title>New (14% a year) — 10: AED 11,667<\/title><circle cx=\"435.3\" cy=\"215.8\" fill=\"transparent\" r=\"9\"><\/circle><circle cx=\"435.3\" cy=\"215.8\" fill=\"#2a78d6\" r=\"4\" stroke=\"#fff\" stroke-width=\"2\"><\/circle><\/g><g><title>New (14% a year) — 11: AED 12,833<\/title><circle cx=\"472.7\" cy=\"210.6\" fill=\"transparent\" r=\"9\"><\/circle><circle cx=\"472.7\" cy=\"210.6\" fill=\"#2a78d6\" r=\"4\" stroke=\"#fff\" stroke-width=\"2\"><\/circle><\/g><g><title>New (14% a year) — 12: AED 14,000<\/title><circle cx=\"510.0\" cy=\"205.4\" fill=\"transparent\" r=\"9\"><\/circle><circle cx=\"510.0\" cy=\"205.4\" fill=\"#2a78d6\" r=\"4\" stroke=\"#fff\" stroke-width=\"2\"><\/circle><\/g><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"start\" x=\"518.0\" y=\"202.4\"><tspan dy=\"0.0\" x=\"518.0\">New (14% a year): AED<\/tspan><tspan dy=\"14.0\" x=\"518.0\">14,000<\/tspan><\/text><rect fill=\"#2a78d6\" height=\"4\" rx=\"2\" width=\"16\" x=\"72\" y=\"41\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"start\" x=\"94.0\" y=\"46.9\"><tspan dy=\"0.0\" x=\"94.0\">New (14% a year)<\/tspan><\/text><\/svg><figcaption><b>Chart 30.1<\/b> Late-payment penalty on AED 100,000 of unpaid VAT, old regime versus new. Hover the points for values.<\/figcaption><\/figure>"},{"title":"Key VAT and Excise penalties","html":"<div class=\"tbl\"><table>\n<caption>Table 30.1 Selected penalties under Cabinet Decision 129 of 2025<\/caption>\n<thead><tr><th>Violation<\/th><th>Penalty from 14 April 2026<\/th><th>Before<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Late payment of tax<\/td><td><b>14% per year<\/b>, calculated monthly on the unpaid tax<\/td><td>2% on the due date + 4% per month (cap 300%)<\/td><\/tr>\n<tr><td>Voluntary disclosure (before audit notice)<\/td><td><b>1% per month<\/b> on the tax difference until disclosed<\/td><td>5%–40% fixed<\/td><\/tr>\n<tr><td>Voluntary disclosure after audit notice<\/td><td><b>15%<\/b> fixed + 1% per month<\/td><td>50% fixed + monthly<\/td><\/tr>\n<tr><td>Incorrect tax return<\/td><td>AED 500 (first), AED 2,000 (repeat); none if corrected by the due date or by a VD with no tax effect<\/td><td>AED 1,000 / 2,000<\/td><\/tr>\n<tr><td>Late filing of a return<\/td><td>AED 1,000 (first); AED 2,000 (repeat within 24 months)<\/td><td>Unchanged<\/td><\/tr>\n<tr><td>Late registration<\/td><td>AED 10,000<\/td><td>Unchanged<\/td><\/tr>\n<tr><td>Late deregistration<\/td><td>AED 1,000 per month, up to AED 10,000<\/td><td>Unchanged<\/td><\/tr>\n<tr><td>Failure to update the tax record<\/td><td>AED 1,000 (first); AED 5,000 (repeat)<\/td><td>AED 5,000 / 10,000<\/td><\/tr>\n<tr><td>Failure to provide information in Arabic<\/td><td>AED 5,000<\/td><td>AED 20,000<\/td><\/tr>\n<tr><td>Failure to notify appointment of a legal representative<\/td><td>AED 1,000<\/td><td>AED 10,000<\/td><\/tr>\n<tr><td>Failure to issue a tax invoice or credit note within the legal period<\/td><td>AED 2,500 per case<\/td><td>AED 5,000 per case<\/td><\/tr>\n<tr><td>Failure to keep records<\/td><td>AED 10,000; AED 20,000 for a repeat within 24 months<\/td><td><\/td><\/tr>\n<tr><td>Failure to display VAT-inclusive prices<\/td><td>AED 5,000<\/td><td><\/td><\/tr>\n<\/tbody>\n<\/table><\/div><p class=\"small\">Amounts are summarised from published professional summaries of the Decision; always check the official penalty table on tax.gov.ae before advising.<\/p><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 30.1<\/span>\n<p>VAT of AED 80,000 due on 28 July 2026 is paid on 10 October 2026 (two complete months late). Penalty = 80,000 × 14% × 2/12 = <b>AED 1,866.67<\/b>. Under the old rules it would have been 2% + 2 × 4% = 10% = AED 8,000.<\/p>\n<\/div>"},{"title":"E-invoicing penalties","html":"<div class=\"tbl\"><table>\n<caption>Table 30.2 Cabinet Decision 106 of 2025<\/caption>\n<thead><tr><th>Violation<\/th><th>Penalty<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Failure to implement the e-invoicing system or appoint an Accredited Service Provider on time<\/td><td>AED 5,000 per month (or part)<\/td><\/tr>\n<tr><td>Failure to issue and transmit an electronic invoice on time<\/td><td>AED 100 per invoice, max AED 5,000 per month<\/td><\/tr>\n<tr><td>Failure to issue and transmit an electronic credit note on time<\/td><td>AED 100 per credit note, max AED 5,000 per month<\/td><\/tr>\n<tr><td>Failure to notify the Accredited Service Provider of changes to registered data on time<\/td><td>AED 1,000 per day<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"},{"title":"Challenging a penalty","html":"<p>A taxpayer can ask for <b>reconsideration<\/b> within 40 business days, explaining why the penalty is wrong or should be waived (for example, the FTA system was unavailable, or the error was outside its control), and then follow the dispute path in Chapter 29. Paying promptly and correcting errors voluntarily keeps penalties low under the new time-based approach.<\/p>"}],"summary":["From 14 Apr 2026: late payment 14% a year (monthly); VDs 1% a month (+15% after audit notice).","Several fixed penalties were cut (Arabic, tax record, legal representative, invoices).","E-invoicing penalties: AED 5,000 a month for not implementing; AED 100 per missed e-invoice (capped)."],"review":[{"q":"Calculate the late-payment penalty on AED 50,000 paid 5 complete months late under the new rules.","a":"AED 2,916.67"},{"q":"Why does the new framework encourage voluntary disclosure?","a":null},{"q":"A large business appoints its ASP in December 2026 instead of 30 October 2026. What penalty risk exists?","a":null}],"mcq":[137,138,139,140,144]},"ch31":{"id":"ch31","num":"31","kind":"chapter","title":"E-Invoicing in the UAE","short":"E-Invoicing","objectives":["Explain the UAE’s <b>five-corner Peppol<\/b> e-invoicing model.","Know who is in scope, the exclusions and the 2026–2027 timeline.","Plan an e-invoicing readiness project."],"sections":[{"title":"What is changing?","html":"<p>From 2027 most business-to-business (B2B) and business-to-government (B2G) invoices in the UAE must be <span class=\"term\">electronic invoices<\/span>: <mark>structured data (XML) exchanged between systems<\/mark>, not PDFs or paper. Invoice data is also reported to the FTA almost in real time. The legal framework is <b>Ministerial Decision No. 243 of 2025<\/b> (the system and obligations) and <b>No. 244 of 2025<\/b> (implementation timeline), amended in 2026, with penalties in Cabinet Decision No. 106 of 2025.<\/p>"},{"title":"The five-corner model","html":"<figure class=\"fig\"><svg aria-label=\"The five-corner e-invoicing model\" role=\"img\" viewbox=\"0 0 660 270\" xmlns=\"http://www.w3.org/2000/svg\"><title>The five-corner e-invoicing model<\/title><defs><marker id=\"ar-5c-16324f\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"9\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><marker id=\"ar-5c-16324fs\" markerh
