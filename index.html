<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<link rel="icon" href="/icon.svg" type="image/svg+xml"><link rel="icon" href="/icon-192.png" sizes="192x192"><link rel="apple-touch-icon" href="/apple-touch-icon.png"><link rel="manifest" href="/manifest.webmanifest">
<title>TaxPoint UAE</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#0E5866">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;700;800&display=swap">
<style>/* Layout: one phone-width column; a winding "route" map of chapters, full-screen lesson and quiz sheets slide over it; tab bar fixed at the bottom. */
:root{
  --paper:#EEF3F2; --paper-2:#E2EBEA; --card:#FFFFFF; --ink:#0F2328; --ink-2:#4B5E62; --ink-3:#77898C; --line:#D3DEDD;
  --gulf:#0E5866; --gulf-ink:#FFFFFF; --gulf-soft:#D6EBEB; --saffron:#EE9B2E; --saffron-ink:#3A2200; --saffron-soft:#FBE9CF;
  --good:#1C7F48; --good-soft:#DAF0E2; --bad:#C33137; --bad-soft:#F9DFE0; --violet:#5646C2; --violet-soft:#EBE8FB;
  --figure:#FFFFFF; --shadow:0 1px 2px rgba(15,35,40,.06),0 6px 18px rgba(15,35,40,.08); --scrim:rgba(8,22,26,.45);
  --hl:#FFE27A; --hero:#0E5866; --hero-ink:#FFFFFF;
  --f-display:"Bricolage Grotesque","Avenir Next","Segoe UI",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible","Segoe UI",Roboto,system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Roboto Mono",monospace;
  --r:16px; --r-sm:10px;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.34,1.56,.64,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#0A1517; --paper-2:#0F1E21; --card:#13252A; --ink:#E4EEED; --ink-2:#A3B6B6; --ink-3:#74898A; --line:#24393D;
  --gulf:#5CC0CB; --gulf-ink:#062126; --gulf-soft:#123539; --saffron:#F4AC48; --saffron-ink:#2A1800; --saffron-soft:#3A2A12;
  --good:#52C786; --good-soft:#123020; --bad:#F2737A; --bad-soft:#3B171A; --violet:#AC9FF6; --violet-soft:#221F3F;
  --figure:#F2F6F5; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6); --hl:#8A6A10; --hero:#0F4A54; --hero-ink:#E9F6F5;
  color-scheme:dark }}
:root[data-theme="dark"]{
  --paper:#0A1517; --paper-2:#0F1E21; --card:#13252A; --ink:#E4EEED; --ink-2:#A3B6B6; --ink-3:#74898A; --line:#24393D;
  --gulf:#5CC0CB; --gulf-ink:#062126; --gulf-soft:#123539; --saffron:#F4AC48; --saffron-ink:#2A1800; --saffron-soft:#3A2A12;
  --good:#52C786; --good-soft:#123020; --bad:#F2737A; --bad-soft:#3B171A; --violet:#AC9FF6; --violet-soft:#221F3F;
  --figure:#F2F6F5; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 22px rgba(0,0,0,.35); --scrim:rgba(0,0,0,.6); --hl:#8A6A10; --hero:#0F4A54; --hero-ink:#E9F6F5;
  color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
a{color:inherit}
.brand,.tab,a.btn{text-decoration:none}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 var(--f-body);-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:40;background:var(--paper)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:3px solid var(--saffron);outline-offset:2px;border-radius:8px}
h1,h2,h3,h4{font-family:var(--f-display);line-height:1.15;margin:0;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font:700 11px/1.2 var(--f-body);letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- top bar ---------- */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--paper) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.topbar .wrap{display:flex;align-items:center;gap:8px;padding-block:10px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.brand-mark{width:34px;height:34px;flex:none}
.brand b{font:800 19px/1 var(--f-display);letter-spacing:-.02em}
.brand small{display:block;font:700 10px/1.2 var(--f-body);letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:2px}
.chip{display:inline-flex;align-items:center;gap:5px;height:34px;padding:0 11px;border-radius:999px;background:var(--card);box-shadow:var(--shadow);font:700 14px/1 var(--f-mono);white-space:nowrap}
.chip svg{width:18px;height:18px;flex:none}
.chip.flame{color:var(--saffron)}
.chip.flame.off{color:var(--ink-3)}
.chip.xp{color:var(--gulf)}
.chip.bump{animation:bump .5s var(--spring)}
.iconbtn{width:34px;height:34px;border-radius:999px;display:grid;place-items:center;background:var(--card);box-shadow:var(--shadow);color:var(--ink-2)}
.iconbtn svg{width:18px;height:18px}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.22)}100%{transform:scale(1)}}

/* ---------- tab bar ---------- */
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.tabbar .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:3px;padding:9px 0 8px;font:700 11px/1 var(--f-body);color:var(--ink-3);position:relative}
.tab svg{width:24px;height:24px}
.tab[aria-current="page"]{color:var(--gulf)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 3px 3px;background:var(--saffron);animation:grow .35s var(--ease)}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
main{padding-bottom:calc(88px + env(safe-area-inset-bottom,0px))}
.view{animation:viewIn .35s var(--ease)}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* ---------- generic pieces ---------- */
.panel{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px}
.stack{display:flex;flex-direction:column;gap:12px}
.row{display:flex;align-items:center;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 20px;border-radius:14px;font:800 16px/1 var(--f-display);letter-spacing:.01em;background:var(--gulf);color:var(--gulf-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--gulf) 60%,#000);transition:transform .12s,box-shadow .12s,opacity .2s;user-select:none}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--gulf) 60%,#000)}
.btn.sf{background:var(--saffron);color:var(--saffron-ink);box-shadow:0 4px 0 color-mix(in srgb,var(--saffron) 55%,#000)}
.btn.sf:active{box-shadow:0 1px 0 color-mix(in srgb,var(--saffron) 55%,#000)}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:0 0 0 2px var(--line),0 4px 0 var(--line)}
.btn.ghost:active{box-shadow:0 0 0 2px var(--line),0 1px 0 var(--line)}
.btn.good{background:var(--good);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--good) 55%,#000)}
.btn.bad{background:var(--bad);color:#fff;box-shadow:0 4px 0 color-mix(in srgb,var(--bad) 55%,#000)}
.btn.wide{width:100%}
.btn.sm{min-height:40px;padding:0 14px;font-size:14px;border-radius:12px}
.btn[disabled]{opacity:.4;pointer-events:none}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 9px;border-radius:999px;font:700 12px/1.3 var(--f-body);background:var(--paper-2);color:var(--ink-2)}
.pill.l1{background:var(--good-soft);color:var(--good)}
.pill.l2{background:var(--gulf-soft);color:var(--gulf)}
.pill.l3{background:var(--bad-soft);color:var(--bad)}
.pill.sf{background:var(--saffron-soft);color:color-mix(in srgb,var(--saffron) 70%,var(--ink))}
.bar{height:10px;border-radius:99px;background:var(--paper-2);overflow:hidden}
.bar>i{display:block;height:100%;border-radius:inherit;background:var(--saffron);transform-origin:left;transition:width .6s var(--ease)}
.bar.g>i{background:var(--gulf)}
.sec-title{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:26px 0 10px}
.sec-title h2{font-size:21px}
.sec-title .eyebrow{flex:none}

/* ---------- home: today card ---------- */
.today{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center;margin-top:6px}
.ring{width:78px;height:78px;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .trk{stroke:var(--paper-2)}
.ring .val{stroke:var(--saffron);transition:stroke-dashoffset 1s var(--ease)}
.ring b{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;font:800 18px/1 var(--f-display)}
.ring b small{display:block;font:700 10px/1 var(--f-body);color:var(--ink-3);text-align:center;margin-top:2px}
.continue{margin-top:12px;display:flex;flex-direction:column;gap:12px;background:var(--hero);color:var(--hero-ink);border-radius:20px;padding:18px;position:relative;overflow:hidden}
.continue::after{content:"";position:absolute;right:-30px;top:-30px;width:150px;height:150px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--saffron) 55%,transparent),transparent 70%);opacity:.55;animation:sun 6s ease-in-out infinite alternate}
@keyframes sun{to{transform:translate(-18px,14px) scale(1.12)}}
.continue h3{font-size:22px;position:relative;z-index:1}
.continue .eyebrow{color:color-mix(in srgb,var(--hero-ink) 75%,transparent);position:relative;z-index:1}
.continue .bar{background:color-mix(in srgb,var(--hero-ink) 22%,transparent);position:relative;z-index:1}
.continue .btn{position:relative;z-index:1;align-self:flex-start}

/* ---------- route map ---------- */
.part-head{margin:30px 0 4px;display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:center}
.part-badge{grid-row:span 2;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font:800 15px/1 var(--f-display);background:var(--ink);color:var(--paper)}
.part-head h2{font-size:22px}
.part-head p{font-size:13px;color:var(--ink-2);line-height:1.35}
.route{position:relative;padding:8px 0 4px}
.route svg.trail{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.route svg.trail path{fill:none;stroke:color-mix(in srgb,var(--ink-3) 45%,transparent);stroke-width:5;stroke-linecap:round;stroke-dasharray:2 11}
.route svg.trail path.done{stroke:var(--saffron);stroke-dasharray:none;opacity:.7}
.node{position:relative;z-index:1;display:flex;align-items:center;gap:12px;padding:8px 0;width:100%;text-align:left}
.view .node{animation:nodeIn .5s var(--spring) backwards}
.node .dot{flex:none;width:62px;height:62px;border-radius:50%;position:relative;display:grid;place-items:center;background:var(--card);box-shadow:0 5px 0 var(--line),var(--shadow);font:800 21px/1 var(--f-display);color:var(--ink-2);transition:transform .15s}
.node:active .dot{transform:translateY(3px)}
.node .dot svg.prog{position:absolute;inset:-6px;width:74px;height:74px;transform:rotate(-90deg)}
.node .dot svg.prog circle{fill:none;stroke-width:4}
.node .dot svg.prog .t{stroke:transparent}
.node .dot svg.prog .v{stroke:var(--saffron);stroke-linecap:round}
.node.done .dot{background:var(--gulf);color:var(--gulf-ink);box-shadow:0 5px 0 color-mix(in srgb,var(--gulf) 55%,#000)}
.node.cur .dot{background:var(--saffron);color:var(--saffron-ink);box-shadow:0 5px 0 color-mix(in srgb,var(--saffron) 55%,#000)}
.node.cur .dot::after{content:"";position:absolute;inset:-10px;border-radius:50%;border:3px solid var(--saffron);animation:pulse 1.8s ease-out infinite}
@keyframes pulse{from{transform:scale(.85);opacity:.9}to{transform:scale(1.35);opacity:0}}
@keyframes nodeIn{from{opacity:0;transform:scale(.6) translateY(10px)}}
.node .lab{min-width:0;flex:1}
.node .lab b{display:block;font:700 15px/1.25 var(--f-display)}
.node .lab small{display:block;font-size:12.5px;color:var(--ink-3);margin-top:2px}
.node .stamp-mini{display:inline-block;font:800 9px/1 var(--f-mono);letter-spacing:.12em;color:var(--good);border:1.5px solid currentColor;border-radius:4px;padding:2px 4px;transform:rotate(-6deg);margin-left:4px;vertical-align:2px}
.refgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:10px}
.refcard{display:flex;flex-direction:column;gap:6px;text-align:left;background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);min-height:96px}
.refcard .k{font:800 26px/1 var(--f-display);color:var(--saffron)}
.refcard b{font:700 14px/1.25 var(--f-display)}

/* ---------- full-screen sheets ---------- */
.sheet:focus{outline:none}
.sheet{position:fixed;inset:0;z-index:60;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);animation:sheetIn .38s var(--ease)}
.sheet.closing{animation:sheetOut .28s var(--ease) forwards;pointer-events:none}
@keyframes sheetIn{from{transform:translateY(40px);opacity:0}}
@keyframes sheetOut{to{transform:translateY(40px);opacity:0}}
.sheet-head{flex:none}
.sheet-head .wrap{display:flex;align-items:center;gap:12px;padding-block:10px}
.sheet-head .x{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.sheet-head .x svg{width:24px;height:24px}
.sheet-head .grow{flex:1;min-width:0}
.sheet-head .ttl{font:700 13px/1.2 var(--f-body);color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.segs{display:flex;gap:4px;margin-top:6px}
.segs i{flex:1;height:7px;border-radius:9px;background:var(--paper-2);overflow:hidden;position:relative}
.segs i::after{content:"";position:absolute;inset:0;background:var(--saffron);transform:scaleX(0);transform-origin:left;transition:transform .45s var(--ease)}
.segs i.on::after{transform:scaleX(1)}
.segs i.chk{background:var(--violet-soft)}
.segs i.chk::after{background:var(--violet)}
.sheet-body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.sheet-body .wrap{padding-block:8px 28px}
.sheet-foot{flex:none;border-top:1px solid var(--line);background:var(--card);padding-bottom:env(safe-area-inset-bottom,0px)}
.sheet-foot .wrap{display:flex;gap:10px;padding-block:12px}
.sheet-foot .btn{flex:1}
.sheet-foot .btn.ghost{flex:0 0 auto}
.step{animation:stepIn .42s var(--ease)}
.step.back{animation:stepBack .42s var(--ease)}
@keyframes stepIn{from{opacity:0;transform:translateX(36px)}}
@keyframes stepBack{from{opacity:0;transform:translateX(-36px)}}

/* ---------- lesson prose ---------- */
.prose{font-size:16.5px;line-height:1.62;max-width:65ch}
.prose>*+*{margin-top:14px}
.prose h2{font-size:22px;margin-top:26px;padding-top:14px;border-top:2px dashed var(--line)}
.prose h3{font-size:18.5px;margin-top:22px;color:var(--gulf)}
.prose h4{font-size:16px;color:var(--good)}
.prose ul,.prose ol{padding-left:22px;margin:12px 0 0}
.prose li+li{margin-top:7px}
.prose b,.prose strong{font-weight:700}
.prose a{color:var(--gulf)}
.lesson-title{font-size:27px;margin:4px 0 16px}
.lesson-kicker{display:flex;align-items:center;gap:8px;margin-top:6px}
mark{color:inherit;background:linear-gradient(transparent 55%,var(--hl) 55%) no-repeat;background-size:100% 100%;padding:0 1px;border-radius:2px}
mark.o{background-image:linear-gradient(transparent 55%,var(--saffron-soft) 55%)}
mark.g{background-image:linear-gradient(transparent 55%,var(--good-soft) 55%)}
.num{font-family:var(--f-mono);font-size:.9em;font-weight:700;background:var(--gulf-soft);color:var(--gulf);padding:1px 6px;border-radius:6px;white-space:nowrap;display:inline-block;line-height:1.35}
.term{font-weight:700;color:var(--bad)}
.new{display:inline-block;font:800 10px/1.6 var(--f-body);letter-spacing:.08em;background:var(--bad);color:#fff;padding:0 6px;border-radius:6px;vertical-align:2px;margin-right:3px}
.ans{color:var(--good);font-weight:700}
.tbl{overflow-x:auto;margin-top:14px;border-radius:12px;box-shadow:inset 0 0 0 1px var(--line);-webkit-overflow-scrolling:touch}
.tbl table{border-collapse:collapse;width:100%;min-width:100%;font-size:14px;line-height:1.4}
.tbl caption{caption-side:top;text-align:left;font:700 13px/1.3 var(--f-display);color:var(--ink-2);padding:10px 12px 6px}
.tbl th{background:var(--ink);color:var(--paper);text-align:left;padding:9px 10px;font:700 13px/1.25 var(--f-body);vertical-align:bottom}
.tbl td{padding:9px 10px;border-top:1px solid var(--line);vertical-align:top}
.tbl tbody tr:nth-child(even) td{background:color-mix(in srgb,var(--paper-2) 55%,transparent)}
.tbl td.r,.tbl th.r{text-align:right;white-space:nowrap;font-family:var(--f-mono);font-size:13px}
.tbl td.c,.tbl th.c{text-align:center}
.tbl tr.tot td{font-weight:800;background:var(--gulf-soft)!important;border-top:2px solid var(--gulf)}
.tbl tr.sub td{font-weight:700;background:var(--saffron-soft)!important}
.tbl td.ind{padding-left:22px}
.tbl table.calc td:first-child{min-width:60%}
.fig{margin:16px 0 0;background:var(--figure);border-radius:14px;padding:10px;box-shadow:inset 0 0 0 1px var(--line)}
.fig svg{display:block;width:100%;height:auto}
.fig svg text{font-family:var(--f-body)}
.fig figcaption{font-size:12.5px;color:#4B5E62;text-align:center;margin-top:6px;line-height:1.35}
.fig figcaption b{color:#0E5866}
.fig figcaption:empty{display:none}
.fig.zoomable{cursor:zoom-in}
.box{border-radius:14px;padding:14px 14px 14px;position:relative;background:var(--bx-bg);box-shadow:inset 0 0 0 1.5px var(--bx)}
.box>.lbl{display:inline-block;font:800 11px/1 var(--f-body);letter-spacing:.09em;padding:5px 9px;border-radius:7px;background:var(--bx);color:var(--bx-ink,#fff);margin-bottom:10px}
.box>*+*:not(.lbl+*){margin-top:10px}
.box ul,.box ol{padding-left:20px}
.box.key{--bx:var(--gulf);--bx-bg:var(--gulf-soft);--bx-ink:var(--gulf-ink)}
.box.exam{--bx:var(--violet);--bx-bg:var(--violet-soft);--bx-ink:var(--card)}
.box.eg{--bx:var(--good);--bx-bg:var(--good-soft);--bx-ink:var(--card)}
.box.warn{--bx:var(--bad);--bx-bg:var(--bad-soft);--bx-ink:var(--card)}
.box.upd{--bx:var(--saffron);--bx-bg:var(--saffron-soft);--bx-ink:var(--saffron-ink)}
.box.law,.box.think{--bx:var(--ink-3);--bx-bg:var(--paper-2);--bx-ink:var(--card)}
.box .tbl{background:var(--card)}
.formula{background:var(--ink);color:var(--paper);border-radius:14px;padding:14px 16px;font:700 16px/1.4 var(--f-display);text-align:center}
.formula small{display:block;font:400 13px/1.4 var(--f-body);opacity:.75;margin-top:6px}
.grid2,.grid3{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:430px){.grid2{grid-template-columns:1fr 1fr}}
.grid2>*,.grid3>*{min-width:0}
.card{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:inset 0 0 0 1.5px var(--line)}
.card h4{margin-bottom:6px}
.card p{font-size:15px}
.steps{list-style:none;padding-left:0!important;counter-reset:s}
.steps>li{counter-increment:s;position:relative;padding-left:58px;min-height:26px}
.steps>li::before{content:"Step " counter(s);position:absolute;left:0;top:2px;font:800 10.5px/1 var(--f-body);letter-spacing:.04em;background:var(--saffron);color:var(--saffron-ink);border-radius:6px;padding:5px 6px}
.qs{padding-left:22px}
.small{font-size:13.5px;color:var(--ink-2)}
.legend-hl{display:flex;flex-wrap:wrap;gap:8px 14px;font-size:14px}
.glossary .gl{padding:10px 0;border-top:1px solid var(--line)}
.glossary dt{font:700 15px/1.3 var(--f-display);color:var(--bad)}
.glossary dd{margin:4px 0 0}
.srcs li{word-break:break-word;font-size:14px}
.reveal-sol{margin-top:14px}
.reveal-sol>.btn{width:100%}

/* scroll-driven reveals (Chrome on Android supports these) */
@media (prefers-reduced-motion:no-preference){
  @supports (animation-timeline:view()){
    :root:not(.calm) .prose>*{animation:rise linear both;animation-timeline:view();animation-range:entry 0% entry 55%}
    :root:not(.calm) .prose mark{animation:sweep linear both;animation-timeline:view();animation-range:entry 30% cover 35%;background-size:0% 100%}
    :root:not(.calm) .prose .num{animation:popn linear both;animation-timeline:view();animation-range:entry 20% cover 30%}
  }
}
@keyframes rise{from{opacity:.0;transform:translateY(22px)}to{opacity:1;transform:none}}
@keyframes sweep{to{background-size:100% 100%}}
@keyframes popn{from{transform:scale(.7);opacity:.3}60%{transform:scale(1.12)}to{transform:none;opacity:1}}

/* figure draw-in */
.fig.draw svg>g,.fig.draw svg>text,.fig.draw svg>rect,.fig.draw svg>circle,.fig.draw svg>polygon,.fig.draw svg>line,.fig.draw svg>path{animation:figIn .55s var(--ease) backwards;animation-delay:calc(var(--i,0) * 45ms)}
.fig.draw svg [data-draw]{stroke-dasharray:1;stroke-dashoffset:1;animation:drawLine .9s var(--ease) forwards;animation-delay:calc(var(--i,0) * 45ms + .15s)}
@keyframes figIn{from{opacity:0;transform:translateY(6px) scale(.98)}}
@keyframes drawLine{to{stroke-dashoffset:0}}

/* ---------- intro / summary / done ---------- */
.intro-hero{display:grid;gap:12px;padding:8px 0 4px}
.chbig{font:800 92px/.85 var(--f-display);color:var(--saffron);letter-spacing:-.04em;animation:chIn .7s var(--spring)}
@keyframes chIn{from{opacity:0;transform:translateY(20px) scale(.8)}}
.objs{list-style:none;padding:0;margin:4px 0 0;display:grid;gap:10px}
.objs li{display:grid;grid-template-columns:28px 1fr;gap:10px;align-items:start;background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow);animation:rise .5s var(--ease) backwards}
.objs li .tick{width:28px;height:28px;border-radius:50%;background:var(--gulf-soft);color:var(--gulf);display:grid;place-items:center;font:800 13px/1 var(--f-display)}
.facts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fact{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.fact b{display:block;font:800 22px/1 var(--f-display)}
.fact small{font-size:12px;color:var(--ink-3)}
.takeaways{display:grid;gap:10px;margin-top:6px}
.take{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow);animation:rise .55s var(--ease) backwards}
.take svg{width:34px;height:34px}
.take svg path{stroke-dasharray:30;stroke-dashoffset:30;animation:dash .5s var(--ease) forwards}
@keyframes dash{to{stroke-dashoffset:0}}
.done-wrap{display:grid;justify-items:center;text-align:center;gap:14px;padding-top:18px}
.stamp{font:800 34px/1 var(--f-mono);letter-spacing:.14em;color:var(--good);border:5px double currentColor;padding:10px 18px;border-radius:12px;transform:rotate(-8deg);animation:stampIn .55s cubic-bezier(.2,1.4,.4,1) .2s backwards;mix-blend-mode:normal}
.stamp.bad{color:var(--bad)}
@keyframes stampIn{from{opacity:0;transform:rotate(-8deg) scale(2.6)}70%{opacity:1;transform:rotate(-8deg) scale(.92)}to{transform:rotate(-8deg) scale(1)}}
.certificate{width:100%;background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow);text-align:left;position:relative;overflow:hidden}
.certificate::before{content:"";position:absolute;inset:8px;border:1.5px dashed var(--line);border-radius:12px;pointer-events:none}
.certificate dl{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;margin:10px 0 0;font-size:14px}
.certificate dt{color:var(--ink-3)}
.certificate dd{margin:0;font-weight:700;text-align:right}

/* ---------- MCQ ---------- */
.q-meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.q-text{font:700 20px/1.35 var(--f-display);letter-spacing:-.005em}
.opts-list{display:grid;gap:10px;margin-top:18px}
.opt{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:center;text-align:left;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:0 0 0 2px var(--line),0 4px 0 var(--line);font-size:16px;line-height:1.35;transition:transform .12s,box-shadow .2s,background .2s;animation:rise .4s var(--ease) backwards}
.opt:active{transform:translateY(3px)}
.opt .k{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;font:800 15px/1 var(--f-mono);background:var(--paper-2);color:var(--ink-2);transition:background .2s,color .2s}
.opt.sel{box-shadow:0 0 0 2.5px var(--gulf),0 4px 0 var(--gulf);background:var(--gulf-soft)}
.opt.sel .k{background:var(--gulf);color:var(--gulf-ink)}
.opt.right{box-shadow:0 0 0 2.5px var(--good),0 4px 0 var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{box-shadow:0 0 0 2.5px var(--bad),0 4px 0 var(--bad);background:var(--bad-soft);animation:shake .45s}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt.dim{opacity:.55}
.opt[disabled]{cursor:default}
.opt.right.reveal{animation:glow 1s ease-in-out 2}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
@keyframes glow{50%{box-shadow:0 0 0 5px var(--good),0 4px 0 var(--good)}}
.fb{margin-top:16px;border-radius:16px;padding:14px 16px;animation:fbIn .35s var(--ease)}
.fb.ok{background:var(--good-soft)}
.fb.no{background:var(--bad-soft)}
.fb h4{font:800 18px/1.2 var(--f-display);display:flex;align-items:center;gap:8px}
.fb.ok h4{color:var(--good)}
.fb.no h4{color:var(--bad)}
.fb p{margin-top:6px;font-size:15px}
@keyframes fbIn{from{opacity:0;transform:translateY(14px)}}
.timer{font:700 14px/1 var(--f-mono);padding:6px 10px;border-radius:9px;background:var(--card);box-shadow:var(--shadow)}
.timer.low{color:var(--bad)}

/* results */
.result{display:grid;justify-items:center;text-align:center;gap:10px;padding-top:12px}
.score-ring{width:170px;height:170px;position:relative}
.score-ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.score-ring .trk{stroke:var(--paper-2)}
.score-ring .val{stroke:var(--good);transition:stroke-dashoffset 1.2s var(--ease)}
.score-ring b{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;font:800 44px/1 var(--f-display)}
.score-ring b small{display:block;font:700 13px/1 var(--f-body);color:var(--ink-3);margin-top:4px}
.notice{width:100%;text-align:left;background:var(--card);border-radius:16px;box-shadow:var(--shadow);overflow:hidden}
.notice .nh{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--ink);color:var(--paper);font:700 12px/1.2 var(--f-mono);letter-spacing:.08em}
.notice .nr{display:flex;justify-content:space-between;gap:10px;padding:10px 14px;border-top:1px solid var(--line);font-size:14.5px}
.notice .nr span:last-child{font:700 14px/1.3 var(--f-mono);text-align:right}
.wronglist{width:100%;display:grid;gap:10px;text-align:left}
.wrongitem{background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow);font-size:14.5px}
.wrongitem b{font-family:var(--f-display)}
.wrongitem .ra{color:var(--good);font-weight:700;margin-top:6px}

/* ---------- practice hub ---------- */
.hub{display:grid;gap:10px}
.tile{display:grid;grid-template-columns:52px 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);transition:transform .12s}
.tile:active{transform:scale(.98)}
.tile .ic{width:52px;height:52px;border-radius:14px;display:grid;place-items:center;font:800 18px/1 var(--f-display)}
.tile .ic svg{width:28px;height:28px}
.tile b{display:block;font:700 16px/1.25 var(--f-display)}
.tile small{display:block;color:var(--ink-2);font-size:13px;margin-top:2px;line-height:1.35}
.tile .meta{font:700 13px/1 var(--f-mono);color:var(--ink-3);text-align:right}
.ic.c1{background:var(--gulf-soft);color:var(--gulf)}
.ic.c2{background:var(--saffron-soft);color:color-mix(in srgb,var(--saffron) 75%,var(--ink))}
.ic.c3{background:var(--violet-soft);color:var(--violet)}
.ic.c4{background:var(--good-soft);color:var(--good)}
.ic.c5{background:var(--bad-soft);color:var(--bad)}
.setgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.setcard{display:flex;flex-direction:column;gap:8px;text-align:left;background:var(--card);border-radius:16px;padding:14px;box-shadow:var(--shadow);min-height:132px}
.setcard .no{font:800 13px/1 var(--f-mono);color:var(--saffron)}
.setcard b{font:700 14.5px/1.25 var(--f-display);flex:1}
.setcard .bar{height:7px}
.setcard small{font-size:12px;color:var(--ink-3)}

/* ---------- swipe cards (true/false, flashcards) ---------- */
.deck{position:relative;height:min(58vh,420px);margin-top:8px;perspective:1200px}
.scard{position:absolute;inset:0;border-radius:22px;background:var(--card);box-shadow:var(--shadow),0 0 0 1.5px var(--line);padding:22px;display:flex;flex-direction:column;justify-content:center;gap:12px;touch-action:pan-y;user-select:none;transition:transform .35s var(--ease),opacity .35s}
.scard.under{transform:translateY(14px) scale(.95);opacity:.75}
.scard.under2{transform:translateY(28px) scale(.9);opacity:.45}
.scard .stxt{font:700 21px/1.35 var(--f-display)}
.scard .hint{font-size:13px;color:var(--ink-3)}
.scard .vstamp{position:absolute;top:22px;font:800 26px/1 var(--f-mono);letter-spacing:.14em;border:4px double currentColor;border-radius:10px;padding:6px 10px;opacity:0;pointer-events:none}
.scard .vstamp.t{left:20px;color:var(--good);transform:rotate(-12deg)}
.scard .vstamp.f{right:20px;color:var(--bad);transform:rotate(12deg)}
.scard.fly-r{transform:translateX(130%) rotate(18deg)!important;opacity:0;transition:transform .45s ease-in,opacity .45s}
.scard.fly-l{transform:translateX(-130%) rotate(-18deg)!important;opacity:0;transition:transform .45s ease-in,opacity .45s}
.choicebar{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.cls-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.cls-btn{display:grid;gap:2px;justify-items:start;text-align:left;padding:12px 14px;border-radius:14px;background:var(--card);box-shadow:0 0 0 2px var(--line),0 4px 0 var(--line);transition:transform .12s}
.cls-btn:active{transform:translateY(3px)}
.cls-btn b{font:800 22px/1 var(--f-mono)}
.cls-btn small{font-size:12.5px;color:var(--ink-2)}
.cls-btn.S b{color:var(--gulf)}.cls-btn.Z b{color:var(--good)}.cls-btn.E b{color:color-mix(in srgb,var(--saffron) 75%,var(--ink))}.cls-btn.O b{color:var(--ink-3)}
.cls-btn.right{box-shadow:0 0 0 2.5px var(--good),0 4px 0 var(--good);background:var(--good-soft)}
.cls-btn.wrong{box-shadow:0 0 0 2.5px var(--bad),0 4px 0 var(--bad);background:var(--bad-soft);animation:shake .45s}

.flip{position:relative;height:min(52vh,380px);perspective:1200px;margin-top:8px}
.flip .inner{position:absolute;inset:0;transition:transform .6s var(--ease);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.flip .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:22px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:12px;box-shadow:var(--shadow),0 0 0 1.5px var(--line);overflow:auto}
.flip .front{background:var(--card)}
.flip .backf{background:var(--hero);color:var(--hero-ink);transform:rotateY(180deg)}
.flip .backf .eyebrow{color:color-mix(in srgb,var(--hero-ink) 70%,transparent)}
.flip .ftxt{font:700 22px/1.3 var(--f-display)}
.flip .btxt{font:700 19px/1.4 var(--f-body)}
.flip .btxt .num{background:color-mix(in srgb,var(--gulf-ink) 18%,transparent);color:inherit}
.blank-fill{display:inline-block;min-width:3ch;border-bottom:3px solid var(--saffron);padding:0 4px;font-family:var(--f-mono);color:var(--saffron)}
.grade{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.grade .btn{padding:0 8px;font-size:14px;min-height:46px}

/* ---------- reveal (practical/case) ---------- */
.qcard{background:var(--card);border-radius:18px;padding:18px;box-shadow:var(--shadow)}
.qcard .pn{font:800 13px/1 var(--f-mono);color:var(--saffron)}
.answer{margin-top:14px;border-radius:16px;background:var(--gulf-soft);padding:16px;animation:fbIn .4s var(--ease)}
.answer .eyebrow{color:var(--gulf);margin-bottom:6px}
.solstep{animation:fbIn .45s var(--ease);margin-top:12px;background:var(--card);border-radius:14px;padding:14px;box-shadow:var(--shadow)}
.solstep .sn{font:800 11px/1 var(--f-mono);letter-spacing:.1em;color:var(--good);margin-bottom:8px}
.marks{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.marks button{min-width:42px;height:42px;border-radius:12px;font:700 15px/1 var(--f-mono);background:var(--card);box-shadow:0 0 0 2px var(--line)}
.marks button.on{background:var(--gulf);color:var(--gulf-ink);box-shadow:none}
.plist{display:grid;gap:8px}
.pitem{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;text-align:left;background:var(--card);border-radius:14px;padding:12px 14px;box-shadow:var(--shadow)}
.pitem .pn{font:800 13px/1 var(--f-mono);color:var(--saffron);min-width:30px}
.pitem b{font:700 15px/1.3 var(--f-display)}
.dotst{width:12px;height:12px;border-radius:50%;background:var(--paper-2);box-shadow:inset 0 0 0 1.5px var(--line)}
.dotst.g{background:var(--good);box-shadow:none}.dotst.p{background:var(--saffron);box-shadow:none}.dotst.m{background:var(--bad);box-shadow:none}

/* ---------- VAT chain ---------- */
.chain{display:grid;gap:10px;margin-top:10px}
.link{background:var(--card);border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);display:grid;gap:8px}
.link h4{font:700 16px/1.2 var(--f-display)}
.link .small b{color:var(--ink)}
.link .flds{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.fld{display:grid;gap:4px}
.fld label{font:700 11px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.fld input{width:100%;min-width:0;height:44px;border-radius:10px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:700 16px/1 var(--f-mono);padding:0 8px;text-align:right}
.fld input.ok{border-color:var(--good);background:var(--good-soft)}
.fld input.no{border-color:var(--bad);background:var(--bad-soft);animation:shake .4s}
.fld input[readonly]{border-style:dashed;color:var(--ink-3)}
.fta{position:relative;background:var(--ink);color:var(--paper);border-radius:16px;padding:16px;display:flex;justify-content:space-between;align-items:center;overflow:hidden}
.fta b{font:800 26px/1 var(--f-mono)}
.coin{position:fixed;width:22px;height:22px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#FFE7A8,var(--saffron) 60%,#B86F0E);box-shadow:0 0 0 2px #B86F0E inset;z-index:90;pointer-events:none}

/* ---------- tools ---------- */
.tool{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:16px;display:grid;gap:12px}
.tool h3{font-size:19px}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;background:var(--paper-2);border-radius:12px;padding:4px;gap:4px}
.seg button{min-height:38px;border-radius:9px;font:700 13.5px/1.2 var(--f-body);color:var(--ink-2);padding:0 6px}
.seg button[aria-pressed="true"]{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.inp{display:grid;gap:5px}
.inp label{font:700 12px/1 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.inp input,.inp select{width:100%;height:50px;border-radius:12px;border:2px solid var(--line);background:var(--paper);color:var(--ink);font:700 18px/1 var(--f-mono);padding:0 12px}
.inp select{font:700 15px/1 var(--f-body)}
.inp input[type=range]{height:30px;padding:0;border:0;background:none;accent-color:var(--saffron)}
.outs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.out{background:var(--paper);border-radius:12px;padding:10px}
.out small{display:block;font:700 11px/1.2 var(--f-body);letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3)}
.out b{display:block;font:800 17px/1.2 var(--f-mono);margin-top:5px;word-break:break-all}
.out.hi{background:var(--saffron-soft)}
.out.hi b{color:color-mix(in srgb,var(--saffron) 70%,var(--ink))}
.formline{font:700 13px/1.4 var(--f-mono);color:var(--ink-2);background:var(--paper);border-radius:10px;padding:8px 10px}
.stackbar{display:flex;height:34px;border-radius:10px;overflow:hidden;background:var(--paper-2)}
.stackbar i{display:grid;place-items:center;font:700 11px/1 var(--f-mono);transition:flex-grow .7s var(--ease);min-width:0;overflow:hidden;white-space:nowrap}
.stackbar .z{background:var(--gulf-soft);color:var(--gulf)}
.stackbar .t{background:var(--saffron);color:var(--saffron-ink)}
.cmp{display:grid;gap:8px}
.cmp .r{display:grid;grid-template-columns:76px 1fr auto;gap:10px;align-items:center;font-size:13.5px}
.cmp .r .bar{height:16px}
.cmp .r b{font:700 13.5px/1 var(--f-mono)}
.cmp .r.old .bar>i{background:var(--bad)}
.cmp .r.new .bar>i{background:var(--good)}
.dline{display:grid;gap:4px;background:var(--gulf-soft);border-radius:14px;padding:14px}
.dline b{font:800 24px/1.1 var(--f-display);color:var(--gulf)}
.dline small{color:var(--ink-2);font-size:13.5px}

/* ---------- progress ---------- */
.cert{background:var(--card);border-radius:20px;box-shadow:var(--shadow);overflow:hidden}
.cert .top{background:var(--hero);color:var(--hero-ink);padding:16px 18px;position:relative;overflow:hidden}
.cert .top::after{content:"";position:absolute;right:-24px;bottom:-40px;width:140px;height:140px;border-radius:50%;border:16px solid color-mix(in srgb,var(--saffron) 60%,transparent);opacity:.5}
.cert .top .eyebrow{color:color-mix(in srgb,var(--hero-ink) 70%,transparent)}
.cert .top h2{font-size:26px;margin-top:6px;position:relative;z-index:1}
.cert .trn{font:700 13px/1 var(--f-mono);letter-spacing:.08em;margin-top:8px;opacity:.85;position:relative;z-index:1}
.cert .bot{padding:14px 18px;display:grid;gap:8px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.stat{background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--shadow)}
.stat b{display:block;font:800 22px/1 var(--f-display)}
.stat small{display:block;font-size:12px;color:var(--ink-3);margin-top:4px;line-height:1.25}
.heat{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;margin-top:10px}
.heat i{display:block;width:100%;aspect-ratio:1;border-radius:6px;background:var(--paper-2)}
.heat i.h1{background:color-mix(in srgb,var(--saffron) 35%,var(--paper-2))}
.heat i.h2{background:color-mix(in srgb,var(--saffron) 65%,var(--paper-2))}
.heat i.h3{background:var(--saffron)}
.heat i.today{box-shadow:inset 0 0 0 2px var(--ink)}
.heatlab{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:5px;font:700 10px/1 var(--f-body);color:var(--ink-3);text-align:center;margin-top:8px}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.badge{display:grid;justify-items:center;text-align:center;gap:6px;background:var(--card);border-radius:14px;padding:12px 6px;box-shadow:var(--shadow)}
.badge .med{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:var(--saffron-soft);color:color-mix(in srgb,var(--saffron) 75%,var(--ink));font:800 16px/1 var(--f-display)}
.badge.lock{opacity:.45;filter:grayscale(1)}
.badge b{font:700 12.5px/1.2 var(--f-display)}
.badge small{font-size:11px;color:var(--ink-3);line-height:1.25}
.acc{display:grid;gap:10px;margin-top:10px}
.acc .r{display:grid;grid-template-columns:1fr auto;gap:6px;font-size:14px}
.acc .r .bar{grid-column:1/-1;height:8px}
.setting{display:grid;gap:8px;padding:12px 0;border-top:1px solid var(--line)}
.setting:first-child{border-top:0;padding-top:0}
.setting>span{font:700 14px/1.2 var(--f-display)}
.syncline{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--ink-2)}
.syncline i{width:9px;height:9px;border-radius:50%;background:var(--ink-3)}
.syncline i.on{background:var(--good)}

/* ---------- overlays: toasts, xp float, level up, zoom ---------- */
.toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 12px);transform:translateX(-50%);z-index:95;background:var(--ink);color:var(--paper);border-radius:14px;padding:10px 16px;font:700 14px/1.3 var(--f-body);box-shadow:var(--shadow);display:block;width:max-content;max-width:calc(100% - 32px);animation:toastIn .45s var(--spring)}
.toast svg,.toast .pill{display:inline-flex;vertical-align:-4px;margin-right:6px}
.toast.out{animation:toastOut .3s ease-in forwards}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,-30px)}}
@keyframes toastOut{to{opacity:0;transform:translate(-50%,-30px)}}
.xpfloat{position:fixed;z-index:96;font:800 18px/1 var(--f-display);color:var(--saffron);pointer-events:none;text-shadow:0 2px 0 var(--card),0 0 12px var(--card);animation:xpUp 1.1s var(--ease) forwards}
@keyframes xpUp{0%{opacity:0;transform:translateY(10px) scale(.7)}20%{opacity:1;transform:translateY(0) scale(1.15)}100%{opacity:0;transform:translateY(-70px) scale(1)}}
.modal{position:fixed;inset:0;z-index:92;background:var(--scrim);display:grid;place-items:center;padding:24px;animation:fadeIn .3s}
.modal .box2{background:var(--card);border-radius:24px;padding:26px 20px 20px;width:100%;max-width:360px;text-align:center;display:grid;gap:12px;justify-items:center;animation:popIn .55s var(--spring);position:relative;overflow:hidden}
.modal .rays{position:absolute;inset:-60%;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--saffron) 22%,transparent) 0 10deg,transparent 10deg 20deg);animation:spin 14s linear infinite;z-index:0}
.modal .box2>*{position:relative;z-index:1}
.modal .lvl{width:96px;height:96px;border-radius:28px;display:grid;place-items:center;background:var(--saffron);color:var(--saffron-ink);font:800 44px/1 var(--f-display);transform:rotate(-6deg)}
@keyframes popIn{from{opacity:0;transform:scale(.7)}}
@keyframes fadeIn{from{opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
.zoom{position:fixed;inset:0;z-index:94;background:var(--scrim);display:flex;flex-direction:column;animation:fadeIn .25s}
.zoom .zbar{display:flex;justify-content:flex-end;padding:calc(env(safe-area-inset-top,0px) + 8px) 12px 8px}
.zoom .zin{flex:1;overflow:auto;padding:0 12px calc(env(safe-area-inset-bottom,0px) + 16px)}
.zoom .zin .fig{width:900px;max-width:none;margin:0}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:97}

/* ---------- motion preferences ---------- */
:root.calm *,:root.calm *::before,:root.calm *::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
@media (min-width:600px){.deck,.flip{height:420px}}

/* icon sizing + extras */
.btn svg{width:20px;height:20px;flex:none}
.toast svg{width:18px;height:18px;flex:none;color:var(--saffron)}
.fb h4 svg{width:20px;height:20px;flex:none}
.ra svg,.panel .small svg{width:16px;height:16px;vertical-align:-3px}
.tool .row>svg{width:24px;height:24px;color:var(--ink-3)}
.tile .meta svg{width:18px;height:18px}
.slices{display:grid;grid-template-columns:repeat(21,1fr);gap:3px}
.slices i{aspect-ratio:1;border-radius:4px;background:var(--gulf-soft);box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--gulf) 25%,transparent)}
.slices i.v{background:var(--saffron);box-shadow:none}
.slices.pop i{animation:popn .45s var(--spring) backwards}
.chip[data-combo]{height:30px;font-size:13px}
.q-meta .pill{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
</style>

<script type="application/json" id="D">{"parts":[{"id":"part1","no":"PART I","title":"Foundations","desc":"The UAE, why it introduced taxes, how tax law is made, who administers it, and the online platform every taxpayer uses.","chapters":["ch1","ch2"]},{"id":"part2","no":"PART II","title":"Value Added Tax","desc":"Federal Decree-Law No. 8 of 2017 and its Executive Regulation: how VAT works, who must register, how to classify and value supplies, when input tax can be recovered, and how to invoice, file and claim refunds.","chapters":["ch3","ch4","ch5","ch6","ch7","ch8","ch9","ch10","ch11","ch12","ch13","ch14","ch15","ch16"]},{"id":"part3","no":"PART III","title":"Corporate Tax","desc":"Federal Decree-Law No. 47 of 2022 on the Taxation of Corporations and Businesses: who is taxed, how taxable income is calculated, free zones, groups, transfer pricing, the 15% Top-up Tax, incentives and compliance.","chapters":["ch17","ch18","ch19","ch20","ch21","ch22","ch23","ch24","ch25","ch26","ch27","ch28"]},{"id":"part4","no":"PART IV","title":"Tax Administration & Practice","desc":"The Tax Procedures Law that governs every federal tax, the penalty framework, mandatory e-invoicing from 2027, and how to start and grow a career in UAE tax.","chapters":["ch29","ch30","ch31","ch32","ch33"]},{"id":"appx","no":"APPENDICES","title":"Reference & Practice","desc":"Quick-reference numbers, a compliance calendar, a glossary, practice questions with answers, the legislation list and sources.","chapters":["appA","appB","appC","appD","appE","appF"]}],"order":["ch1","ch2","ch3","ch4","ch5","ch6","ch7","ch8","ch9","ch10","ch11","ch12","ch13","ch14","ch15","ch16","ch17","ch18","ch19","ch20","ch21","ch22","ch23","ch24","ch25","ch26","ch27","ch28","ch29","ch30","ch31","ch32","ch33","appA","appB","appC","appD","appE","appF"],"chapters":{"ch1":{"id":"ch1","num":"1","kind":"chapter","title":"The UAE and its Tax System","short":"The UAE and its Tax System","objectives":["Describe the UAE federation, its emirates, mainland and free zones.","Explain <b>why<\/b> the UAE moved from a near tax-free model to VAT and Corporate Tax.","List the taxes that exist today and those that do <b>not<\/b> exist.","Place the main milestones of UAE taxation on a timeline, up to the e-invoicing rollout in 2027."],"sections":[{"title":"The UAE at a glance","html":"<p>The United Arab Emirates is a <span class=\"term\">federation<\/span> of seven emirates formed in 1971–72: <b>Abu Dhabi<\/b> (the capital), <b>Dubai<\/b>, <b>Sharjah<\/b>, <b>Ajman<\/b>, <b>Umm Al Quwain<\/b>, <b>Ras Al Khaimah<\/b> and <b>Fujairah<\/b>. Each emirate keeps important local powers, while the federal government in Abu Dhabi is responsible for matters such as foreign affairs, defence, federal finance and <mark>federal taxation<\/mark>.<\/p><p>The currency is the <span class=\"term\">UAE Dirham (AED)<\/span>, pegged to the US dollar at <span class=\"num\">USD 1 = AED 3.6725<\/span>. All tax amounts in returns and invoices must be expressed in AED. Arabic is the official language of legislation; the English versions published by the Ministry of Finance (MoF) and the Federal Tax Authority (FTA) are translations, and if there is any conflict the <mark>Arabic text prevails<\/mark>.<\/p><h3>Mainland and free zones<\/h3><p>A business in the UAE operates either on the <span class=\"term\">mainland<\/span>, licensed by the economic department of an emirate (for example the Department of Economy and Tourism in Dubai), or in one of more than forty <span class=\"term\">free zones<\/span>, such as JAFZA, DMCC, Dubai Airport Free Zone, ADGM, DIFC, KEZAD and RAKEZ. Free zones were created to attract foreign investment by offering 100% foreign ownership, simplified licensing, customs advantages and, historically, guaranteed tax holidays.<\/p><div class=\"box key\"><span class=\"lbl\">KEY POINT<\/span>\n<p>“Free zone” does <b>not<\/b> mean “tax free”. A free zone company is subject to VAT like any other business, and it is a taxable person for Corporate Tax. It can enjoy a <span class=\"num\">0%<\/span> CT rate only on <mark>qualifying income<\/mark> and only if it meets strict conditions (Chapter 20). For VAT, a small number of free zones are listed as <span class=\"term\">Designated Zones<\/span>, which have special rules for <b>goods only<\/b> (Chapter 7).<\/p>\n<\/div>"},{"title":"Why did the UAE introduce taxes?","html":"<p>For decades the UAE financed government spending mainly from <b>oil and gas revenues<\/b>, plus government fees, customs duties and profits from state enterprises. Individuals paid no income tax and most companies paid no tax on profits (only foreign banks and oil companies were taxed under emirate-level decrees). Several forces pushed the country to build a modern tax system:<\/p><ol>\n<li><b>Diversification away from oil.<\/b> Oil prices are volatile; the 2014–2016 price fall showed the risk of relying on a single revenue source. A broad-based tax gives a <mark>stable, non-oil income<\/mark> for public services such as roads, schools and hospitals.<\/li>\n<li><b>The GCC VAT Framework Agreement.<\/b> In 2016 the six Gulf Cooperation Council states signed a <span class=\"term\">Common VAT Agreement<\/span> committing them to introduce VAT at a standard rate of 5%. The UAE and Saudi Arabia were the first to implement it, on <span class=\"num\">1 January 2018<\/span>.<\/li>\n<li><b>International transparency standards.<\/b> As a global business hub, the UAE committed to the OECD’s Base Erosion and Profit Shifting (BEPS) programme. Countries with no corporate tax risked being treated as non-cooperative. Corporate Tax (2023) and the global minimum tax (2025) keep the UAE aligned with these standards.<\/li>\n<li><b>Behavioural goals.<\/b> Excise Tax (2017) raises revenue while discouraging consumption of harmful products such as tobacco and sugary drinks.<\/li>\n<\/ol><p>Even after these reforms the UAE remains one of the <mark>lowest-tax economies in the world<\/mark>: VAT of 5% is among the lowest rates globally, the CT rate of 9% is far below the global average, and there is still <b>no personal income tax<\/b> on employment income.<\/p><figure class=\"fig\"><svg aria-label=\"Timeline of UAE tax milestones 2017-2027\" role=\"img\" viewbox=\"0 0 660 300\" xmlns=\"http://www.w3.org/2000/svg\"><title>Timeline of UAE tax milestones 2017-2027<\/title><defs><\/defs><line stroke=\"#16324f\" stroke-linecap=\"round\" stroke-width=\"5\" x1=\"20\" x2=\"640\" y1=\"150\" y2=\"150\"><\/line><circle cx=\"70\" cy=\"150\" fill=\"#f1f2f3\" r=\"12\" stroke=\"#8a8f96\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"70.0\" y=\"182.6\"><tspan dy=\"0.0\" x=\"70.0\">2017<\/tspan><\/text><line stroke=\"#8a8f96\" stroke-width=\"1.6\" x1=\"70\" x2=\"70\" y1=\"138\" y2=\"78\"><\/line><g><rect fill=\"#f1f2f3\" height=\"74\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"132\" x=\"4\" y=\"4\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"70.0\" y=\"31.4\"><tspan dy=\"0.0\" x=\"70.0\">Tax Procedures<\/tspan><tspan dy=\"13.4\" x=\"70.0\">Law; Excise Tax<\/tspan><tspan dy=\"13.4\" x=\"70.0\">from 1 Oct<\/tspan><\/text><\/g><circle cx=\"135\" cy=\"150\" fill=\"#e6f0fc\" r=\"12\" stroke=\"#2a78d6\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"135.0\" y=\"126.5\"><tspan dy=\"0.0\" x=\"135.0\">2018<\/tspan><\/text><line stroke=\"#2a78d6\" stroke-width=\"1.6\" x1=\"135\" x2=\"135\" y1=\"162\" y2=\"222\"><\/line><g><rect fill=\"#e6f0fc\" height=\"74\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"132\" x=\"69\" y=\"222\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"135.0\" y=\"256.1\"><tspan dy=\"0.0\" x=\"135.0\">VAT at 5% from 1<\/tspan><tspan dy=\"13.4\" x=\"135.0\">Jan<\/tspan><\/text><\/g><circle cx=\"200\" cy=\"150\" fill=\"#f1f2f3\" r=\"12\" stroke=\"#8a8f96\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"200.0\" y=\"182.6\"><tspan dy=\"0.0\" x=\"200.0\">2019<\/tspan><\/text><line stroke=\"#8a8f96\" stroke-width=\"1.6\" x1=\"200\" x2=\"200\" y1=\"138\" y2=\"78\"><\/line><g><rect fill=\"#f1f2f3\" height=\"74\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"132\" x=\"134\" y=\"4\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"200.0\" y=\"38.1\"><tspan dy=\"0.0\" x=\"200.0\">Economic Substance<\/tspan><tspan dy=\"13.4\" x=\"200.0\">Regulations<\/tspan><\/text><\/g><circle cx=\"265\" cy=\"150\" fill=\"#e3f3e3\" r=\"12\" stroke=\"#008300\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"265.0\" y=\"126.5\"><tspan dy=\"0.0\" x=\"265.0\">2022<\/tspan><\/text><line stroke=\"#008300\" stroke-width=\"1.6\" x1=\"265\" x2=\"265\" y1=\"162\" y2=\"222\"><\/line><g><rect fill=\"#e3f3e3\" height=\"74\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"132\" x=\"199\" y=\"222\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"265.0\" y=\"242.7\"><tspan dy=\"0.0\" x=\"265.0\">Corporate Tax Law<\/tspan><tspan dy=\"13.4\" x=\"265.0\">issued (FDL<\/tspan><tspan dy=\"13.4\" x=\"265.0\">47/2022); new TPL<\/tspan><tspan dy=\"13.4\" x=\"265.0\">(FDL 28/2022)<\/tspan><\/text><\/g><circle cx=\"330\" cy=\"150\" fill=\"#e3f3e3\" r=\"12\" stroke=\"#008300\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"182.6\"><tspan dy=\"0.0\" x=\"330.0\">2023<\/tspan><\/text><line stroke=\"#008300\" stroke-width=\"1.6\" x1=\"330\" x2=\"330\" y1=\"138\" y2=\"78\"><\/line><g><rect fill=\"#e3f3e3\" height=\"74\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"132\" x=\"264\" y=\"4\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"31.4\"><tspan dy=\"0.0\" x=\"330.0\">CT applies to<\/tspan><tspan dy=\"13.4\" x=\"330.0\">years from 1 Jun<\/tspan><tspan dy=\"13.4\" x=\"330.0\">2023<\/tspan><\/text><\/g><circle cx=\"395\" cy=\"150\" fill=\"#e6f0fc\" r=\"12\" stroke=\"#2a78d6\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"395.0\" y=\"126.5\"><tspan dy=\"0.0\" x=\"395.0\">2024<\/tspan><\/text><line stroke=\"#2a78d6\" stroke-width=\"1.6\" x1=\"395\" x2=\"395\" y1=\"162\" y2=\"222\"><\/line><g><rect fill=\"#e6f0fc\" height=\"74\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"132\" x=\"329\" y=\"222\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"395.0\" y=\"242.7\"><tspan dy=\"0.0\" x=\"395.0\">VAT regulation<\/tspan><tspan dy=\"13.4\" x=\"395.0\">overhaul; CT<\/tspan><tspan dy=\"13.4\" x=\"395.0\">registration<\/tspan><tspan dy=\"13.4\" x=\"395.0\">deadlines<\/tspan><\/text><\/g><circle cx=\"460\" cy=\"150\" fill=\"#ebe8fb\" r=\"12\" stroke=\"#6250d6\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"460.0\" y=\"182.6\"><tspan dy=\"0.0\" x=\"460.0\">2025<\/tspan><\/text><line stroke=\"#6250d6\" stroke-width=\"1.6\" x1=\"460\" x2=\"460\" y1=\"138\" y2=\"78\"><\/line><g><rect fill=\"#ebe8fb\" height=\"74\" rx=\"10\" stroke=\"#6250d6\" stroke-width=\"2\" width=\"132\" x=\"394\" y=\"4\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"460.0\" y=\"31.4\"><tspan dy=\"0.0\" x=\"460.0\">15% Top-up Tax<\/tspan><tspan dy=\"13.4\" x=\"460.0\">(DMTT) for big<\/tspan><tspan dy=\"13.4\" x=\"460.0\">MNEs<\/tspan><\/text><\/g><circle cx=\"525\" cy=\"150\" fill=\"#fdeadf\" r=\"12\" stroke=\"#eb6834\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"525.0\" y=\"126.5\"><tspan dy=\"0.0\" x=\"525.0\">2026<\/tspan><\/text><line stroke=\"#eb6834\" stroke-width=\"1.6\" x1=\"525\" x2=\"525\" y1=\"162\" y2=\"222\"><\/line><g><rect fill=\"#fdeadf\" height=\"74\" rx=\"10\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"132\" x=\"459\" y=\"222\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"525.0\" y=\"242.7\"><tspan dy=\"0.0\" x=\"525.0\">VAT &amp; TPL<\/tspan><tspan dy=\"13.4\" x=\"525.0\">amendments, new<\/tspan><tspan dy=\"13.4\" x=\"525.0\">penalties, R&amp;D<\/tspan><tspan dy=\"13.4\" x=\"525.0\">credit<\/tspan><\/text><\/g><circle cx=\"590\" cy=\"150\" fill=\"#fde4e4\" r=\"12\" stroke=\"#e34948\" stroke-width=\"2\"><\/circle><text fill=\"#16324f\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"590.0\" y=\"182.6\"><tspan dy=\"0.0\" x=\"590.0\">2027<\/tspan><\/text><line stroke=\"#e34948\" stroke-width=\"1.6\" x1=\"590\" x2=\"590\" y1=\"138\" y2=\"78\"><\/line><g><rect fill=\"#fde4e4\" height=\"74\" rx=\"10\" stroke=\"#e34948\" stroke-width=\"2\" width=\"132\" x=\"524\" y=\"4\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"590.0\" y=\"31.4\"><tspan dy=\"0.0\" x=\"590.0\">Mandatory<\/tspan><tspan dy=\"13.4\" x=\"590.0\">e-invoicing<\/tspan><tspan dy=\"13.4\" x=\"590.0\">(phased)<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 1.1<\/b> Key milestones in UAE taxation, 2017–2027.<\/figcaption><\/figure>"},{"title":"The taxes that exist today","html":"<figure class=\"fig\"><svg aria-label=\"Map of taxes that exist in the UAE\" role=\"img\" viewbox=\"0 0 660 330\" xmlns=\"http://www.w3.org/2000/svg\"><title>Map of taxes that exist in the UAE<\/title><defs><\/defs><g><rect fill=\"#24507a\" height=\"310\" rx=\"10\" stroke=\"#24507a\" stroke-width=\"2\" width=\"300\" x=\"10\" y=\"10\"><\/rect><path d=\"M10,40 V20 Q10,10 20,10 H300 Q310,10 310,20 V40 Z\" fill=\"#24507a\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"160.0\" y=\"29.6\"><tspan dy=\"0.0\" x=\"160.0\">FEDERAL taxes (administered by the FTA)<\/tspan><\/text><\/g><g><rect fill=\"#e6f0fc\" height=\"58\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"90\" x=\"22\" y=\"50\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"67.0\" y=\"83.2\"><tspan dy=\"0.0\" x=\"67.0\">VAT<\/tspan><\/text><\/g><g><rect fill=\"#ffffff\" height=\"58\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"182\" x=\"116\" y=\"50\"><\/rect><text fill=\"#1f2328\" font-size=\"10.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"207.0\" y=\"76.3\"><tspan dy=\"0.0\" x=\"207.0\">5% standard rate on most<\/tspan><tspan dy=\"12.8\" x=\"207.0\">goods &amp; services<\/tspan><\/text><\/g><g><rect fill=\"#e3f3e3\" height=\"58\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"90\" x=\"22\" y=\"117\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"67.0\" y=\"142.9\"><tspan dy=\"0.0\" x=\"67.0\">Corporate<\/tspan><tspan dy=\"14.6\" x=\"67.0\">Tax<\/tspan><\/text><\/g><g><rect fill=\"#ffffff\" height=\"58\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"182\" x=\"116\" y=\"117\"><\/rect><text fill=\"#1f2328\" font-size=\"10.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"207.0\" y=\"149.7\"><tspan dy=\"0.0\" x=\"207.0\">0% to AED 375,000; 9% above<\/tspan><\/text><\/g><g><rect fill=\"#ebe8fb\" height=\"58\" rx=\"10\" stroke=\"#6250d6\" stroke-width=\"2\" width=\"90\" x=\"22\" y=\"184\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"67.0\" y=\"209.9\"><tspan dy=\"0.0\" x=\"67.0\">Top-up Tax<\/tspan><tspan dy=\"14.6\" x=\"67.0\">(DMTT)<\/tspan><\/text><\/g><g><rect fill=\"#ffffff\" height=\"58\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"182\" x=\"116\" y=\"184\"><\/rect><text fill=\"#1f2328\" font-size=\"10.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"207.0\" y=\"203.9\"><tspan dy=\"0.0\" x=\"207.0\">15% minimum for MNE groups<\/tspan><tspan dy=\"12.8\" x=\"207.0\">with revenue of EUR 750m or<\/tspan><tspan dy=\"12.8\" x=\"207.0\">more<\/tspan><\/text><\/g><g><rect fill=\"#fdeadf\" height=\"58\" rx=\"10\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"90\" x=\"22\" y=\"251\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"67.0\" y=\"284.2\"><tspan dy=\"0.0\" x=\"67.0\">Excise Tax<\/tspan><\/text><\/g><g><rect fill=\"#ffffff\" height=\"58\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"182\" x=\"116\" y=\"251\"><\/rect><text fill=\"#1f2328\" font-size=\"10.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"207.0\" y=\"270.9\"><tspan dy=\"0.0\" x=\"207.0\">100% tobacco, energy drinks,<\/tspan><tspan dy=\"12.8\" x=\"207.0\">e-smoking; tiered per litre<\/tspan><tspan dy=\"12.8\" x=\"207.0\">on sweetened drinks<\/tspan><\/text><\/g><g><rect fill=\"#f1f2f3\" height=\"200\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"160\" x=\"322\" y=\"10\"><\/rect><path d=\"M322,40 V20 Q322,10 332,10 H472 Q482,10 482,20 V40 Z\" fill=\"#8a8f96\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"402.0\" y=\"29.6\"><tspan dy=\"0.0\" x=\"402.0\">Customs<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"402.0\" y=\"108.7\"><tspan dy=\"0.0\" x=\"402.0\">Usually 5% of CIF value<\/tspan><tspan dy=\"13.4\" x=\"402.0\">of imports (GCC Common<\/tspan><tspan dy=\"13.4\" x=\"402.0\">Customs Law), collected<\/tspan><tspan dy=\"13.4\" x=\"402.0\">by customs authorities<\/tspan><\/text><\/g><g><rect fill=\"#fff4d1\" height=\"200\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"158\" x=\"492\" y=\"10\"><\/rect><path d=\"M492,40 V20 Q492,10 502,10 H640 Q650,10 650,20 V40 Z\" fill=\"#eda100\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"571.0\" y=\"29.6\"><tspan dy=\"0.0\" x=\"571.0\">Emirate-level<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"571.0\" y=\"108.7\"><tspan dy=\"0.0\" x=\"571.0\">Property registration<\/tspan><tspan dy=\"13.4\" x=\"571.0\">fees (e.g. 4% in<\/tspan><tspan dy=\"13.4\" x=\"571.0\">Dubai), municipality &amp;<\/tspan><tspan dy=\"13.4\" x=\"571.0\">tourism fees<\/tspan><\/text><\/g><g><rect fill=\"#fde4e4\" height=\"98\" rx=\"10\" stroke=\"#e34948\" stroke-width=\"2\" width=\"328\" x=\"322\" y=\"222\"><\/rect><path d=\"M322,252 V232 Q322,222 332,222 H640 Q650,222 650,232 V252 Z\" fill=\"#e34948\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"486.0\" y=\"241.6\"><tspan dy=\"0.0\" x=\"486.0\">NOT levied (as at Nov 2026)<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"486.0\" y=\"283.1\"><tspan dy=\"0.0\" x=\"486.0\">No personal income tax on salaries; no capital gains<\/tspan><tspan dy=\"13.4\" x=\"486.0\">tax on personal investments; withholding tax rate 0%<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 1.2<\/b> The UAE tax landscape at a glance (November 2026).<\/figcaption><\/figure><div class=\"tbl\"><table>\n<caption>Table 1.1 Main federal taxes<\/caption>\n<thead><tr><th>Tax<\/th><th>Main law<\/th><th>Started<\/th><th>Rate(s)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Value Added Tax<\/b><\/td><td>Federal Decree-Law (FDL) No. 8 of 2017<\/td><td>1 Jan 2018<\/td><td>5% standard; 0% zero-rate; some exemptions<\/td><\/tr>\n<tr><td><b>Excise Tax<\/b><\/td><td>FDL No. 7 of 2017<\/td><td>1 Oct 2017<\/td><td>100% tobacco, energy drinks, e-smoking devices and liquids; sweetened drinks taxed per litre by sugar content from 1 Jan 2026<\/td><\/tr>\n<tr><td><b>Corporate Tax<\/b><\/td><td>FDL No. 47 of 2022<\/td><td>Financial years starting on or after 1 Jun 2023<\/td><td>0% up to AED 375,000; 9% above; 0% on qualifying free zone income<\/td><\/tr>\n<tr><td><b>Top-up Tax (DMTT)<\/b><\/td><td>Cabinet Decision No. 142 of 2024<\/td><td>Financial years starting on or after 1 Jan 2025<\/td><td>Tops up to a 15% effective rate for large multinational groups<\/td><\/tr>\n<tr><td><b>Tax procedures<\/b><\/td><td>FDL No. 28 of 2022 (replaced Federal Law No. 7 of 2017)<\/td><td>1 Mar 2023<\/td><td>Rules for registration, records, audits, refunds, penalties and disputes for all federal taxes<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><div class=\"box upd\"><span class=\"lbl\">UPDATE 2025–26<\/span>\n<p><span class=\"new\">NEW<\/span> From <span class=\"num\">1 January 2026<\/span> sweetened drinks are no longer taxed at a flat 50%. A <b>tiered volumetric model<\/b> applies: drinks with 8 g or more of sugar and sweeteners per 100 ml pay <span class=\"num\">AED 1.09 per litre<\/span>, those with 5 g to under 8 g pay <span class=\"num\">AED 0.79 per litre<\/span>, and drinks under 5 g (or sweetened only with artificial sweeteners) pay nothing. Energy drinks stay at 100%.<\/p>\n<\/div><h3>Taxes that do not exist (yet)<\/h3><ul>\n<li><b>No personal income tax<\/b> on salaries, wages and pensions of individuals.<\/li>\n<li><b>No tax on personal investment income<\/b> of individuals (dividends, interest, capital gains), and no CT on an individual’s private real estate rental income that does not need a licence.<\/li>\n<li><b>No inheritance, gift or wealth tax<\/b> at federal level.<\/li>\n<li><b>Withholding tax<\/b> exists in the CT law but at a <span class=\"num\">0%<\/span> rate.<\/li>\n<\/ul><p>Some <b>emirate-level charges<\/b> do exist: for example property registration fees on transfers of real estate (4% of the price in Dubai), municipality and housing fees linked to rent, and tourism dirham fees on hotel stays. These are fees and are outside the scope of this book.<\/p>"},{"title":"The GCC dimension","html":"<p>The UAE is a member of the GCC. The GCC Common VAT Agreement sets common principles (a 5% minimum standard rate, the categories that may be zero-rated or exempt, and rules for trade between “Implementing States”). Each state then adopts its own national law. Four GCC states currently apply VAT.<\/p><figure class=\"fig\"><svg aria-label=\"Standard VAT rates in the GCC states that apply VAT (2026)\" role=\"img\" viewbox=\"0 0 660 270\" xmlns=\"http://www.w3.org/2000/svg\"><title>Standard VAT rates in the GCC states that apply VAT (2026)<\/title><defs><\/defs><line stroke=\"#e3e5e8\" x1=\"60\" x2=\"640\" y1=\"214.0\" y2=\"214.0\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"end\" x=\"52.0\" y=\"217.8\"><tspan dy=\"0.0\" x=\"52.0\">0%<\/tspan><\/text><line stroke=\"#e3e5e8\" x1=\"60\" x2=\"640\" y1=\"178.4\" y2=\"178.4\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"end\" x=\"52.0\" y=\"182.2\"><tspan dy=\"0.0\" x=\"52.0\">3%<\/tspan><\/text><line stroke=\"#e3e5e8\" x1=\"60\" x2=\"640\" y1=\"142.8\" y2=\"142.8\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"end\" x=\"52.0\" y=\"146.6\"><tspan dy=\"0.0\" x=\"52.0\">6%<\/tspan><\/text><line stroke=\"#e3e5e8\" x1=\"60\" x2=\"640\" y1=\"107.1\" y2=\"107.1\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"end\" x=\"52.0\" y=\"111.0\"><tspan dy=\"0.0\" x=\"52.0\">9%<\/tspan><\/text><line stroke=\"#e3e5e8\" x1=\"60\" x2=\"640\" y1=\"71.5\" y2=\"71.5\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"end\" x=\"52.0\" y=\"75.3\"><tspan dy=\"0.0\" x=\"52.0\">12%<\/tspan><\/text><line stroke=\"#e3e5e8\" x1=\"60\" x2=\"640\" y1=\"35.9\" y2=\"35.9\"><\/line><text fill=\"#5d6168\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"end\" x=\"52.0\" y=\"39.7\"><tspan dy=\"0.0\" x=\"52.0\">15%<\/tspan><\/text><g><title>UAE: 5%<\/title><path d=\"M97.5,214.0 V158.6 Q97.5,154.6 101.5,154.6 H163.5 Q167.5,154.6 167.5,158.6 V214.0 Z\" fill=\"#eb6834\"><\/path><\/g><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"132.5\" y=\"148.8\"><tspan dy=\"0.0\" x=\"132.5\">5%<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"132.5\" y=\"236.0\"><tspan dy=\"0.0\" x=\"132.5\">UAE<\/tspan><\/text><text fill=\"#5d6168\" font-size=\"9.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"132.5\" y=\"253.3\"><tspan dy=\"0.0\" x=\"132.5\">since 1 Jan 2018<\/tspan><\/text><g><title>Saudi Arabia: 15%<\/title><path d=\"M242.5,214.0 V39.9 Q242.5,35.9 246.5,35.9 H308.5 Q312.5,35.9 312.5,39.9 V214.0 Z\" fill=\"#2a78d6\"><\/path><\/g><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"277.5\" y=\"30.1\"><tspan dy=\"0.0\" x=\"277.5\">15%<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"277.5\" y=\"236.0\"><tspan dy=\"0.0\" x=\"277.5\">Saudi Arabia<\/tspan><\/text><text fill=\"#5d6168\" font-size=\"9.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"277.5\" y=\"253.3\"><tspan dy=\"0.0\" x=\"277.5\">since 1 Jul 2020<\/tspan><\/text><g><title>Bahrain: 10%<\/title><path d=\"M387.5,214.0 V99.2 Q387.5,95.2 391.5,95.2 H453.5 Q457.5,95.2 457.5,99.2 V214.0 Z\" fill=\"#2a78d6\"><\/path><\/g><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"422.5\" y=\"89.5\"><tspan dy=\"0.0\" x=\"422.5\">10%<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"422.5\" y=\"236.0\"><tspan dy=\"0.0\" x=\"422.5\">Bahrain<\/tspan><\/text><text fill=\"#5d6168\" font-size=\"9.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"422.5\" y=\"253.3\"><tspan dy=\"0.0\" x=\"422.5\">since 1 Jan 2022<\/tspan><\/text><g><title>Oman: 5%<\/title><path d=\"M532.5,214.0 V158.6 Q532.5,154.6 536.5,154.6 H598.5 Q602.5,154.6 602.5,158.6 V214.0 Z\" fill=\"#2a78d6\"><\/path><\/g><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"567.5\" y=\"148.8\"><tspan dy=\"0.0\" x=\"567.5\">5%<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"567.5\" y=\"236.0\"><tspan dy=\"0.0\" x=\"567.5\">Oman<\/tspan><\/text><text fill=\"#5d6168\" font-size=\"9.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"567.5\" y=\"253.3\"><tspan dy=\"0.0\" x=\"567.5\">since 16 Apr 2021<\/tspan><\/text><line stroke=\"#8a8f96\" stroke-width=\"1.5\" x1=\"60\" x2=\"640\" y1=\"214\" y2=\"214\"><\/line><text fill=\"#3a3f45\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" transform=\"rotate(-90 16 119.0)\" x=\"16\" y=\"119.0\">Standard VAT rate<\/text><\/svg><figcaption><b>Chart 1.1<\/b> Standard VAT rates in the GCC states that apply VAT. Hover a bar for its value.<\/figcaption><\/figure><div class=\"box exam\"><span class=\"lbl\">EXAM / CLASS TIP<\/span>\n<p>Because the GCC electronic system for intra-GCC trade has not been launched, the UAE currently treats supplies to other GCC states <mark>like exports outside the GCC<\/mark> (they can be zero-rated when the export conditions are met). Do not apply special “intra-GCC” rules in exam answers unless a question says so.<\/p>\n<\/div>"},{"title":"Who is affected by UAE taxes?","html":"<div class=\"grid2\">\n<div class=\"card\"><h4>Businesses<\/h4><p>Almost every business must register for <b>Corporate Tax<\/b> (even if it pays 0%). Businesses with taxable supplies above <span class=\"num\">AED 375,000<\/span> a year must register for <b>VAT<\/b>. Large multinational groups also deal with <b>Top-up Tax<\/b>, transfer pricing and, from 2027, <b>e-invoicing<\/b>.<\/p><\/div>\n<div class=\"card\"><h4>Individuals<\/h4><p>Employees pay no income tax, but every consumer bears <b>5% VAT<\/b> in prices. An individual who runs a business (a freelancer or sole trader) becomes subject to CT once business turnover exceeds <span class=\"num\">AED 1 million<\/span> in a calendar year.<\/p><\/div>\n<\/div>"}],"summary":["The UAE is a federation of seven emirates; federal taxes are made by federal law and administered by the <b>FTA<\/b>.","Taxes were introduced to diversify revenue, honour the GCC VAT agreement and meet international standards.","Federal taxes today: <b>VAT 5%<\/b>, <b>Excise<\/b>, <b>CT 0%/9%<\/b>, <b>Top-up Tax 15%<\/b> for big MNEs; customs duty is usually 5%.","No personal income tax; WHT exists at 0%."],"review":[{"q":"Name the seven emirates. Which one is the capital?","a":null},{"q":"Give three reasons the UAE introduced VAT and Corporate Tax.","a":null},{"q":"“A company in a free zone does not pay any tax.” Explain why this statement is wrong.","a":null},{"q":"What changed in the Excise Tax on sweetened drinks from 1 January 2026?","a":null},{"q":"Which GCC states apply VAT, and at what standard rate?","a":null}],"mcq":[2,3,4,5,10]},"ch2":{"id":"ch2","num":"2","kind":"chapter","title":"Tax Legislation, Authorities and EmaraTax","short":"Tax Law, Authorities & EmaraTax","objectives":["Explain the hierarchy of UAE tax legislation and how to read it.","Distinguish the roles of the <b>Ministry of Finance<\/b> and the <b>Federal Tax Authority<\/b>.","Understand the status of FTA guides, public clarifications and the new binding <b>Directives<\/b>.","Navigate EmaraTax and know the key identifiers: TRN, Tax Residency Certificate and GIBAN."],"sections":[{"title":"How UAE tax law is built","html":"<p>A beginner often looks for “the VAT law” and finds dozens of documents. That is because UAE tax rules are written in <mark>layers<\/mark>. The main law sets principles; Cabinet and Ministerial decisions fill in detail; the FTA then publishes decisions on procedures and guidance on how it applies the law.<\/p><figure class=\"fig\"><svg aria-label=\"Hierarchy of UAE tax legislation\" role=\"img\" viewbox=\"0 0 660 360\" xmlns=\"http://www.w3.org/2000/svg\"><title>Hierarchy of UAE tax legislation<\/title><defs><marker id=\"ar-pyr-c8102e\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"9\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c8102e\"><\/path><\/marker><marker id=\"ar-pyr-c8102es\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"1\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#c8102e\"><\/path><\/marker><\/defs><polygon fill=\"#16324f\" points=\"260.0,14 340.0,14 380.0,64 220.0,64\" stroke=\"#16324f\" stroke-width=\"2\"><\/polygon><text fill=\"#ffffff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"300.0\" y=\"43.5\"><tspan dy=\"0.0\" x=\"300.0\">Constitution<\/tspan><\/text><polygon fill=\"#24507a\" points=\"220.0,68 380.0,68 420.0,118 180.0,118\" stroke=\"#24507a\" stroke-width=\"2\"><\/polygon><text fill=\"#ffffff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"300.0\" y=\"83.0\"><tspan dy=\"0.0\" x=\"300.0\">Federal Decree-Laws: VAT<\/tspan><tspan dy=\"14.0\" x=\"300.0\">(8/2017), CT (47/2022), Tax<\/tspan><tspan dy=\"14.0\" x=\"300.0\">Procedures (28/2022)<\/tspan><\/text><polygon fill=\"#2a78d6\" points=\"180.0,122 420.0,122 460.0,172 140.0,172\" stroke=\"#2a78d6\" stroke-width=\"2\"><\/polygon><text fill=\"#ffffff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"300.0\" y=\"144.0\"><tspan dy=\"0.0\" x=\"300.0\">Cabinet Decisions: Executive Regulations,<\/tspan><tspan dy=\"14.0\" x=\"300.0\">penalties, reliefs<\/tspan><\/text><polygon fill=\"#e6f0fc\" points=\"140.0,176 460.0,176 500.0,226 100.0,226\" stroke=\"#2a78d6\" stroke-width=\"2\"><\/polygon><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"300.0\" y=\"198.0\"><tspan dy=\"0.0\" x=\"300.0\">Ministerial Decisions (Ministry of Finance): detailed<\/tspan><tspan dy=\"14.0\" x=\"300.0\">rules &amp; thresholds<\/tspan><\/text><polygon fill=\"#e0f5ec\" points=\"100.0,230 500.0,230 540.0,280 60.0,280\" stroke=\"#1baf7a\" stroke-width=\"2\"><\/polygon><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"300.0\" y=\"259.0\"><tspan dy=\"0.0\" x=\"300.0\">FTA Decisions: procedures, timelines, forms<\/tspan><\/text><polygon fill=\"#fff4d1\" points=\"60.0,284 540.0,284 580.0,334 20.0,334\" stroke=\"#eda100\" stroke-width=\"2\"><\/polygon><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"300.0\" y=\"313.0\"><tspan dy=\"0.0\" x=\"300.0\">FTA Directives (binding from 2026), Guides &amp; Public Clarifications<\/tspan><\/text><path d=\"M598.0,30.0 L598.0,330.0\" fill=\"none\" marker-end=\"url(#ar-pyr-c8102e)\" stroke=\"#c8102e\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><text fill=\"#c8102e\" font-size=\"11\" font-weight=\"bold\" text-anchor=\"middle\" x=\"630.0\" y=\"157.0\"><tspan dy=\"0.0\" x=\"630.0\">more<\/tspan><tspan dy=\"13.4\" x=\"630.0\">detail,<\/tspan><tspan dy=\"13.4\" x=\"630.0\">less<\/tspan><tspan dy=\"13.4\" x=\"630.0\">legal<\/tspan><tspan dy=\"13.4\" x=\"630.0\">force<\/tspan><\/text><\/svg><figcaption><b>Figure 2.1<\/b> The hierarchy of UAE tax legislation. Higher layers prevail over lower ones.<\/figcaption><\/figure><div class=\"tbl\"><table>\n<caption>Table 2.1 The layers explained<\/caption>\n<thead><tr><th>Instrument<\/th><th>Issued by<\/th><th>Purpose and examples<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Federal Decree-Law<\/b><\/td><td>The President (on Cabinet proposal)<\/td><td>Creates the tax and its core rules. VAT: FDL 8/2017 (amended, most recently by FDL 16/2025). CT: FDL 47/2022 (amended by FDL 60/2023 and FDL 28/2025). Tax Procedures: FDL 28/2022 (amended by FDL 17/2025).<\/td><\/tr>\n<tr><td><b>Cabinet Decision<\/b><\/td><td>UAE Cabinet<\/td><td>Executive Regulations and major implementing rules: VAT Executive Regul
