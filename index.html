s (taxed on UAE income only)<\/h3><ol>\n<li>A non-resident with a <span class=\"term\">Permanent Establishment (PE)<\/span> in the UAE is taxed on the income attributable to that PE.<\/li>\n<li>A non-resident juridical person with a <span class=\"term\">nexus<\/span> in the UAE is taxed on the related income. Under Cabinet Decision No. 35 of 2025 (which replaced CD 56/2023), a nexus exists where the person earns income from <b>immovable property in the UAE<\/b>.<\/li>\n<li>Other <b>UAE-sourced income<\/b> of a non-resident not connected with a PE or nexus is subject only to <b>withholding tax at 0%<\/b>, so in practice no UAE tax and no registration.<\/li>\n<\/ol>"},{"title":"Permanent establishment","html":"<p>A non-resident has a PE in the UAE if it has:<\/p><ul>\n<li>a <b>fixed or permanent place<\/b> in the UAE through which its business is wholly or partly conducted: a branch, office, factory, workshop, mine, oil or gas well, or a building, construction or installation site; or<\/li>\n<li>a person (a <b>dependent agent<\/b>) who habitually exercises authority to conduct business or concludes contracts on its behalf in the UAE.<\/li>\n<\/ul><p>There is no PE where activities are only <b>preparatory or auxiliary<\/b> (storage, display, purchasing, information gathering), where the business acts through an <b>independent agent<\/b> in the ordinary course of that agent’s business, or in limited cases of <b>temporary<\/b> presence (e.g. employees stuck in the UAE due to exceptional circumstances). The UAE also has an <b>investment manager<\/b> exemption that protects foreign funds using UAE-based managers, if conditions are met.<\/p><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 18.1<\/span>\n<ol>\n<li>A German engineering company rents an office in Abu Dhabi with eight staff who negotiate and sign contracts with UAE clients. <b>PE: yes.<\/b> Profits attributable to the office are taxable at 9%.<\/li>\n<li>A Japanese company keeps a warehouse in JAFZA only to store spare parts for quick delivery. <b>Likely no PE<\/b> (auxiliary storage), provided nothing else happens there.<\/li>\n<li>An Indian investor owns a Dubai apartment rented to tenants through a company registered in India. The company has a <b>nexus<\/b> through UAE immovable property, so it must register for CT.<\/li>\n<\/ol>\n<\/div>"},{"title":"Source of income","html":"<p>Income is <span class=\"term\">UAE-sourced<\/span> if, for example, it is derived from a UAE resident person, from activities performed or assets located in the UAE, from UAE immovable property, from the sale of shares in a UAE company, from contracts performed or used in the UAE, or from services or intellectual property used in the UAE. Source matters mainly for non-residents.<\/p>"}],"summary":["Residents: UAE-incorporated entities, foreign entities managed and controlled in the UAE, natural persons with business turnover > AED 1m.","Non-residents: taxed on PE income and nexus (UAE immovable property) income; other UAE-sourced income faces 0% WHT.","Residents get foreign tax credits; treaties prevent double taxation."],"review":[{"q":"A BVI company’s board meets and decides everything in Dubai. Is it a UAE resident? Why?","a":null},{"q":"Give three examples of a fixed place PE.","a":null},{"q":"A UK company receives interest from a UAE borrower and has no presence in the UAE. What UAE tax applies?","a":null}],"mcq":[83,86,87,88]},"ch19":{"id":"ch19","num":"19","kind":"chapter","title":"Exempt Persons","short":"Exempt Persons","objectives":["List the categories of <b>Exempt Persons<\/b> and how each obtains exemption.","Explain the conditions for public benefit entities, investment funds and pension funds.","Understand the registration and reporting duties of exempt persons."],"sections":[{"title":"The categories","html":"<figure class=\"fig\"><svg aria-label=\"Exempt Persons under UAE Corporate Tax\" role=\"img\" viewbox=\"0 0 660 300\" xmlns=\"http://www.w3.org/2000/svg\"><title>Exempt Persons under UAE Corporate Tax<\/title><defs><\/defs><g><rect fill=\"#e3f3e3\" height=\"280\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"205\" x=\"10\" y=\"10\"><\/rect><path d=\"M10,40 V20 Q10,10 20,10 H205 Q215,10 215,20 V40 Z\" fill=\"#008300\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"112.5\" y=\"29.6\"><tspan dy=\"0.0\" x=\"112.5\">Exempt automatically<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"middle\" x=\"112.5\" y=\"132.6\"><tspan dy=\"0.0\" x=\"112.5\">Government Entities (federal<\/tspan><tspan dy=\"14.6\" x=\"112.5\">&amp; local ministries,<\/tspan><tspan dy=\"14.6\" x=\"112.5\">departments, authorities)<\/tspan><tspan dy=\"14.6\" x=\"112.5\"><\/tspan><tspan dy=\"14.6\" x=\"112.5\">But a Government Entity's<\/tspan><tspan dy=\"14.6\" x=\"112.5\">licensed business is taxable<\/tspan><\/text><\/g><g><rect fill=\"#e6f0fc\" height=\"280\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"205\" x=\"228\" y=\"10\"><\/rect><path d=\"M228,40 V20 Q228,10 238,10 H423 Q433,10 433,20 V40 Z\" fill=\"#2a78d6\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.5\" y=\"21.6\"><tspan dy=\"0.0\" x=\"330.5\">Exempt if listed or<\/tspan><tspan dy=\"15.9\" x=\"330.5\">notified<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11.4\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.5\" y=\"99.5\"><tspan dy=\"0.0\" x=\"330.5\">Government Controlled Entities<\/tspan><tspan dy=\"13.9\" x=\"330.5\">listed by Cabinet Decision<\/tspan><tspan dy=\"13.9\" x=\"330.5\"><\/tspan><tspan dy=\"13.9\" x=\"330.5\">Extractive &amp; non-extractive<\/tspan><tspan dy=\"13.9\" x=\"330.5\">natural resource businesses<\/tspan><tspan dy=\"13.9\" x=\"330.5\">(conditions; must notify the<\/tspan><tspan dy=\"13.9\" x=\"330.5\">Ministry)<\/tspan><tspan dy=\"13.9\" x=\"330.5\"><\/tspan><tspan dy=\"13.9\" x=\"330.5\">Qualifying Public Benefit<\/tspan><tspan dy=\"13.9\" x=\"330.5\">Entities listed by Cabinet<\/tspan><tspan dy=\"13.9\" x=\"330.5\">Decision<\/tspan><\/text><\/g><g><rect fill=\"#ebe8fb\" height=\"280\" rx=\"10\" stroke=\"#6250d6\" stroke-width=\"2\" width=\"204\" x=\"446\" y=\"10\"><\/rect><path d=\"M446,40 V20 Q446,10 456,10 H640 Q650,10 650,20 V40 Z\" fill=\"#6250d6\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"548.0\" y=\"29.6\"><tspan dy=\"0.0\" x=\"548.0\">Exempt on FTA application<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"11.4\" font-weight=\"normal\" text-anchor=\"middle\" x=\"548.0\" y=\"113.4\"><tspan dy=\"0.0\" x=\"548.0\">Qualifying Investment Funds<\/tspan><tspan dy=\"13.9\" x=\"548.0\">(incl. qualifying REITs)<\/tspan><tspan dy=\"13.9\" x=\"548.0\"><\/tspan><tspan dy=\"13.9\" x=\"548.0\">Public or private pension &amp;<\/tspan><tspan dy=\"13.9\" x=\"548.0\">social security funds<\/tspan><tspan dy=\"13.9\" x=\"548.0\"><\/tspan><tspan dy=\"13.9\" x=\"548.0\">UAE juridical persons wholly<\/tspan><tspan dy=\"13.9\" x=\"548.0\">owned and controlled by<\/tspan><tspan dy=\"13.9\" x=\"548.0\">certain exempt persons<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 19.1<\/b> Exempt Persons and how they become exempt.<\/figcaption><\/figure><div class=\"tbl\"><table>\n<thead><tr><th>Category<\/th><th>Main conditions<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Government Entity<\/b><\/td><td>Federal and local government ministries, departments, agencies and authorities. Exempt automatically, but a <mark>business activity it conducts under a licence is taxable<\/mark>.<\/td><\/tr>\n<tr><td><b>Government Controlled Entity<\/b><\/td><td>Wholly owned and controlled by a Government Entity and listed in a Cabinet Decision; exempt for its <b>mandated<\/b> activities only.<\/td><\/tr>\n<tr><td><b>Extractive Business<\/b> and <b>Non-Extractive Natural Resource Business<\/b><\/td><td>Holds a right or concession from an emirate to explore, extract or process UAE natural resources, is subject to emirate-level tax, and has notified the Ministry of Finance.<\/td><\/tr>\n<tr><td><b>Qualifying Public Benefit Entity<\/b><\/td><td>Established and operated exclusively for religious, charitable, scientific, artistic, cultural, sporting, educational, healthcare, environmental, humanitarian, animal protection or similar purposes (or as a professional body, chamber of commerce or similar), uses income only for those purposes, and is listed in a Cabinet Decision.<\/td><\/tr>\n<tr><td><b>Qualifying Investment Fund<\/b><\/td><td>A regulated investment fund that meets the conditions in Cabinet Decision 34/2025 (e.g. widely held, not set up mainly to avoid tax) and applies to the FTA. Qualifying REITs can also be exempt (MD 96/2025).<\/td><\/tr>\n<tr><td><b>Public or private pension and social security funds<\/b><\/td><td>Regulated funds meeting the conditions, on application.<\/td><\/tr>\n<tr><td><b>Wholly owned subsidiaries<\/b> of certain exempt persons<\/td><td>UAE juridical persons wholly owned and controlled by a Government Entity, Government Controlled Entity, Qualifying Investment Fund or pension fund, that carry on (or support) the parent’s exempt activity; on application.<\/td><\/tr>\n<tr><td><b>Others<\/b><\/td><td>Any other person specified by Cabinet Decision (e.g. CD 55/2025 on exempting certain persons).<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"},{"title":"Duties of exempt persons","html":"<ul>\n<li>Government Entities do not need to register unless they conduct licensed business.<\/li>\n<li>Most other exempt persons must <b>register<\/b> with the FTA and file an <b>annual declaration<\/b> (instead of a tax return) to show they still meet the conditions. The CT late-registration penalty waiver (file within 7 months of the end of the first year) was also available for the declaration.<\/li>\n<li>An exempt person that stops meeting the conditions becomes a taxable person from the date it fails them (some categories with a grace period), and must notify the FTA.<\/li>\n<\/ul><div class=\"box warn\"><span class=\"lbl\">WATCH OUT<\/span>\n<p>A charity, school or association is <b>not<\/b> automatically exempt. If it is not listed as a Qualifying Public Benefit Entity, it is an ordinary taxable person (though its taxable income may be small after expenses). Donations to a non-listed body are also <b>not deductible<\/b> for the donor.<\/p>\n<\/div>"}],"summary":["Exempt Persons: Government Entities, listed GCEs, natural resource businesses, listed QPBEs, QIFs, pension funds, qualifying subsidiaries and others named by Cabinet.","Exemption may be automatic, by listing, by notification or by FTA application.","Most exempt persons still register and file annual declarations."],"review":[{"q":"A government department runs a licensed commercial car park. Is the car park income exempt?","a":null},{"q":"What makes a charity a Qualifying Public Benefit Entity?","a":null},{"q":"What document does a Qualifying Investment Fund file each year?","a":null}],"mcq":[89,90]},"ch20":{"id":"ch20","num":"20","kind":"chapter","title":"Free Zone Persons and the QFZP Regime","short":"Free Zone Persons & QFZP","objectives":["State the six conditions to be a <b>Qualifying Free Zone Person<\/b> (QFZP).","Classify income as Qualifying Income or income taxed at 9%.","Apply the <b>de minimis<\/b> test and the consequences of failing it.","Know the 2025–2026 updates: MD 229/2025, MD 84/2025 and FTA Decision 6/2026."],"sections":[{"title":"Free Zone Person and QFZP","html":"<p>A <span class=\"term\">Free Zone Person<\/span> is a juridical person incorporated, established or registered in a UAE free zone (including a branch of a non-resident registered there). Every Free Zone Person is a taxable person. A Free Zone Person that meets <mark>all<\/mark> the conditions in Article 18 of the CT Law is a <span class=\"term\">Qualifying Free Zone Person<\/span> and pays:<\/p><div class=\"grid2\">\n<div class=\"formula\">0%<small>on Qualifying Income<\/small><\/div>\n<div class=\"formula\">9%<small>on taxable income that is not Qualifying Income (no AED 375,000 band)<\/small><\/div>\n<\/div>"},{"title":"The six conditions","html":"<figure class=\"fig\"><svg aria-label=\"Conditions to be a Qualifying Free Zone Person\" role=\"img\" viewbox=\"0 0 660 384\" xmlns=\"http://www.w3.org/2000/svg\"><title>Conditions to be a Qualifying Free Zone Person<\/title><defs><\/defs><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"115\" x2=\"330\" y1=\"50\" y2=\"180\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"545\" x2=\"330\" y1=\"50\" y2=\"180\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"545\" x2=\"330\" y1=\"180\" y2=\"180\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"545\" x2=\"330\" y1=\"310\" y2=\"180\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"115\" x2=\"330\" y1=\"310\" y2=\"180\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"115\" x2=\"330\" y1=\"180\" y2=\"180\"><\/line><circle cx=\"330\" cy=\"180\" fill=\"#16324f\" r=\"76\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"176.6\"><tspan dy=\"0.0\" x=\"330.0\">QFZP: 0% on<\/tspan><tspan dy=\"15.9\" x=\"330.0\">Qualifying Income<\/tspan><\/text><g><rect fill=\"#e6f0fc\" height=\"80\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"210\" x=\"10\" y=\"10\"><\/rect><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"middle\" x=\"115.0\" y=\"34.0\"><tspan dy=\"0.0\" x=\"115.0\">1. Adequate SUBSTANCE in the<\/tspan><tspan dy=\"13.2\" x=\"115.0\">Free Zone: assets, qualified<\/tspan><tspan dy=\"13.2\" x=\"115.0\">staff, operating costs for core<\/tspan><tspan dy=\"13.2\" x=\"115.0\">activities<\/tspan><\/text><\/g><g><rect fill=\"#e3f3e3\" height=\"80\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"210\" x=\"440\" y=\"10\"><\/rect><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"middle\" x=\"545.0\" y=\"40.6\"><tspan dy=\"0.0\" x=\"545.0\">2. Earns QUALIFYING INCOME from<\/tspan><tspan dy=\"13.2\" x=\"545.0\">qualifying activities / Free<\/tspan><tspan dy=\"13.2\" x=\"545.0\">Zone customers<\/tspan><\/text><\/g><g><rect fill=\"#f1f2f3\" height=\"80\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"210\" x=\"440\" y=\"140\"><\/rect><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"middle\" x=\"545.0\" y=\"177.2\"><tspan dy=\"0.0\" x=\"545.0\">3. Has NOT elected to be taxed<\/tspan><tspan dy=\"13.2\" x=\"545.0\">at the regular rates<\/tspan><\/text><\/g><g><rect fill=\"#e0f5ec\" height=\"80\" rx=\"10\" stroke=\"#1baf7a\" stroke-width=\"2\" width=\"210\" x=\"440\" y=\"270\"><\/rect><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"middle\" x=\"545.0\" y=\"307.2\"><tspan dy=\"0.0\" x=\"545.0\">4. Meets TRANSFER PRICING rules<\/tspan><tspan dy=\"13.2\" x=\"545.0\">and keeps documentation<\/tspan><\/text><\/g><g><rect fill=\"#fff4d1\" height=\"80\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"210\" x=\"10\" y=\"270\"><\/rect><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"middle\" x=\"115.0\" y=\"307.2\"><tspan dy=\"0.0\" x=\"115.0\">5. Prepares AUDITED financial<\/tspan><tspan dy=\"13.2\" x=\"115.0\">statements<\/tspan><\/text><\/g><g><rect fill=\"#fdeadf\" height=\"80\" rx=\"10\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"210\" x=\"10\" y=\"140\"><\/rect><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"middle\" x=\"115.0\" y=\"170.6\"><tspan dy=\"0.0\" x=\"115.0\">6. DE MINIMIS: non-qualifying<\/tspan><tspan dy=\"13.2\" x=\"115.0\">revenue no more than 5% of total<\/tspan><tspan dy=\"13.2\" x=\"115.0\">revenue or AED 5m (lower figure)<\/tspan><\/text><\/g><text fill=\"#c8102e\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"376.0\"><tspan dy=\"0.0\" x=\"330.0\">Fail any condition = regular 9% rates for that period AND the next 4 tax periods<\/tspan><\/text><\/svg><figcaption><b>Figure 20.1<\/b> Conditions to be a QFZP.<\/figcaption><\/figure><ol>\n<li><b>Adequate substance in a free zone<\/b>: the core income-generating activities are performed in the free zone with adequate assets, an adequate number of qualified full-time employees, and adequate operating expenditure. Outsourcing to a related or third party in the free zone is allowed if the QFZP supervises it.<\/li>\n<li><b>Derives Qualifying Income<\/b> (see below).<\/li>\n<li><b>Has not elected<\/b> to be subject to the regular CT rates. An election applies for the period and the following four tax periods.<\/li>\n<li><b>Complies with transfer pricing<\/b> rules (arm’s length pricing and documentation).<\/li>\n<li><b>Prepares audited financial statements<\/b> (MD 84/2025 makes audit mandatory for every QFZP, regardless of revenue).<\/li>\n<li><b>Meets the de minimis requirement<\/b>: non-qualifying revenue does not exceed the <mark>lower of 5% of total revenue or AED 5,000,000<\/mark>.<\/li>\n<\/ol><div class=\"box warn\"><span class=\"lbl\">WATCH OUT<\/span>\n<p>Failing any condition at any time in a tax period means the person is <b>not a QFZP<\/b> for that period <b>and the next four tax periods<\/b> (five years in total). All its taxable income is then taxed at the regular 0%/9% rates.<\/p>\n<\/div>"},{"title":"Qualifying Activities and Excluded Activities","html":"<p>Ministerial Decision No. 229 of 2025 (which replaced MD 265/2023 with effect from 1 June 2023) lists the activities.<\/p><div class=\"grid2\">\n<div class=\"card\" style=\"border-color:#008300\"><h4>Qualifying Activities<\/h4>\n<ul class=\"small\">\n<li>Manufacturing and processing of goods or materials<\/li>\n<li>Trading of <b>Qualifying Commodities<\/b> (expanded in 2025, with prices referenced to a recognised exchange or a price reporting agency listed in MD 230/2025)<\/li>\n<li>Holding shares and other securities for investment<\/li>\n<li>Ownership, management and operation of ships<\/li>\n<li>Regulated reinsurance, fund management, and wealth and investment management<\/li>\n<li>Headquarter services, and treasury and financing services, to Related Parties<\/li>\n<li>Financing and leasing of aircraft (including engines and rotable parts)<\/li>\n<li>Distribution of goods in or from a <b>Designated Zone<\/b> to customers who resell or process them<\/li>\n<li>Logistics services<\/li>\n<li>Activities ancillary to the above<\/li>\n<\/ul><\/div>\n<div class=\"card\" style=\"border-color:#e34948\"><h4>Excluded Activities<\/h4>\n<ul class=\"small\">\n<li>Transactions with <b>natural persons<\/b>, except in specified activities (e.g. ships, fund and wealth management, aircraft leasing)<\/li>\n<li>Regulated banking activities<\/li>\n<li>Regulated insurance activities (other than qualifying reinsurance)<\/li>\n<li>Regulated finance and leasing (other than those listed as qualifying)<\/li>\n<li>Ownership or exploitation of UAE immovable property, other than commercial property in a free zone transacted with Free Zone Persons<\/li>\n<li>Ownership or exploitation of intellectual property (other than qualifying IP)<\/li>\n<li>Activities ancillary to the above<\/li>\n<\/ul><\/div>\n<\/div>"},{"title":"Qualifying Income","html":"<p>Under Cabinet Decision No. 100 of 2023, Qualifying Income includes:<\/p><ol>\n<li>income from transactions with <b>other Free Zone Persons<\/b> (who are the beneficial recipients), except income from Excluded Activities;<\/li>\n<li>income from transactions with <b>non-Free Zone Persons<\/b>, but only from <b>Qualifying Activities<\/b> that are not Excluded Activities;<\/li>\n<li>income from <b>qualifying intellectual property<\/b> (patents, copyrighted software), in proportion to the nexus ratio of R&amp;D done by the QFZP; and<\/li>\n<li><mark>any other income, provided the de minimis requirement is met<\/mark>.<\/li>\n<\/ol><p>Some income is <b>never<\/b> Qualifying Income and is always taxed at 9%: income of a <b>domestic PE<\/b> (e.g. a mainland branch) or a <b>foreign PE<\/b>, and income from <b>immovable property<\/b> other than commercial property in a free zone transacted with Free Zone Persons. Revenue from such property, and from qualifying IP, is left out of the de minimis calculation because it is dealt with separately.<\/p><figure class=\"fig\"><svg aria-label=\"Sorting the income of a Qualifying Free Zone Person\" role=\"img\" viewbox=\"0 0 660 344\" xmlns=\"http://www.w3.org/2000/svg\"><title>Sorting the income of a Qualifying Free Zone Person<\/title><defs><marker id=\"ar-qinc-8a8f96\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"9\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a8f96\"><\/path><\/marker><marker id=\"ar-qinc-8a8f96s\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"1\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#8a8f96\"><\/path><\/marker><\/defs><g><rect fill=\"#16324f\" height=\"70\" rx=\"10\" stroke=\"#16324f\" stroke-width=\"2\" width=\"130\" x=\"10\" y=\"136\"><\/rect><text fill=\"#ffffff\" font-size=\"12.5\" font-weight=\"normal\" text-anchor=\"middle\" x=\"75.0\" y=\"167.8\"><tspan dy=\"0.0\" x=\"75.0\">Income of the<\/tspan><tspan dy=\"15.2\" x=\"75.0\">QFZP<\/tspan><\/text><\/g><path d=\"M142.0,171.0 L180.0,36.0\" fill=\"none\" marker-end=\"url(#ar-qinc-8a8f96)\" stroke=\"#8a8f96\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#e3f3e3\" height=\"60\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"400\" x=\"184\" y=\"6\"><\/rect><text fill=\"#1f2328\" font-size=\"10.3\" font-weight=\"normal\" text-anchor=\"start\" x=\"194.0\" y=\"33.3\"><tspan dy=\"0.0\" x=\"194.0\">Transactions with other Free Zone Persons (beneficial recipients),<\/tspan><tspan dy=\"12.6\" x=\"194.0\">not Excluded Activities<\/tspan><\/text><\/g><circle cx=\"620\" cy=\"36\" fill=\"#00843d\" r=\"25\" stroke=\"#00843d\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"13.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"620.0\" y=\"40.7\"><tspan dy=\"0.0\" x=\"620.0\">0%<\/tspan><\/text><path d=\"M142.0,171.0 L180.0,103.0\" fill=\"none\" marker-end=\"url(#ar-qinc-8a8f96)\" stroke=\"#8a8f96\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#e3f3e3\" height=\"60\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"400\" x=\"184\" y=\"73\"><\/rect><text fill=\"#1f2328\" font-size=\"10.3\" font-weight=\"normal\" text-anchor=\"start\" x=\"194.0\" y=\"100.3\"><tspan dy=\"0.0\" x=\"194.0\">Qualifying Activities with mainland or foreign customers (e.g.<\/tspan><tspan dy=\"12.6\" x=\"194.0\">manufacturing, logistics, treasury), not Excluded<\/tspan><\/text><\/g><circle cx=\"620\" cy=\"103\" fill=\"#00843d\" r=\"25\" stroke=\"#00843d\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"13.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"620.0\" y=\"107.7\"><tspan dy=\"0.0\" x=\"620.0\">0%<\/tspan><\/text><path d=\"M142.0,171.0 L180.0,170.0\" fill=\"none\" marker-end=\"url(#ar-qinc-8a8f96)\" stroke=\"#8a8f96\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#e3f3e3\" height=\"60\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"400\" x=\"184\" y=\"140\"><\/rect><text fill=\"#1f2328\" font-size=\"10.3\" font-weight=\"normal\" text-anchor=\"start\" x=\"194.0\" y=\"167.3\"><tspan dy=\"0.0\" x=\"194.0\">Qualifying Intellectual Property income: the share allowed by the<\/tspan><tspan dy=\"12.6\" x=\"194.0\">nexus ratio<\/tspan><\/text><\/g><circle cx=\"620\" cy=\"170\" fill=\"#00843d\" r=\"25\" stroke=\"#00843d\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"13.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"620.0\" y=\"174.7\"><tspan dy=\"0.0\" x=\"620.0\">0%<\/tspan><\/text><path d=\"M142.0,171.0 L180.0,237.0\" fill=\"none\" marker-end=\"url(#ar-qinc-8a8f96)\" stroke=\"#8a8f96\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#fdeadf\" height=\"60\" rx=\"10\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"400\" x=\"184\" y=\"207\"><\/rect><text fill=\"#1f2328\" font-size=\"10.3\" font-weight=\"normal\" text-anchor=\"start\" x=\"194.0\" y=\"228.0\"><tspan dy=\"0.0\" x=\"194.0\">Any other income (Excluded Activities, other activities with the<\/tspan><tspan dy=\"12.6\" x=\"194.0\">mainland): 0% ONLY while non-qualifying revenue stays within the de<\/tspan><tspan dy=\"12.6\" x=\"194.0\">minimis limit; above it, QFZP status is lost<\/tspan><\/text><\/g><circle cx=\"620\" cy=\"237\" fill=\"#b8860b\" r=\"25\" stroke=\"#b8860b\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"13.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"620.0\" y=\"241.7\"><tspan dy=\"0.0\" x=\"620.0\">0%*<\/tspan><\/text><path d=\"M142.0,171.0 L180.0,304.0\" fill=\"none\" marker-end=\"url(#ar-qinc-8a8f96)\" stroke=\"#8a8f96\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><g><rect fill=\"#fde4e4\" height=\"60\" rx=\"10\" stroke=\"#e34948\" stroke-width=\"2\" width=\"400\" x=\"184\" y=\"274\"><\/rect><text fill=\"#1f2328\" font-size=\"10.3\" font-weight=\"normal\" text-anchor=\"start\" x=\"194.0\" y=\"295.0\"><tspan dy=\"0.0\" x=\"194.0\">Always 9%: income of a mainland branch or foreign PE; UAE immovable<\/tspan><tspan dy=\"12.6\" x=\"194.0\">property income (except Free Zone commercial property let to Free<\/tspan><tspan dy=\"12.6\" x=\"194.0\">Zone Persons); non-nexus share of IP income<\/tspan><\/text><\/g><circle cx=\"620\" cy=\"304\" fill=\"#c8102e\" r=\"25\" stroke=\"#c8102e\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"13.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"620.0\" y=\"308.7\"><tspan dy=\"0.0\" x=\"620.0\">9%<\/tspan><\/text><\/svg><figcaption><b>Figure 20.2<\/b> Sorting a QFZP’s income. *0% only while within the de minimis limit.<\/figcaption><\/figure>"},{"title":"Designated Zone distribution and the 2026 AUP report","html":"<div class=\"box upd\"><span class=\"lbl\">UPDATE 2025–26<\/span>\n<p><span class=\"new\">NEW<\/span> <b>FTA Decision No. 6 of 2026<\/b> (issued July 2026, applying to tax periods starting on or after <span class=\"num\">1 January 2026<\/span>) requires a QFZP that relies on the <b>distribution of goods in or from a Designated Zone<\/b> to obtain an <b>agreed-upon procedures (AUP) report<\/b> from a UAE-licensed auditor (ISRS 4400). The report confirms that customers are resellers (or processors for resale) and, for imported goods, that they came in through a Designated Zone, using evidence such as customer licences and confirmations, contracts, invoices, purchase orders, customs declarations and shipping documents. It is due <b>30 days after the CT return deadline<\/b>. If it is not filed, the conditions are treated as not met, which can cost the QFZP its status.<\/p>\n<\/div>"},{"title":"Worked example","html":"<div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 20.1<\/span>\n<p><b>Falcon Manufacturing FZE<\/b> (in a free zone) has these revenues for 2026: goods it makes sold to Free Zone customers AED 20m; goods it makes sold to mainland distributors AED 15m; consultancy to mainland companies AED 1.2m; rent from letting part of its free zone warehouse to a mainland company AED 0.6m. Its profit is AED 6m, of which AED 0.4m relates to consultancy and AED 0.35m to the rental. All other conditions are met.<\/p>\n<div class=\"tbl\"><table class=\"calc\"><tbody>\n<tr><td>Non-qualifying revenue for de minimis (consultancy only; rental is excluded from the test)<\/td><td class=\"r\">1,200,000<\/td><\/tr>\n<tr><td>5% of total revenue (36.2m, excluding the rental) / AED 5m: lower limit<\/td><td class=\"r\">1,810,000<\/td><\/tr>\n<tr class=\"sub\"><td>De minimis met? 1.2m ≤ 1.81m<\/td><td class=\"r\">YES<\/td><\/tr>\n<tr><td>Manufacturing and consultancy profit (Qualifying Income) at 0%<\/td><td class=\"r\">0<\/td><\/tr>\n<tr><td>Rental profit from a mainland tenant: 9% × 350,000<\/td><td class=\"r\">31,500<\/td><\/tr>\n<tr class=\"tot\"><td>Corporate Tax for 2026<\/td><td class=\"r\">31,500<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><b>Variation:<\/b> if consultancy revenue were AED 3m, non-qualifying revenue would be about 7.9% of total revenue, above 5%. Falcon would lose QFZP status for 2026–2030 and its whole taxable income would be taxed at 0%/9%: 9% × (taxable income − 375,000).<\/p>\n<\/div>"}],"summary":["QFZP = substance + qualifying income + no election + TP compliance + audited accounts + de minimis.","0% on Qualifying Income; 9% on other taxable income (PE income, certain property income, non-nexus IP).","De minimis: non-qualifying revenue ≤ lower of 5% or AED 5m; failure costs five years of status.","From 2026, Designated Zone distributors need an AUP report."],"review":[{"q":"A DMCC trading company sells coffee machines to individuals in Dubai Mall pop-up stores. Is that income qualifying?","a":null},{"q":"What is the maximum non-qualifying revenue for a QFZP with total revenue of AED 200m?","a":"AED 5m, the lower of 10m and 5m"},{"q":"Why might a free zone company <b>choose<\/b> to be taxed at regular rates?","a":null},{"q":"What is the consequence of not preparing audited financial statements?","a":null}],"mcq":[91,92,93,94,95,96,97,98]},"ch21":{"id":"ch21","num":"21","kind":"chapter","title":"Small Business Relief and Natural Persons in Business","short":"Small Business Relief & Natural Persons","objectives":["Apply the conditions for <b>Small Business Relief<\/b> (SBR), now available to 2029.","Decide when an individual (freelancer, sole trader) is a taxable person.","Identify income of individuals that is <b>excluded<\/b> from CT."],"sections":[{"title":"Small Business Relief","html":"<p>SBR lets small resident businesses be treated as having <mark>no taxable income<\/mark> for a tax period, with simplified compliance. It is in Article 21 of the CT Law and Ministerial Decision No. 73 of 2023.<\/p><div class=\"box upd\"><span class=\"lbl\">UPDATE 2025–26<\/span>\n<p><span class=\"new\">NEW<\/span> <b>Ministerial Decision No. 131 of 2026<\/b> (29 July 2026) extended SBR to tax periods ending on or before <span class=\"num\">31 December 2029<\/span> (previously 31 December 2026). The <span class=\"num\">AED 3,000,000<\/span> revenue threshold is unchanged and must be met for the <b>current and all previous<\/b> tax periods starting from 1 June 2023.<\/p>\n<\/div><h3>Conditions<\/h3><ul>\n<li>The person is a <b>Resident Person<\/b> (company or natural person).<\/li>\n<li>Revenue in the tax period, and in every previous tax period, did <b>not exceed AED 3,000,000<\/b>.<\/li>\n<li>The person <b>elects<\/b> for SBR in its tax return for that period.<\/li>\n<li>The person is <b>not<\/b> a QFZP and <b>not<\/b> a member of a multinational group with consolidated revenue above AED 3.15 billion.<\/li>\n<\/ul><h3>Consequences<\/h3><ul>\n<li>No CT for that period, but registration, a (simplified) return and records are still required.<\/li>\n<li>Tax losses and disallowed net interest from SBR periods <b>cannot be carried forward<\/b>.<\/li>\n<li>The FTA can deny SBR where a business is <b>artificially split<\/b> to stay below the threshold.<\/li>\n<li>Businesses with revenue below AED 3m may prepare accounts on a <b>cash basis<\/b>.<\/li>\n<\/ul><div class=\"box key\"><span class=\"lbl\">KEY POINT<\/span>\n<p>Once revenue exceeds AED 3m in any tax period, SBR is lost for that period <b>and all later periods<\/b>, even if revenue falls again. Track revenue carefully as the year end approaches.<\/p>\n<\/div>"},{"title":"Natural persons conducting business","html":"<p>Individuals in the UAE generally pay no tax on personal income. A <b>natural person<\/b> becomes a taxable person only if they conduct a <b>business or business activity<\/b> in the UAE and their total <b>turnover<\/b> from such activities exceeds <span class=\"num\">AED 1,000,000<\/span> in a <b>calendar year<\/b> (Cabinet Decision No. 49 of 2023). This catches freelancers, sole proprietors and individuals running unincorporated businesses, whether or not they hold a licence.<\/p><div class=\"tbl\"><table>\n<caption>Table 21.1 Income of individuals that does not count and is not taxed<\/caption>\n<thead><tr><th>Excluded income<\/th><th>Examples<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Wage<\/b> income<\/td><td>Salary, allowances, bonuses and end-of-service benefits from employment.<\/td><\/tr>\n<tr><td><b>Personal investment<\/b> income<\/td><td>Dividends, interest, capital gains on shares, bonds, funds or crypto held privately, where the activity does not require a licence.<\/td><\/tr>\n<tr><td><b>Real estate investment<\/b> income<\/td><td>Rent from privately owned property and gains on its sale, where the individual does not need a licence for it.<\/td><\/tr>\n<tr><td>Other non-business income<\/td><td>Inheritance, gifts, prizes not connected with a business.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><p>Once over the threshold, the individual is taxed on <b>all<\/b> business income (not just the excess over AED 1m), after deducting business expenses, at 0%/9%. The tax period is the calendar year; registration is due by <span class=\"num\">31 March<\/span> of the following year and the return by <span class=\"num\">30 September<\/span> of the following year. Individuals can elect SBR if their revenue is AED 3m or less.<\/p><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 21.1<\/span>\n<p>Ayesha is a freelance graphic designer in Dubai. In 2026 she earns AED 1,400,000 from design clients (expenses AED 400,000), a part-time salary of AED 200,000, and rent of AED 120,000 from her own apartment.<\/p>\n<ul>\n<li>Turnover test: only design income counts: AED 1.4m &gt; AED 1m, so she is a <b>taxable person<\/b> for 2026. Salary and rent are excluded.<\/li>\n<li>She must register by <b>31 March 2027<\/b> and file by <b>30 September 2027<\/b>.<\/li>\n<li>Taxable income = 1,400,000 − 400,000 = AED 1,000,000. Without SBR: 9% × 625,000 = <b>AED 56,250<\/b>.<\/li>\n<li>Her revenue (AED 1.4m) is below AED 3m, so she can <b>elect SBR<\/b> and pay <b>nil<\/b>.<\/li>\n<\/ul>\n<\/div>"}],"summary":["SBR: resident, revenue ≤ AED 3m now and in all prior periods, elect yearly; available to periods ending by <b>31 Dec 2029<\/b>.","Individuals are taxable only on business income once turnover > AED 1m in a calendar year.","Salary, personal investment and private real estate income are excluded."],"review":[{"q":"A company had revenue of AED 2.5m in 2024, AED 3.4m in 2025 and AED 2.8m in 2026. Can it elect SBR for 2026?","a":"No: the threshold was exceeded in 2025."},{"q":"A doctor employed by a hospital also runs a private clinic as a sole proprietor with turnover of AED 900,000. Is he a taxable person?","a":null},{"q":"When must a natural person who crossed the threshold in 2026 register?","a":null}],"mcq":[84,85,99,100,101,102]},"ch22":{"id":"ch22","num":"22","kind":"chapter","title":"Calculating Taxable Income","short":"Calculating Taxable Income","objectives":["Start from accounting profit prepared under the correct standards.","Apply the general deduction rule and the specific <b>non-deductible<\/b> items.","Apply the <b>interest limitation<\/b> rules and the market value rule for connected persons.","Prepare a full CT computation."],"sections":[{"title":"Start with the accounts","html":"<p>Taxable income starts from the <mark>accounting net profit or loss<\/mark> in standalone financial statements prepared under <b>IFRS<\/b>. A business with revenue of <span class=\"num\">AED 50 million<\/span> or less may use <b>IFRS for SMEs<\/b>, and one with revenue of <span class=\"num\">AED 3 million<\/span> or less (or in exceptional circumstances approved by the FTA) may use the <b>cash basis<\/b>. Audited financial statements are required where revenue exceeds AED 50m and for every QFZP (MD 84/2025, for tax periods starting on or after 1 January 2025). Amounts in another functional currency are converted to AED.<\/p><figure class=\"fig\"><svg aria-label=\"From accounting profit to Corporate Tax payable\" role=\"img\" viewbox=\"0 0 660 614\" xmlns=\"http://www.w3.org/2000/svg\"><title>From accounting profit to Corporate Tax payable<\/title><defs><\/defs><g><rect fill=\"#16324f\" height=\"46\" rx=\"10\" stroke=\"#16324f\" stroke-width=\"2\" width=\"590\" x=\"62\" y=\"6\"><\/rect><text fill=\"#ffffff\" font-size=\"11.2\" font-weight=\"bold\" text-anchor=\"start\" x=\"74.0\" y=\"32.9\"><tspan dy=\"0.0\" x=\"74.0\">Accounting net profit or loss (audited, IFRS-based)<\/tspan><\/text><\/g><circle cx=\"34\" cy=\"87.0\" fill=\"#16324f\" r=\"17\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"16\" font-weight=\"bold\" text-anchor=\"middle\" x=\"34.0\" y=\"92.6\"><tspan dy=\"0.0\" x=\"34.0\">−<\/tspan><\/text><g><rect fill=\"#e3f3e3\" height=\"58\" rx=\"10\" stroke=\"#008300\" stroke-width=\"2\" width=\"590\" x=\"62\" y=\"58\"><\/rect><text fill=\"#1f2328\" font-size=\"11.2\" font-weight=\"normal\" text-anchor=\"start\" x=\"74.0\" y=\"84.1\"><tspan dy=\"0.0\" x=\"74.0\">Exempt income: UAE dividends, qualifying foreign dividends &amp; gains (participation exemption),<\/tspan><tspan dy=\"13.7\" x=\"74.0\">foreign PE income if elected<\/tspan><\/text><\/g><circle cx=\"34\" cy=\"145.0\" fill=\"#16324f\" r=\"17\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"16\" font-weight=\"bold\" text-anchor=\"middle\" x=\"34.0\" y=\"150.6\"><tspan dy=\"0.0\" x=\"34.0\">±<\/tspan><\/text><g><rect fill=\"#f1f2f3\" height=\"46\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"590\" x=\"62\" y=\"122\"><\/rect><text fill=\"#1f2328\" font-size=\"11.2\" font-weight=\"normal\" text-anchor=\"start\" x=\"74.0\" y=\"148.9\"><tspan dy=\"0.0\" x=\"74.0\">Realisation-basis adjustments for unrealised gains/losses (if elected)<\/tspan><\/text><\/g><circle cx=\"34\" cy=\"203.0\" fill=\"#16324f\" r=\"17\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"16\" font-weight=\"bold\" text-anchor=\"middle\" x=\"34.0\" y=\"208.6\"><tspan dy=\"0.0\" x=\"34.0\">+<\/tspan><\/text><g><rect fill=\"#fde4e4\" height=\"58\" rx=\"10\" stroke=\"#e34948\" stroke-width=\"2\" width=\"590\" x=\"62\" y=\"174\"><\/rect><text fill=\"#1f2328\" font-size=\"11.2\" font-weight=\"normal\" text-anchor=\"start\" x=\"74.0\" y=\"200.1\"><tspan dy=\"0.0\" x=\"74.0\">Non-deductible expenses: 50% of client entertainment, fines &amp; penalties, bribes, CT itself,<\/tspan><tspan dy=\"13.7\" x=\"74.0\">recoverable VAT, dividends, donations to non-qualifying bodies<\/tspan><\/text><\/g><circle cx=\"34\" cy=\"267.0\" fill=\"#16324f\" r=\"17\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"16\" font-weight=\"bold\" text-anchor=\"middle\" x=\"34.0\" y=\"272.6\"><tspan dy=\"0.0\" x=\"34.0\">±<\/tspan><\/text><g><rect fill=\"#fdeadf\" height=\"58\" rx=\"10\" stroke=\"#eb6834\" stroke-width=\"2\" width=\"590\" x=\"62\" y=\"238\"><\/rect><text fill=\"#1f2328\" font-size=\"11.2\" font-weight=\"normal\" text-anchor=\"start\" x=\"74.0\" y=\"270.9\"><tspan dy=\"0.0\" x=\"74.0\">Interest limitation (30% of EBITDA cap) and arm's length / market value adjustments<\/tspan><\/text><\/g><circle cx=\"34\" cy=\"325.0\" fill=\"#16324f\" r=\"17\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"16\" font-weight=\"bold\" text-anchor=\"middle\" x=\"34.0\" y=\"330.6\"><tspan dy=\"0.0\" x=\"34.0\">−<\/tspan><\/text><g><rect fill=\"#e0f5ec\" height=\"46\" rx=\"10\" stroke=\"#1baf7a\" stroke-width=\"2\" width=\"590\" x=\"62\" y=\"302\"><\/rect><text fill=\"#1f2328\" font-size=\"11.2\" font-weight=\"normal\" text-anchor=\"start\" x=\"74.0\" y=\"328.9\"><tspan dy=\"0.0\" x=\"74.0\">Reliefs: transfers within a Qualifying Group, business restructuring relief<\/tspan><\/text><\/g><circle cx=\"34\" cy=\"377.0\" fill=\"#16324f\" r=\"17\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"16\" font-weight=\"bold\" text-anchor=\"middle\" x=\"34.0\" y=\"382.6\"><tspan dy=\"0.0\" x=\"34.0\">=<\/tspan><\/text><g><rect fill=\"#2a78d6\" height=\"46\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"590\" x=\"62\" y=\"354\"><\/rect><text fill=\"#ffffff\" font-size=\"11.2\" font-weight=\"bold\" text-anchor=\"start\" x=\"74.0\" y=\"380.9\"><tspan dy=\"0.0\" x=\"74.0\">Taxable income before losses<\/tspan><\/text><\/g><circle cx=\"34\" cy=\"429.0\" fill=\"#16324f\" r=\"17\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"16\" font-weight=\"bold\" text-anchor=\"middle\" x=\"34.0\" y=\"434.6\"><tspan dy=\"0.0\" x=\"34.0\">−<\/tspan><\/text><g><rect fill=\"#fff4d1\" height=\"46\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"590\" x=\"62\" y=\"406\"><\/rect><text fill=\"#1f2328\" font-size=\"11.2\" font-weight=\"normal\" text-anchor=\"start\" x=\"74.0\" y=\"432.9\"><tspan dy=\"0.0\" x=\"74.0\">Tax losses brought forward: up to 75% of this taxable income<\/tspan><\/text><\/g><circle cx=\"34\" cy=\"481.0\" fill=\"#16324f\" r=\"17\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"16\" font-weight=\"bold\" text-anchor=\"middle\" x=\"34.0\" y=\"486.6\"><tspan dy=\"0.0\" x=\"34.0\">=<\/tspan><\/text><g><rect fill=\"#2a78d6\" height=\"46\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"590\" x=\"62\" y=\"458\"><\/rect><text fill=\"#ffffff\" font-size=\"11.2\" font-weight=\"bold\" text-anchor=\"start\" x=\"74.0\" y=\"484.9\"><tspan dy=\"0.0\" x=\"74.0\">TAXABLE INCOME: 0% on first AED 375,000, 9% on the rest<\/tspan><\/text><\/g><circle cx=\"34\" cy=\"533.0\" fill=\"#16324f\" r=\"17\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"16\" font-weight=\"bold\" text-anchor=\"middle\" x=\"34.0\" y=\"538.6\"><tspan dy=\"0.0\" x=\"34.0\">−<\/tspan><\/text><g><rect fill=\"#ebe8fb\" height=\"46\" rx=\"10\" stroke=\"#6250d6\" stroke-width=\"2\" width=\"590\" x=\"62\" y=\"510\"><\/rect><text fill=\"#1f2328\" font-size=\"11.2\" font-weight=\"normal\" text-anchor=\"start\" x=\"74.0\" y=\"536.9\"><tspan dy=\"0.0\" x=\"74.0\">Credits: withholding tax credit, foreign tax credit, R&amp;D tax credit (from 2026)<\/tspan><\/text><\/g><circle cx=\"34\" cy=\"585.0\" fill=\"#16324f\" r=\"17\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"16\" font-weight=\"bold\" text-anchor=\"middle\" x=\"34.0\" y=\"590.6\"><tspan dy=\"0.0\" x=\"34.0\">=<\/tspan><\/text><g><rect fill=\"#c8102e\" height=\"46\" rx=\"10\" stroke=\"#c8102e\" stroke-width=\"2\" width=\"590\" x=\"62\" y=\"562\"><\/rect><text fill=\"#ffffff\" font-size=\"11.2\" font-weight=\"bold\" text-anchor=\"start\" x=\"74.0\" y=\"588.9\"><tspan dy=\"0.0\" x=\"74.0\">CORPORATE TAX PAYABLE (within 9 months of year end)<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 22.1<\/b> From accounting profit to Corporate Tax payable.<\/figcaption><\/figure>"},{"title":"The general deduction rule","html":"<p>Under Article 28, an expense is deductible if it is incurred <mark>wholly and exclusively for the purposes of the taxable person’s business<\/mark>, is <b>not capital<\/b> in nature, and is not incurred to earn exempt income. Expenses with a mixed purpose (e.g. a car used partly privately) are apportioned. Depreciation and amortisation charged in the accounts are generally deductible; there is no separate tax depreciation system.<\/p>"},{"title":"Specific rules","html":"<div class=\"tbl\"><table>\n<caption>Table 22.1 Common adjustments<\/caption>\n<thead><tr><th>Item<\/th><th>Treatment<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Client entertainment<\/b> (customers, shareholders, suppliers, business partners: meals, hospitality, events)<\/td><td>Only <span class=\"num\">50%<\/span> deductible. Staff entertainment is fully deductible.<\/td><\/tr>\n<tr><td><b>Fines and penalties<\/b><\/td><td>Not deductible (except amounts paid as compensation for damages or breach of contract).<\/td><\/tr>\n<tr><td><b>Bribes<\/b> and illicit payments<\/td><td>Not deductible.<\/td><\/tr>\n<tr><td><b>Donations, grants, gifts<\/b><\/td><td>Deductible only if made to a Qualifying Public Benefit Entity.<\/td><\/tr>\n<tr><td><b>Corporate Tax<\/b> itself and foreign income taxes<\/td><td>Not deductible (relief for foreign tax is by credit).<\/td><\/tr>\n<tr><td><b>Recoverable input VAT<\/b><\/td><td>Not deductible (irrecoverable VAT is part of the cost and is deductible).<\/td><\/tr>\n<tr><td><b>Dividends<\/b> and profit distributions<\/td><td>Not deductible.<\/td><\/tr>\n<tr><td><b>Owner’s drawings<\/b> in a sole establishment or partnership<\/td><td>Not deductible.<\/td><\/tr>\n<tr><td><b>Payments to Connected Persons<\/b> (owners, directors, officers and their related parties)<\/td><td>Deductible only up to <b>market value<\/b> and if wholly and exclusively for the business (with exceptions for certain listed and regulated entities).<\/td><\/tr>\n<tr><td><b>Related party transactions<\/b><\/td><td>Adjusted to arm’s length (Chapter 25).<\/td><\/tr>\n<tr><td><b>Unrealised gains and losses<\/b><\/td><td>Taxable/deductible as recognised in the accounts, unless the taxpayer elects the <b>realisation basis<\/b>, which defers them until the asset is sold.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>"},{"title":"Interest limitation","html":"<h3>General interest deduction limitation<\/h3><p><span class=\"term\">Net interest expenditure<\/span> (interest expense minus interest income) is deductible up to the <mark>higher of AED 12 million and 30% of adjusted EBITDA<\/mark> (taxable income before interest, tax, depreciation and amortisation). The excess is carried forward for up to <span class=\"num\">10 years<\/span>. Banks, insurers and certain other regulated entities are outside this rule.<\/p><figure class=\"fig\"><svg aria-label=\"General interest deduction limitation\" role=\"img\" viewbox=\"0 0 660 250\" xmlns=\"http://www.w3.org/2000/svg\"><title>General interest deduction limitation<\/title><defs><\/defs><text fill=\"#16324f\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"start\" x=\"10.0\" y=\"24.2\"><tspan dy=\"0.0\" x=\"10.0\">Example: adjusted tax EBITDA AED 100m; net interest expenditure AED 40m<\/tspan><\/text><rect fill=\"#e6f0fc\" height=\"40\" rx=\"6\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"560.0\" x=\"10\" y=\"44\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"290.0\" y=\"68.2\"><tspan dy=\"0.0\" x=\"290.0\">Adjusted EBITDA AED 100m<\/tspan><\/text><rect fill=\"#00843d\" height=\"40\" rx=\"6\" width=\"168.0\" x=\"10\" y=\"100\"><\/rect><text fill=\"#fff\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"94.0\" y=\"124.0\"><tspan dy=\"0.0\" x=\"94.0\">Cap 30% = AED 30m<\/tspan><\/text><rect fill=\"#e3f3e3\" height=\"40\" rx=\"6\" stroke=\"#008300\" stroke-width=\"2\" width=\"168.0\" x=\"10\" y=\"156\"><\/rect><rect fill=\"#fde4e4\" height=\"40\" rx=\"6\" stroke=\"#e34948\" stroke-width=\"2\" width=\"56.0\" x=\"181.0\" y=\"156\"><\/rect><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"94.0\" y=\"180.0\"><tspan dy=\"0.0\" x=\"94.0\">Deduct AED 30m now<\/tspan><\/text><text fill=\"#c8102e\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"209.0\" y=\"180.0\"><tspan dy=\"0.0\" x=\"209.0\">10m<\/tspan><\/text><g><rect fill=\"#fff4d1\" height=\"96\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"232\" x=\"418\" y=\"100\"><\/rect><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"middle\" x=\"534.0\" y=\"132.0\"><tspan dy=\"0.0\" x=\"534.0\">Excess AED 10m carried forward for<\/tspan><tspan dy=\"13.2\" x=\"534.0\">up to 10 years. The de minimis rule<\/tspan><tspan dy=\"13.2\" x=\"534.0\">always allows up to AED 12m of net<\/tspan><tspan dy=\"13.2\" x=\"534.0\">interest.<\/tspan><\/text><\/g><text fill=\"#c8102e\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"234.2\"><tspan dy=\"0.0\" x=\"330.0\">Deductible net interest = the HIGHER of AED 12m and 30% of adjusted EBITDA<\/tspan><\/text><\/svg><figcaption><b>Figure 22.2<\/b> The 30% EBITDA cap.<\/figcaption><\/figure><h3>Specific interest limitation<\/h3><p>Interest on a loan from a <b>Related Party<\/b> is not deductible where the loan is used for certain transactions, such as paying dividends, redeeming or reducing share capital, making capital contributions, or acquiring an ownership interest in a person who becomes a Related Party, unless the taxpayer shows that the main purpose was not to obtain a tax advantage.<\/p>"},{"title":"A full computation","html":"<div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 22.1: Oasis Logistics LLC, year ended 31 December 2026<\/span>\n<p>Accounting profit before tax AED 4,200,000. This includes: dividend from a UAE subsidiary AED 300,000; dividend from a 30%-owned Indian company that qualifies for the participation exemption AED 200,000; client entertainment AED 160,000; traffic and municipality fines AED 25,000; donation to an unlisted charity AED 40,000; donation to a listed QPBE AED 30,000; consultancy paid to the director’s brother’s firm AED 60,000 above market value; an unrealised gain of AED 500,000 on investment property (realisation basis elected). Net interest expense of AED 2,000,000 is below AED 12m. Tax losses brought forward AED 1,000,000.<\/p>\n<div class=\"tbl\"><table class=\"calc\"><tbody>\n<tr><td>Accounting profit before tax<\/td><td class=\"r\">4,200,000<\/td><\/tr>\n<tr><td class=\"ind\">Less: UAE dividend (exempt)<\/td><td class=\"r\">(300,000)<\/td><\/tr>\n<tr><td class=\"ind\">Less: foreign dividend (participation exemption)<\/td><td class=\"r\">(200,000)<\/td><\/tr>\n<tr><td class=\"ind\">Add: 50% of client entertainment<\/td><td class=\"r\">80,000<\/td><\/tr>\n<tr><td class=\"ind\">Add: fines<\/td><td class=\"r\">25,000<\/td><\/tr>\n<tr><td class=\"ind\">Add: donation to non-qualifying charity<\/td><td class=\"r\">40,000<\/td><\/tr>\n<tr><td class=\"ind\">Donation to QPBE: deductible, no adjustment<\/td><td class=\"r\">–<\/td><\/tr>\n<tr><td class=\"ind\">Add: excess over market value paid to a connected person<\/td><td class=\"r\">60,000<\/td><\/tr>\n<tr><td class=\"ind\">Less: unrealised gain (realisation basis)<\/td><td class=\"r\">(500,000)<\/td><\/tr>\n<tr class=\"sub\"><td>Taxable income before losses<\/td><td class=\"r\">3,405,000<\/td><\/tr>\n<tr><td class=\"ind\">Less: losses brought forward (cap 75% × 3,405,000 = 2,553,750)<\/td><td class=\"r\">(1,000,000)<\/td><\/tr>\n<tr class=\"sub\"><td>Taxable income<\/td><td class=\"r\">2,405,000<\/td><\/tr>\n<tr><td class=\"ind\">0% on first 375,000<\/td><td class=\"r\">0<\/td><\/tr>\n<tr><td class=\"ind\">9% on 2,030,000<\/td><td class=\"r\">182,700<\/td><\/tr>\n<tr class=\"tot\"><td>Corporate Tax payable by 30 September 2027<\/td><td class=\"r\">182,700<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<\/div><div class=\"box exam\"><span class=\"lbl\">EXAM / CLASS TIP<\/span>\n<p>Lay out every computation in the same order: accounting profit → exempt income → add-backs → other adjustments → reliefs → losses (75% cap) → rates → credits. State <b>why<\/b> each adjustment is made; examiners give marks for the reason, not only the number.<\/p>\n<\/div>"}],"summary":["Start from IFRS (or IFRS for SMEs / cash basis) accounting profit.","Deduct expenses wholly and exclusively for business; add back 50% client entertainment, fines, non-qualifying donations, CT, dividends.","Net interest capped at the higher of AED 12m and 30% EBITDA; excess carried forward 10 years.","Connected person payments limited to market value."],"review":[{"q":"A company spends AED 80,000 on a staff party and AED 60,000 hosting clients at a golf day. What is deductible?","a":"80,000 + 30,000"},{"q":"Adjusted EBITDA AED 20m; net interest AED 9m. How much is deductible?","a":"All AED 9m: the AED 12m de minimis applies."},{"q":"Why is recoverable VAT not deductible but irrecoverable VAT is?","a":null}],"mcq":[103,104,105,106,107,108,109,110,111]},"ch23":{"id":"ch23","num":"23","kind":"chapter","title":"Exempt Income, Tax Losses and Reliefs","short":"Exempt Income, Losses & Reliefs","objectives":["Identify exempt dividends and apply the <b>participation exemption<\/b>.","Use tax losses within the <b>75%<\/b> limit and the ownership continuity rules.","Apply <b>Qualifying Group Relief<\/b>, <b>Business Restructuring Relief<\/b> and loss transfers."],"sections":[{"title":"Exempt income","html":"<div class=\"tbl\"><table>\n<thead><tr><th>Income<\/th><th>Treatment<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Dividends from <b>UAE resident<\/b> juridical persons<\/td><td>Exempt.<\/td><\/tr>\n<tr><td>Dividends and gains from <b>foreign<\/b> shareholdings meeting the participation exemption<\/td><td>Exempt.<\/td><\/tr>\n<tr><td>Income of a <b>foreign PE<\/b><\/td><td>Exempt if the taxpayer elects (applies to all its foreign PEs; foreign tax credits are then not available).<\/td><\/tr>\n<tr><td>Income of a non-resident from operating aircraft or ships in <b>international transport<\/b><\/td><td>Exempt on a reciprocal basis.<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><h3>The participation exemption<\/h3><figure class=\"fig\"><svg aria-label=\"Conditions for the participation exemption\" role=\"img\" viewbox=\"0 0 660 250\" xmlns=\"http://www.w3.org/2000/svg\"><title>Conditions for the participation exemption<\/title><defs><\/defs><g><rect fill=\"#e6f0fc\" height=\"150\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"152\" x=\"10\" y=\"10\"><\/rect><path d=\"M10,38 V20 Q10,10 20,10 H152 Q162,10 162,20 V38 Z\" fill=\"#2a78d6\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"86.0\" y=\"28.6\"><tspan dy=\"0.0\" x=\"86.0\">Ownership<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"middle\" x=\"86.0\" y=\"83.0\"><tspan dy=\"0.0\" x=\"86.0\">Hold at least 5% of the<\/tspan><tspan dy=\"13.2\" x=\"86.0\">shares, OR the cost of<\/tspan><tspan dy=\"13.2\" x=\"86.0\">the stake is at least<\/tspan><tspan dy=\"13.2\" x=\"86.0\">AED 4m<\/tspan><\/text><\/g><g><rect fill=\"#e0f5ec\" height=\"150\" rx=\"10\" stroke=\"#1baf7a\" stroke-width=\"2\" width=\"152\" x=\"172\" y=\"10\"><\/rect><path d=\"M172,38 V20 Q172,10 182,10 H314 Q324,10 324,20 V38 Z\" fill=\"#1baf7a\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"248.0\" y=\"28.6\"><tspan dy=\"0.0\" x=\"248.0\">Holding period<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"middle\" x=\"248.0\" y=\"89.6\"><tspan dy=\"0.0\" x=\"248.0\">Held (or intended to be<\/tspan><tspan dy=\"13.2\" x=\"248.0\">held) for an<\/tspan><tspan dy=\"13.2\" x=\"248.0\">uninterrupted 12 months<\/tspan><\/text><\/g><g><rect fill=\"#fff4d1\" height=\"150\" rx=\"10\" stroke=\"#eda100\" stroke-width=\"2\" width=\"152\" x=\"334\" y=\"10\"><\/rect><path d=\"M334,38 V20 Q334,10 344,10 H476 Q486,10 486,20 V38 Z\" fill=\"#eda100\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"410.0\" y=\"28.6\"><tspan dy=\"0.0\" x=\"410.0\">Subject to tax<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"middle\" x=\"410.0\" y=\"83.0\"><tspan dy=\"0.0\" x=\"410.0\">Subsidiary pays CT or<\/tspan><tspan dy=\"13.2\" x=\"410.0\">similar tax at a rate<\/tspan><tspan dy=\"13.2\" x=\"410.0\">of at least 9% (with<\/tspan><tspan dy=\"13.2\" x=\"410.0\">exceptions)<\/tspan><\/text><\/g><g><rect fill=\"#ebe8fb\" height=\"150\" rx=\"10\" stroke=\"#6250d6\" stroke-width=\"2\" width=\"152\" x=\"496\" y=\"10\"><\/rect><path d=\"M496,38 V20 Q496,10 506,10 H638 Q648,10 648,20 V38 Z\" fill=\"#6250d6\"><\/path><text fill=\"#fff\" font-size=\"13\" font-weight=\"bold\" text-anchor=\"middle\" x=\"572.0\" y=\"28.6\"><tspan dy=\"0.0\" x=\"572.0\">Asset test<\/tspan><\/text><text fill=\"#1f2328\" font-size=\"10.8\" font-weight=\"normal\" text-anchor=\"middle\" x=\"572.0\" y=\"83.0\"><tspan dy=\"0.0\" x=\"572.0\">Not more than 50% of<\/tspan><tspan dy=\"13.2\" x=\"572.0\">the subsidiary's assets<\/tspan><tspan dy=\"13.2\" x=\"572.0\">are non-qualifying<\/tspan><tspan dy=\"13.2\" x=\"572.0\">holdings<\/tspan><\/text><\/g><g><rect fill=\"#00843d\" height=\"64\" rx=\"10\" stroke=\"#00843d\" stroke-width=\"2\" width=\"640\" x=\"10\" y=\"176\"><\/rect><text fill=\"#ffffff\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"204.9\"><tspan dy=\"0.0\" x=\"330.0\">If met: dividends, capital gains, foreign exchange gains/losses and impairments on the<\/tspan><tspan dy=\"14.6\" x=\"330.0\">Participating Interest are EXEMPT (and related losses are not deductible)<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 23.1<\/b> The participation exemption.<\/figcaption><\/figure><p>A <span class=\"term\">Participating Interest<\/span> must meet all of: an ownership interest of at least <span class=\"num\">5%<\/span> (or an acquisition cost of at least <span class=\"num\">AED 4 million<\/span>); held for at least <span class=\"num\">12 months<\/span> without interruption (or intended to be); the subsidiary is subject to CT or a similar tax at a rate of at least <span class=\"num\">9%<\/span> (with exceptions, such as subsidiaries that are themselves mainly holding participations); and no more than <span class=\"num\">50%<\/span> of its assets are ownership interests that would not qualify if held directly. Then dividends, capital gains on disposal, and related foreign exchange gains and impairments are ignored for CT. Expenses incurred to earn the exempt income are not deductible.<\/p>"},{"title":"Tax losses","html":"<ul>\n<li>Losses can be carried forward <b>indefinitely<\/b>.<\/li>\n<li>They can reduce taxable income of a later period by a maximum of <mark>75% of that period’s taxable income<\/mark> (before loss relief).<\/li>\n<li>The same person (or persons) must own at least <span class=\"num\">50%<\/span> from the start of the loss period to the end of the period of use, <b>or<\/b>, if ownership changes, the business must continue with the same or a similar activity.<\/li>\n<li>Losses cannot be used if they arose before CT applied, while the person was exempt, or while it was a QFZP, or in an SBR period. There is no loss carry-back.<\/li>\n<\/ul><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 23.1<\/span>\n<div class=\"tbl\"><table class=\"calc\">\n<thead><tr><th>Year<\/th><th class=\"r\">Taxable income<\/th><th class=\"r\">Loss used<\/th><th class=\"r\">After losses<\/th><th class=\"r\">CT<\/th><th class=\"r\">Loss c/f<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>2024<\/td><td class=\"r\">(3,000,000)<\/td><td class=\"r\">–<\/td><td class=\"r\">0<\/td><td class=\"r\">0<\/td><td class=\"r\">3,000,000<\/td><\/tr>\n<tr><td>2025<\/td><td class=\"r\">2,000,000<\/td><td class=\"r\">1,500,000<\/td><td class=\"r\">500,000<\/td><td class=\"r\">11,250<\/td><td class=\"r\">1,500,000<\/td><\/tr>\n<tr><td>2026<\/td><td class=\"r\">2,400,000<\/td><td class=\"r\">1,500,000<\/td><td class=\"r\">900,000<\/td><td class=\"r\">47,250<\/td><td class=\"r\">0<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>2025: cap = 75% × 2,000,000 = 1,500,000. 2026: cap = 1,800,000, but only 1,500,000 remains. CT 2025 = 9% × (500,000 − 375,000); 2026 = 9% × (900,000 − 375,000).<\/p>\n<\/div><h3>Transfer of losses between group companies<\/h3><p>A taxable person can transfer losses to another taxable person if both are resident, not exempt and not QFZPs, have the same financial year and accounting standards, and there is <b>common ownership of at least 75%<\/b>. The recipient can use them up to 75% of its own taxable income.<\/p>"},{"title":"Qualifying Group Relief (transfers within a Qualifying Group)","html":"<figure class=\"fig\"><svg aria-label=\"Qualifying Group (75%) versus Tax Group (95%)\" role=\"img\" viewbox=\"0 0 660 330\" xmlns=\"http://www.w3.org/2000/svg\"><title>Qualifying Group (75%) versus Tax Group (95%)<\/title><defs><marker id=\"ar-grp-16324f\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"9\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><marker id=\"ar-grp-16324fs\" markerheight=\"7\" markerwidth=\"7\" orient=\"auto-start-reverse\" refx=\"1\" refy=\"5\" viewbox=\"0 0 10 10\"><path d=\"M0,0 L10,5 L0,10 z\" fill=\"#16324f\"><\/path><\/marker><\/defs><g><rect fill=\"#e0f5ec\" height=\"40\" rx=\"10\" stroke=\"#1baf7a\" stroke-width=\"2\" width=\"310\" x=\"10\" y=\"6\"><\/rect><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"165.0\" y=\"23.0\"><tspan dy=\"0.0\" x=\"165.0\">QUALIFYING GROUP: common ownership of 75% or<\/tspan><tspan dy=\"14.0\" x=\"165.0\">more<\/tspan><\/text><\/g><g><rect fill=\"#16324f\" height=\"40\" rx=\"10\" stroke=\"#16324f\" stroke-width=\"2\" width=\"80\" x=\"125\" y=\"62\"><\/rect><text fill=\"#ffffff\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"middle\" x=\"165.0\" y=\"86.2\"><tspan dy=\"0.0\" x=\"165.0\">Parent P<\/tspan><\/text><\/g><g><rect fill=\"#e0f5ec\" height=\"44\" rx=\"10\" stroke=\"#1baf7a\" stroke-width=\"2\" width=\"80\" x=\"20\" y=\"160\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"60.0\" y=\"186.2\"><tspan dy=\"0.0\" x=\"60.0\">A Ltd<\/tspan><\/text><\/g><path d=\"M165.0,102.0 L60.0,158.0\" fill=\"none\" marker-end=\"url(#ar-grp-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"13.1\" opacity=\"0.92\" rx=\"4\" width=\"25.0\" x=\"94.7\" y=\"124.4\"><\/rect><text fill=\"#16324f\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"107.2\" y=\"134.9\"><tspan dy=\"0.0\" x=\"107.2\">80%<\/tspan><\/text><g><rect fill=\"#e0f5ec\" height=\"44\" rx=\"10\" stroke=\"#1baf7a\" stroke-width=\"2\" width=\"80\" x=\"125\" y=\"160\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"165.0\" y=\"186.2\"><tspan dy=\"0.0\" x=\"165.0\">B Ltd<\/tspan><\/text><\/g><path d=\"M165.0,102.0 L165.0,158.0\" fill=\"none\" marker-end=\"url(#ar-grp-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"13.1\" opacity=\"0.92\" rx=\"4\" width=\"25.0\" x=\"152.5\" y=\"124.4\"><\/rect><text fill=\"#16324f\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"165.0\" y=\"134.9\"><tspan dy=\"0.0\" x=\"165.0\">75%<\/tspan><\/text><g><rect fill=\"#f1f2f3\" height=\"44\" rx=\"10\" stroke=\"#8a8f96\" stroke-dasharray=\"6 4\" stroke-width=\"2\" width=\"80\" x=\"230\" y=\"160\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"middle\" x=\"270.0\" y=\"186.2\"><tspan dy=\"0.0\" x=\"270.0\">C Ltd<\/tspan><\/text><\/g><path d=\"M165.0,102.0 L270.0,158.0\" fill=\"none\" marker-end=\"url(#ar-grp-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"13.1\" opacity=\"0.92\" rx=\"4\" width=\"25.0\" x=\"210.2\" y=\"124.4\"><\/rect><text fill=\"#16324f\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"222.8\" y=\"134.9\"><tspan dy=\"0.0\" x=\"222.8\">60%<\/tspan><\/text><rect fill=\"none\" height=\"158\" rx=\"12\" stroke=\"#1baf7a\" stroke-dasharray=\"8 5\" stroke-width=\"2\" width=\"208\" x=\"14\" y=\"54\"><\/rect><g><rect fill=\"#ffffff\" height=\"96\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"310\" x=\"10\" y=\"224\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"165.0\" y=\"262.4\"><tspan dy=\"0.0\" x=\"165.0\">Assets/liabilities can be transferred between A<\/tspan><tspan dy=\"13.4\" x=\"165.0\">and B at book value (no gain); clawback if they<\/tspan><tspan dy=\"13.4\" x=\"165.0\">leave within 2 years<\/tspan><\/text><\/g><g><rect fill=\"#ebe8fb\" height=\"40\" rx=\"10\" stroke=\"#6250d6\" stroke-width=\"2\" width=\"310\" x=\"340\" y=\"6\"><\/rect><text fill=\"#1f2328\" font-size=\"11.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"495.0\" y=\"30.0\"><tspan dy=\"0.0\" x=\"495.0\">TAX GROUP: parent owns 95% or more<\/tspan><\/text><\/g><g><rect fill=\"#16324f\" height=\"40\" rx=\"10\" stroke=\"#16324f\" stroke-width=\"2\" width=\"80\" x=\"455\" y=\"62\"><\/rect><text fill=\"#ffffff\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"middle\" x=\"495.0\" y=\"86.2\"><tspan dy=\"0.0\" x=\"495.0\">Parent P<\/tspan><\/text><\/g><g><rect fill=\"#ebe8fb\" height=\"44\" rx=\"10\" stroke=\"#6250d6\" stroke-width=\"2\" width=\"80\" x=\"350\" y=\"160\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"390.0\" y=\"186.2\"><tspan dy=\"0.0\" x=\"390.0\">A Ltd<\/tspan><\/text><\/g><path d=\"M495.0,102.0 L390.0,158.0\" fill=\"none\" marker-end=\"url(#ar-grp-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"13.1\" opacity=\"0.92\" rx=\"4\" width=\"30.7\" x=\"421.9\" y=\"124.4\"><\/rect><text fill=\"#16324f\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"437.2\" y=\"134.9\"><tspan dy=\"0.0\" x=\"437.2\">100%<\/tspan><\/text><g><rect fill=\"#ebe8fb\" height=\"44\" rx=\"10\" stroke=\"#6250d6\" stroke-width=\"2\" width=\"80\" x=\"455\" y=\"160\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"bold\" text-anchor=\"middle\" x=\"495.0\" y=\"186.2\"><tspan dy=\"0.0\" x=\"495.0\">B Ltd<\/tspan><\/text><\/g><path d=\"M495.0,102.0 L495.0,158.0\" fill=\"none\" marker-end=\"url(#ar-grp-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"13.1\" opacity=\"0.92\" rx=\"4\" width=\"25.0\" x=\"482.5\" y=\"124.4\"><\/rect><text fill=\"#16324f\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"495.0\" y=\"134.9\"><tspan dy=\"0.0\" x=\"495.0\">96%<\/tspan><\/text><g><rect fill=\"#f1f2f3\" height=\"44\" rx=\"10\" stroke=\"#8a8f96\" stroke-dasharray=\"6 4\" stroke-width=\"2\" width=\"80\" x=\"560\" y=\"160\"><\/rect><text fill=\"#1f2328\" font-size=\"12\" font-weight=\"normal\" text-anchor=\"middle\" x=\"600.0\" y=\"186.2\"><tspan dy=\"0.0\" x=\"600.0\">C Ltd<\/tspan><\/text><\/g><path d=\"M495.0,102.0 L600.0,158.0\" fill=\"none\" marker-end=\"url(#ar-grp-16324f)\" stroke=\"#16324f\" stroke-linejoin=\"round\" stroke-width=\"2\"><\/path><rect fill=\"#ffffff\" height=\"13.1\" opacity=\"0.92\" rx=\"4\" width=\"25.0\" x=\"540.2\" y=\"124.4\"><\/rect><text fill=\"#16324f\" font-size=\"10.5\" font-weight=\"bold\" text-anchor=\"middle\" x=\"552.8\" y=\"134.9\"><tspan dy=\"0.0\" x=\"552.8\">80%<\/tspan><\/text><rect fill=\"none\" height=\"158\" rx=\"12\" stroke=\"#6250d6\" stroke-dasharray=\"8 5\" stroke-width=\"2\" width=\"208\" x=\"344\" y=\"54\"><\/rect><g><rect fill=\"#ffffff\" height=\"96\" rx=\"10\" stroke=\"#8a8f96\" stroke-width=\"2\" width=\"310\" x=\"340\" y=\"224\"><\/rect><text fill=\"#1f2328\" font-size=\"11\" font-weight=\"normal\" text-anchor=\"middle\" x=\"495.0\" y=\"262.4\"><tspan dy=\"0.0\" x=\"495.0\">P, A and B file ONE return as a single taxable<\/tspan><tspan dy=\"13.4\" x=\"495.0\">person; C files alone; all members jointly<\/tspan><tspan dy=\"13.4\" x=\"495.0\">liable<\/tspan><\/text><\/g><\/svg><figcaption><b>Figure 23.2<\/b> Qualifying Group (75%) and Tax Group (95%).<\/figcaption><\/figure><p>Two taxable persons are in the same <span class=\"term\">Qualifying Group<\/span> if one owns at least 75% of the other, or a third person owns at least 75% of each, both are resident, neither is exempt or a QFZP, and they have the same financial year and accounting standards. They can elect to transfer assets or liabilities at <mark>net book value<\/mark>, so no gain or loss arises. If, within <span class=\"num\">2 years<\/span>, the asset leaves the group or the parties stop being in the same Qualifying Group, the relief is clawed back and the gain becomes taxable.<\/p><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 23.2<\/span>\n<p>Parent P owns 80% of A and 90% of B (common ownership above 75%). A transfers a warehouse with book value AED 10m and market value AED 15m to B for AED 15m. With QGR elected, A recognises no gain and B takes the asset at AED 10m. If B sells the warehouse to an outsider 18 months later, the relief is withdrawn and the AED 5m gain becomes taxable.<\/p>\n<\/div>"},{"title":"Business Restructuring Relief","html":"<p>Where a business or an independent part of it (or the whole of a company’s assets and liabilities) is transferred in exchange for <b>shares or other ownership interests<\/b> (mergers, spin-offs, share-for-business exchanges), the transfer can be made at net book value if both parties are resident (or have a UAE PE), are not exempt or QFZPs, use the same financial year and accounting standards, and the transaction is made for <b>valid commercial reasons<\/b> (not mainly to avoid tax). The relief is clawed back if the shares or the business are transferred within <span class=\"num\">2 years<\/span>.<\/p>"}],"summary":["UAE dividends exempt; foreign dividends and gains exempt under the participation exemption (5%/AED 4m, 12 months, 9% subject-to-tax, asset test).","Losses: indefinite carry-forward, max 75% of taxable income, 50% ownership continuity or same business.","QGR (75% group) and BRR allow tax-neutral transfers, with 2-year clawbacks."],"review":[{"q":"A UAE company bought 3% of a Saudi company for AED 6m. Can dividends be exempt?","a":"Yes, if other conditions are met: cost above AED 4m."},{"q":"Taxable income of AED 800,000 and losses brought forward of AED 1m. How much loss can be used?","a":"AED 600,000"},{"q":"What happens if a 60% shareholder sells to a new owner and the business changes completely?","a":null}],"mcq":[112,113,114,115,116]},"ch24":{"id":"ch24","num":"24","kind":"chapter","title":"Tax Groups, Partnerships and Special Entities","short":"Tax Groups, Partnerships & Special Entities","objectives":["State the conditions and effects of a CT <b>Tax Group<\/b>.","Compare a Tax Group with loss transfers and Qualifying Group Relief.","Explain the treatment of partnerships, family foundations, investment funds and branches."],"sections":[{"title":"Tax Groups","html":"<p>A resident parent and its resident subsidiaries can apply to form a <span class=\"term\">Tax Group<\/span> and be treated as a <mark>single taxable person<\/mark> (Article 40). Conditions:<\/p><ul>\n<li>The parent holds at least <span class=\"num\">95%<\/span> of the share capital, voting rights, profits and net assets of each subsidiary, directly or indirectly through other members.<\/li>\n<li>All members are UAE residents (or treated as residents under a treaty), and none is an Exempt Person or a QFZP.<\/li>\n<li>All members have the same financial year and prepare financial statements under the same accounting standards.<\/li>\n<\/ul><p>The parent (the representative) applies through EmaraTax, files one return based on aggregated financial statements in which intra-group transactions are eliminated, and pays the tax. All members are <b>jointly and severally liable<\/b>. Pre-grouping losses and interest carried forward can be used under the rules in MD 301 of 2024.<\/p><div class=\"tbl\"><table>\n<thead><tr><th>Advantages<\/th><th>Disadvantages<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>One return; intra-group transactions ignored (no transfer pricing between members)<\/td><td>Joint and several liability for the group’s tax<\/td><\/tr>\n<tr><td>Profits and losses of members offset in the same period, without the 75% transfer cap<\/td><td>Only <b>one AED 375,000<\/b> 0% band for the whole group<\/td><\/tr>\n<tr><td>Assets move between members without tax<\/td><td>Audited aggregated accounts may be needed; leaving the group can trigger adjustments<\/td><\/tr>\n<\/tbody>\n<\/table><\/div><div class=\"box eg\"><span class=\"lbl\">WORKED EXAMPLE 24.1: Group or not?<\/span>\n<p>Gulf Holdings (P) owns 100% of A, 96% of B and 80% of C. 2026 taxable income: P AED 1m, A (loss) AED 3m, B AED 5m, C AED 2m.<\/p>\n<div class=\"tbl\"><table class=\"calc\">\n<thead><tr><th>Option<\/th><th class=\"r\">CT (AED)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>No group, no loss transfer: P 56,250 + B 416,250 (A’s loss carried forward)<\/td><td class=\"r\">472,500<\/td><\/tr>\n<tr><td>Tax Group P+A+B: taxable income 1m − 3m + 5m = 3m; 9% × (3m − 375k)<\/td><td class=\"r\">236,250<\/td><\/tr>\n<tr><td>No group, but A transfers its loss to B (75% common ownership): B 5m − 3m = 2m → 146,250; P 56,250<\/td><td class=\"r\">202,500<\/td><\/tr>\n<\/tbody>\n<\/table><\/div>\n<p>C’s tax (9% × 1,625,000 = AED 146,250) is the same in every option, so it is left out. C (80%) cannot join the Tax Group but is in the same Qualifying Group (75%+). Here the loss transfer gives a lower bill than grouping because P and B each keep their own AED 375,000 band; the group gets only one. Real decisions also weigh compliance cost, liability and future years.<\/p>\n<\/div>"},{"title":"Partnerships","html":"<ul>\n<li>An <span class=\"term\">unincorporated partnership<\/span> (a contractual joint venture or partnership without separate legal personality) is generally <b>tax transparent<\/b>: each partner is taxed on its share of income and expenses.<\/li>\n<li>The partners may apply for the partnership to be treated as a <b>taxable person in its own right<\/b> (Cabinet Decision 63 of 2025 sets the conditions).<\/li>\n<li>A <b>foreign partnership<\/b> can be treated as transparent if it is not taxed in its home country, each partner is taxed on its share, and other conditions are met.<\/li>\n<li>Partnerships with legal personality (e.g. limited liability companies, limited partnerships with personality) are taxable persons.<\/li>\n<\/ul>"},{"title":"Family foundations and trusts","html":"<p>A <span class=\"term\">family foundation<\/span> (or trust or similar entity) can apply to be treated as an unincorporated partnership, making it <b>transparent<\/b>, if it is set up for identified natural persons or public benefit entities, its main activity is receiving, holding, investing and distributing assets, it does not conduct a business that would be taxable if done by the founder directly, and it is not used mainly to avoid tax. The FTA published a <b>Taxation of Family Foundations Guide<\/b> in June 2026. Foundations can be established in ADGM, DIFC, RAK ICC and, from September 2026, DMCC.<\/p>"},{"title":"Investment funds, REITs and branches","html":"<ul>\n<li><b>Qualifying Investment Funds<\/b> can be exempt on application, and <b>Qualifying Limited Partnerships<\/b> can be transparent (Cabinet Decision 34 of 2025); qualifying <b>REITs<\/b> can be exempt (MD 96 of 2025).<\/li>\n<li>A UAE company’s <b>domestic branches<\/b> are part of the company. Its <b>foreign branches<\/b> (foreign PEs) are taxed in the UAE unless it elects the foreign PE exemption.<\/li>\n<li>A <b>sole establishment<\/b> owned by an individual is not a separate taxable person: the individual is taxed under the natural person rules.<\/li>\n<\/ul>"}],"summary":["Tax Group: 95% ownership, residents, no exempt/QFZP members, same year-end and standards; one return; joint liability; one 0% band.","Unincorporated partnerships are transparent unless they elect to be taxed.","Family foundations, QIFs, QLPs and REITs have special regimes based on conditions."],"review":[{"q":"Can a QFZP subsidiary join a Tax Group with its mainland parent?","a":null},{"q":"Give two reasons a group might decide <b>not<\/b> to form a Tax Group.","a":null},{"q":"When is a family foundation transparent for CT?","a":null}],"mcq":[117,118,119]},"ch25":{"id":"ch25","num":"25","kind":"chapter","title":"Transfer Pricing","short":"Transfer Pricing","objectives":["Explain the <b>arm’s length principle<\/b> and identify Related Parties and Connected Persons.","Describe the five OECD transfer pricing methods.","Know the <b>documentation thresholds<\/b>: Disclosure Form, Master File, Local File, CbCR."],"sections":[{"title":"The arm’s length principle","html":"<p>Transactions between <b>Related Parties<\/b> must be priced as if they were made between <mark>independent parties in similar circumstances<\/mark> (Article 34). If the price is outside the arm’s length range, the FTA can adjust the taxable income, generally to a point within the range (often the median). The UAE follows the <b>OECD Transfer Pricing Guidelines<\/b>.<\/p><figure class=\"fig\"><svg aria-label=\"Related Parties and Connected Persons\" role=\"img\" viewbox=\"0 0 660 372\" xmlns=\"http://www.w3.org/2000/svg\"><title>Related Parties and Connected Persons<\/title><defs><\/defs><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"105\" x2=\"330\" y1=\"48\" y2=\"170\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"330\" x2=\"330\" y1=\"42\" y2=\"170\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"555\" x2=\"330\" y1=\"48\" y2=\"170\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"555\" x2=\"330\" y1=\"173\" y2=\"170\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"555\" x2=\"330\" y1=\"300\" y2=\"170\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"105\" x2=\"330\" y1=\"300\" y2=\"170\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"330\" x2=\"330\" y1=\"316\" y2=\"170\"><\/line><line stroke=\"#8a8f96\" stroke-dasharray=\"5 4\" stroke-width=\"1.5\" x1=\"105\" x2=\"330\" y1=\"173\" y2=\"170\"><\/line><circle cx=\"330\" cy=\"170\" fill=\"#16324f\" r=\"66\" stroke=\"#16324f\" stroke-width=\"2\"><\/circle><text fill=\"#ffffff\" font-size=\"14\" font-weight=\"bold\" text-anchor=\"middle\" x=\"330.0\" y=\"174.9\"><tspan dy=\"0.0\" x=\"330.0\">Taxable Person<\/tspan><\/text><g><rect fill=\"#e6f0fc\" height=\"76\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"190\" x=\"10\" y=\"10\"><\/rect><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"105.0\" y=\"32.3\"><tspan dy=\"0.0\" x=\"105.0\">Individuals related to the<\/tspan><tspan dy=\"12.9\" x=\"105.0\">4th degree by kinship or<\/tspan><tspan dy=\"12.9\" x=\"105.0\">marriage (incl. adoption,<\/tspan><tspan dy=\"12.9\" x=\"105.0\">guardianship)<\/tspan><\/text><\/g><g><rect fill=\"#e6f0fc\" height=\"76\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"190\" x=\"235\" y=\"4\"><\/rect><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"330.0\" y=\"32.8\"><tspan dy=\"0.0\" x=\"330.0\">A person owning or<\/tspan><tspan dy=\"12.9\" x=\"330.0\">controlling 50% or more<\/tspan><tspan dy=\"12.9\" x=\"330.0\">(directly / indirectly)<\/tspan><\/text><\/g><g><rect fill=\"#e6f0fc\" height=\"76\" rx=\"10\" stroke=\"#2a78d6\" stroke-width=\"2\" width=\"190\" x=\"460\" y=\"10\"><\/rect><text fill=\"#1f2328\" font-size=\"10.6\" font-weight=\"normal\" text-anchor=\"middle\" x=\"555.0\" y=\"38.8\"><tspan dy=\"0.0\" x=\"555.0\">Entities under common<\/tspan><tspan dy=\"12.9\" x=\"555.0\">ownership or control of 50%<\/tspan><tspan
