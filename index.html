};
addEventListener('pointerdown', () => Snd.wake(), { once: true, capture: true });
const buzz = p => { try { if (navigator.vibrate) navigator.vibrate(p); } catch (e) {} };

const FX = {
  cv: null, cx: null, ps: [], raf: 0,
  colors() { const cs = getComputedStyle(document.documentElement); return ['--saffron', '--gulf', '--good', '--violet', '--bad'].map(v => cs.getPropertyValue(v).trim() || '#EE9B2E'); },
  burst(x, y, n = 70, power = 1) {
    if (!motionOK()) return;
    if (!this.cv) { this.cv = $('#confetti'); this.cx = this.cv.getContext('2d'); }
    const dpr = Math.min(2, devicePixelRatio || 1); const W = innerWidth, H = innerHeight;
    if (this.cv.width !== W * dpr) { this.cv.width = W * dpr; this.cv.height = H * dpr; }

    for (let i = 0; i < n; i++) {
      const a = Math.random() * Math.PI * 2, sp = (3 + Math.random() * 9) * power;
      this.ps.push({ x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp - 6 * power, r: Math.random() * 6.3, vr: (Math.random() - .5) * .4, w: 5 + Math.random() * 6, h: 3 + Math.random() * 5, c: cols[i % cols.length], life: 0, round: Math.random() < .25 });
    }

  rain() { const W = innerWidth; for (let i = 0; i < 5; i++) setTimeout(() => this.burst(W * (.1 + .2 * i), innerHeight * .25, 40, .9), i * 90); },
  at(el, n, p) { if (!el) return this.rain(); const r = el.getBoundingClientRect(); this.burst(r.left + r.width / 2, r.top + r.height / 2, n, p); },

    const c = this.cx, dpr = this.cv.width / innerWidth; c.setTransform(dpr, 0, 0, dpr, 0, 0); c.clearRect(0, 0, innerWidth, innerHeight);
    this.ps = this.ps.filter(p => p.life < 160 && p.y < innerHeight + 30);

function floatXP(n, el) {

}

  setTimeout(() => { t.classList.add('out'); setTimeout(() => t.remove(), 320); }, ms);
}
function countUp(el, to, dur = 900, dec = 0) {
  if (!motionOK()) { el.textContent = fmt(to, dec); return; }
  const t0 = performance.now();
  const step = t => { const k = clamp((t - t0) / dur, 0, 1), e = 1 - Math.pow(1 - k, 3); el.textContent = fmt(to * e, dec); if (k < 1) requestAnimationFrame(step); };
  requestAnimationFrame(step);
}

/* ================= XP, levels, streaks, badges ================= */
const LV_T = ['Newcomer', 'Tax Trainee', 'VAT Apprentice', 'Return Filer', 'Input Tax Ace', 'CT Analyst', 'Transfer Pricer', 'Tax Consultant', 'Senior Consultant', 'Tax Manager', 'Tax Director', 'Tax Partner'];
const lvMin = n => 50 * n * (n - 1);
const lvOf = xp => { let n = 1; while (xp >= lvMin(n + 1)) n++; return n; };
const lvTitle = n => LV_T[Math.min(n - 1, LV_T.length - 1)];
function curStreak() { return (S.last === today() || S.last === dayKey(-1)) ? S.streak : 0; }

function addXP(n, from) {
  if (!n) return;
  const before = lvOf(S.xp), d = today(), had = S.days[d] || 0, wasToday = S.last === d;
  S.xp += n; S.days[d] = had + n; touchStreak();
  if (from) floatXP(n, from);

}
function record(key, ok) {

}
function feel(ok) { if (ok) { Snd.ok(); buzz(18); } else { Snd.no(); buzz([40, 50, 40]); } }
function levelUp(n) {

  const m = h(`<div class="modal" role="dialog" aria-modal="true" aria-label="Level up"><div class="box2"><div class="rays"></div><div class="eyebrow">Level up</div><div class="lvl">${n}</div><h2 style="font-size:26px">${lvTitle(n)}</h2><p class="muted">You have earned ${fmt(S.xp, 0)} XP. Next title at ${fmt(lvMin(n + 1), 0)} XP.</p><button class="btn sf wide">Keep going</button></div></div>`);

    animRings(w); countUp($('[data-pct]', w), pct, 1100);

    w.onclick = e => { if (e.target.closest('[data-x="extra"]')) o.extra.fn(); };

  // VAT calculator
  const tv = $('#tVat', v); let vm = 'add';
  const vIn = $('#vatAmt', tv);
  const vRun = () => {
    const a = num(vIn.value); let n, t, g;
    if (vm === 'add') { n = a; t = a * .05; g = a + t; } else { g = a; t = a * 5 / 105; n = g - t; }
    $('[data-o="n"]', tv).textContent = fmt(n); $('[data-o="v"]', tv).textContent = fmt(t); $('[data-o="g"]', tv).textContent = fmt(g);
    $('[data-o="f"]', tv).textContent = vm === 'add' ? `VAT = ${fmt(a)} × 5% = ${fmt(t)}` : `VAT = ${fmt(a)} × 5/105 = ${fmt(t)}`;
    $('[data-l]', tv).textContent = vm === 'add' ? 'Net amount (AED)' : 'VAT-inclusive amount (AED)';
  };
  $('.seg', tv).onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; vm = b.dataset.m; $$('.seg button', tv).forEach(x => x.setAttribute('aria-pressed', String(x === b))); const s = $('.slices', tv); s.classList.remove('pop'); void s.offsetWidth; s.classList.add('pop'); Snd.tick(); vRun(); };
  vIn.oninput = vRun; vIn.onblur = () => { vIn.value = fmt(num(vIn.value), num(vIn.value) % 1 ? 2 : 0); }; vRun();
  // Corporate tax
  const tc = $('#tCt', v); let cm = 'std';
  const cIn = $('#ctAmt', tc), nIn = $('#ctNq', tc);
  const cRun = () => {
    const a = Math.max(0, num(cIn.value)); let z, t, note, f;
    if (cm === 'std') { z = Math.min(a, 375000); t = Math.max(0, a - 375000); f = `(${fmt(a, 0)} − 375,000) × 9% = ${fmt(t * .09)}`; note = 'An ordinary taxable person pays 0% on the first AED 375,000 of taxable income and 9% on the excess.'; $('[data-zl]', tc).textContent = '0% band'; }
    else if (cm === 'sbr') { z = a; t = 0; f = 'Treated as having no taxable income: CT = 0'; note = 'Small Business Relief: a resident person whose revenue is AED 3m or less in the period and every previous period from 1 June 2023 can elect it, for tax periods ending on or before 31 December 2029 (MD 131 of 2026). Revenue, not income, is tested.'; $('[data-zl]', tc).textContent = 'Relieved'; }
    else { const nq = clamp(num(nIn.value), 0, a); z = a - nq; t = nq; f = `${fmt(nq, 0)} non-qualifying × 9% = ${fmt(nq * .09)}`; note = 'A Qualifying Free Zone Person pays 0% on Qualifying Income and 9% on other taxable income, with no AED 375,000 band. Breach the de minimis test (lower of 5% of revenue or AED 5m) and QFZP status is lost for that period and the next four.'; $('[data-zl]', tc).textContent = 'Qualifying'; }
    const ct = t * .09;
    $('[data-o="z"]', tc).textContent = fmt(z, 0); $('[data-o="t"]', tc).textContent = fmt(t, 0); $('[data-o="c"]', tc).textContent = fmt(ct, 0);
    $('[data-o="f"]', tc).textContent = f + (a ? ` · effective rate ${fmt(100 * ct / a, 2)}%` : ''); $('[data-o="n"]', tc).textContent = note;
    $('[data-z]', tc).style.flexGrow = z || .0001; $('[data-t]', tc).style.flexGrow = t || .0001;
    $('[data-z]', tc).textContent = z / Math.max(a, 1) > .22 ? '0%' : ''; $('[data-t]', tc).textContent = t / Math.max(a, 1) > .12 ? '9%' : '';
  };
  $('.seg', tc).onclick = e => { const b = e.target.closest('[data-m]'); if (!b) return; cm = b.dataset.m; $$('.seg button', tc).forEach(x => x.setAttribute('aria-pressed', String(x === b))); $('[data-fz]', tc).hidden = cm !== 'fz'; Snd.tick(); cRun(); };
  cIn.oninput = cRun; nIn.oninput = cRun; [cIn, nIn].forEach(x => x.onblur = () => { x.value = fmt(num(x.value), 0); }); cRun();
  // Deadlines
  const td = $('#tDl', v), sel = $('#dlType', td), dIn = $('#dlDate', td);
  const dRun = () => {
    const r = DL_RULES[+sel.value]; $('[data-l]', td).textContent = r[1];
    const p = dIn.value.split('-').map(Number); if (p.length < 3 || !p[0]) return;
    const due = r[2](new Date(p[0], p[1] - 1, p[2]));
    const now = new Date(); now.setHours(0, 0, 0, 0); const diff = Math.round((due - now) / 864e5);
    $('[data-o="d"]', td).textContent = due.toLocaleDateString('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });

function chainGame(root) {
  const r = n => Math.round(n / 100) * 100;
  const m = r(800 + Math.random() * 1600), w = m + r(300 + Math.random() * 700), rt = w + r(500 + Math.random() * 1500);
  const L = [['Manufacturer', m, 0], ['Wholesaler', w, m * .05], ['Retailer', rt, w * .05]];
  const paid = [false, false, false]; let fta = 0, solved = false;
  root.innerHTML = `<div class="row" style="justify-content:space-between"><h3>VAT chain challenge</h3><span class="pill sf">Game</span></div>
    <p class="small">Each business charges 5% on its sale and deducts the VAT it paid on its purchase. Fill in the blanks. When a link balances, its tax drops into the FTA's box.</p>
    <div class="chain">${L.map(([nm, sale, inp], k) => `<div class="link" data-k="${k}"><h4>${k + 1}. ${nm}</h4><p class="small">Sells for <b class="mono">AED ${fmt(sale, 0)}</b> + VAT${k ? ` · bought for <b class="mono">AED ${fmt(L[k - 1][1], 0)}</b>` : ' · no VAT on its inputs'}</p>
      <div class="flds"><div class="fld"><label for="o${k}">Output VAT</label><input id="o${k}" data-f="o" inputmode="decimal" autocomplete="off"></div>
      <div class="fld"><label for="i${k}">Input VAT</label><input id="i${k}" data-f="i" inputmode="decimal" autocomplete="off" ${k ? '' : 'value="0" readonly'}></div>
      <div class="fld"><label for="p${k}">Pays FTA</label><input id="p${k}" data-f="p" inputmode="decimal" autocomplete="off"></div></div></div>`).join('')}
      <div class="link"><h4>4. Consumer</h4><p class="small">Pays <b class="mono">AED ${fmt(rt * 1.05, 0)}</b> including VAT and cannot recover any of it: the consumer bears the tax.</p></div></div>
    <div class="fta" data-fta><span><span class="eyebrow" style="color:inherit;opacity:.7">FTA has collected</span><br>AED</span><b data-tot>0</b></div>
    <div class="row"><button class="btn sf" style="flex:1" data-chk>Check my answers</button><button class="btn ghost" data-new aria-label="New numbers">${ic('shuffle')}</button></div><div class="chain-fb" aria-live="polite"></div>`;
  const tot = $('[data-tot]', root);
  $('[data-new]', root).onclick = () => { Snd.tick(); chainGame(root); };
  $('[data-chk]', root).onclick = () => {
    if (solved) return;
    let allOk = true;
    L.forEach(([nm, sale, inp], k) => {
      const want = { o: sale * .05, i: inp, p: sale * .05 - inp }; let ok = true;
      $$(`[data-k="${k}"] input`, root).forEach(x => { const good = x.value.trim() !== '' && Math.abs(num(x.value) - want[x.dataset.f]) < .5; if (!x.readOnly) { x.classList.toggle('ok', good); x.classList.toggle('no', !good); } ok = ok && good; });
      if (ok && !paid[k]) { paid[k] = true; coins($(`[data-k="${k}"] [data-f="p"]`, root), $('[data-fta]', root), want.p); }
      allOk = allOk && ok;
    });
    if (!allOk) { Snd.no(); buzz([30, 40, 30]); $('.chain-fb', root).innerHTML = `<div class="fb no"><h4>${ic('x')} Some boxes are off</h4><p>Output VAT is 5% of the sale. Input VAT is the previous business's output VAT. Pays FTA is the difference.</p></div>`; return; }
    $('.chain-fb', root).innerHTML = ''; solved = true;
    setTimeout(() => {
      $('.chain-fb', root).innerHTML = `<div class="fb ok"><h4>${ic('check')} Chain balanced!</h4><p>The FTA collected AED ${fmt(rt * .05, 0)} in three instalments, exactly 5% of the final price of AED ${fmt(rt, 0)}. Every business passed the tax on; only the consumer bore it.</p></div>`;
      FX.at($('[data-fta]', root), 120, 1.1); Snd.win(); const first = !S.chain; S.chain = (S.chain || 0) + 1; addXP(first ? 30 : 10, $('[data-fta]', root));
    }, 1300);
  };
  function coins(from, to, amount) {
    const a = from.getBoundingClientRect(), b = to.getBoundingClientRect();
    const n = 5;
    for (let j = 0; j < n; j++) {
      const c = h('<i class="coin"></i>'); c.style.left = (a.left + a.width / 2 - 11) + 'px'; c.style.top = (a.top + a.height / 2 - 11) + 'px'; document.body.append(c);
      const dx = b.left + b.width - 60 - a.left - a.width / 2, dy = b.top + b.height / 2 - a.top - a.height / 2;
      const done = () => { c.remove(); if (j === n - 1) { fta += amount; countUp(tot, fta, 500); const t = to; if (motionOK()) t.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.04)' }, { transform: 'scale(1)' }], { duration: 300 }); } Snd.coin(); };
      if (!motionOK() || !c.animate) { done(); continue; }
      const an = c.animate([{ transform: 'translate(0,0) scale(1)', opacity: 1 }, { transform: `translate(${dx * .5}px,${dy * .5 - 70}px) scale(1.15)`, opacity: 1 }, { transform: `translate(${dx}px,${dy}px) scale(.7)`, opacity: .9 }], { duration: 750, delay: j * 90, easing: 'cubic-bezier(.45,0,.55,1)', fill: 'forwards' });
      an.onfinish = done;
    }
  }
}

/* ================= PROGRESS tab ================= */

  let cells = '';
  for (let k = 0; k < 28; k++) {

    cells += `<i class="${fut ? '' : x >= S.goal ? 'h3' : x >= S.goal / 2 ? 'h2' : x > 0 ? 'h1' : ''}${+d === +t ? ' today' : ''}" ${fut ? 'style="opacity:.35"' : ''} title="${key}: ${x} XP"></i>`;
  }

  return `<section class="wrap">
    <div class="sec-title" style="margin-top:10px"><h1 style="font-size:28px">Progress</h1><span class="eyebrow">${fmt(S.xp, 0)} XP</span></div>
    <div class="cert"><div class="top"><div class="eyebrow">Learner card · TaxPoint UAE</div><h2>Level ${lv} · ${lvTitle(lv)}</h2><div class="trn">${fmt(S.xp, 0)} XP · next title at ${fmt(hi, 0)}</div></div>
      <div class="bot"><div class="bar"><i style="width:${100 * (S.xp - lo) / (hi - lo)}%"></i></div><small class="muted">${fmt(hi - S.xp, 0)} XP to ${lvTitle(lv + 1)}</small></div></div>
    <div class="stats">
      <div class="stat"><b data-cu="${doneCount()}">${doneCount()}</b><small>of 33 chapters filed</small></div>
      <div class="stat"><b data-cu="${S.ans || 0}">${S.ans || 0}</b><small>questions answered</small></div>
      <div class="stat"><b><span data-cu="${acc}">${acc}</span>%</b><small>accuracy</small></div>
      <div class="stat"><b data-cu="${curStreak()}">${curStreak()}</b><small>day streak</small></div>
      <div class="stat"><b data-cu="${S.bestStreak || 0}">${S.bestStreak || 0}</b><small>best streak</small></div>
      <div class="stat"><b data-cu="${mastered()}">${mastered()}</b><small>cards mastered</small></div>
    </div>
    <div class="sec-title"><h2>Last four weeks</h2><span class="eyebrow">Goal ${S.goal} XP/day</span></div>
    <div class="panel"><div class="heatlab">${['M', 'T', 'W', 'T', 'F', 'S', 'S'].map(d => `<span>${d}</span>`).join('')}</div><div class="heat">${cells}</div></div>
    <div class="sec-title"><h2>Accuracy by area</h2><span class="eyebrow">Bank MCQs</span></div>
    <div class="panel acc">${areas.map(a => `<div class="r"><span>${a.t}</span><span class="mono">${a.n ? Math.round(100 * a.c / a.n) + '%' : '–'} <span class="muted">· ${a.n}</span></span><div class="bar ${a.n && a.c / a.n >= .7 ? 'g' : ''}"><i style="width:${a.n ? 100 * a.c / a.n : 0}%"></i></div></div>`).join('')}</div>
    <div class="sec-title"><h2>Badges</h2><span class="eyebrow">${Object.keys(S.bd).length}/${BADGES.length}</span></div>
    <div class="badges">${BADGES.map(b => `<div class="badge${S.bd[b[0]] ? '' : ' lock'}"><span class="med">${b[3]}</span><b>${b[1]}</b><small>${b[2]}</small></div>`).join('')}</div>
    <div class="sec-title"><h2>Settings</h2></div>

      <div class="setting"><div class="syncline" id="syncLine"><i class="${Sync.ref ? 'on' : ''}"></i>${Sync.ref ? 'Progress saved to your account, so it follows you across devices.' : 'Progress saved on this device.'}</div></div>
      ${window.claude ? '' : `<div class="setting"><span>Backup</span><p class="small">Save a copy of your progress as a file, or restore it on another phone.</p><div class="row"><button class="btn ghost sm" data-r="exp">Save backup file</button><label class="btn ghost sm" style="cursor:pointer">Restore backup<input type="file" accept=".json,application/json" data-imp hidden></label></div></div>`}

after.progress = (v, anim) => {

  if (anim) $$('[data-cu]', v).forEach(b => countUp(b, +b.dataset.cu, 900));

    if (b) {

    else { const keep = { goal: S.goal, theme: S.theme, sound: S.sound, calm: S.calm }; S = Object.assign(fresh(), keep); save(); updateChips(); toast('Progress erased. Fresh start!'); refresh(); }
